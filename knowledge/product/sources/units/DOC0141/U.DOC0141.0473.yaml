text: |-
  Lesson 4: Contract Administration and Configuration
  1. View these changes in the Contract Header Configure a Contracts Dashboard
  2. In your sandbox site, create a dashboard from the system default: Contracts > Contracts Home > Configure This Dashboard
  3. Name it and make it accessible to the Contract Configuration role.
  4. Add and modify widgets that would be useful for a contract manager.
  5. Publish the changes.
  6. Review the dashboard: Contracts > Contracts Home > Configure This Dashboard
