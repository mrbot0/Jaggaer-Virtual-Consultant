text: |-
  Lesson 4: ePro Workflow XML
  1. In your sandbox site, navigate to the setup page for any configured workflow process
  2. From the Shared Folders tab, select a folder
  3. Assign one or more approvers Add Another Shared Folder (optional)
  4. In your sandbox site, export the workflow folders file for requisition workflow: Setup > Workflow Setup > Requisition Workflow Setup > Workflow Folder Import/Export
  5. Add another shared (manual) folder called An other Approval to the XML, import it, examine the Shared Workflow Folders tab Add a Workflow Step In your sandbox site, create a new workfl ow step to meet this requirement: If the requisition is over the user’s PCard limit designated in their profile, then automatically reject it.
  6. Add the folder with the reject requisition robot into the Workflow Folder XML file.
