text: |-
  Lesson 5: Updating and Reporting on Budget Data
  1. Enable spend adjustments in your sandbox site: Budget Manager > Administration > Defaults Used When Creating a New Budget > Allow Spend Adjustments
  2. Navigate to the Spend Adjustments page and add a spend adjustment.
  3. View the spend adjustment yo u just made now on that page.
  4. Navigate to the Date Ranges page and view the adjustment in the blue information icon.
  5. View the adjustment in the History.
