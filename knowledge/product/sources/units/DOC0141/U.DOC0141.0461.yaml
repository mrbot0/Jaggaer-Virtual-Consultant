text: |-
  Course Workbook: JAGGAER eProcurement
  1. Open the contract summary from the contract icon in the search results and view the total number of non-catalog items managed on this contract (under Goods and Services ). Add Non-Catalog Items to a Contract Scenario: Education Lab Supplies offers some specia lized non-catalog items to the organization. Add those items to your contract with this supplier.
  2. In your sandbox site, go to the contract ( Goods and Services > Non-Catalog Items ) and import the non-catalog items from the class files ( contract_non-catalog items_import.txt ). Add item logos, if you like.
  3. Search for the items.
  4. On the Education Lab Supplies sticker on the showcase, enable Showcase Browse Contracts and any other relevant options. Invoice from a Contract (optional)
  5. In your sandbox site, add services as non-catalog items to your contract.
