text: |-
  Course Workbook: JAGGAER eProcurement
  1. View the category-commodity code mappings: Commodity Code > Category Map . For more detailed information on commodity codes and how to map them, see commodity codes_setup in the class files. Add and Map a Co mmodity Code Scenario: The organization wa nts to add a commodity code DENTAL SUPPLIES and map it to the UNSPSC code Dental and all its children.
  2. In your sandbox site, manually add DENTAL SUPPLIES to your existing list of commodity codes.
  3. Map this value to the UNSPSC code Dental and all of its children via a category mapping import.
