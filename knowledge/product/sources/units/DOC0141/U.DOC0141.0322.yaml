text: |-
  Course Workbook: JAGGAER eProcurement
  1. Apply the Researcher user role to your user and view the product views your user has access to.
  2. Return visibility of Customer Base Role to all products. Make a Product Category Unavailable Sitewide Scenario: Disallow every item in the Cleaning Equipment and Suppliers category for every user in the site.
  3. In your sandbox site, search for “degreaser” in the item search. Note the total number of results and the number for each supplier.
  4. Disallow Cleaning Equipment and Supplies as a product category:
  5. Navigate to Hosted Catalog and Ordering Configuration > Manage Product Categories.
  6. Open MRO/Facilities .
  7. Search again for “degreaser”, and again note the total number of results and the number for each supplier. Make a Product Category Available from a Supplier Scenario: Allow one of the suppliers to offer all their products in the Cleaning Equipment and Supplies category.
  8. In your sandbox site, do a supplier search for the supplier and select Manage > Category Review/Selection .
  9. Enable the Cleaning Equipment and Supplies category.
  10. Search for degreaser and note the number of results for that supplier. Make Certain Items Not Viewable Scenario: You have discovered that some cleaning items available to shoppers are radioactive. You need to remove access immediately while you determine the best way to control their visibility in the longer term.
