text: |-
  Course Workbook: JAGGAER eProcurement
  1. In your sandbox site, view the order distri bution default settings at the site level: Setup > Hosted Catalog and Ordering Configuration > Default Ordering Settings > Order Distribution > Order Distribution Defaults
  2. In the non-catalog supplier’s profile, review the setting that enables non-catalog items: About > System Settings > Shopping Configuration
  3. Configure the order distribution method for this supplier (either email or fax): Contacts and Locations > Fulfillment Centers > Order Distribution Configure PCard at Site and Supplier Levels
  4. Enable PCards as a site default in your sandbox site: Setup > Hosted Catalog and Ordering Configuration > Default Ordering Settings > Payment Method > Use PCard
  5. Navigate to the profile of a non-catalo g supplier and review its PCard settings. Set Up PO Terms
  6. Set up a new PO clause in your sandbox site.
