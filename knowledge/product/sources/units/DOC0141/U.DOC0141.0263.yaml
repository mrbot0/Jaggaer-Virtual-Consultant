text: "• Note : Sometimes users run into the issue when opening the CSV file in Excel in which the data is not converted correctly: instead of parsing the values into separate cells, they are separated by commas, semicolons , or double quotes. There are several workarounds for this issue documented in the file SC Perspective - Converting JAGGAER csv Files to Excel in the class files.m"
