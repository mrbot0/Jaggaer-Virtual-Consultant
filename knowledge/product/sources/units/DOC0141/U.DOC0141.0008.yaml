text: "Complete the following requirements in your sandbox site: A shopping dashboard with a showcase with the following stickers for: ☐ 1. Items in a shared favorites folder ☐ 2. Education Lab Supplies showcasing catalog search ☐ 3. A form request ☐ 4. Items with a custom catalog attribute assigned to them ☐ 5. A new supplier class with at least one supplier assigned to it ☐ 6. An ePro contract with an associated hosted catalog price set AND contract non-catalog items ☐ 7. User search results showing you have more than 100 imported users ☐ 8. A completed change request on a purchase order ☐ 9. A requisition that includes the custom field Delivery Variables ☐ 10. A requisition that has been automatically rejected in workflow because of an exceeded PCard limit ☐ 11. A form request that has triggered either procurement or form request workflow"
