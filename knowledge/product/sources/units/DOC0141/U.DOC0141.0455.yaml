text: |-
  Lesson 3: Setting Up a Contract for Shopping
  1. Purchase items from this contract and exceed the budget. Note the warning in the cart.
  2. Open the contract and view the changes to the budget. Adjust Spend on a Contract (optional) Scenario: Some spend against the contract with Education Lab Supplies has occurred outside the system. Adjust the spend against the contract.
  3. In your sandbox site, adjust spend on PR and PO.
  4. Add a note for reference.
  5. Observe the change in spend data. Expose Non-Catalog Items with a Contract Scenario: The organization has a local vendor who provides specialized products that are not in a supplier catalog. These items are managed by the organization within the contract.
