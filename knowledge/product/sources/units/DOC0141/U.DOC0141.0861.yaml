text: |-
  • From the Search Budgets page, select an approved budget with remaining funds as the source budget
  1. Open the source budget.
  2. Navigate to the Date Ranges page and request a budget transfer.
  3. Fill out the request. View the Transfer Approval page so see if workflow will be triggered.
  4. Submit the request.
  5. Approve the transfer.
  6. Open the target budget:
  7. Navigate to the Incoming Transfers page and view the status of your request and the total transfer amount.
