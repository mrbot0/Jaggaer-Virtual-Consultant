text: |-
  Course Workbook: JAGGAER eProcurement
  1. Log back in as your config user, navigate to the shared cart, lock the cart to proceed to checkout, review the requisition history and the Share cart field, and submit. Pay with a PCard
  2. In your sandbox site, review the PCard on your use profile.
  3. Shop for an item. Exceed the PCard limit on your profile (based on the Requester role).
  4. In checkout, edit the requisition under Billing to pay via credit card.
  5. Submit the requisition.
