text: |-
  Lesson 2: Managing Requisitio n and Purchase Order Workflows
  1. Enable ad hoc approval for requisitions in your sandbox site: Setup > Workflow Setup > General Workflow Settings
  2. Add the Ad-Hoc Approvers field to the General section of your requisition document; finalize and activate the new version.
  3. Grant permissions: Permission Settings > Approv als > Requisition Approvals
