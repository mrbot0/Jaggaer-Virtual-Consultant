text: |-
  Lesson 2: Managing Requisitio n and Purchase Order Workflows
  1. Add both of these permissions to the Approver With Edit role.
  2. Add the notification to alert users when they have been assigned to a PR as an ad hoc approver: PR pending Ad-Hoc Workflow approval (Notification Preferences > Shopping, Carts & Requisitions )
  3. Make the Comments field on the Ad-Hoc Approver overlay mandatory, so that users are required to enter a comment when addi ng or changing an ad-hoc approver. This setting applies to the Comments field for both invoices and requisitions.
