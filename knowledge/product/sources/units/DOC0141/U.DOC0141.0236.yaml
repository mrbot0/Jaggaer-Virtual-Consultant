text: |-
  Course Workbook: JAGGAER eProcurement
  1. Under the Need Assistance? widget, select Online Training and Support .
  2. Under the Hosted Catalog Management widget in Reference Materials, select Item Categories and Attributes . Import and Commodity Code List and Category Map You may have completed this activity in the platform class. If not, do so now in your sandbox site.
  3. Enable and configure category mapping:
  4. Navigate to Setup > Hosted Catalog & Ordering Configuration > Category, Commodity and UOM Taxonomy Sets .
