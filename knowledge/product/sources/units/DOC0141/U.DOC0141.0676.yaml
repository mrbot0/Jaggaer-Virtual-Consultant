text: |-
  • Determine what ADW workflow objects and values should be used to trigger the robot
  1. Review the PCard limit on your user profile: Ordering and Approval Settings > User Pu rchasing and Approval Limit Values > PCard Limit
  2. Review the field help for that setting---notice that it states: “Any line item in a requisition exceeding this limit will have to be processed through the LPO folder.”
