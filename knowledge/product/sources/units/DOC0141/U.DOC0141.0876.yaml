text: |-
  Once classwork has ended, the following must be completed
  1. Complete this task list.
  2. Ask for help if you need it.
  3. Finish your capstone products and mark it complete in JAGGAER University. (JAGGAER U will send the instructor a notification to check and approve completion.)
  4. Take the exam.
  5. Complete the evaluation. Done all that? Congratulations! You’re ready to move ahead with implementation projects. You are also eligible to complete other product- specific certification courses that will prepare you to implement additional JAGGAER products for your clients!
