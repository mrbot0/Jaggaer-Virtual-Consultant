text: |-
  Lesson 4: Configuring an d Managing System Emails
  1. Examine the Org default email address in your sandbox site: Administer > Email Management > Email Configuration
  2. View system emails: Administer > Email Management > System Emails
  3. Review emails related to ePro.
  4. Edit a system email and preview your changes.
  5. View History.
  6. View Logs. Manage Older System Emails
  7. Edit a system email notification in your sandbox site.
  8. Navigate to a message in Field Management: Setup > Field Management > Mana ge Field Names and Help Text
  9. Search for Email Notification .
  10. Click Browse fields and review various messages.
