text: |-
  Lesson 4: Configuring Taxono my Sets and Custom Catalog
  1. In your sandbox site, view the unre viewed price sets at the site level.
  2. Search for products from either of these suppliers. What results do you get?
  3. Request a price extract for Education Lab Supplies.
  4. Review the extract.
  5. Approve one version a price set.
  6. Add Education Lab Supplies to the showcase.
