text: |-
  Lesson 2: Managing Us er Roles and Profiles
  1. Make it active and assign it to the Asia business unit.
  2. Configure the permissions and settings, e.g ., default home page, approval limits, product views, punchout/currency access, custom fields, permissions, notifications.
  3. Assign a user to this role. Note that the user must be part of the Asia bu siness unit before they can be assigned to BU- specific role.
