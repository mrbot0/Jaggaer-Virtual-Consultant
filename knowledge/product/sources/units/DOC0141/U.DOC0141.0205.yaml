  Lesson 3: Managing Price Sets
  1. Approve Assigned Supplier Price Files
  2. Assign the Catalog Manager role to a regular user who is NOT already a Catalog Admin or System Admin (because those roles ahve the perm ission to approve all supplier price files). View Price Settings and Price Files In your sandbox site, view the price settings and price files for individual suppliers and the site.
  3. Enable list pricing for a supplier.
