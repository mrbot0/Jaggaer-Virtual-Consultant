text: |-
  Lesson 5: Managing Product Visibility
  1. Define a category class for lab and medical supplies: Setup > Hosted Catalog and Ordering Configuration > Manage Category Classes
  2. Define the category class: Under Definitions, select a category class, name it Lab/Medical Supplies , and activate it.
  3. Configure the category class: Under Configuration , select the category class you just defined and select the lab and medical product categories that you want researchers to have access to and general shoppers to not have access to.
  4. Create two product views: Standard and Lab Research. Setup > Hosted Catalog and Ordering Configuration > Manage Product Views
  5. Create two new product views.
