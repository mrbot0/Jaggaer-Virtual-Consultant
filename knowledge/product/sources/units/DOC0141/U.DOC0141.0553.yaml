text: |-
  Lesson 3: Managing Documents
  1. Create a shared cart group and add user s (e.g., create a group for the Operations department): Shop > Admin > Manage Groups for Shared Carts
  2. Add the Share cart field to the requisition configuration in the General section.
  3. Search for an item, put it in the cart, change th e cart name to make it clear what it’s for (e.g., Operations Dept Cart – week of x), share it, and unlock it.
  4. Log in as a user who is in the Operations department and has the Advanced Shopper role, view the shared cart notification, open the shared cart, add items to it.
