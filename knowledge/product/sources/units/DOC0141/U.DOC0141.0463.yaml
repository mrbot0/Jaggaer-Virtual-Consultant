text: |-
  Course Workbook: JAGGAER eProcurement
  1. Once the contract is in effe ct, create an invoice from it. Expose Instructions from a Contract – Part 1 The organization has an auto rental contract wi th Enterprise Rent-A-Car. Reservations are made online in the Enterprise’s system.
  2. In the WorldWide Widgets WorldMarket site (https://usertest.sciquest.com/org/SQUFS) , search for a rental car.
  3. View the instructions.
  4. View the contract summary. Expose Instructions from a Contract – Part 2
  5. In your sandbox site, add the instructions to the contract with Education Lab Supplies (in Goods and Services > Ordering Instructions ).
  6. Search for the instructions in the item search. Assign a PO Clause to a Contract
  7. In your sandbox site, apply a PO clause to the contract with Education Lab Supplies (in PO Clauses ).
  8. Purchase an item associated with that contract and view the PO clause on the PO fax. Limit Access to a Contract and Its Associated Items Scenario: The European business unit is the on ly group who should have access to the items associated with the contract with Education Lab Supplies.
  9. In your sandbox site, make sure your user is not in the Europe business unit.
  10. Limit access to the contract to the Europe business unit (in Applies To).
  11. Search for the items associated with this contract.
