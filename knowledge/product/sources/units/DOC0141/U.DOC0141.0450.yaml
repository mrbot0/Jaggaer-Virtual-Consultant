  Lesson 3: Setting Up a Contract for Shopping
  1. Shop for an item from Education Lab Supplies and view the associated contract in the cart.
  2. Submit the requisition. Track Spend and Set Up a Budget Scenario: Track spend against the contract with Education Lab Supplies and enforce a contract budget.
  3. In your sandbox site, review the Budget and Spend page in the Education Lab Supplies contract.
  4. Note the current spend, and se t a budget amount and enforce it:
  5. Set the budget amount.
