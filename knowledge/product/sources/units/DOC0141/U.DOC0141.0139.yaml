text: "For the rest of the course, you will be focused on configuring ePro in your sandbox site, which is the site you began configuring during the JI-PLT -2300 (JAGGAER Indirect Configuration) course. However, there are a few exceptions: It is often helpful to see a fully configured site before configuring your own, so in that case, you will be directed to access the Worldwide Widgets WorldMarket training site to better understand how that feature works."
