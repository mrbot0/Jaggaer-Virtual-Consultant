text: |-
  Course Workbook: JAGGAER eProcurement
  1. Review the new users in your site via user search. Update Custom Field Defaults via Import Use the custom field defaults of Sam Shopper to populate those of Brock Lee in your sandbox site.
  2. Review the accounting code defaults for Sam Shopper and Brock Lee.
  3. Export Sam Shopper’s data using the Tab Delimited Export option.
  4. In the custom field export file ( UserCFExport ) using Excel, substitute blee as the user.
  5. Change some of the values and defaults.
  6. Validate and import the new file.
  7. Check Brock’s profile. Add User Profile Comments
