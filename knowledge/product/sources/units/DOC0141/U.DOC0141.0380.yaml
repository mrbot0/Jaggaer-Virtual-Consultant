text: |-
  Course Workbook: JAGGAER eProcurement
  1. Set terms and conditions at the site level on the Terms and Conditions tab.
  2. View the results on the profile of your active non-catalog supplier.
  3. Apply the PO clause you created to that supplier. Manage Suppliers (optional)
  4. In your sandbox site, create supplier addresses.
  5. Add contact information.
  6. Change supplier status.
  7. Review supplier history.
  8. Export supplier information.
  9. Set supplier profile elements as required.
