text: |-
  Course Workbook: JAGGAER eProcurement
  1. Open the XML file of a form from the form samples folder in your class files and try to determine what is in the form.
  2. Import the form to your sandbox site.
  3. Address any errors.
  4. Add the form to a folder in Shared Favorites.
  5. Add a sticker to the showcase.
  6. Access the form from the showcase.
