text: |-
  Lesson 2: Creating a Contract
  1. Set default notifications.
  2. Assign the Contract Configuration role to your user. Find and View Contracts
  3. In the WorldWide Widgets WorldMarket site (https://usertest.sciquest.com/org/SQUFS ), search the catalog of Daigger, which has a hosted catalog associated with a contract.
  4. Open the contract summary and view its contents.
  5. View all contracts that have been drawn up for Daigger in its supplier profile, under Legal and Compliance > Contracts .
  6. Navigate to contract search and view the cont racts with Daigger that are active for shopping.
  7. Save and export a search.
