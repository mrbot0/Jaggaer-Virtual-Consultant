text: |-
  ji-plt-2305-jaggaer-full-suite-ppq-docx-8e533abc
  1. Are you able to provide flat, delimited text files or Excel files?
  2. How often are the supplier files submitted?
  3. For the detailed files that are submitted for all suppliers, what is the approximate annual total count of all lines?
  4. Customers will often times use ancillary (lookup) files to reference or display additional information within reporting. Examples include diversity information, product lookups, etc. Does your organization plan on providing any supplemental files in addition to the spend files?
  5. If you will be providing lookup files, are you going to be providing a date range where the lookup value would be joined to your spend (see below example)?
