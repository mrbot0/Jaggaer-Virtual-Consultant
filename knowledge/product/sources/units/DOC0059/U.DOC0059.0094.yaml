text: |-
  ji-plt-2305-jaggaer-full-suite-ppq-docx-8e533abc
  1. What is the fully qualified account code string used by your general ledger? For example, Company, Division, GL, Department (xxx-xxx-xxxxxxx-xxx).
  2. Please list each segment below:
  3. Are any of the above segments associated with the other segments? For example, Segment 1 has a specific set of Segment 2 values that apply. In this instance, SciQuest would refer to Segment 1 as the Parent and Segment 2 as the Child. Please identify any parent/child relationships with your accounting elements and if the relationship is one to one (one unique parent to one unique child), one to many (one unique parent to many children), or many to one (many parents to one unique child).
  4. Please provide a sample file that contains at least a subset of all values for each field listed above and relationships noted.
