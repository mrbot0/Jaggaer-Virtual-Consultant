text: The TSM portion of this questionnaire is intended to gather information about how you register and onboard suppliers today, and how you intend to do that process with TSM. The more we can learn about your business processes and requirements, the better we can tailor TSM to meet your needs. Please answer as many of the questions as you can with as much detail as you can provide. Keep in mind that the project team will be reviewing this document with you as part of the beginning of the implementation process.
