text: |-
  ji-plt-2305-jaggaer-full-suite-ppq-docx-8e533abc
  1. Do you have experience extracting chart field data (accounting data), users, and suppliers from you ERP/HR systems into a flat file?
  2. Do you have experience with importing financial documents (purchase requisitions, purchase orders, invoices) into your ERP system?
  3. Do you have experience scripting ERP imports/exports mentioned in items 1 and 2?
  4. Have you identified an authentication technology (SAML, LDAP, etc.)?
  5. Is the supplier information in your ERP accurate (addresses, order delivery information)?
