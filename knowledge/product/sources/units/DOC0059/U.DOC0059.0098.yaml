text: |-
  ji-plt-2305-jaggaer-full-suite-ppq-docx-8e533abc
  1. Briefly explain how Business Units and Departments are used in your organization.
  2. Is there a requirement to restrict visibility of orders among departments? For example, will a user associated with department A be able to see orders for department B?
  3. Can users be assigned to a single Business Unit and/or Department? Is the information easily available such that it can be included with a user extract?
