text: There are pre-defined Standard Fields within Contract Manager Repository. Please review the list below and compare the Standard Fields to the fields that your organization requires. Ask yourself what fields you report out on, what fields your users search on, etc. As mentioned above, Custom Fields can be created for any desired field that is not included in the table below.
