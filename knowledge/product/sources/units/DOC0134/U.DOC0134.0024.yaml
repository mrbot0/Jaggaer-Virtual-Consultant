text: "Note that Form Type ADW workflow has all but replaced Form Type Dynamic Approval. ADW allows for individual Form Types as well as specific Form Names. Dynamic Form Type approval is more limiting because it is “all or n othing ” (any Form Type configured for workflow routing will require approval in one workflow step, typically called “Form Approval”). To Enable or Disable Form Type Dynamic Workflow for an organization go to the following location and ensure the setting, “Organiz ation uses Dynamic workflow for Form Types” is turned on: Site Configuration > Workflow Setup > General Workflow Settings > Workflow General"
