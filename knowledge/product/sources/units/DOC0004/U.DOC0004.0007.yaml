text: Purpose of Capstone The capstone is the culmination of the educational program — the finish line! It gives you an opportunity to evaluate your ability to apply the concepts that you’ve learned. It also gives you the opportunity to configure a realistic instance— as you would configure for an actual Buyer Organization. Completing Your Capstone You will use an instance provided by JAGGAER to complete your capstone. Once you subm it your capstone, the instructor will confirm that you’ve configured a functional , realistic site.
