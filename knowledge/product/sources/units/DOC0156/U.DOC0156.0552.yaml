text: "Nota del relatore: Exams are offered at the end of each course, accessed through JAGGAER University and tracked for certification. When it’s time to re-certify, participants can access the current version of the exam, which reflects the content they learned initially, as well as new functionality that has been added in the time since. Release update content is provided continually, and for those who need a refresher, recordings and resources are readily available in the same JAGGAER University environment."
