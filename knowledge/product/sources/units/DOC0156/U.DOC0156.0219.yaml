text: The Jaggaer One platform is the foundation from which all of our solutions work. It houses the supplier data our customers need to conduct business, the contract and pricing data from which they shop and make purchases, the process workflows that route activities to the right reviewers and approvers, and provides the integration to their ERP and other backoffice systems, as well as 3rd party systems for additional capabilities for eSignatures, tax and invoice compliance, and risk indicators.
