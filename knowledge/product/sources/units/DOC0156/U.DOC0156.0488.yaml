text: "Nota del relatore: We’re constantly improving our software, with a standard release cycle that occurs three times a year – the “dot-one” release in the spring, dot-two in the summer and dot-three in the fall. The dates are scheduled and publicized well in advance, and we have a LOT of resources available to tell you what’s coming. It begins to appear about six weeks before the official release date… and shortly after that, the updates go out to the USERTEST environment… and three to four weeks before they appear in your Production site…"
