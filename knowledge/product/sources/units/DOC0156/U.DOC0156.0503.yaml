text: "Nota del relatore: So if you have your laptop and want to follow along, go to library-dot-jaggaer-dot-com. I’m going to show you how to find the release information that matters to you, and then we’ll talk about where to find some general information like the product release timeline, and browser support. DEMO OUTLINE: Explain that all JAGGAER ONE solutions are listed at the top, and talk about how to find the ones that matter to them and navigate from there. Tell them a better starting point might be to scroll down and click on the box for the latest release. Show the Platform page and help them understand whether to pay attention to the JI column or the JA video, or both."
