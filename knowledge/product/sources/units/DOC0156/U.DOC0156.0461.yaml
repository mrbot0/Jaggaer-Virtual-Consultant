text: |-
  Colonne: Role | Implementation Effort | Post Go-Live Effort | Key Responsibilities
  Role: System Administrator | Key Responsibilities: Masters tasks needed to maintain and administer the solution on a daily basis (user profiles and data, ADW Workflow rules, forms and templates) Documents process and configuration changes Performs troubleshooting to aid end users with day to day usage Acts as the lead liaison with JAGGAER Support for cases Reviews upcoming software release notes and education to understand which features may be beneficial to group Leads and supports regression testing for those same software releases
  Role: Supplier Manager | Key Responsibilities: Responsible for overall supplier relationships, contract negotiation, supplier requirements and managing catalog content Selects and prioritizes initial suppliers to enable either with hosted content or as “punch out” suppliers Leads day to day efforts during implementation such as unit testing, order and invoice testing Works with JAGGAER team to onboard suppliers and provides information as requested
  Role: Testing Lead | Key Responsibilities: Develops and executes detailed, end-to-end test cases based on business process/scenario list Responsible for obtaining venue to perform both validation and User Acceptance Testing and invites testers based on schedule Performs initial triage of issues and updates and shares issue log daily
