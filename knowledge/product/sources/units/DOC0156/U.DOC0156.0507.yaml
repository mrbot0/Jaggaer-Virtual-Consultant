text: Back to the Platform page, where you will navigate to any solution-specific page and explain that ONCE THE RELEASE GOES TO UIT, THIS is where they will find the final Release Notes, this is where they will find the solution-specific video, AND the actual ‘general’ release demo video recorded after features were available to show. Take them back to the home page, and show the Helpful Information widget and tour that page. Be sure to explain the Cloud Report, and point out that we have links to the Product Timeline and the list of currently supported browsers and devices.
