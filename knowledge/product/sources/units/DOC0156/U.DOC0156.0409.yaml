text: |-
  Colonne: Service | Description
  Service: Event Coaching Services | Description: Provides exclusive access to ASOs Best Practices Center consultants to discuss event strategy and approach
  Service: RFP Readiness Reviews | Description: Gives buyers the option to request a quality assurance check of their sourcing event prior to launch and ensures buyers are taking full advantage of ASO features
  Service: ASO RFxpress Template Library | Description: Gives buyers access to Jaggaer’s ASO “start from here” templates in a variety of sourcing categories across direct materials, indirect materials/services, and transportation.
  Service: Premium Support Content | Description: Access to premium documents and other content that focus on the strategic use of ASO, in business applications
  Service: 1 Event Start-Up | Description: BPC customers obtain access to an event start-up service to help them prepare and configure a selected sourcing event. This ensures that the team learns best practices to help launch the event quickly and efficiently.
  Service: OR
  Service: 1 Analytics Workshop | Description: During this ½ day remote session an ASO consultant will help your team expedite their knowledge of ASO’s robust Scenario Analysis capabilities.
