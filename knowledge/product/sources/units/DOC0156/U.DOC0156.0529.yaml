text: (CLICK) When you select “Search Help” you’ll be taken to a page for accessing several different resources for administrators on topics like Supplier Enablement, or the Product Release Library – which we’ll talk about later. In the Online Searchable Help section, you can either enter a search term, or click the Table of Contents. (CLICK) Either will give you a popup window the Online Searchable Help – if you’ve used it before, you may notice the new and improved interface shown here! This is, essentially, the always-current, searchable version of printable handbooks, with solid explanations of features and functionality… (CLICK)…and a lot of step-by-step instructions on performing specific tasks in the application.
