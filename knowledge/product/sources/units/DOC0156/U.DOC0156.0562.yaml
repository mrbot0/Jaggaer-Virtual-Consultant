text: "Nota del relatore: There are three phases of education. A participant’s certification process begins with a 16-hour self-paced eLearning course called JAGGAER Indirect Foundations, available through JAGGAER University. It introduces the JAGGAER Indirect suite, covers key concepts and provides. hands-on experience with shopping, AP, contract, sourcing and supplier management tasks in a full-suite training site. (animate) The next component, offered live in a classroom environment, is a two-and-a-half day Boot Camp called JAGGAER Indirect Platform Configuration. Participants get their own sandbox instance of a full-suite JAGGAER Indirect site. They begin configuring it as they learn about critical concepts that apply across the suite of products. We discuss everything from configuring the user experience to incorporating client terminology and data points to setting up approvals through our powerfully flexible workflow engine."
