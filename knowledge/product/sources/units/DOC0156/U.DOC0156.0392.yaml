text: |-
  Colonne: eProcurement | Powerful, flexible configuration to suit your processes, rules, and workflows Your preferred suppliers and contracted prices | Manage spend, control costs, and improve compliance Easy-to-use, familiar online Shopping experience for unlimited end-users
  eProcurement: Savings | Powerful, flexible configuration to suit your processes, rules, and workflows Your preferred suppliers and contracted prices: Complete process from baselining, budgeting and forecasting to implementation and tracking of negotiated savings; includes approval processes | Manage spend, control costs, and improve compliance Easy-to-use, familiar online Shopping experience for unlimited end-users: Ensures savings is incurred and tracked for reporting; reduces savings erosion Measurement of procurement value contribution
  eProcurement: Invoicing | Powerful, flexible configuration to suit your processes, rules, and workflows Your preferred suppliers and contracted prices: Automated Invoice Processing: PO-flip, Submission, Status and Approvals Enable touchless eInvoicing via cXML, EDI or a supplier portal Accurately calculate and manage tax compliance Supplier self-service eInvoicing capabilities | Manage spend, control costs, and improve compliance Easy-to-use, familiar online Shopping experience for unlimited end-users: Leverage Spend & Invoices into effective decision-making data “Manage by exception” significantly decreases the costs of invoice handling Reduce or eliminate late fees, duplicate payments and overpayments
  eProcurement: Project Based Procurement | Powerful, flexible configuration to suit your processes, rules, and workflows Your preferred suppliers and contracted prices: Create an “envelope/binder” around all procurement-related activities associated with capital or large projects including a library of all related sourcing events, contracts, and related documents Manage deliverables and tasks for procurement activities and supporting activities | Manage spend, control costs, and improve compliance Easy-to-use, familiar online Shopping experience for unlimited end-users: Assign accounting/project codes at the deliverable/task levels for enhanced spend management Associate all contracts and sourcing events directly to the project for easy centralized accessibility for all project/ grant constituents
