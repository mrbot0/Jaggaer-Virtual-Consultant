text: But if you prefer an organized ‘book’ to read or browse, these are available and easy to pull up. (CLICK) There’s also a link on the welcome page to several “Best Practices” documents that explain how many clients handle common business processes like contract visibility, PO close processes, or blanket and standing orders. (CLICK) And there’s a link to documentation for whatever new features or changes are in “Early Access” status, meaning functionality that’s still being ‘tweaked’ that is being made available to you to make available to beta testers or others in your organization.
