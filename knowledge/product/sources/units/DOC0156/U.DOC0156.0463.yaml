text: |-
  Colonne: Role | Implementation Effort | Post Go-Live Effort | Key Responsibilities
  Role: Technical Lead | Key Responsibilities: Provides expert guidance to team on connectivity and function of client ERP Leads client effort in design of integration Ensures availability of technical resources during implementation Outlines and implements error handling process Coordinates design and development decisions with functional leads
  Role: Developer | Key Responsibilities: JAGGAER Standards Responsible for development of client side programs to accept JAGGAER Standard XML or Flat File JAGGAER Integration as a Service Responsible for development of program to accept or export data to and from JAGGAER middleware Both Finalize file structure and communication protocol Performs unit testing (technical validation) prior to larger validation effort Adjusts integration as needed based on testing efforts Migrates working integration to production environment
  Role: Extended Team | Key Responsibilities: Supports the Business Owners/Process Leads by providing Business Scenarios/Processes Provides testing assistance and feedback as requested by Core Team Acts as lead users within each individual area
