text: "Nota del relatore: So as you saw on the Foundations video, We rely on an event-based approach using project phases to ensure a predictable project experience and to accelerate the speed in which JAGGAER solutions deliver value. As we touch on each phase, keep in mind that some of these phases may overlap or repeat as the project progresses. The first phase is Initiate, in which the groundwork for the project is laid Next is the Plan phase where the initial project plan is established and the client is introduced to the products The third phase is Execute which includes Primary configurations and end-to-end product demonstration within the prep environment Once the agreed upon configurations have been implemented, the project moves forward to Validation, consisting of Solution testing and initial data imports The final phase in the implementation process is Enable. During this phase the Production site is activated for ‘go-live’ and rollout activities commence. Once any miscellaneous end-user or administration training has taken place and the solution is officially in production, the project team facilitates a formal hand-over from Professional Services to our Global Customer Care team. For a deeper dive into each of these stages, take a look at this website. We’ll also be touching on each one throughout this course."
