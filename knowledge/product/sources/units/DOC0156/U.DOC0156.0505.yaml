text: Call up the Snapshot and show how it can help them formulate a release strategy by giving a quick list of features being developed and which solutions they impact, whether they impact end users or just administrators, and very importantly whether there’s a big impact on integrations. That last one is particularly important to identifying things they definitely need to test.
