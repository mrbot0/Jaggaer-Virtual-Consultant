text: |-
  Colonne: Role | Implementation Effort | Post Go-Live Effort | Key Responsibilities
  Role: Executive Sponsor | Implementation Effort: 1-2 Hrs per Mth | Post Go-Live Effort: 1-2 Hrs per Mth | Key Responsibilities: Serves as project champion; responsible for project outcome Provides resolution to personnel, policy and process escalations
  Role: Project Manager | Implementation Effort: 4-6 Hrs per Wk | Post Go-Live Effort: 0 Hrs per Wk | Key Responsibilities: Responsible for the day-to-day project planning, execution, issues resolution, timeline, resourcing and budgeting Drives internal team to make decisions
  Role: Technical Manager | Key Responsibilities: Provides oversight of the development of integration points Acts as an expert regarding current ERP Advises team on issues, risks and decision points Communicates with team and PM regarding technical environment upgrades/outages/clones
  Role: Business Owner / Process Lead | Key Responsibilities: Understands and documents current business processes Ensures implementation is aligned with business processes and policies Drives internal team to modify processes and policies, if necessary, in order to achieve overall project goals Assists creation of test plan and associate scripts based on processes
  Role: Trainer | Key Responsibilities: Develops and assists in implementation of training strategy Creates training materials Trains end users
