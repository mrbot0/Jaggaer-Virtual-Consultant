text: There are three different ways to access it, including from the Admin Home Page, but perhaps the easiest is from the Profile dropdown and “Search Help for a Solution” option. This is permission-based, and usually only accessible by site administrators because it cannot be edited by clients, and could confuse end users about how their organization is using the application.
