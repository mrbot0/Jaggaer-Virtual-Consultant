text: |-
  Managing eProcurement Contracts
  1. From the showcase, view items available from suppliers with non-catalog items on a contract.
  2. Open the contract summary from the contract icon in the search results and view the total number of non-catalog items managed on this contract.
  3. Watch how the non-catalog items are managed in the contract record.
  4. Watch how you can add a product to the contract.
  5. Search for that item.
