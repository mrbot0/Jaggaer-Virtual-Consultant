text: |-
  Managing eProcurement Contracts
  1. Search the catalog of Daigger, which has a hosted catalog associated with a contract.
  2. Open the contract summary and view its contents.
  3. View all contracts that have been drawn up for Daigger in its supplier profile.
  4. Navigate to contract search and view the contracts with Daigge r that are active for shopping.
  5. Save and export a search.
