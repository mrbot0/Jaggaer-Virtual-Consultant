text: |-
  Managing eProcurement Contracts
  1. Open the contract you created with Education Lab Supplies.
  2. Set up the contract for shopping.
  3. Submit the contract for approval.
  4. Verify that the contract appears in the supplier profile.
  5. Shop for an item from Education Lab Supplies and view the linked contract in the cart.
  6. Submit the requisition.
