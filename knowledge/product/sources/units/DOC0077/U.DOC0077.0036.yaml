text: |-
  JI-ePRO-3000: JAGGAER Indirect eProcurement Specialization
  1. (JAGGAER user) Enable the catalog availability for the site: o eProcurement > Catalog Availability
  2. Add the supplier ID and name to the item file: o From the class files, open the catalog item file called: catalog_item file ‐ USD_org‐ managed.xlsx o Put your new Supplier’s Supplier ID in cell A1 and your supplier’s name in cell B1. You can get this information from the supplier profile in About > Summary .
