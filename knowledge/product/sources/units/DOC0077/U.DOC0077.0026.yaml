text: |-
  JI-ePRO-3000: JAGGAER Indirect eProcurement Specialization
  1. (JAGGAER user) Expose list pricing.
  2. Enable list pricing: o eProcurement > Price Config/List Price o Use List Pricing: Yes
  3. (JAGGAER user) Determine the display name of the site: o Find the organization’s display name by navigating to Setup > Site Profile > Configure Site Profile Miscellaneous Settings. You will need to know this for the next step.
