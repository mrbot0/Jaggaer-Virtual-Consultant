text: |-
  JI-ePRO-3000: JAGGAER Indirect eProcurement Specialization
  1. Upload the non‐USD price list for your supplier. o The item file you uploaded in the previous exercise contained l ist pricing in USD. If you were adding an internally managed supplier from the start who provid ed pricing not in USD, then you would leave the Corporate List(USD) column (column F) blank. If you changed this column to zeros, it would make all the pr icing [importo] if you were using list pricing. o To upload the price list for yo ur supplier, in your class files , open: catalog_price file ‐ world currencies_org‐managed.xlsx Put your supplier’s Supplier ID in cell A1 and your supplier’s name in cell B1. You can get this information from the supplie r profile in your sandbox. If you would like to add or change a currency column, you may d o so.
  2. (JAGGAER user) Create a relationship between the client organization and the s elf‐managed supplier: o Tools > Manage Buyers, Suppliers, and Relati onships > Create Re lationships
  3. Upload the price list. o Contracts > Hosted Catalog Items and Price > Submit Hosted Cont ent and Price Data o Submission Type: Prices – Add/Update o Remember, an indexing may be re quired, so results won’t be imme diate.
