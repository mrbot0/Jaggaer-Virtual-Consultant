type: procedura
text: |-
  JI-ePRO-3000: JAGGAER Indirect eProcurement Specialization
  1. Add the new supplier: o From the Suppliers icon, add a new "internally managed supplier" and give it a name. o Note : Do not send an email invitation to register. o Note : This cannot be a supplier who has logged into the supplier portal; it has to be an entirely client‐managed instance of the supplier. If the client already does business with the supplier and the supplier logs in to the portal, the client should upload their own catalog that way.
  2. Configure the Supplier:
  3. Make them Active for Shopping from the General tab.
  4. In the supplier’s profile, assign it to the Client Internal Catalog Suppliers class.
  5. (JAGGAER user) From the System Settings tab, click " Has Catalog "
  6. From Contacts and Locations > Addresses , Use the Add an Address with Address Wizard option to set up an address and fulfillment center for the supplier.
