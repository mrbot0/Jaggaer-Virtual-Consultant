text: |-
  Attribute: productType | Mandatory (Y/N): Y | Description: Method by which the item was selected. Possible values:
  Catalog
  ContractItem
  Form
  NonCatalogItem
  OrgCatalogItem
  Punchout
  TradeIn
  VirtualContractItem
  VirtualItemMasterItem
  No matter which product type you specify, you must also identify the supplier by specifying the @id attribute, the SupplierNumber field, or both, in the Supplier element.
  ContractItem indicates a non-catalog item that is loaded directly onto a contract. If you specify a ProductType of ContractItem, you must also specify either the CatalogNumber or the ProductReferenceNumber on the Item element.
  OrgCatalogItem is a legacy product type. It has been replaced by VirtualContractItem and VirtualItemMasterItem.
  Do not specify Punchout unless the supplier is configured as a punchout supplier.
  VirtualContractItem indicates a contract item that is linked to a hosted catalog item. If you specify a ProductType of VirtualContractItem, you must also specify either the CatalogNumber or the ProductReferenceNumber on the Item element.
  VirtualItemMasterItem indicates an item master item that is linked to a contract item, a hosted catalog item, or both. If you specify a ProductType of VirtualItemMasterItem, you must also specify either the CatalogNumber or the ProductReferenceNumber on the Item element.
