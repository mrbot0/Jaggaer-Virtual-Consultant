        Import JIOrder method
        Main request structure [Import JIOrder method]: element “lineList” marked as mandatory with the comment that at least an order line must be set in the request.
        Header [Import JIOrder method]: element “supplier”, remarked it must always be provided
        SupplierInfo [Import JIOrder method]: note added stating “You must specify either the id element, the supplierNumber field, or both.”
        JIOrderLine [Import JIOrder method]: element “item” marked as mandatory.
        Export and import methods: JIOrderLine “quantity” field changed from unsigned long to double value to represent decimal number, too. In case quantity is a positive whole number, it is exported with no decimal value and with no decimal separator.
