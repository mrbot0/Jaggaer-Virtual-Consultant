text: |-
  Colonne: Attribute | Description
  Attribute: returnCode | Description: Global Operation result.
  This code is about the web service call, not about import result.
  For information about import, consider data specified in responseMessage field.
  See “Error codes [JIOrder Status Import method]” below for a list of possible global code
  Attribute: returnMessage | Description: Global result description. If operation completed successfully, it is “OK”, otherwise it is a brief explanation of mismatches found.
  Attribute: statusResponseMessage | Description: Import operation result description, inserted if provided data is formally correct and no generic error (e.g.: communication error) was found.
  If a problem occurred during the import, the responseMessage includes appropriate warning or error messages
  See section “StatusResponseMessage [JIOrder Status Import method]” below.
