text: |-
  Colonne: Attribute | Description
  Attribute: statusCode | Description: Import response result code.
  200 – The request was processed successfully in its entirety with no warnings or errors.
  201 – User data was imported successfully, but one or more warnings were generated. The warnings are included in the response.
  Any other code indicates an import failure. For instance:
  400 – The request could not be understood due to syntax errors.
  403 – User import failed because authorization failed
  408 – Request Timeout
  500 – The request could not be processed due to a transient error.
  Attribute: statusText | Description: Text of the status message
  Attribute: statusImportErrorList | Description: List of generic import error information found.
  See section “Error [JIOrder Status Import method]” below.
