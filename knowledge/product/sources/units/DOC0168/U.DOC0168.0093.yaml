text: "Colonne: Attribute | Description | Available from version Attribute: catalogNumber | Description: Unique ID number for a specific stock item in the supplier inventory Attribute: auxiliaryCatalogNumber | Description: Catalog number, sometimes used by punchout suppliers to provide additional identification of an item. Attribute: description | Description: Description of the item being purchased Attribute: productUnitOfMeasureList | Description: Container for description of the unit of measure of the item. See section “ProductUnitOfMeasure [Export JIOrder method]” below Attribute: productSizeList | Description: Container for description of the size of the item. See section “ProductSize [Export JIOrder method]” below Attribute: unspsc | Description: Standardized commodity code value for the item, as specified by http://www.unspsc.org (for example, 43191501 - Mobile phones). Attribute: commodityCode | Description: Code assigned to a product, or a group of products, for the purposes of identifying it in international commerce, or commerce in general. CommodityCode is not a specific description of the goods or service. Attribute: productReferenceNumber | Description: Unique ID for hosted products in JAGGAER Indirect, not usually needed by customers. Attribute: productType | Description: Method by which the item was selected. Catalog Form Punchout NonCatalogItem ContractItem Attribute: productClassificationList | Description: Container of item classification. See section “ProductClassification [Export JIOrder method]” below. Attribute: categoryInfo | Description: Item category information. See section “CategoryInfo [Export JIOrder method]” below Attribute: manufacturerInfo | Description: Item manufacturer information. See section “ManufacturerInfo [Export JIOrder method]” below Attribute: leadTimeDays | Description: Lead time the vendor requires to fill the order. Attribute: casNumber | Description: CAS number to identify chemicals Attribute: radioNuclide | Description: RadioNuclide number to identify RadioNuclides. Attribute: barCode | Description: Bar code for the item. Attribute: itemAttributeList | Description: Container of item attribute information. See section “ItemAttribute [Export JIOrder method]” below. Attribute: serialNumber | Description: Serial number of the trade-in line item."
