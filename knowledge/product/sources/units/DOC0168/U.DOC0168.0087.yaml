text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: transactionDetail | Description: Transaction information.
  See section “TransactionDetail [Export JIOrder method]” below | Available from version: JINT_20_01_01
  Attribute: totalTransactionAmount/money | Description: Total amount of all transactions being charged against the virtual card.
  Must be a positive number or zero.
  See section “Money [Export JIOrder method]” above | Available from version: JINT_20_01_01
  Attribute: overToleranceRate | Description: Percentage over the order amount that can be charged against the virtual card and still be considered a valid amount. Often, the order amount will include an estimate of tax, shipping and handling, or other charges that may change as the order is finalized. The over tolerance rate accounts for these deviations to allow the purchase order to be processed.
  The over tolerance rate is defined as part of the configurations when a virtual payment card is requested. | Available from version: JINT_20_01_01
  Attribute: orderAmount/money | Description: Total amount of the order for which the virtual card was submitted.
  Must be a positive number or zero.
  See section “Money [Export JIOrder method]” above | Available from version: JINT_20_01_01
