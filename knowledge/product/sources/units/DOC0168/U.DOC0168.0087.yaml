      - |-
        Percentage over the order amount that can be charged against the virtual card and still be considered a valid amount. Often, the order amount will include an estimate of tax, shipping and handling, or other charges that may change as the order is finalized. The over tolerance rate accounts for these deviations to allow the purchase order to be processed.
        The over tolerance rate is defined as part of the configurations when a virtual payment card is requested.
