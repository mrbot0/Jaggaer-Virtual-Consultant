  Colonne: Attribute | Description | Available from version
  Attribute: templateName | Description: Used in billTo information, Name of the template to be called by this label type.
  Attribute: addressCode | Description: Used in billTo information, Address code associated with this billing address. Use the AddressCode field to link the BillTo address to the billing address stored in your ERP system.
  Attribute: contactList | Description: Container of contact information.
  See section “Contact [Export JIOrder method]” below
  Attribute: addressLineList | Description: Container of address line information.
  See section “AddressLine [Export JIOrder method]” below
  Attribute: city | Description: City
  Attribute: state | Description: For US addresses, 2-character state code.
  For non-US addresses, name of the province, county, or region.
  Attribute: postalCode | Description: Postal code.
  Attribute: country | Description: Long name of the country.
  Attribute: isoCountryCode | Description: 2-letter ISO country code of the contact's country.
