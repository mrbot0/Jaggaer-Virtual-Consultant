text: |-
  Colonne: Field | Description | Datatype | Notes | UI Default Label (EN)
  Field: OBJ_KEY | Description: Internal file identifier, used to link data from this file with data retrieved from other files. | Notes: Mandatory
  Field: CF_NAME | Description: Hard-coded value, such as Cost Center. Must be a valid custom field name defined in the solution. | Datatype: VARCHAR2(100 CHAR) | Notes: Mandatory
  Field: CF_VALUE | Description: Value of the custom field. | Datatype: VARCHAR2(100 CHAR) | Notes: Mandatory
  Field: DESCRIPTION | Description: Description of the custom field value. | Datatype: VARCHAR2(100 CHAR)
  Field: ACTIVE | Description: Indicates whether the value should be active for shoppers in the JAGGAER Indirect solution:
  true = Value should be active for shoppers. An active item is available to appropriate end users when shopping in the solution.
  false = The value should be inactive for shoppers. An inactive item is not available to end users. A value might be marked inactive even if it has relationships in place.
  Default is 1. | Datatype: VARCHAR2(5 CHAR) | Notes: Mandatory
