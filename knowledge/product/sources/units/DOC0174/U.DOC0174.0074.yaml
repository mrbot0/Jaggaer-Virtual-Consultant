text: |-
  Colonne: Field | Description | Datatype | Notes | UI Default Label (EN)
  Field: RULE_KEY | Description: Internal file identifier, used to link data from this file with data retrieved from other files. | Notes: Mandatory
  Field: CF_NAME | Description: Hard-coded value, such as Cost Center. Must be a valid custom field name defined in the solution. | Datatype: VARCHAR2(100 CHAR) | Notes: Mandatory
  Field: CF_VALUE | Description: Value of the custom field. | Datatype: VARCHAR2(100 CHAR) | Notes: Mandatory
  Field: WORKFLOW_TYPE | Description: Type of workflow. Must be a valid workflow type licensed to your organization.
  Possible values:
  requisition
  po
  invoice | Datatype: VARCHAR2(100 CHAR) | Notes: Mandatory
  Field: RULE_MIN_RANGE | Description: Minimum value that triggers the workflow rule. This is a numeric value of up to 15 digits, including up to 4 decimal places. | Datatype: NUMBER(15,4) | Notes: Mandatory
  Field: RULE_MAX_RANGE | Description: Maximum value that triggers the workflow rule. This is a numeric value of up to 15 digits, including up to 4 decimal places.
  If there is no maximum value, specify an asterisk (*). | Datatype: NUMBER(15,4) | Notes: Mandatory
  Field: RULE_CURRENCY | Description: Currency type for the range amount.
  See the Integration Currency Codes document in the JAGGAER Indirect Online Help for valid currency codes. Must be among your organization’s supported currencies. | Datatype: VARCHAR2(3 CHAR)
  Field: AUTO_APPROVE | Description: Enables the automatic approval of the rule when the user placing the order is an approver for that rule.
  Possible value: true and false | Datatype: VARCHAR2(5 CHAR)
