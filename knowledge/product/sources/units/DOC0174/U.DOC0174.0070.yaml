text: |-
  Colonne: Folder | File Name | Description
  Folder: CREATE_UPDATE | File Name: <PREFIX>CFVALUE.CSV | Description: Information about custom field values to be modified (created or updated).
  File Name: <PREFIX>CFVALUEDEL.CSV | Description: Information about custom field values to be deleted.
  File Name: <PREFIX>CFVAPPROVER.CSV | Description: List of approver users related to the custom field value. The approvers list works in FULL-REFRESH. All approvers must be passed.
  File Name: <PREFIX>CFVBU.CSV | Description: List of business units assigned to the custom field value.
  Whatever the component of the custom field you want to update, if the custom field value has an existing business unit associated with it, this file must always be provided; otherwise, the existing business unit will be removed.
  File Name: <PREFIX>CFVWFRULEDEL.CSV | Description: List of WF dynamic rules to be deleted related to the custom field value.
  File Name: <PREFIX>CFVWFRULEMOD.CSV | Description: List of WF dynamic rules to be created or updated related to the custom field value.
  File Name: <PREFIX>CFVWFAPPROVER.CSV | Description: List of approver users related to the WF dynamic rule. The approvers list works in FULL-REFRESH. All approvers must be passed.
  File Name: <PREFIX>CFRELATIONSHIPMOD.CSV | Description: Information about custom field relationships to be added.
  File Name: <PREFIX>CFRELATIONSHIPDEL.CSV | Description: Information about custom field relationships to be deleted.
