text: Starting from the root folder, the system searches for an initial folder whose name starts with the prefix specified in the rootDataFolderName configuration parameter. (By default, the value JICUSTOMFIELDDATA is used for the JI CUSTOM FIELD Service.) Note that JICUSTOMFIELDDATA is the prefix. The folder name can be longer and include other characters after the prefix.
