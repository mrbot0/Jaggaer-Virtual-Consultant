text: Grainger maintains more complete and accurate information on their products in their hosted catalog than the organization does in the ERP item master, and the list price offered on the hosted catalog is the default price for this organization. The customer wants to consolidate the Grainger item master item with the hosted catalog item, showing the hosted catalog item price and detail in item search results. Link the Grainger item master item to the item in the Grainger hosted catalog.
