text: |-
  4/15/2021
  1. Create a new item master item for a mop bucket.
  2. Set up a custom catalog attribute IM ID for item master IDs.
  3. Add the item master ID of the new item master item to the custom catalog attribute of the corresponding hosted catalog item part number CB5000 .
  4. Enable and configure the automatic linking by item master ID rule and run the linking engine.
  5. View the linking details for that s upplier in the item master item supplier item details.
