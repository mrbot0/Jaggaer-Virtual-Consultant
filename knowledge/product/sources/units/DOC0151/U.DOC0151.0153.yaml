text: The customer manages the list of personal care products they use to run their business in the item master of their ERP. Shoppers request these items in ePro as needed. One of these items is a toothbrush manufactured by CORTECH and offered by several suppliers Add the item master item for this toothbrush so that it is available for shopping in ePro.
