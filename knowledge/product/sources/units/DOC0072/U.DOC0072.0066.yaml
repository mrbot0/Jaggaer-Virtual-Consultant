text: "- EP-1774 Add the GUI and Wiring for the SCT Addresses mapping on the new tab CLOSED Navigate to Setup > Hosted Catalog and Ordering Configuration > Category, Commodity and UOM Mapping Sets >Select the Default Mapping set, Select SCT Addresses. In order to manage this page, the user needs an administrative permission called Catalog Management. Generally this configuration is setup by an internal user or partner user, but it is accessible by regular users. Organizations with the Banner Finance ERP application are able to send a supplier synchronization message to the eProcurement application. This message keeps the eProcurement system synchronized with the Banner Finance system of record. Banner Finance allows the customer to define different types of supplier addresses. The eProcurement system needs a table that tells it how to interpret the different address types coming from Banner Finance."
