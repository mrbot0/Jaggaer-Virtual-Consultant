text: Package inbound mappings might be needed if the ERP system is sending carts, requisitions, purchase orders or invoices into the site via an XML integration point. If the ERP system defines a case as CE but JAGGAER defines it as CS, then the customer organization can create a map that will cause the application to read the CE value and translate that to the CS value when parsing messages sent to the JAGGAER site. The imported documents will show the correct JAGGAER value when viewed in the user interface.
