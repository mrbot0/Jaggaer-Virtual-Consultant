text: By default, the user would see "CS" in product search results, in favorites and in their cart. However, if you changed this setting to show "Description Only", then the user would see "Case" instead of CS. One reason you may want to make this change is when the UOMs that your shoppers are used to seeing in your ERP system don't match the System UOM values. This could cause some confusion to the shopper.
