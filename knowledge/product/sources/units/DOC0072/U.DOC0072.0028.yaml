text: 'The hard coded default values for UOM configuration in a new org or in an org that never defined these fields: "Select to Use UOM Mapping Functionality" - off by default "Choose Display Format for Packaging UOM" default will be: UOM Only (e.g. "CS") "Outbound to ERP Integration Value" default will be: send supplier value "Default Inbound Package UOM Value" default will be: EA - Each Once decisions are made on the UOMs configuration page, then other tabs become available for creating a map between JAGGAER UOM values to the ERP system matching UOM value. Select To Use UOM Mapping Functionality: Select this checkbox to map Package UOM and Product Size UOM values for both inbound and outbound values. Choose Display Format for Packaging UOM: This setting will allow you to set how the System Packaging/UOM for an item is displayed to the user.'
