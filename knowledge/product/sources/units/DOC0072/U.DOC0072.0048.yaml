text: Suppliers use these codes to classify their products or services so that our customers buying products can more easily manage the spend per classification. Some organizations only care about tracking spend at the Segment and Family level and some may care about classifying spend at a more detailed level. Therefore, we provide them a way to decide how they want to view and export this data to their ERP (Enterprise Resource Planning) systems. The UNSPSC page in the default mapping set defines how the customer site wants to view the UNSPSC code values on items and how it wants this data sent to the ERP in XML or electronic messages.
