text: In the 18.1 release development towards creating multiple mapping sets and then making those available for business unit designation began. The feature will be partially completed in 18.1 release. In 18.1 release, the back-end data is migrated to a new database table schema that will later on allow us to select an entire mapping set that can be related to one or more business units. (We originally thought we would be able to add the multiple mapping sets functionality per org in 18.1, however there were complications for making the multiple sets available to upstream products like TSM, Sourcing and Contract modules. Therefore, we are hiding the ability to create multiple sets in 18.1 and will continue to work on the back-end design for making more than the default set available to other modules in a later release.)
