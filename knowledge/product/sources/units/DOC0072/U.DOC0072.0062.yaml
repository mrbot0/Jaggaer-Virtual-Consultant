text: While testing for 18.1 we compared the way UNSPSC values are exported in XML and in document search exports to the way it was done in 17.3. We found that the separator is completely ignored for exports in the 17.3 release. Therefore, we are not using these settings in 18.1 when we do an XML export of a document or when we perform a transaction or full export of a set of documents in document search. In the 17.3 release the field "Apply to UN/SPSC Integration Value" field is not being obeyed for XML exports. Therefore, we are not changing this behavior in 18.1.
