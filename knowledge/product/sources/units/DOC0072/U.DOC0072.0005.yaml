text: Why did we need a new database structure and a data migration? The new schema is designed so that in a future release, a Multi-Business Unit organization can specify one mapping set to use per business unit. The new schema design will also eventually allow a Non-Multi-Business Unit organization to create a new mapping set and completely configure it before making it the default for business processes.(Currently, each time an admin makes a change, that change immediately becomes live. Admins would like to fully configure all of their planned changes before switching business processes over to their new configuration.) The data from the old Manage Commodity Codes and Mappings user interface was migrated from the SciQuest database schema to a new schema called CategoryUOMMappingSets.
