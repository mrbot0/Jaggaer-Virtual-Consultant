text: 'UN/SPSC Masking Format: This setting specifies how many segments of the code to be shown in the JAGGAER system. Some organizations only want the first two segments, in which case zeros are sent for the final two segments if sent to an external system. The UNSPSC value has 4 parts to it. The first 2 digits represent a "Segment". The next 2 digits represent a "Family". Then the two digits after that represent a "Class". The last two digits represent a "Commodity". Sometimes the customer only care about part of the UNSPSC, therefore we give them a way to only show the values for the portions they care about and populate the other portions with zeros.'
