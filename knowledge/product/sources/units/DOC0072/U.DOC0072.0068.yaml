text: Some of our older Banner Finance customers like Virginia Tech = VATech (site name in switch org) use this table. Here is an example message for supplier synchronization. Notice the "type" attribute in the Address elements. <PurchasingAddress status="Active" type="Order Address" number="1"> = the primary fulfillment address <AccountsPayableAddress status="Active" type="Order Address" number="1"> = the primary remittance address <Address status="Active" type="Vendor Payment Address" number="1"> = a generic active remittance address
