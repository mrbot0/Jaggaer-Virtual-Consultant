text: "Managing Commodity Code List in AP Director, CMR/TCM, Sourcing Director, TSM: There are a few stand-alone license modules that do not require the organization to have the Spend Director license. When an organization does not have the Spend Director license, they manage the commodity code list from a different navigation path and they have a simplified user experience. The user interface has a search for finding a commodity code. Navigate to Suppliers > Configuration Settings > Commodity Codes"
