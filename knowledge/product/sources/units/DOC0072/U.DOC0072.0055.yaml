text: "UN/SPSC Separator: While testing for 18.1 we compared the way these values are exported in XML and in document search exports to the way it was done in 17.3. We found that this separator is completely ignored for exports in the 17.3 release. Therefore, we are not using these settings in 18.1 when we do an XML export of a document or when we perform a transaction or full export of a set of documents in document search."
