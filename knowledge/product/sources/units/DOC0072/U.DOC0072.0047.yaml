text: When suppliers in our network are loading items for a hosted catalog, they classify their items by category. They also provide the UNSPSC value as part of the item details. Punchout suppliers will send items back to our site with a UNSPSC value. The values provided on items allow the customers to then create a mapping from the JAGGAER proprietary category associated with the UNSPSC codes.
