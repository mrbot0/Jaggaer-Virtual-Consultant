text: Out of Scope • JAGGAER does not publish nor maintain production supplier data • Suppliers own, publish, maintain all production content and pr icing via their JAGGAER Supplier Portal • JAGGAER will publish content and pricing into UIT/Test environ ment when needed • JAGGAER will provide data best practices on content and pricin g, especially around UNSPSC and images, and provide hands-on education • JAGGAER does not negotiate any supplier/client contracts
