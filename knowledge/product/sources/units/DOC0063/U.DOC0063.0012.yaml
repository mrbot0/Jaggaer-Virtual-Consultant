text: When exporting from Excel… if you choose CSV, then I think it can be confusing. Excel does some odd things. First, they will only put the double-quotes (“) around the text if a specific cell contains a comma… but if you are in some countries where they switch the commas and periods, then I think it will use semi-colons to separate the cells?
