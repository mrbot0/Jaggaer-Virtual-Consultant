text: One way to do this is to rename the file and give it a file extension of .txt (this won’t affect the underlying data at all). When opening the file with Excel (you may have to change the filter in the Open dialog box to include TXT files), Excel will automatically start the Import Wizard – where you can manually format all columns as “Text” (I automatically choose all columns as text, because Excel will not just reformat numbers, but dates and times, too). There are other options you can choose during this import wizard to help Excel understand the data – like identifying the delimiter; how to treat consecutive delimiters; what the “text qualifiers” are, etc…
