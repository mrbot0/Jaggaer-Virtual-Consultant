text: |-
  Managing Suppliers and Configuring Orders
  1. Buyer org must set up an acco unt with and get configuration details from bank.
  2. Org provides config details, an d JAGGAER turns vCard payments on.
  3. JAGGAER adds step to PO workflo w to communicate with bank to acquire the single-use credit card number.
  4. Org admin assigns card to user and supplier.
