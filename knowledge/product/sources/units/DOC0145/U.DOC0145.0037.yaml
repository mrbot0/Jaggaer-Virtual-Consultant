text: |-
  Managing Suppliers and Configuring Orders
  1. Create a new supplier class.
  2. Open the profile for a supplier and apply the class to that supplier.
  3. In supplier search, se arch for the supplier using the Supplier Class filter.
  4. In advanced item sear ch, search for items from that supplier and view the supplier class filter option.
