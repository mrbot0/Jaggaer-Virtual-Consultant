text: |-
  Take it to the Next Level:
  1. Familiarize yourself with the questions in the JLL Client Business Insights form
  2. Read through the pdf Case Study for JLL and make note of the things that might apply to the form
  3. Fill out the JLL Client Business Insights form to the best of your ability using the Case Study.
  4. Read through the other two Case Studies and make note of the different needs and processes that the other two company’s have vs. those of JLL.
