text: In the event the webservice client exceeds a preconfigured number of webservice calls per a given period (usually 100 per minute), when this scenario was not previously agreed, the server will return an HTTP status 429 (Too Many Requests) as per RFC 6585 (https://tools.ietf.org/html/rfc6585#page-3).
