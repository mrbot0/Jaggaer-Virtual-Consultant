text: |-
  JSON Web Token (JWT)
  1. Issuer (iss) = agreed at activation time
  2. Subject (sub)= agreed at activation time
  3. Audience (aud) = hostname of the JINT endpoint
  4. Issued At (iat) = JINT won’t accept a JWT issued in the future or older than 24h
  5. Expire At (exp) = in case is provided JITN will check is not in the past
