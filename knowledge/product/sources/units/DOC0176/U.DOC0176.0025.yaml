text: JINT usually accepts also request including small files encoded base64 and included in the SOAP request but this has not to be considered a feature to be exploited for “production level” integrations since SOAP requests above a preconfigure size threshold (e.g. because including to several or large files encoded in base64) will be refused with a 400 error
