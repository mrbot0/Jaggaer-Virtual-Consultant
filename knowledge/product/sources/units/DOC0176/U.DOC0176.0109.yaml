  URL: Http Method | /esop/jint/api/public/v1/tokens: POST
  URL: Header Parameters
  URL: Body Parameters | /esop/jint/api/public/v1/tokens: client_id : client identified defined at setup phase
  client_secret: shared password defined at setup phase
  grant_type=client_credentials (fixed value)
  URL: Response format: JSON | /esop/jint/api/public/v1/tokens: Json response message including created token. The following fields are defined
  Token: the opaque token to be used for invoking the JINT API
  Resource: the endpoint the tokecn is valid for
  token_type= Bearer [segreto] = the datetime the token expires (fomat yyyy-MM-dd'T'HH:mm:ss.SSSX). The token TTL is usually 24 hours
  expire_in = the token TTL (in mseconds)
  URL: Return Codes | /esop/jint/api/public/v1/tokens: 200 token created successfully
  400 wrong or missing data
  401 Unauthorized request ( i.e. the provided credentials are invalid)
  500 internal error
