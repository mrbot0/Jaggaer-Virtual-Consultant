text: The web service has been designed to manage validation errors related to the SOAP Request content by including error code and error details in the SOAP Response. Possible error codes for each operation are listed in the specific tables in the previous “Error codes” chapters. These errors are not raised at protocol level. This design choice allows errors handling to any legacy system.
