text: "• The following options are available for Package UOMs outbound t o the ERP under the “Outbound to ERP Integration Value” pulldown: o send system value ‐ Distributes the JAGGAER‐mapped UOM value to the ERP. This value is the value seen in the application (Search, Non‐Catalog, etc). o send supplier value ‐ Send the supplier UOM value to the ERP. o send mapped value – Used for specific UOM mapping as described below."
