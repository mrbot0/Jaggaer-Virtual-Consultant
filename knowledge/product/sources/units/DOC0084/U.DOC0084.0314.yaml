text: "• Mapping Types: o Category Name ‐ This option maps the Commodity Code field to the JAGGAER category name. Mapped values can be overridden on the Category Map tab. o Category UN/SPSC ‐ This option maps the Commodity Code field to the JAGGAER category UN/SPSC values. Mapped values can be overridden on the Category Map tab. o Free‐Form Value ‐ This option does not map the Commodity Code field to any value by default."
