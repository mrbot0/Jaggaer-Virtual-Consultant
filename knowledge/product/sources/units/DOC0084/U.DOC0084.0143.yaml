text: "• Dynamic Workflow involves assigni ng Approvers to “objects” with in the system, such as: Custom Field values, Departments, Form types, Commodit y Codes, Contract Types etc. o Dynamic Workflow can be set for t he Requisition, PO & Invoice l evels of the object. o Dynamic Workflow uses Rules that can “Route All” or only be tri ggered by value ranges for the Document. o If enabled, “Enable Automatic Approvals” will automatically approve the step if the order was submitted by an appr over of this step."
