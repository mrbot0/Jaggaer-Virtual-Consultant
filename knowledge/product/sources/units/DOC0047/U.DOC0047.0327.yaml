text: Fax - Country Code Code to access the specific country, not including the international dialing sequence, for the fax number. 4 Fax - Area Code Area code for the fax number. 3 digits if the country is US, otherwise 5 digits max. 5 Fax - Number Fax number for the address. 7 digits if the country is US, otherwise 10 digits max. 10 Fax - Extension Fax extension for the address, if applicable. 5 Fax - Combined Entire Fax number, which is then parsed to the individual elements using the SQTools:phoneStringToSQFormat package
