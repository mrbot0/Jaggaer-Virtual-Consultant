text: This option will automatically create a new fulfillment center for each address of fulfillment type. This will set the fulfillment center's ERP Number to the same as the associated address. This will set the fulfillment center's name to the same as the associated address's name. If no name is provided, the fulfillment center's name will be "Fulfillment Center" New functionality in the site as of 16.1 makes this feature less necessary but still useful as it sets an ERP Number for the fulfillment center.
