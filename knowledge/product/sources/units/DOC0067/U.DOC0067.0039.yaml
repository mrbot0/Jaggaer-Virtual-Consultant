text: "General Site Settings \"Configuration\" page o Security and Sessions settings o International settings (country, language, time zone) o Appropriate settings under Misc. section (primarily attachment settings, search export settings, whether to show a supplier's JAGGAER ID number - most of the settings in this section are related to Spend Director and AP Director) o Email Settings (these are the settings for emails managed in Field Management) o Note: IF the client will need any of the Field Management emails and notifications modified, be sure to do that! o Email Addresses - 'from' and 'reply to' for various messages (again, these are for the emails under Field Management - and this is a good place to see a list of what is there) o M obile subtab - set up mobile settings o Currency Configuration page - Enable applicable currencies and establish order of preference o Note: Settings on the Document Export, Alias Mgt, Certification Mgt and Shared Secret pages are handled primarily by the Tech nical Consultant"
