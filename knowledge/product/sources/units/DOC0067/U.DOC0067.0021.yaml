type: procedura
text: |-
  Integrations
  1. Configure top -level org role with all permissions and settings that will apply to any user throughout the life of the client's system ; CAUTION: Keep in mind that as products are added in the future, the settings in the top -level role will apply to EVERYONE, so for example if setting up TCM only, don't give this role permission to Manage Contracts or all users will be able to do it.
  2. Configure inactive 'umbrella' roles for all the functions available in the client's org
