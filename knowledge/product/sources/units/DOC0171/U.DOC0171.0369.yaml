text: In section definitions the sectionPos is always preferred to the section name. A section is also known as a parameterGroup. The section name is not guaranteed to be unique. If a section position and a section name are given the section position will be used, even if the section name is not a valid section name. If a section name and a section name are given and both are not valid the webservice will respond with an appropriate error message.
