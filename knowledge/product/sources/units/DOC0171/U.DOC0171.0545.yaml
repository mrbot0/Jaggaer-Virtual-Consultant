text: |-
  Note
  1. Buyer can configure the rfq so that suppliers need to have the same consortium for all lots. In this case, when suppliers answer to the qualification only RFQ, they define the consortium and then in each lot is stated that the consortium is the same of the qualification only rfq (this is useful if supplier have the same consortium for all lots, so that they can insert this information only once)
  2. Buyer can also configure the rfq so that suppliers can have different consortiums for different lots. In this case, when suppliers answer to the qualification only RFQ, they define the consortium. Then when they answer to a lot,
