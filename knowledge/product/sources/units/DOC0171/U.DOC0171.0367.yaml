text: When operation code CHANGE_OWNER is used, only owner user of the existing RfX will be updated. It’s necessary to provide the RfX identifier, rfxID or Reference Code, and new Owner User identifier. If assignOwnerDivision flag is set to true the RfX Division value will be set according to the Division of the new Owner.
