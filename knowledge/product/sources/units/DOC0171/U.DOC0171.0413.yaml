text: A special filtering section named DEConditionFilter (Data Element Condition filter) can be specified in order to retrieve only rfx having data elements with specific values. If a data element condition filter is used, it will apply to either the RFX type data or the RFX Award type data, depending on how that data element is mapped. If a DE_ID is mapped to BOTH an RFX Type and an RFX Award Type, then filter will be applied to RFX type data.
