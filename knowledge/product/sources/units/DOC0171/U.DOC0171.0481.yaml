text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: numSupplInvited | Description: Number of invited suppliers.
  Attribute: numSupplResponded | Description: Number of invited suppliers who have responded.
  Attribute: numSupplNotResponded | Description: Number of invited suppliers who have not responded.
  Attribute: numSupplRespDeclined | Description: Number of invited suppliers who have declined to respond (auto-excluded).
  Attribute: numSupplRespAccepted | Description: Number of invited suppliers with response accepted (populated if the RfX is in evaluation phase i.e. RfX status > 400).
  This is a subset of the suppliers counted in numSupplResponded.
  Attribute: numSupplRespExcluded | Description: Number of invited suppliers having submitted a valid response, but then excluded during pre-evaluation or evaluation phase.
  This is a subset of the suppliers counted in numSupplResponded.
  Attribute: numSupplRespExcludedPreEval | Description: Number of invited suppliers that have been excluded in pre-evaluation stage.
  This is a subset of the suppliers counted in numSupplRespExcluded.
  Attribute: numSupplRespExcludedQual | Description: Number of invited suppliers that have been excluded in evaluation stage, qualification phase.
  This is a subset of the suppliers counted in numSupplRespExcluded.
  Attribute: numSupplRespExcludedTech | Description: Number of invited suppliers that have been excluded in evaluation stage, technical phase.
  This is a subset of the suppliers counted in numSupplRespExcluded.
  Attribute: numSupplRespExcludedComm | Description: Number of invited suppliers that have been excluded in evaluation stage, commercial phase.
  This is a subset of the suppliers counted in numSupplRespExcluded.
  Attribute: numSupplRespExcludedAward | Description: Number of invited suppliers with response accepted but then excluded from awarding.
  This is a subset of the suppliers counted in numSupplRespAccepted.
