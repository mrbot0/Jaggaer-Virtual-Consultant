text: When operation code UPDATE_ATTACH_BUYER is used, only buyer side attachment of the existing RfX will be updated. It’s necessary to provide the RfX identifier, rfxID or Reference Code, and new Attachment. The attachment will be uploaded regardless the current status of the RfX.
