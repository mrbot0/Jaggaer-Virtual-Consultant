text: This web service method can be used to import RfX into the JA platform. It implements creation of new item, update of existing one and “insert-update” logics (if an RfX with the given code/id already exists then the existing object is updated, otherwise a new element is created). Such behavior is ruled explicitly by providing in request a proper operation code.
