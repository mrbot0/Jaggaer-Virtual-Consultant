text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: parameterId | Description: Id if the commercial field
  Attribute: price | Description: Seller price (it can have exponential notation)
  Attribute: quantity | Description: Seller quantity
  Attribute: notes | Description: Seller notes
  Attribute: buyerPrice | Description: Price confirmed by the buyer
  Attribute: awardState | Description: Awarding state of the single offer item:
