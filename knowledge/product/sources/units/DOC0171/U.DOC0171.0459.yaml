  Attribute: discount | Description: Seller discount value (%) | Available from version: BA_17_02
  Attribute: assignedQuantity | Description: Assigned quantity by buyer in awarding | Available from version: BA_18_00
  Attribute: questionType | Description: The only value is PRICE for Price section | Available from version: JA_19_00
