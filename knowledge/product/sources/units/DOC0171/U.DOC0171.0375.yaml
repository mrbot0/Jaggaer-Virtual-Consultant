text: "Colonne: Code | Description Code: 0 | Description: operation completed successfully Code: 1 | Description: operation completed successfully with warnings as detailed in the returned message Code: -500 | Description: Error occurred while saving RFQ header/settings Code: -501 | Description: Error occurred while saving Additional Information/Data Elements Code: -502 | Description: Unable to save Attachments Code: -503 | Description: Error occurred while saving Supplier Code: -504 | Description: Error occurred while saving Technical or Qualification Envelope Code: -505 | Description: Error occurred while saving Commercial Envelope Code: -506 | Description: Unable to remove RFx Code: -507 | Description: Unable to create RFx from template Code: -508 | Description: Error occurred while saving Evaluation Group Code: -509 | Description: Error saving RFx e-mail recipients Code: -510 | Description: Error creating RFx Code: -511 | Description: Unable to save Opening Committee Code: -512 | Description: Error duplicating RFx Code: -996 | Description: Invalid Request Object (Request doesn’t match web service definition or request contains information that are not compliant with instance configuration or user permission). NOTE: This generic error code can show in the error message the sub-code 132(Attach.fileBase64). This means that in the platform there is an existing version of the same attachment you are trying to import in the Rfx request and it cannot be overwritten, or you are trying to perform an UPDATE_RESET operation. Generally, this occurs because the Rfx is already running. Instead, when the Rfx is “to be published” all the attachments can be overwritten or it is a seller attachment and seller attachments are not allowed in that Rfq state."
