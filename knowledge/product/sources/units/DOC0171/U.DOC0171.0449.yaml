    - - id
      - JA internal identifier of the column (referenced in offers)
      - ""
    - - name
      - Column title
      - ""
    - - type
      - |-
        Column type:
        Valid value:
        BOOLEAN (True/False)
        MULTILINE (multi line text)
        TEXT
        NUMERIC (number)
        COMBO (single choice)
        NUMERIC_FORMULA [12.3.01]
        DATE [22.02.00] Note: format is yyyy-MM-dd
        NUMERIC_SR_FORMULA[23.1.0]
      - ""
    - - allowedValues
      - In case of choice list of allowed values
      - ""
    - - defaultValue
      - |-
        The additional column default value
        Note: In case of additional column with type NUMBER, the number format has 3 decimal positions by default.
        It is possible to enable a ws configuration parameter to check the DECIMAL_SCALE toolkit parameter in order to align the decimal positions in the ws output with the ones shown in the platform.
      - 12_2_00
    - - sellerVisibility
      - |-
        Visibility of the additional column to the seller.
        Valid value:
        0 = not visible
        1 = visible in read-only mode
        2 = visible and writeable
      - 12_2_00
    - - columnPos
      - Progressive identifier of the additional column parameter (1-based enumeration)
      - 12_2_00
    - - mandatory
      - Mandatory additional column parameter flag. (1-parameter is mandatory; 0-parameter is optional)
      - 12_2_00
    - - defaultLineValues
      - "Default line value redefined for additional column [see section “Commercial Envelope: Redefined Default Line Values” below]"
      - ""
    - - formulaData
      - "For additional column type of NUMERIC_FORMULA or NUMERIC_SR_FORMULA, formulaTCO is always shown, and if formulaTCO=1, then aggregationTypeTCO is also shown. Formula value is shown for additional column of type NUMERIC_FORMULA [see section “Commercial Envelope: Formula Values” below]"
      - ""
    - - code
      - It is a code that can be used by external systems to identify the column and that it must be unique. It is the unique name of the column belonging to the Column Library
      - JINT_20_03_01
    - - columnUniqueCode
      - It's a code used to identify the column.
      - JINT_23_01_00
