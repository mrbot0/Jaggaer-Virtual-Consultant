text: |-
  Attribute: columnPos | Mandatory (Y/N): N | Description: Progressive identifier of the additional column parameter (1-based enumeration) | Mapping on JA data model and notes: Progressive identifier of an existing additional column parameter to update;
  It must not be specified when creating parameter for new section; for existing section, it is used to try to identify an existing parameter to update and so, in case of creation of new parameter, it is advisable not to specify this value.
  If positive and the section doesn’t contain a multi column parameter with such identifier, it is assumed that it refers to a new parameter to be created. Otherwise it is used to identify a parameter to be updated.
  See §Behavior, section “Envelope Management”.
