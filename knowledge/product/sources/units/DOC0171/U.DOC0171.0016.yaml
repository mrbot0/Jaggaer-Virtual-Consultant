text: "2. Request data format: describes the possible operations on import (CREATE, UPDATE, CREATE_FROM_TEMPLATE and so on) and describes the structure of the request. The request is composed of sections and every section is composed of fields to be filled. This paragraph specifies which fields are mandatory depending on the operation you want to perform and those that can be omitted."
