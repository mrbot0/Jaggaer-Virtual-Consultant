text: The sub element ForceRfxVisibility can redefine the permission by assigning the visibility on the Rfx for the evaluation user. If the permission is already present in the standard permissions, no redefinition is performed. If the permission is redefined for a user and the user is removed from the evaluation group, the permission (forced) persists. If you need to remove it, you can do it manually, from the platform. The ForceSensitiveDataVisibility permission follows the same logic.
