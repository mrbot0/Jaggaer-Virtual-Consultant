text: "If this element is provided, the underlying additional info array (rfxAdditionalInfoList.getAdditionalInfo()) is verified 1. Additional Info array hasn’t been defined (null value) or it has been defined (not null value) but it doesn’t contain any additional info: if operation is called in RESET mode, all previously associated data elements are removed 2. Additional Info array contains at least one element: web service ensures currently provided data elements (identified by the value retrieved via provided data element name field) are created or updated, while not listed existing element are removed if operation is called in RESET mode, remains unchanged otherwise. 3. Updating the RFQ Award Type data element values does work as part of an UPDATE request, but only if the RFQ is in “to be published” or “running” statuses. If the RFQ is in a state where you can update the data element values associated with the RFQ Type on the “Settings” page, then you can successfully also update the data element values for the RFQ Award Type. The problem comes in once the RFQ transitions past RUNNING status. After that point, the web services are assuming that no updates of any kind can be made to the RFQ, because the RFX web service does not manage changes to the award details or evaluation data. RFX web service should allow the RFQ Award Type data element values to be updated in at least some statuses past RUNNING. 4. The request that is sent to update the RFQ Award Type data elements after the RFQ has moved past RUNNING status should be sent with an operation code of:UPDATE_ADDINFO instead of UPDATE. After an RFQ has moved past RUNNING status, any attempt to use the operation code of UPDATE will still fail. 5."
