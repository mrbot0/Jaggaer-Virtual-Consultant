text: "Colonne: Attribute | Description | Available from version Attribute: name | Description: Name of an existing additional info (data element) Attribute: type | Description: Type of the data-element Attribute: visibleToSupplier | Description: 0=no, 1=yes, Attribute: label | Description: Label in the default language Attribute: labelLocale | Description: default language Attribute: values/value | Description: Data-element value(s). In case of attachment data-element contains the filename. Note: In case of data element with type NUMBER, the number format has 3 decimal positions by default. It is possible to enable a ws configuration parameter to check the DECIMAL_SCALE toolkit parameter in order to align the decimal positions in the ws output with the ones shown in the platform. In case of option/multichoice data element, the value is extracted in the system default language. If the condition filter independentLocale is set, the value will be extracted in the “neutral” language. Attribute: Values/value/@id | Description: In case of attachment the Internal identifier of the attachment, to be used for calling attachments web service to download it In case of choice/multichoice the id of the choice Attribute: values/value/@secureToken | Description: In case of attachment it is the secure token to be used for calling attachments web service to download the attachment file. | Available from version: BA_17_03 Attribute: lastAnswerDate | Description: Date and time of the last answer | Available from version: 12_4_0_00 Attribute: lastAnswerUser | Description: User performing last answer."
