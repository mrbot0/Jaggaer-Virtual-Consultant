text: "More, envelopes offer a further mechanism to update existing parameter or additional column on existing section. If the id field is not provided but it is provided the paramPos, enclosing section is searched for a parameter at such position. If not found (paramPos is not positive or it is greater than existing parameter number), an attempt is made to identify the parameter to update via the reference field: enclosing section is searched for a commercial parameter having such value for reference code."
