text: "In particular, if the id field is provided, it must identify an existing parameter in the envelope we are working on, otherwise an error is returned and the operation abandoned: that means if we are totally creating new section for an envelope or if we want to create new parameter in an existing envelope section, the id field must not be provided (or provided with value -1 for commercial envelope additional column)."
