text: For commercial envelope additional column, if the id field is not provided, it first check if columnPos has been provided and, when positive, if it is no greater than the actual number of additional parameter. If this is the case, actual parameter will be updated. Otherwise, the name value is checked to verify if a parameter exists with the same column title. Again, if a match is found, the corresponding parameter will be updated. In all other case, a new parameter will be added.
