      - "EQUAL: required field must match exactly provided value"
    - - supplierUserLogin
      - |-
        Login of supplier user who can access to the RfXs.
        This filter allows to extract the list of RfXs accessible to the supplier user.
      - "EQUAL: required field must match exactly provided value"
    - - independentLocale
      - |-
        This filter forces the export of option/multichoice values in “neutral” language. If this filter is omitted the system default language is used.
        Possible values:
        YES, TRUE, Y, 1
        NO, FALSE, N, 0
      - EQUAL
    - - templateId
