  rows:
    - - statusCode
      - Status code of the RFx as a number
      - |-
        It accepts following operation:
        EQUAL: status must be equal to provided value
        NOTEQUAL: status must be different from provided value
        GREATER_THAN: status must be equal to or greater than provided value
        LESS_THAN: status must be lower than or equal to provided value
        IN: any project whose status matches one of provided values
        NOT_IN: any project whose status doesn’t match anyone of provided values
    - - lastUpdateDate
      - |-
        Last update date/time of the RfX
        Date value must be expressed in the form
        yyyy-MM-dd
        or
        yyyy-MM-dd HH:mm:ss.SSS Z
        eg. 2012-03-01 or 2012-03-01 12:36:42.535 +0100
      - |-
        Date filtering acceptd following operation:
        EQUAL: last update date must be equal to provided value
        NOTEQUAL: last update date must be different from provided value
        GREATER_THAN: last update date must be equal to or greater than provided value
        LESS_THAN: last update date must be lower than or equal to provided value
    - - rfxContentLastUpdateDate
      - |-
        Last update date/time of the RfX with update from suppliers considered
        Date value must be expressed in the form
        yyyy-MM-dd
        or
        yyyy-MM-dd HH:mm:ss.SSS Z
        eg. 2012-03-01 or 2012-03-01 12:36:42.535 +0100
      - |-
        Date filtering acceptd following operation:
        EQUAL: Rfx content last update date must be equal to provided value
        NOTEQUAL: Rfx content last update date must be different from provided value
        GREATER_THAN: Rfx content last update date must be equal to or greater than provided value
        LESS_THAN: Rfx content last update date must be lower than or equal to provided value
    - - rfxId
      - RfX internal identifier, as a string
      - |-
        All these filters accept following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        STARTWITH: required field must start with provided value (case insensitive)
        CONTAINS: required field must contain provided value (case insensitive)
        IN: required field must be present in provided value list
        NOT_IN: required field must not be present in provided value list
        For rfxReferenceCode, tenderCode, tenderReferenceCode and buyerCompanyCode other 2 operators can be applied:
        ISNULL: required field is checked to be null
        NOTNULL: required field is required to be valorized, no matter value
        For tenderCode is available the special value TENDER_TEMPLATE that identifies the RfX Templates. The following filters are equivalent:
        key=tenderCode
        operator=ISNULL
        and
        key=tenderCode
        operator=EQUAL
        value=TENDER_TEMPLATE.
    - - rfxReferenceCode
      - RfX user identifier, as a string
      - ""
    - - tenderCode
      - Project/Tender internal identifier, as a string
      - ""
    - - tenderReferenceCode
      - Project/Tender user visible identifier, as a string
      - ""
    - - buyerCompanyCode
      - Buyer company external code, as a string
      - ""
    - - buyerCompanyName
      - Buyer company name, as a string
      - ""
    - - buyerCompanyId
      - Buyer company internal identifier
      - |-
        EQUAL: required field must match exactly provided value
        NOTEQUAL: required field must be different from provided value
        IN: required field must be present in provided value list
        NOT_IN: required field must not be present in provided value list
    - - deletedStatus
      - |-
        RFx deletion status. Valid values are:
        Undefined: behaves like NOT-DELETED (default value even if condition filter isn’t expressed)
        NOT-DELETED: export only not deleted RFxs
        DELETED: export only deleted RFxs
        ALL: export both deleted and not deleted RFxs.
        If this condition filter is expressed, exported RFx Setting will be enriched with a new field (deleted) reporting the deletion status of the specific RFx
      - N.A.
    - - rfxOwner
      - RFx owner (name or surname), as a string
      - |-
        It accepts following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        STARTWITH: required field must start with provided value (case insensitive)
        CONTAINS: required field must contain provided value (case insensitive)
    - - rfxOwnerId
      - RFx Owner internal identifier
      - |-
        It accepts following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        IN: required field must be present in provided value list
        NOT_IN: required field must not be present in provided value list
    - - rfxOwnerCode
      - RFx Owner external code, as a string
      - |-
        It accepts following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        STARTWITH: required field must start with provided value (case insensitive)
        CONTAINS: required field must contain provided value (case insensitive)
    - - supplierAccess
      - |-
        Type of supplier access.
        Possible values:
        RFQ_TYPE_PRIVATE_WITH_ANSWER = 0
        RFQ_TYPE_PUBLIC_WITH_ANSWER = 1
        RFQ_TYPE_PRIVATE_NO_ANSWER = 2
        RFQ_TYPE_PUBLIC_NO_ANSWER = 3
        RFQ_TYPE_SIMPLIFIED = 4
        RFQ_TYPE_PRIVATE_PPB = 5
        RFQ_TYPE_PUBLIC_PPB = 6
        Use string or numeric value indifferently.
        The special value ALL (or *) means all previous values.
      - |-
        It accepts following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        IN: required field must be present in provided value list
        NOT_IN: required field must not be present in provided value list
    - - rfxExtCode
      - RfX external identifier.
      - |-
        It accepts following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        IN: required field must be present in provided value list
        NOT_IN: required field must not be present in provided value list
        ISNULL: required field is checked to be null
        NOTNULL: required field is required to be valorized, no matter value
    - - divisionId
      - Division internal identifier
      - |-
        It accepts following operators:
        EQUAL: required field must match exactly provided value
        NOTEQUAL: required field must be different from provided value
        IN: required field must be present in provided value list
