text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: supplier | Description: Supplier company who answered:
  id = company internal identifier
  code = company external identifier
  name = company name
  extUniqueCode = company external unique code (BA_17_02)
  In case of unregistered supplier, the company name can contain several company names separated by “;”
  Attribute: answerState | Description: Status of the offline response:
  3 = winner
  4 = loser
  Attribute: price | Description: Price offered in the offline response (it can have exponential notation)
  Attribute: lastUpdate | Description: Offline response date
  Attribute: lastUpdateUser | Description: Buyer user who inserted the offline response:
  id = user internal identifier
  code = user external code
  name = user full name
  Attribute: notes | Description: Notes inserted by the buyer on the offline response
  Attribute: registered | Description: 1 = supplier registered
  0 = supplier unregistered
