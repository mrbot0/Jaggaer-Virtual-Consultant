  1. <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> : This line indicates th e folder that the type of folder being used for approvals is an Explicit Folder. In other words, this rule uses a Shared Workflow folder, which is populated with approvers that have the ability to advance the document to the next step in workflow.
  2. </Activ ity> : Each activity must end with this element. This indicates that the activity stops here.
