type: procedura
text: |-
  This rule shows some interesting concepts
  1. !(Document.CustomFieldValues("Manual Purchase Order") in {"true"})
  2. This shows that the rule is looking at a Custom Field value at the document level.
  3. The rule is looking to see if the value of the Manual Purchase Order Custom Field has a value of true .
  4. Notice the ! in front of this rule. If you see ! at the beginning of any rule, then a document will only stop if that rule IS NOT true. In this case, as long as the Manual Purchase Order is not true , the document will stop here.
  5. && - When you see two "and" symbols like this (&&) that means that the rule following the preceding rule MUST also be true. This allows customers to require several criteria in order for a document to stop. Many && can be used in a given activity.
