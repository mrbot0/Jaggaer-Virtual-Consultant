text: 'The TSM Supplier Import Utility was developed to simplify the process of importing supplier data into SelectSite. Since customers have varying data requirements for imported data, a standard "one size fits all" template does not meet the needs of our diverse customer base. This tool was developed with the idea that the user can choose the appropriate data fields for the customer without having to engage in additional mapping exercises in webMethods. Having said that, if you wish to provide the client a template, this template is designed specifically with this tool in mind: TSM Import Template.xlsx'
