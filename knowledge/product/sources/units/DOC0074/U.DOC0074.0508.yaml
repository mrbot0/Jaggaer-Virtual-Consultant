text: Terms FOB Freight on Board (FOB) information. When shipping goods, FOB indicates whether the destination or the origin pays the loading and transportation costs, or the point at which the responsibility of the goods transfers from the shipper to the buyer. Destination, Origin, and notApplicable are the standard FOB options, but any previously configured FOB option is valid.
