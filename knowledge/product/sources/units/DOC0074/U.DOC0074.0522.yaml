text: If no NAICS Code is marked as Primary, the first NAICS for each supplier will be imported as the Primary NAICS. If more than one NAICS is marked as Primary, the last NAICS marked as Primary will pass as the Primary. If the same NAICS is marked as both Primary and Secondary for a supplier, the entry for Secondary will be ignored.
