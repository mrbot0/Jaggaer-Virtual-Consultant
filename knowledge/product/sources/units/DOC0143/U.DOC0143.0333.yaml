text: |-
  Managing Catalogs
  1. Create an Emergency Supplies custom catalog attribute.
  2. Assign the attribute to specific items.
  3. Filter on the custom catalog attribute in item administration .
  4. See how the attribute appears as a search filter in Advanced Search and how it can be used as a filter search results.
  5. Highlight the items with the custom attribute offered by a specific supplier on showcase sticker.
