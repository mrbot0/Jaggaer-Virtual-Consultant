  Managing Catalogs
  1. View the current flat commodity code list in Advanced Search.
  2. Enable the commodity code tree structure setting.
  3. Export the existing flat commodity code list.
  4. Create the commodity code tree.
  5. Validate and import the file.
  6. Test the commodity code tree in Advanced Search and on a requisition.
