text: |-
  Managing Catalogs
  1. Define a category class for lab and medical supplies.
  2. Create two product views: Standard and Lab Research .
  3. Create a new Researcher user role and assign product views to the appropriate user roles.
  4. View the suppliers and product categories your user now has access to.
  5. Apply the Researcher user role to your user and view the product views your user has access to.
  6. Return visibility of Customer Base Role to all products.
