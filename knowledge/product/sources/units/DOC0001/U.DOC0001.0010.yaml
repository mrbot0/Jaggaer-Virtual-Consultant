text: "The project had four workstreams: People, Technology, Category Management and Ethics & Sustainability. An objective of the Technology workstream was to replace the disparate platforms and disjointed systems that were being used in the three regions with one that would meet all of JLL’s needs worldwide and deliver consistency of performance at lower cost."
