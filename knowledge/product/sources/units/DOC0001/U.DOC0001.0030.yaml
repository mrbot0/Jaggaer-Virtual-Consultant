text: “Demonstrating to clients that we are managing procurement and the supply chain with robust processes that are transparent and auditable, and which mitigate risk, gives JLL an additional edge in a competitive market.” The technology, training and support provided by Jaggaer to our sourcing professionals worldwide is an important element in that.” concludes McBride.
