text: “It is really important that our technology partners have global reach so that we can fully leverage our scale, streamline processes and have full transparency and auditability,” says McBride. “It therefore made sense to opt for a one-stop-shop spend management and procurement solution that could be rolled out globally, allowing us to tap into consistent data about global supply markets, while at the same time taking account of regional variations. This is basically where we are now with Jaggaer,” he adds. Having current and historical spend data accessible in a single corporate repository cuts out a lot of the administrative inefficiencies associated with manual storage of data, emails etc.
