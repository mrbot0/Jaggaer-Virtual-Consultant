text: Getting the Jaggaer system up and running was a fast and truly collaborative process. Bringing all three regions together for several workshops provided an opportunity to review JLL’s processes and gather expert insights from Jaggaer’s consulting team. “From implementation to training through to change management, the quality of support and collaboration was exceptional,” says McBride. The system has now been rolled out to all offices in the EMEA region, supported by a shared services centre in Warsaw.
