text: A global professional services and investment management firm specialising in real estate, JLL is a Fortune 500 company with annual revenue of [importo] billion, operations in over 80 countries and a global workforce of over 90,000 (as of December 31, 2018). JLL’s significant global spend with third-party suppliers puts procurement and supply chain management at the very hear of JLL’s successful business model. Every dollar saved is an additional dollar sent to the bottom line, so in terms of JLL’s market differentiation, the profitability of its clients, and the financial success of JLL itself, procurement has obviously been a top priority for the company’s leadership.
