text: Jaggaer configured the system, focusing on the Integrated Facilities Management part of the business, by October of the same year. “IFM is one of the most complex and challenging of our operations but offered the critical mass needed in terms of headcount and maturity of processes to test the robustness of the system,” says McBride.
