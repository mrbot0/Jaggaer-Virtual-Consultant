text: |-
  Attribute: grantAccessViaDeptAndRole | Description: Indicates whether access to this contact is (true) or is not (false) to be granted using roles, departments, and business units.
  To grant access to all users, set this field to true, and set the role, department, and businessUnit fields to all (or leave them blank).
  To limit access based on role, department, or business unit, set this field to true, and specify the limiting criteria in the role, department, and businessUnit fields.
  To limit access to only specific users, set this field to false, and specify the users in the user field.
