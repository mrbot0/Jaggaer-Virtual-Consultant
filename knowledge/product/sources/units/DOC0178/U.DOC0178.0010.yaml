text: "Colonne: Revision | Date Released | Version | Description of Change Revision: 0 | Date Released: 2018-11 | Version: JINT 18 00 | Description of Change: First release Revision: 1 | Date Released: 2019-07 | Version: JINT 19 02 | Description of Change: New “import”, “export” and “validate” operations added. New “jint” web service endpoint Revision: 2 | Date Released: 2019-11-20 | Version: JINT 19 02 | Description of Change: Export method, JIContract object: missing description for “status” exported field added. Revision: 3 | Date Released: 2020-01-03 | Version: JINT 19 03 | Description of Change: Import and Export methods: new fields “attachmentURL” and “mainDocument” Revision: 4 | Date Released: 2020-03-08 | Version: JINT 20 01 00 | Description of Change: Minor changes (no impact): new WSDL version management Revised structure: JINT webservices general guidelines moved to a separate document Revision: 5 | Date Released: 2020-04-27 | Version: JINT 20 01 00 | Description of Change: Minor changes: alignment of data types and UI default labels Revision: 6 | Date Released: 2020-07-08 | Version: JINT 20 01 00 | Description of Change: Import methods: GoodsAndService, NonCatalogItem information marked as not supported on import Revision: 7 | Date Released: 2020-07-13 | Version: JINT 20 01 00 | Description of Change: Added REST Interface Revision: 8 | Date Released: 2020-11-11 | Version: JINT 20 03 00 | Description of Change: “Export” method: “Obligation” element: new field “obligationUseScorecard“ and ObligationScorecard list. “NonCatalogItem” element: new “internalItemId” and itemMasterId” fields added “ProductLineItem” and “ServiceLineItem” elements: new field “itemMasterId” added Revision: 9 | Date Released: 2020-11-24 | Version: JINT 20 03 01 | Description of Change: Import/Export method: Added fields PaymentTermsType, PaymentTermsDaysAfter, StandardPaymentTermsCode to PaymentTerms element. Added new element SalesForceFields to Contract element."
