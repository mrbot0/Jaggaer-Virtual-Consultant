text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: obligationId | Description: Unique identifier for the obligation.
  Attribute: obligationName | Description: Name of the obligation
  Attribute: obligationDescription | Description: Description of the obligation
  Attribute: obligationCancelledTime | Description: If the obligation was cancelled, date and time of the cancellation
  Attribute: requiresDocumentation | Description: Indicates whether documentation is (true) or is not (false) required to fulfill the obligation.
  Attribute: Cancelled | Description: Indicates whether the obligation has (true) or has not (false) been cancelled
  Attribute: promptToCreateInvoice | Description: Indicates whether the obligation is (true) or is not (false) to prompt the user to create an invoice when the obligation is marked as Complete
  Attribute: useTimeZoneContract | Description: Indicates whether the obligation is (true) or is not (false) to use the contract time zone.
  Attribute: obligationTagList | Description: Container for obligation tag information.
  See section “ObligationTag [Export]” below.
  Attribute: obligationScheduledEvent | Description: Obligation scheduled event information.
  See section “ObligationScheduledEvent [Export]” below
  Attribute: obligationOccurrenceList | Description: Container for obligation occurrence information.
  See section “ObligationOccurrence [Export]” below
  Attribute: obligationOwnerList | Description: Container for obligation owner information.
  See section “ObligationOwner [Export]” below
  Attribute: obligationLeadTimeList | Description: Container for obligation lead time information.
  See section “ObligationLeadTime [Export]” below
  Attribute: obligationUseScorecard | Description: Indicates whether the obligation is (true) or is not (false) to use a scorecard.
  The default setting is false. | Available from version: JINT_20_03_00
  Attribute: obligationScorecardList | Description: Container for obligation scorecard information.
  See section “ObligationScorecard {Export}” below. | Available from version: JINT_20_03_00
