text: |-
  Attribute: standardPaymentTermsCode | Description: Uniquely identifies a specific preconfigured combination of payment terms.
  If StandardPaymentTermsCode is provided in an import message, PaymentTermsType, PaymentTermsDaysAfter, and Discount are populated based on the code.
  If both StandardPaymentTermsCode and Discount are provided, the value for Discount is used.
  Note: If StandardPaymentTermsCode is provided in an import message, the Net and PaymentTermsType elements cannot have values.
