type: tabella
text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: startOnExecution | Description: Indicates whether the contract start date is (true) or is not (false) to be set to the date when the contract reaches “Executed: In Effect” status.
  For eSignature contracts, this is the date and time that the final signer signs the contract, or a signed contract is manually uploaded.
  Attribute: timeZone | Description: Timezone associated with the ContractDates element.
  Valid values:
  US/Eastern
  US/Central
  US/Pacific
  US/Mountain
  US/Arizona
  US/East-Indiana
  CETUS/Hawaii
  Europe/London
  Attribute: createdDate | Description: Date on which the contract was created.
  Attribute: startDate | Description: Date on which the contract take effect.
  Attribute: endDate | Description: Last effective date for the contract
  Attribute: terminationDate | Description: Date on which the contract is to be terminated
  Attribute: terminationReason | Description: Reason entered by the user when the contract was terminated.
  Attribute: doesNotExpire | Description: Indicates whether the contract is (true) or is not (false) to expire automatically when the endDate occurs.
  Attribute: contractRenewal | Description: Contract renewal specification.
  See section “ContractRenewal [Export]” below
  Attribute: contractReview | Description: Contract review information.
  See section “ContractReview [Export]” below
  Attribute: fullyExecutedDate | Description: Date on which the contract was fully executed (signed and dated by all parties)
  Attribute: outForSignatureDate | Description: Date on which the contract was sent out for eSignature.
  Valid only for contracts that use eSignature
  Attribute: terminationScheduled | Description: Container for scheduled termination settings.
  See section “TerminationScheduled [Export]” below.
