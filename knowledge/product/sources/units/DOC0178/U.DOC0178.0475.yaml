text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: discount | Description: Discount for the prescribed period, to be used instead of the payment terms on the invoice.
  Valid only if:
  • All lines on the invoice are for the same contract.
  • These payment terms differ from those on the invoice
  Attribute: unit | Description: Indicates whether the discount is a percentage (percent) or a fixed amount (amount).
  Attribute: Days | Description: Number of days after the invoice date that the discount can be applied to the invoice.
  That is, if payment is received within the specified number of days of the invoice date, the discount is applied.
  Attribute: Net | Description: Number of days after the invoice date that the invoice is due.
  Attribute: paymentTermsType | Description: Used in conjunction with the PaymentTermsDaysAfter element to determine the invoice due date. Possible values:
  Net: Invoice due date = Invoice date + PaymentTermsDaysAfter
  EOM (End of Month): Invoice due date = Last day of the month of the invoice date + PaymentTermsDaysAfter.
  MFI (Month Following Invoice): Invoice due date = First day of the month after the invoice date + PaymentTermsDaysAfter.
  EOQ (End of Quarter): Invoice due date = Last day of the quarter of the invoice date + PaymentTermsDaysAfter.
  Manual: The invoice due date is not set based on payment terms but is entered manually by the user. | Available from version: JINT_20_03_01
  Attribute: paymentTermsDaysAfter | Description: Used in conjunction with the PaymentTermsType element to compute the invoice due date when an invoice or credit memo is created or when payment terms are updated. | Available from version: JINT_20_03_01
  Attribute: standardPaymentTermsC ode | Description: Uniquely identifies a specific preconfigured combination of payment terms. | Available from version: JINT_20_03_01
