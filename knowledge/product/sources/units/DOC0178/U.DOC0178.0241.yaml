text: |-
  Attribute: prSpend | Description: Additional PR spend amount.
  Note: Values in the prSpend field for subsequent updates are added to the current prSpend total for the contract. For example, if the current prSpend value for the contract in the CLM solution is [importo], and the import document contains a value of [importo], the updated value for the contract in the CLM solution, after the import, will be [importo]. Therefore, we recommend that you leave this field blank unless you are manually updating the prSpend total.
