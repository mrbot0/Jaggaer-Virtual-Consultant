text: |-
  Attribute: searchableKeywords | Description: Keywords by which the item can be found in product search.
  Commas are used to separate more keywords.
  Appropriate keywords include commodities, products, services, and categories that describe the item.
  Use common product search terms that are typically used when searching for products. These terms can then be searched for by users in product search.
  If the list of keywords is longer than 1000 characters, it is truncated and saved.
