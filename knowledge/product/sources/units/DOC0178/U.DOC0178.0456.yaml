text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: distributionValue | Description: Distribution value for the split for the accounting codes group. According to distribution type, it represents:
  AmountOfQuantity – the portion of the quantity to be split
  AmountOfPrice – the monetary amount to be split.
  PercentOfQuantity and PercentOfPrice- the percentage of the split. In this case, the the total of all distribution values must equal 100%.
  Attribute: codesCustomField | Description: Account code custom field value container.
  See section “CodesCustomField [Export]” below.
