text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: name | Description: Name of a service line item from a JAGGAER Indirect Sourcing solution event.
  Valid only for Sourcing solution contracts.
  Attribute: Description | Description: Description of the service line item.
  Attribute: catalogNumber | Description: Unique ID number for the service line item in the supplier inventory.
  Attribute: Quantity | Description: Number of service items.
  Attribute: unitOfMeasure | Description: Packaging or size unit for the service line item, such as EA (each), PK (pack), KG (kg), or LG (large).
  The supplier item is the actual purchasable item available for the shopper.
  Attribute: unitPrice | Description: Unit cost of the service line item
  Attribute: totalPrice | Description: Total cost of the service line item (item quantity times the unit price).
  Attribute: targetPrice | Description: Target cost for the service line item
  Attribute: commodityCode | Description: Code assigned to the service line item, for the purposes of identifying it in international commerce, or commerce in general.
  It is not a specific description of the goods or service.
  Attribute: requestedServiceStartDate | Description: Date you would like the service to begin
  Attribute: requestedServiceEndDate | Description: Date you would like the service to end
  Attribute: requestedDeliveryDays | Description: Number of days after the sourcing event is awarded that you would like the service line item to be delivered.
  Attribute: estimatedServiceStartDate | Description: Date you expect the service to begin
  Attribute: estimatedServiceEndDate | Description: Date you expect the service to end
  Attribute: estimatedDeliveryDays | Description: Number of days after the sourcing event is awarded that you expect the service line item to be delivered.
  Attribute: itemMasterId | Description: Unique identifier for the item. | Available from version: JINT_20_03_00
