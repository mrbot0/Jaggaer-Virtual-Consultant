text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: useDefaultTemplate | Description: Indicates whether the default contract template is (true) or is not (false) to be used when creating a new contract via import.
  If set to true, the values in the default contract template override the values in the contract import document when creating the new contract.
  The default template must exist in the CLM solution and must be configured as the default template.
