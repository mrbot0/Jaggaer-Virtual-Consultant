type: tabella
text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: cancelled | Description: Indicates whether the occurrence has (true) or has not (false) been cancelled.
  Attribute: occurrenceKey | Description: Identifier for the occurrence, in the following format:
  ObligationId-OccurrenceIteration
  For example, if the ObligationId is 12345 and the OccurrenceIteration is 3 (that is, the third occurrence of the obligation), the OccurrenceKey is 12345-3.
  Attribute: occurrenceIteration | Description: Iteration number for the occurrence (number of times the obligation has recurred).
  One (1) indicates the first occurrence of the obligation.
  Attribute: occurrenceCompletedDate | Description: Date and time the occurrence was actually completed
  Attribute: occurrenceDueDate | Description: Date and time the occurrence is due, as specified by the user
  Attribute: occurrenceCalculatedDueDate | Description: Date and time the occurrence is due, calculated by the CLM solution based on the frequency settings of the obligation
  Attribute: occurrenceNotes | Description: Freeform text field providing additional details about the occurrence
  Attribute: occurrenceCompletedByUser | Description: Username of the user who marked the obligation as Complete
  Attribute: obligationAttachmentList | Description: Container for obligation attachments.
  See section “Attachment [Export]” below
