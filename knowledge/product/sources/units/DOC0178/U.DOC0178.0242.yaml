text: |-
  Attribute: poSpend | Description: Additional PO spend amount.
  Note: Values in the poSpend field for subsequent updates are added to the current poSpend total for the contract. For example, if the current poSpend value for the contract in the CLM solution is [importo], and the import document contains a value of [importo], the updated value for the contract in the CLM solution, after the import, will be [importo]. Therefore, we recommend that you leave this field blank unless you are manually updating the poSpend total.
