text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: obligationOwnerRole | Description: Role of the owner of the obligation
  Attribute: secondPartyContact | Description: Contact associated with second party.
  See section “Second Party Contact [Export]” below.
  Attribute: ownerType | Description: Type of owner to be specified for the obligation.
  Possible values:
  ContractManager
  PickAUser
  ToBeNamed
  Attribute: obligationUser | Description: Username of an owner or stakeholder for the obligation.
  The owner can be someone who is responsible for meeting the obligation, or responsible for ensuring it is met, or simply interested in knowing when the obligation is met.
  Attribute: taskNote | Description: Freeform text field providing additional details about the owner’s task as it relates to the obligation.
  Attribute: sendNotificationList | Description: Container for obligation notifications to be sent.
  See section “SendNotification [Export]” below.
