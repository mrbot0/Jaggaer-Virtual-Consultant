text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: autoRenew | Description: Indicates whether the contract is (true) or is not (false) to be renewed automatically on the EffectiveEndDate.
  Attribute: autoApplyPriceFile | Description: If the contract is associated with a hosted price file, indicates whether that same price file will (true) or will not (false) apply when the contract is automatically renewed.
  Attribute: renewalNumber | Description: Renewal number for the contract
  Attribute: renewalTerm | Description: Number of days, months, or years (defined by renewalTermType) for which the contract will be automatically renewed.
  Attribute: renewalTermType | Description: Renewal period for the renewalTerm element.
  Valid values:
  Days
  Months
  Years
  Attribute: renewalsRemaining | Description: Number of automatic renewals allowed for the contract.
  Attribute: renewalDate | Description: Date on which the contract is to be renewed
  Attribute: autoRenewalLeadDays | Description: Number of days prior to the end date of a contract when the contract will auto renew
