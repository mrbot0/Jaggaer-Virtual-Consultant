text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: description | Description: Description of the noncatalog item that displays in product search.
  Attribute: catalogNumber | Description: Unique ID number for the item.
  Attribute: Size | Description: Unit of size for the item, such as 1 mg (milligram) or 16 fl oz (fluid ounces).
  Attribute: Price | Description: Price of the item
  Attribute: packaging | Description: Packaging of the item, such as 1 ea or 1 case of 12.
  Attribute: promoteInProductSearch | Description: Indicates whether the item is (Yes) or are not (No) to be promoted to shoppers who have access to the contract.
  Attribute: Color | Description: Color of the item
  Attribute: commodityCode | Description: Code assigned to the item, for the purposes of identifying it in international commerce, or commerce in general.
  CommodityCode is not a specific description of the goods or service.
  Attribute: Unspsc | Description: Standardized commodity code value for the contract item,
  See section “UNSPSC [Export]” above
  Attribute: searchableKeywords | Description: Keywords by which the item can be found in product search.
  Commas are used to separate more keywords.
  Attribute: longDescription | Description: Long description of the item
  Attribute: manufacturerName | Description: Name of the manufacturer
  Attribute: manufacturerPartNumber | Description: Manufacturer’s part number (SKU code) for the item.
  Attribute: dynamicAttributeList | Description: List of dynamic attributes.
  See section “DynamicAttribute [Export]” below
  Attribute: internalItemId | Description: Unique internal identifier for the contract item. | Available from version: JINT_20_03_00
  Attribute: itemMasterId | Description: Unique user visible identifier for the item. | Available from version: JINT_20_03_00
