text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: distributionType | Description: Manner in which the funds are to be distributed to each split for the accounting codes defaults for the invoice custom fields:
  AmountOfQuantity – funds are distributed based on a user-specified portion of the quantity
  AmountOfPrice – funds are distributed based on a user-specified portion of the quantity.
  PercentOfQuantity – funds are distributed based on a user-specified percentage of the quantity
  PercentOfPrice – funds are distributed based on a user-specified percentage of the price
  Attribute: codesGroupName | Description: Name of the accounting codes group
  Attribute: codesGroupSplit | Description: Container for distribution for the split for the accounting codes group.
  See section “CodesGroupSplit [Export]” below
