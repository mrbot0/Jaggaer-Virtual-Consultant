text: |-
  Attribute: type | Description: Type of the commodity code.
  0 – Reporting commodity code, used to limit the results of a Sourcing Savings Report. Each sourcing event can have only one reporting commodity code.
  1 – Additional commodity code. Any commodity code that is not a reporting commodity code is an additional commodity code.
  Note: If the reporting commodity code was added via the sourcing event, you can only add additional commodity codes manually.
