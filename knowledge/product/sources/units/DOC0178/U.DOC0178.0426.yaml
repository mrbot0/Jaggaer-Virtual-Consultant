    - - contractManagerVisibility
      - |-
        Visibility setting for the contract summary for a user who can access the contract and who has the Contract Manager permission.
        Full – All contract details are visible to the user, including links to the actual contract files.
        Partial- Only some of the contract details are visible to the user.
        None- No contract information is visible to the user, unless he or she has access to buy against the contract. A user who has access to buy against the contract can see the contract summary.
      - ""
    - - allOtherUsersVisibility
      - |-
        Visibility setting for the contract summary for a regular user who can access the contract.
        Full – All contract details are visible to the user, including links to the actual contract files.
        Partial- Only some of the contract details are visible to the user.
        None- No contract information is visible to the user, unless he or she has access to buy against the contract. A user who has access to buy against the contract can see the contract summary.
