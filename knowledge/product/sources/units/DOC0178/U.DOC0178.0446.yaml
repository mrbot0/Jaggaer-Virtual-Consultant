    - - fileName
      - File name
      - ""
    - - type
      - |-
        Identifies the type of attachment (for contract attachment only).
        MainDocument – The attachment is the main contract document
        SignedDocument – The attachment is a signed document
        CompiledDocument- The attachment is a compilation of multiple attachments
        Attachment- The attachment is a normal attachment, not a main, signed, or compiled document.
        PreviousSignedDocument- The attachment is a previously signed document.
      - ""
    - - printWithFullContract
      - Indicates whether the attachment is (true) or is not (false) to be printed when the full contract is printed (for contract attachment only).
      - ""
    - - shareWithSecondParties
      - Indicates whether the attachment can (true) or cannot (false) be shared with second parties (for contract attachment only).
      - ""
    - - contractSummaryVisibility
      - |-
        Indicates the visibility setting for the contract summary (for contract attachment only).
        UseSummaryConfigVisibility- Use the visibility settings on the Contract Info tab on the Summary Configuration screen
        AdminOrManagerVisibility- The contract summary is only visible to contract administrators and contract managers
      - ""
    - - fileId
      - Internal identifier of the attachment, to be used for calling attachments web service to download it
      - ""
    - - secureToken
      - It is the secure token to be used for calling attachments web service to download the attachment file.
      - ""
    - - attachmentURL
      - URL of the attachment (for contract attachment of type link only).
      - JA 19 03
    - - mainDocument
      - Indicates whether the attachment is (true) or is not (false) the main contract document (for contract attachment of type link only).
