text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: name | Description: Name of a product line item from a JAGGAER Indirect Sourcing solution event.
  Valid only for Sourcing solution contracts.
  Attribute: Description | Description: Description of the product line item.
  Attribute: catalogNumber | Description: Unique ID number for the product line item in the supplier inventory.
  Attribute: Quantity | Description: Number of product items
  Attribute: unitOfMeasure | Description: Packaging or size unit for the product line item, such as EA (each), PK (pack), KG (kg), or LG (large).
  The supplier item is the actual purchasable item available for the shopper.
  Attribute: unitPrice | Description: Unit cost of the product line item.
  Attribute: totalPrice | Description: Total cost of the product line item (item quantity times the unit price).
  Attribute: targetPrice | Description: Target cost for the product line item
  Attribute: commodityCode | Description: Code assigned to the product line item, for the purposes of identifying it in international commerce, or commerce in general.
  It is not a specific description of the goods or service
  Attribute: estimatedDeliveryDate | Description: Date you expect the product line item to be delivered
  Attribute: estimatedDeliveryDays | Description: Number of days after the sourcing event is awarded that you expect the product line item to be delivered.
  Attribute: requestedDeliveryDate | Description: Date you would like the product line item delivered
  Attribute: requestedDeliveryDays | Description: Number of days after the sourcing event is awarded that you would like the product line item to be delivered.
  Attribute: itemMasterId | Description: Unique identifier for the item. | Available from version: JINT_20_03_00
