text: "Colonne: Attribute | Description | Available from version Attribute: activeForShopping | Description: Indicates whether the contact is (true) or is not (false) active for shopping Attribute: allowSupplierEditItems | Description: Indicates whether supplier can (true) or cannot (false) edit the price on a contract noncatalog line item that has been populated from the contract on a portal invoice or credit memo. This field does not apply to other non-catalog line items, only those populated from the contract on a portal invoice or credit memo. Note: This field applies to price only. Suppliers cannot edit the part number, product size, packaging, or description of an item. Attribute: blanketPONumber | Description: Number of the blanket PO associated with the contract. Attribute: autoApplyPurchase | Description: Indicates whether the contact is (true) or is not (false) to be automatically applied to a purchase request Attribute: requiresPriceSet | Description: Indicates whether the contact is (true) or is not (false) associated with a price set (hosted catalog). Attribute: evaluateReceiptSettlement | Description: Indicates whether the contact does (true) or does not (false) have the Evaluated Receipt Settlement setting enabled. When the setting is enabled, and a receipt is created from the contract, the associated invoice can be created automatically. Attribute: associatedPriceSetName | Description: Name of the price set associated with the contract Attribute: codesDefaultForInvoices | Description: Accounting codes group container. See section “CodesGroup [Export]” below. Attribute: administrativeFee | Description: Administrative fee information. See section “AdministrativeFee [Export]” below. Attribute: allowNonCatalogItems | Description: Indicates whether the contact does (true) or does not (false) allow non-catalog purchases. Attribute: poClauseList | Description: Container for PO clauses associated to this contract. See section “Clause [Export]” below Attribute: budget | Description: Budget for the contract. If the enforceBudget is set to true, then the value must be greater than zero."
