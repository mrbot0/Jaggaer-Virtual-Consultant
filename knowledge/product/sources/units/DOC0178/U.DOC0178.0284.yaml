text: |-
  Attribute: type | Description: Indicates how the contract-specific ordering instructions are displayed to the shopper in the product search results.
  None – Prevents the instructions from displaying in the search results.
  LinkAttachments- Enables you to provide the instructions as a document or web link attached to the contract and have the document or web link show up in the search results.
  Rich- Displays the instructions to the shopper in a richtext popup overlay
