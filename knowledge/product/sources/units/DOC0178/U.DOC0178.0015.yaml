text: "The structure of the current document is the following (parte 1/2) 1. ImportSpend: 2. Request data format [ImportSpend]: describes the possible operations on import and describes the structure of the request. The request is composed of sections and every section is composed of fields to be filled. This paragraph specifies which fields are mandatory depending on the operation you want to perform and those that can be omitted. 3. Behavior [ImportSpend]: describes how the web service processes the data passed in input, in case of some particular processes. 4. Response Data Format [ImportSpend]: describes the structure of the web service response and contains the list of possible error codes. 5. Import: 6. Request data format [Import]: describes the structure of the import request. 7. Behavior [Import]: describes how the web service processes the data passed in input, in case of some processes 8. Response data format [Import]: describes the structure of the web service response and contains the list of possible error codes 9. Export: 10. Component filters [Export]: describes which sections of a contract can be exported. The use of a component filter increments the number of sections in the response to every contract exported. 11. Condition filters [Export]: describes which fields can be used to filter the contract to be extracted on specific conditions. So, the use of a condition filter allows to decrease the number of contract extracted. 12. Export data format [Export]: describes the structure of the response in terms of exported fields and sections. 13. Error codes [Export]: contains a list of possible error codes 14. Validate: 15. Request data format [Validate]: describes the structure of the validation request. The request is composed of sections and every section is composed of fields to be filled."
