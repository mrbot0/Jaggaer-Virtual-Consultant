text: Content includes a look at JAGGAER and how it works with clients and suppliers, a quick dive into the various products that make up the JAGGAER Indirect portfolio of solutions , an introduction to site administration and configuration, and a quick look a t implementation roles and responsibilities. Participants will learn about typical use of the solutions and discuss some of the variations that are possible based upon client needs and business processes. This course is offered as self - paced eLearning via recordings and resources in JAGGAER University.
