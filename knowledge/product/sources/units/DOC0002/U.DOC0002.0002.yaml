text: "PROFILE One of the best-known brands the world over, McDonald’s restaurants can be found in over 36,000 locations across more than 100 countries, with upwards of 500 in Italy alone. Nowadays, the McDonald’s restaurants in Italy don’t just serve hamburgers, french fries and Coca-Cola, but traditional Italian food as well. More than 70% of the brand’s agro-food supplies are sourced in the country—the result of the brand’s “glocal” strategy, an approach in which the products served satisfy the tastes and dietary traditions of each individual country with the emphasis on local recipes and ingredients. The statistics show that Italians like this formula:"
