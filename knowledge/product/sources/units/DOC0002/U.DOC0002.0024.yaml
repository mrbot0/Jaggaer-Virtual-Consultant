text: And according to Karachalios, Italy acted “as a trailblazer in this area, but various European countries are now taking an interest in the project.” The standard purchasing policies in place in all McDonald’s companies are established by the corporation, so as the Italian restaurants’ approach continues to be particularly efficient, a digitalized procurement process could prove to be a best practice that the corporation replicates worldwide.
