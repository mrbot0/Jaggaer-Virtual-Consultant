text: "paper form, but they aren’t even sent by email—they’re managed seamlessly and efficiently right in the JAGGAER system. At first, the portal put in place with JAGGAER solutions was used by two divisions which represent 80% of purchases in Italy, though today most corporate departments are involved. The first was the Supply Chain division—which handles the procurement of food products for restaurants and certain services, like electric power—with about 400 suppliers registered on the portal. While strategic products for McDonald’s, like meat, bread and, salads, are excluded from this process and managed through long term international agreements, all the rest— from beer to promotional products—are put out to tender every two to three years on average. The second area is the aforementioned Construction department, which deals with new openings and renovations: planning, civil works, interior decoration, maintenance, etc. McDonald’s used the JAGGAER portal to manage tenders for special projects with unusual technical specifications, like"
