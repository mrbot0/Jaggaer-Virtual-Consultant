text: Says Karachalios, “We have received a very positive reaction from suppliers because by registering with the portal they can immediately see what we need here in the world of McDonald’s and obtain all the information they need to meet our expectations.” Luca Montemezzo, McDonald’s Italy’s purchasing construction manager, adds that the impact in the Construction division has also been positive, particularly for new suppliers, who “previously sent in presentations by email or fax, which are hard to manage using a structured approach.
