text: By registering directly with the portal, they receive immediate feedback and can easily understand what McDonald’s needs and therefore the opportunities open to them.” While the portal is mostly used for purchasing, McDonald’s has found use for it in other areas well. “We also use the portal to organize tenders for sales,” explains Karachalios.
