text: documentation requested straightaway, and play a proactive role in the qualification process. “Previously we had different, rather cumbersome processes in place in each business area and every time tenders were called for a particular product category, we had to start over almost from scratch,” said Georgios Karachalios, the head of supply chain for McDonald’s Italy. The company wanted a system with which to centralize the organization’s information in its Italy locations, so that all buyers “would be able easily find what they need, even if they have no direct knowledge of the ‘negotiation history’ in a given category.”
