text: "“For several years now our vehicle fleet has been collecting used oil from restaurants and taking it to distribution centers for storage, after which it is sold to the biodiesel industry. This is known as reverse logistics and is an area that looks set to grow for us: waste like aluminum cans, plastic, and cardboard has a value and we aim to collect and sell it for the best price.” JAGGAER’s portal is even being used when sourcing electric power."
