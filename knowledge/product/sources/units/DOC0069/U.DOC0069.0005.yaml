text: "sc-perspective-unofficial-implementation-conside-4cb385be 1. Workflow is always linear. Rules will not be “re-triggered” if criteria is changed upon a document edit. WF can’t go backwards. An approver can only return or reject 2. We have lots of different ways to implement WF 3. We can do splits, but approvers are approving the whole document, not just their split. (It does route to approvers based on splits) 4. The whole document is approved, not just a line, or a split on a line 5. Note: approvers can reject specific lines 6. Only JAGGAER / Partners (not clients) can change the workflow XML 7. Ad hoc approvals not currently possible. ( Person submitting the document can’t choose who approves it) 8. If you allow approvers to edit, they can edit the whole document. They could change values that were approved in earlier steps. The change they made would not re-initiate those approvals 9. More comments: 10. Familiarize yourself with approval assignment options in JAGGAER. Customers coming from ERP solutions can have workflow expectations that we can’t support natively. 11. On this topic, consult strongly on this to guide a customer toward simpler, more sustainable workflow. This isn’t always possible, but it can help avoid extra cycles churning on workflow design. 12. One distinction often not understood by customers: an approver is approving the document (e.g. the requisition or purchase order or invoice) not the accounting distribution line. Some ERP solutions and customer practices assume budget owners will only be responsible for approving “their distribution” if a requisition is split, but this is not necessarily the case. They will see the entire document, and an approval action is at the document level. 13."
