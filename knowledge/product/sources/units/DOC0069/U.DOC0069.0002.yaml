text: sc-perspective-unofficial-implementation-conside-4cb385be 1. NUMBER ONE priority/concern/recommendation is to consult strongly on every topic, to try to drive the customer to the simplest possible solution. This can avoid even getting into some of the more difficult topics. 2. Custom Fields and Account Codes – we use custom fields for account codes. The two are the same in the JAGGAER solution. 3. Defining the customer’s account code string is a high priority week one task. Technical limitations often inform the direction of the setup in JAGGAER. For instance, we have no in-application validation process to ensure account code validity – we rely largely on an outbound integration with the customer ERP (PR Validation) or on parent-child relationships in which we expect the ERP to send us valid combinations. 4. Parent-child relationship works well, but some customers’ account codes do not work well with this. We support one parent to many children. If you map a parent value, like an organization code, to a child value, like a department code, then when that organization is selected the list of children is limited to those you’ve mapped, like that aforementioned department code. This is the only relationship we really check – no other codes in the string in combination with this value. Additionally, the codes themselves are individual values and not a single string, though they can be transformed via integrations if needed. 5. The UI behind custom field selection is different in JAGGAER than in many ERP solutions as well, so that’s worth covering. Some ERPs or other purchasing software uses type-ahead matching, where a user starts typing their code and it will auto-complete with potential matches. We use either a drop-down of all values (if below a certain threshold) or a search interface, allowing users to search by value or description. 6.
