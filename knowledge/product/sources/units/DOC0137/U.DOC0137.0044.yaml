text: |-
  This activity covers a couple new ideas
  1. <Ac tivityType>automated</ActivityType> : This rule will not require a user to approve the step. This means that the step will complete automatically.
  2. <FolderRef name="Distribute PO" /> : This line may look familiar from the previous activities, but since thi s step is automated it works a little bit differently. Automated activities do not use a Shared Workflow step like manual activities. Instead automated activities take advantage of workflow robots. Robots are what allow automated steps to function witho ut user approval. You can see what robot is being used for this folder under the Workflow Folder Import/Export tab in workflow setup.
  3. <Rule><![CDATA[ !(Document.CustomFieldValues("Manual Purchase Order") in {"true"}) && !(Document.CustomFieldValues("Orde r Category") in {"2 - Confirming - Do Not Distribute"}) ]]></Rule> :
