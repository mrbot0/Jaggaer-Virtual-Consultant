text: "Each step is typically listed in order (although the order is not important in this section, it does help to be consist ent with the intended order of workflow). The only necessary element is the Step name tag, which will contain the name of the step itself as show here: <Step name=\"Missing Distribution\" /> <Step name=\"Missing Distribution II\" /> It is also possible to include help text with any workflow step that can be used to explain it's intended purpose. This is done by using the \"wfActivityHelp\" attribute with the help text included within the AttrValue element: <Step name=\"PO Distribution\"> <Attribute name=\"wfActivityHelp\"> <AttrValue lang=\"default\">System step to distribute a Purchase Order.</AttrValue> </Attribute> </Step>"
