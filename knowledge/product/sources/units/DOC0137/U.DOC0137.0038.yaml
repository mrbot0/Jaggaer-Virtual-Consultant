text: |-
  This rule shows some new concepts
  1. <Rule><![CDATA[ Document.RequiresRuleGroupEvaluation("Director Approval") == true ]]></Rule> : This line shows an ADW rule.
  2. Document. indicates that this evaluates the entire document.
  3. RequiresRuleGroupEvaluation shows that an ADW rule is being evaluated. In this case the rule being evaluated is Director Approval . This rule can be found in the Adv anced Dynamic Workflow section of workflow configuration. There many rules can be configured under ADW. A document stops here if any one of the ADW rules in the group are true.
  4. <Attribute name="RuleGroupInternalName"> : The attribute name line will displa y in SelectSite and makes it easy to see which ADW rule group is evaluated in this activity.
  5. <AttrValue lang="default">Director Approval</AttrValue> : This shows the rule group name itself.
