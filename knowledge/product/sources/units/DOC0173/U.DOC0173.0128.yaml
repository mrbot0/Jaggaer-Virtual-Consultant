text: |-
  Colonne: Unique constraint | Attributes
  Unique constraint: No strategy | Attributes: userAlias: system checks for a company whose super user has provided login.
  extUniqueCode: this field is used if no company has been found having a superUser with provided userAlias. If the case, system checks for a company having the external unique code and, if it is found, we assume web service has been called to change the login information of the super user and operation can proceed.
  extCode: this field is used if no company has been found having a superUser with provided userAlias and having the provided extUniqueCode. If the case, system checks for a company having the external code and, if it is found, we assume web service has been called to change the login information of the super user and operation can proceed.
  Unique constraint: Fiscal Code and/or VAT Code | Attributes: fiscalCode and/or vat fields are used
  Unique constraint: VAT Code inside the country company resides (expressed by the isoCountry attribute) | Attributes: fiscalCode: this field is used if the value of isoCountry attribute is contained in the list of country that must be checked for uniqueness
  Attributes: euVat: this field is used if the value of isoCountry attribute is not contained in the list of country that must be checked for uniqueness, but the country is a member of European Union
  Attributes: dAndBCode: this field is used if the value of isoCountry attribute is not contained in the list of country that must be checked for uniqueness, but the country is not a member of European Union
