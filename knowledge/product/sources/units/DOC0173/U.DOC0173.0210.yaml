text: In the event the webservice client exceeds a preconfigured number of webservice calls per minute (usually 100), when this scenario was not previously agreed, the webservice could return an HTTP status 429 (Too Many Requests) as per RFC 6585 (https://tools.ietf.org/html/rfc6585#page-3).
