text: |-
  This service allows supplier data to be uploaded onto JaggaerAdvantage with 4 possible options
  1. “Insert” (create new record)
  2. “Insert and enable” (create new record and automatically enable referring company)
  3. “Update” (update existing record)
  4. “Delete” (command to delete a specific record)
