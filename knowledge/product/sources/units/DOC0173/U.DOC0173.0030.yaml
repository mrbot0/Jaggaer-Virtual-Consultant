text: |-
  Colonne: Data | Insert | Update | Delete
  Data: Company Data (including “super user”) | Insert: A new company record is created
  (supplier company) | Update: Company profile data is updated (note: the super user login details cannot be changed) | Delete: In this case the service assigns the value “blocked” to the supplier status.
  From that moment forward the supplier will not be able to access the platform.
  The history of actions is maintained in case the supplier account is reactivated at a later time.
  Data: Classification | Insert: Association of categories to the uploaded supplier | Update: The existing categories are substituted with the new list provided | Delete: Associated category list is deleted for the supplier
  Data: Users | Insert: Creation of users (other users within the same company) | Update: Update of user data (with particular rules for login, external code and rights) | Delete: [DEPRECATED] Users deletion
  Any negotiations linked to the user become associated to the Division Manager.
  Data: Data Element | Insert: Create new seller answers for eVm questions | Update: Updates the seller answers to eVm questions | Delete: N/A. Answers can be deleted via WS using a particular syntax (reset) in the data element value (see DeInfo section)
