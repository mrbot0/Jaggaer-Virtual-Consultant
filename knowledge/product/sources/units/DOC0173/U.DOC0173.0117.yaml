text: |-
  Attribute: values/value | Mandatory (Y/N): Y/N | Description: Value of the Data Element (eVM answer) | Mapping on JA data model and notes: According to data element type, values can be:
  textual: text
  number: number formatted in the default locale without grouping separator
  date: date string in the format "yyyyMMdd" or timestamp in “yyyy-MM-dd HH:mm:ss.SSS Z” format .
  It is possible to configure a different format for date (example: "yyyy-MM-dd"). In this case the same format will be applied to import, export and data element condition filter.
  boolean:’1’, ‘true’, ‘yes’ for true value, any other not empty string for false
  Choice and mutichoice: Choice Label in default language, as it appears in the choice list
