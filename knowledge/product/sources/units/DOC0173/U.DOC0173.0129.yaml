text: The userRole field in the company request can be filled with the code or the name (in the current locale) of a user company role. If the value passed is a valid code, the web services uses it. Otherwise, it verifies if the value passed is a user company role name in the current locale. If it is a valid name, the web service takes the corresponding code, otherwise an error is returned.
