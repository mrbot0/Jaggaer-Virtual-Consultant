  cells:
    - extUniqueCode
    - Y/N
    - |-
      Company unique identification code within the external system. When valorized it must be unique within the companies registered and enabled in the same toolkit group (companies deactivated and deleted are excluded).
      Available from version 12_4_0_02.
    - |-
      It may be used in case of UPDATE to identify the company to work on, when the identification strategy is based on userAlias but web service has been called to update this value.
      It is possible to enable the configuration parameter to use extUniqueCode as a company identifier.
      See section “Company identification strategy” in paragraph “Behaviour”.
