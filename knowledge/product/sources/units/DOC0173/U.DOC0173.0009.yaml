text: "Colonne: Document DISTRIBUTION | This document and any files transmitted with it are confidential and intended solely for the use of the individual or entity to whom they are addressed. If you have received this document in error please notify the Jaggaer Security Officer. This document contains confidential information and is intended only for the individual(s) named. If you are not the named addressee you should not disseminate, distribute or copy this document. Please notify the Jaggaer Security Officer immediately by e-mail ([email]) if you have received this document by mistake and delete it from your system. If you are not the intended recipient you are notified that disclosing, copying, distributing, printing or taking any action in reliance on the contents of this information is strictly prohibited. Document DISTRIBUTION: Document use once PRINTED | This document and any files transmitted with it are confidential and intended solely for the use of the individual or entity to whom they are addressed. If you have received this document in error please notify the Jaggaer Security Officer. This document contains confidential information and is intended only for the individual(s) named. If you are not the named addressee you should not disseminate, distribute or copy this document. Please notify the Jaggaer Security Officer immediately by e-mail ([email]) if you have received this document by mistake and delete it from your system. If you are not the intended recipient you are notified that disclosing, copying, distributing, printing or taking any action in reliance on the contents of this information is strictly prohibited.: “When not under the continuing control and supervision of a person with authorized access to such material, it must be, at a minimum, maintained under locked conditions. Handling, storage, and reproduction must be in accordance with the applicable Jaggaer policies."
