      - BA 16 01
      - Added dummy node in the WSDL file, inside the complex type CategoryInfo (container of the list of categories) to manage Microsoft bug when a client application is generated starting from the WSDL, using Microsoft technologies. Previous client applications remain compatible, without need to change version.
