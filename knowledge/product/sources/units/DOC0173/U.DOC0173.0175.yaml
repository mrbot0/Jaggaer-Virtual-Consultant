text: |-
  Colonne: Filter Value | Filter Description
  Filter Value: MASTER | Filter Description: Retrieve the all the information declared visible for Vendor management in the site configuration section
  Filter Value: CLASS | Filter Description: Retrieve all the classifications assigned to the company in terms of code and description
  Filter Value: USER | Filter Description: Retrieve the full profile of all sub users within the given company; . IMPORTANT NOTICE: the “login” field can be omitted for suppliers sub-users with an explicit configuration option of this service.
  Filter Value: DEBASIC | Filter Description: Retrieve the list of question (DATA ELEMENT or DE) linked to a visible form
  DEBASIC: registration supplementary forms
  DEEXTENDED: complementary forms
  DECATEGORY: classification forms
  The retrieved list will include all the types of element (text, number, date, combo, multi item, attachment, etc) and will be independent from the user in charge of the filling (seller, buyer, external systems).
  Filter Value: DEEXTENDED
  Filter Value: DECATEGORY
