text: In general, Commodity Codes are a tool to classify goods or services. A Commodity Code provides a standardized Code and General Description of the goods or services being purchased that can be used in a variety of ways within Procurement, such as; workflow routing, sourcing routing, procurement analysis, automatic account code assignment and with inventory and forecasting systems.
