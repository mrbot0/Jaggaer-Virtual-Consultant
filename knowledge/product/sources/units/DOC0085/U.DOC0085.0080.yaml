  Colonne:  | Import instructions | When in doubt, refer to these Customer facing import instructions.
  Import instructions: Choose File | When in doubt, refer to these Customer facing import instructions.: Select the file to Validate or Import. This typically is a CSV file (unless the system delimiter has been modified).
  Import instructions: Validate Mapping | When in doubt, refer to these Customer facing import instructions.: As with any ePro import, always validate before importing
  Import instructions: Import Mapping | When in doubt, refer to these Customer facing import instructions.: Select when ready to import the mapping.
  Import instructions: Export | When in doubt, refer to these Customer facing import instructions.: Exports the mapping which is currently present in ePro.
  NOTE: An export of current mapping will provide ALL values and their mapping. When preparing for initial mapping this would not necessarily be the most effective approach since “Value List” supports inheritance.
