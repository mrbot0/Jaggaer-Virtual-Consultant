text: |-
  Colonne: Steps for preparing your import: When using “Value List” mapping, the common practice for the preparing the initial import is as follows
  Steps for preparing your import: When using “Value List” mapping, the common practice for the preparing the initial import is as follows: Export the Category Map from the Clint site (or a site of your choosing).
  Steps for preparing your import: When using “Value List” mapping, the common practice for the preparing the initial import is as follows: Delete any row that won’t be specifically mapped. Remember; for “Value List” child sub-categories inherit, so you only need to import the rows that will have mapping.
  Steps for preparing your import: When using “Value List” mapping, the common practice for the preparing the initial import is as follows: Delete “Effective Value” entries, they are not needed for import, they can be blank.
  Steps for preparing your import: When using “Value List” mapping, the common practice for the preparing the initial import is as follows: Assign your “Overridden Values”; the Client Commodity Code Values that will be mapped to.
  Steps for preparing your import: When using “Value List” mapping, the common practice for the preparing the initial import is as follows: Adjust the “Action” values; these should be “Modify”
