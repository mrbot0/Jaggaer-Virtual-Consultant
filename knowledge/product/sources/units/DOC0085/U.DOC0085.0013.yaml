text: The two most common standards are UNSPSC and NIGP (summarized below). How they are assigned to goods or services depends… They can be manually assigned at the time of purchase, but more commonly the Supplier categorizes their items with one of these standard codes which is then “mapped” to a Commodity Code and applied to an item automatically.
