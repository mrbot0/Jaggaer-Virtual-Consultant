text: |-
  Colonne:  | Tax Flag Action (for Orgs using Tax Estimations) | N/A: No taxable status is associated with this value. Tax Applies: The Taxable flag will be set to TRUE for items with this Commodity Code Tax Exempt: The Taxable flag will be set to FALSE for items with This Commodity Code
  Tax Flag Action (for Orgs using Tax Estimations): Workflow (dynamic) | N/A: No taxable status is associated with this value. Tax Applies: The Taxable flag will be set to TRUE for items with this Commodity Code Tax Exempt: The Taxable flag will be set to FALSE for items with This Commodity Code: Only available if Org has: “Organization uses dynamic workflow for Commodity Code” enabled
  Site Configuration > Workflow Setup > General Workflow Settings
  Workflow for Commodity Codes is imported separately from the Commodity Codes themselves.
  Tax Flag Action (for Orgs using Tax Estimations): Custom Field Mappings | N/A: No taxable status is associated with this value. Tax Applies: The Taxable flag will be set to TRUE for items with this Commodity Code Tax Exempt: The Taxable flag will be set to FALSE for items with This Commodity Code: Only Available if Org has: “Map Commodity Codes to Custom Field Values (Value List only)” enabled
  Site Configuration > Hosted Catalog And Ordering Config > Manage Commodity Codes And Mapping
