text: |-
  Colonne:  | Http Status | Response “code” field | Meaning
  Case 1 | Http Status: 200 | Response “code” field: OK | Meaning: Message has been processed with success
  Case 2 | Http Status: 200 | Response “code” field: ≠ OK or missing field | Meaning: Message has been processed with negative result (“description” field should be used to describe the reason for the error an inform users about possible corrective actions)
  Case 3 | Http Status: ≠ 200 | Response “code” field: This field will be ignored | Meaning: Message has not been processed due unexpected errors
