text: |-
  Push message
  1. Header
  2. timestamp: the time the message was generated
  3. messageId: unique identified of the push message
  4. objectType: the type of the Jaggaer One object included in the push message
  5. objectId: the ID of the Jaggaer One object included in the push message
  6. requestAttributeList (available in XML and SOAP format only): list of configured attributes and related value extracted from the message payload; every attribute contains:
  7. name: name of the attribute
  8. value: value of the attribute
  9. Payload
