text: While in case of “call-me” services supporting the PULL logic, regardless of the data-flow direction, the JINT exposes a web-service to be invoked by a client component running at customer or partner side, in case of “push” services it is JINT that sends a message to the server component exposed by the partner/customer when an event occurs in Jaggaer One.
