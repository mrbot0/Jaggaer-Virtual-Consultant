text: |-
  Attribute: bankAccountNumber | Mandatory (Y/N): N | Description: Account number of the bank account. | Mapping on Jaggaer One data model and notes: • If the “type” field on the AccountsPayable element is set to DirectDeposit, this field is required for the United States, and required for all other countries if the AccountNumberType field is set to AccountNumber.
  • If the “type” field on the AccountsPayable element is set to WireTransfer, and the AccountNumberType field is set to AccountNumber, this field is required for the United States, and for the countries identified in AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields (see page 89). Must be blank for all other countries.
  • Must be blank if the “type” field on the AccountsPayable element is set to Check, Credit, ePayable, or PayMode.
  See AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields (see page 89) for the full list of countries for which this field is required, if the “type” field on the AccountsPayable element is set to WireTransfer, and the AccountNumberType field is set to AccountNumber.
