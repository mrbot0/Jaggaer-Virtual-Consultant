text: |-
  Attribute: type | Mandatory (Y/N): Y | Description: Method by which the order will be delivered to the supplier. | Mapping on Jaggaer One data model and notes: Used only for non-catalog Method by which the order will be delivered to the supplier. Used only for non-catalog items.
  • fax - Order delivered via fax.
  • emailplain - Order delivered as plain-text email.
  • emailbody - Order delivered as HTML in the body of an email.
  • emailattach - Order delivered as an HTML attachment to an email.
  • manual - Order delivered as a printed copy.
  For email distribution, most suppliers prefer emailattach.
  Values: (fax | emailplain | emailbody | emailattach | manual)
