text: "Attribute: otherNames | Mandatory (Y/N): N | Description: Additional names by which the supplier is known, other than the legal company name or DBA. | Mapping on Jaggaer One data model and notes: Enter additional names to make it easier for users to search for the supplier. For example, a supplier might have merged with another supplier, but still be known to users by the original name. This is a comma- separated field. That is, use commas to separate keywords. In search results, the other names are displayed in parentheses next to the Name"
