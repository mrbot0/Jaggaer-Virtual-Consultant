text: |-
  Attribute: ibanBankAccountNumber | Mandatory (Y/N): N | Description: IBAN of the bank account. | Mapping on Jaggaer One data model and notes: • If the “type” field on the AccountsPayable element is set to DirectDeposit, this field is required for all countries except the United States. Must be blank for the United States.
  • If the “type” field on the AccountsPayable element is set to WireTransfer, this field is always required for some countries, and required for other countries if the AccountNumberType field is set to Iban. See IbanBankAccountNumber Field (see page 89) for the full list of countries for which this field is required. Must be blank for all other countries.
  • Must be blank if the “type” field on the AccountsPayable element is set to Check, Credit, ePayable, or PayMode.
  See AccountNumberType, BankAccountNumber and InternationalRoutingCode Fields for the full list of countries for which this field is required (see page 89), if the APType field is set to WireTransfer.
