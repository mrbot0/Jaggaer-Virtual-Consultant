text: |-
  Attribute: customElementIdentifier | Mandatory (Y/N): N | Mapping on Jaggaer One data model and notes: Unique identifier for the custom element. Must match a previously defined ID for a custom element. This ID is static and cannot be edited in your system.
  You must provide the CustomElementIdentifier, the DisplayName, or both. However, if the DisplayName that you provide does not match the display name in your system, the custom element is not updated. Therefore, we recommend that you provide the CustomElementIdentifier and omit the DisplayName.
