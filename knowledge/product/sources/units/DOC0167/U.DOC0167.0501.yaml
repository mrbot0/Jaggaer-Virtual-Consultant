text: "Only when JA is Principal SM. | Operators: Date filtering accepts following operators: EQUAL: auction last update date must be equal to provided value NOTEQUAL: any auction whose last update date is different from provided value GREATER_THAN: any auction whose last update date is equal or greater than provided value LESS_THAN: any auction whose last update date is lower or than provided value Date value must be expressed in the form yyyy-MM-dd or yyyy-MM-dd HH:mm:ss.SSS Z eg. 2012-03-01 or 2012-03-01 12:36:42.535 +0100 Condition Filter: JI_lastUpdateDate | Description: Date and time supplier information was last updated in JI platform | Operators: Date filtering accepts following operators: EQUAL: auction last update date must be equal to provided value NOTEQUAL: any auction whose last update date is different from provided value GREATER_THAN: any auction whose last update date is equal or greater than provided value LESS_THAN: any auction whose last update date is lower or than provided value Date value must be expressed in the form yyyy-MM-dd or yyyy-MM-dd HH:mm:ss.SSS Z eg. 2012-03-01 or 2012-03-01 12:36:42.535 +0100 Condition Filter: JI_InternalId | Description: JI internal supplier id | Operators: The filters accept following operators: • EQUAL: value must be equal to provided value • NOTEQUAL: value is different from provided value • IN: value matches any of provided values • NOT_IN: value does not matches any of provided values Condition Filter: JI_ERPNumber | Description: JI ERP Number Condition Filter: JI_ThirdPartyRefNumber | Description: JI Third Party Ref Number Condition Filter: awarded | Description: YES NO YES_INCLUDE_OFFLINE NO_INCLUDE_OFFLINE Only when JA is Principal SM | Operators: YES if a supplier has been successful in at least one negotiation in JA (offline negotiation EXCLUDED). NO if a supplier has not been successful in any negotiation in JA (offline negotiation EXCLUDED)."
