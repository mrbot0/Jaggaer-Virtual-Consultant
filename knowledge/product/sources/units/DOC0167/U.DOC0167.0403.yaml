text: |-
  Attribute: directDepositFormat | Mandatory (Y/N): N | Description: Direct deposit format used by the bank. | Mapping on Jaggaer One data model and notes: • DirectDepositFormat_ACH - Automated Clearing House
  • DirectDepositFormat_CCD - ACH Corporate Credit or Debit Entry
  • DirectDepositFormat_CTX - ACH corporate trade exchange
  • Valid only if the “type” field on the AccountsPayable element is set to DirectDeposit.
  • Must be blank if the “type” field on the AccountsPayable element is set to WireTransfer, Check, Credit, ePayable, or PayMode.
  Values: (DirectDepositFormat_ACH | DirectDepositFormat_CCD | DirectDepositFormat_CTX)
