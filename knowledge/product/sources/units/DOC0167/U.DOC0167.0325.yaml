    - Uniquely identifies a specific preconfigured combination of payment terms.
    - |-
      If provided, TermsType, DaysAfter, and Discount are populated based on the preconfigured values set in StandardPaymentTermsCode.
      If both StandardPaymentTermsCode and Discount are provided, the value for Discount is used.
      If StandardPaymentTermsCode is provided, the Net and TermsType elements cannot have values.
