text: |-
  Colonne: Component Filter | Description | Possible values
  Component Filter: J1DATA | Description: J1 supplier main data (shared among J1 modules) | Possible values: Always included
  Component Filter: JA_REG | Description: JA registration data | Possible values: N.A.
  Component Filter: JA_CLASS | Description: JA classification information | Possible values: N.A.
  Component Filter: JA_DE | Description: JA eVM profile questions | Possible values: List of the DE name to be exported separated by ; (semicolon) e.g: “de.name.1;de.name.2”
  Special values:
  * extract all data-elements
  BASIC: extract all DE belonging to basic eVM forms
  EXTENDED: extract all DE belonging to extended eVM forms
  CATEGORY: extract all DE belonging to category eVM forms
  Component Filter: JI_REG | Description: JI main supplier company data | Possible values: N.A.
  Component Filter: JI_ADD_REG | Description: JI additional supplier company data | Possible values: N.A.
  Component Filter: JI_SERVICEAREA | Description: JI supplier service areas | Possible values: N.A.
  Component Filter: JI_COMMODITYCODE | Description: JI supplier commodity codes | Possible values: N.A.
  Component Filter: JI_NAICSCODE | Description: JI supplier NAICS codes | Possible values: N.A.
  Component Filter: JI_CURRENCY | Description: JI supplier currencies | Possible values: N.A.
  Component Filter: JI_ADDRESS | Description: JI supplier addresses (fulfillment center, remit to, ..) | Possible values: N.A.
  Component Filter: JI_CONTACT | Description: JI supplier contacts | Possible values: N.A.
  Component Filter: JI_CLASSIFICATION | Description: JI supplier additional classes and diversity classification | Possible values: N.A.
  Component Filter: JI_LOCATION | Description: JI supplier locations | Possible values: N.A.
  Component Filter: JI_CUSTOMELEMENT | Description: JI supplier custom elements | Possible values: N.A.
  Component Filter: JI_ACCOUNTSPAYABLE | Description: JI supplier accounts payable info | Possible values: N.A.
