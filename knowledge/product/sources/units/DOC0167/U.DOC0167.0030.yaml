  Attribute: code | Mandatory (Y/N): Y | Description: Code of requested operation | Mapping on Jaggaer One data model and notes: Code of the operation. It accepts following value:
  CREATE: a new supplier company is registered and automatically enabled, no matter main code provided
  UPDATE: it looks for an existing company having main code provided and updates it with new information.
  CREATE_UPDATE: if the company already exists then update it, otherwise creates a new one.
  NO VALUE PROVIDED: No operation will be performed on Company: information is provided to identify the supplier other operation will be performed on
