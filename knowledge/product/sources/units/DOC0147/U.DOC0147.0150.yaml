text: |-
  Configuring Trade-Ins
  1. Enable and configure trade-ins.
  2. Enable Grainger to allow trade-ins.
  3. Add the Add/Edit Trade-ins permission to the Advanced Shopper role.
  4. Add the Advanced Shopper role to your user.
  5. Add a new desk from Grainger to your cart, and trade in the one you have.
