text: |-
  Guided Activity:
  1. Make sure shared carts are enabled.
  2. Configure shared cart permissions and notifications for relevant user roles.
  3. Create a shared cart group and add users.
  4. Add the Share cart field to the requisition configuration in the General section.
  5. Search for an item, put it in the cart, rename it, share it, and unlock it.
  6. Log in as a user who is in the Operations department and has the Advanced Shopper role, view the shared cart notification, open the shared cart, add items to it.
  7. Log back in as your config user, navigate to the shared cart, lock the cart to proceed to checkout, review the requisition history and the Share cart field, and submit.
