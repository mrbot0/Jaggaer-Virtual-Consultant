text: The “One-Stop Shop” Environment • Client specific catalog and pricing hosted in the application Hosted Catalog • Supplier creates a client specific punch-out containing negotiated items and prices Punch-Out Catalog • Used for items that are not found in hosted or punch-out catalogs (specialty items, etc.) Non-Catalog Items • Customized per customer- Examples include catering forms, business cards, services Forms/Requests • Load contract specific items, provide ordering instructions & associate forms Contracts
