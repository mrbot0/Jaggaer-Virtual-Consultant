text: Key Terms Rule Groups • Rule Groups are created in the interface, typically during implementation • An Activity written into the XLM file has a Rule that says “at this point, go check the Rule Group called xxx now” • In the UI, the client can create multiple “Rule Group Rules” that are all in that Rule Group and are evaluated at that same time • Each “Rule Group Rule” can contain numerous ‘if-then’ statements o Document-level and/or Line-Level o
