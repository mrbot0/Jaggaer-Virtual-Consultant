text: |-
  18
  1. Add the folder with the reject requisition robot into the Workflow Folder XML file.
  2. Add a step into the Workflow Definition XML file that will point to the rule and the robot.
  3. Create an ADW rule group.
  4. Import the Workflow Definition XML file and address any errors.
  5. Create an ADW rule to trigger the step.
  6. Test the step for your user.
