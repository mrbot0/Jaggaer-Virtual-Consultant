text: |-
  Configuring Budgets with Budget Manager
  1. Enable spend adjustments.
  2. Navigate to the Spend Adjustments page and add a spend adjustment.
  3. View the spend adjustment you just made now on that page.
  4. Navigate to the Date Ranges page and view the adjustment in the blue information icon.
  5. View the adjustment in the History .
