text: |-
  Configuring Budgets with Budget Manager
  1. Create a budget and submit it for approval.
  2. Approve the budget.
  3. Put items in your cart and code it to that budget.
  4. Do a budget check at checkout.
  5. Submit the PR and view the PR approvals.
  6. View the results on the budget.
