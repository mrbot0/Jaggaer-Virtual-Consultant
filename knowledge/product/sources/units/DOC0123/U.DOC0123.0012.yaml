text: ADW with shared folder As stated above, you can use ADW as an evaluation tool yet send the document to a shared folder. To do this, include the ADW Rule Group reference in the rule, but not the attribute segm ent in the activity. Also, remove the MultiElementDynamic folder selection rule and add a <FolderRef> element into the activity that references the static folder.
