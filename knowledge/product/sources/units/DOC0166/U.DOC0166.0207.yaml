text: 6.2 Supplier users IDM Jaggaer also provide a centralized supplier IDM to allow supplier to access every single J1P tenant with the same credential Every time a supplier user needs to access a J1P resource, the J1 Supplier IDM will verify the supplier session and, if not valid, will ask the suppli er to authenticate himself Username will be the email Supplier IDM will also provide the possibility to support customer IDP federation, in addition to J1P supplier IDM one In case this option is applied, J1P supplier IDM will act as service provider towar ds the customer IDP by using a specific feature named Identity brokering If a supplier user access via customer IDP, access is restricted to the J1P tenant associated to the customer, via a J1P feature named Audience, that block the possibility for a suppl ier to access J1P tenant belonging to other customers
