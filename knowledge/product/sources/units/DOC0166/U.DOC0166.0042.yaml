text: Activation of API’s are managed over the J1P integration manager console and to activate the REST services for any tenant , log in to the console https://global.j1p.jaggaer.com/globalfe/ first and t hen select the region and choose the Public API option from the external integration submenu. Public APIs page allows you to search integrations or create new one, based on selected tenant. Every created integration has action submenu, marked with three do ts. For the activation of rest service, first choose Rest Configuration action, then on Rest Configuration page, use "Activate Service" button in top right corner of the page.
