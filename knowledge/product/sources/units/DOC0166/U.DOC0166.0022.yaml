text: Jaggaer one platform (J1P) module provides the below list of options to integrate Jaggaer platform with customer ERP/ third party applications. Public APIs to Import /Update /Validate /Export data over REST protocol. Cloud Connectors to enrich the supplier information with market -recognized 3rd party Info Providers. Webhooks/connectors + “User aware” APIs to enable flexible PaaS Integrations developed by Partners to connect with customers and third -party applications . J1 IDM to enable Jaggaer as Identity Provider for third -party and customer applications with the abil ity to federate other IDPs (identity brokering) .
