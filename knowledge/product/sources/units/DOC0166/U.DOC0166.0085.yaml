text: 2.6.1 JWT – Json Web Token In order to authenticate itself against the API endpoint , user can use an opaque token that is provided by the J 1P authorization endpoint. Therefore the client components invoke the “Token” API providing some credentials and gets the bearer token to be used to call t he APIs. The access token can be retrieved by the client calling the “tokens” endpoint offered by J1P Public API and providing the credentials communicated at setup phase.
