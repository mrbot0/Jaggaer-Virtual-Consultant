text: 2.4.4 Query grammar specifications The following grammar specification is written in EBNF notation ( ISO 14977 ). query-expression = comparison, { ";" , comparison } selector = unreserved -str; comparison = selector, comparison -op, arguments; comparison -op = ( ( "=", { ALPHA } ) | "!" ), "="; arguments = ( "(", value, { "," , value }, ")" ) | value; value = unreserved -str | double -quoted | single -quoted;
