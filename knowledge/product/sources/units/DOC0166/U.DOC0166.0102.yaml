text: Push services have been introduced to support real -time and near real -time process where it is required to send data from Jaggaer One to an external system and therefore an integration solution based on “CALL -ME” web -services ( only over REST ) based on a the PULL logic was not well -fitting since it requires the client component to “call” the web - services very frequently.
