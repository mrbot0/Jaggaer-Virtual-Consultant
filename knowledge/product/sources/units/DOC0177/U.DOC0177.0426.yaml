text: |-
  Attribute: internationalRoutingCode | Mandatory (Y/N): N | Description: Also known as IRC. Country-specific bank routing code for international banking transactions. | Mapping on Jaggaer One data model and notes: • If the “type” field on the AccountsPayable element is set to WireTransfer, and the AccountNumberType field is set to AccountNumber, this field is required for the countries identified in AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields (see page 89). Must be blank for all other countries.
  • Must be blank if the “type” field on the AccountsPayable element is set to DirectDeposit, Check, Credit, ePayable, or PayMode.
  See AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields (see page 89) for the full list of countries for which this field is required, if the “type” field on the AccountsPayable element is set to WireTransfer, and the AccountNumberType field is set to AccountNumber.
