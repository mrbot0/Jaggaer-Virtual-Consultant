text: |-
  Attribute: routingNumber | Mandatory (Y/N): N | Description: Routing or transit number of the bank. | Mapping on Jaggaer One data model and notes: • If the “type” field on the AccountsPayable element is set to DirectDeposit, this field is always required for the United States, and required for all other countries if the AccountNumberType field is set to AccountNumber.
  • If the “type” field on the AccountsPayable element is set to WireTransfer, this field is required for the United States. Must be blank for all other countries.
  • Must be blank if the “type” field on the AccountsPayable element is set to Check, Credit, ePayable, or PayMode.
