text: In order to get the proper subset of results the webservice client can set in the webservice call the parameter startAt (default is 1). Information about the availability of more objects is given by the response parameter nextStartAt. This parameter contains the value to be used for the value of startAt parameter in subsequent request. If there are no available for another request, the response parameter nextStartAt will have the value -1.
