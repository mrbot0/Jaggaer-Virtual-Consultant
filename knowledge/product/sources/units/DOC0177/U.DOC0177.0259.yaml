text: |-
  Attribute: value | Mandatory (Y/N): Y | Description: Value of the diversity property. | Mapping on Jaggaer One data model and notes: VARIES depending on the setting of the name field.
  certified Indicates whether the supplier is (Yes) or is not (No) certified.
  certificationtype - Type of certification. Must be a valid type, as defined in the JAGGAER ONE Supplier Management solution.
  certifyingagency - Agency responsible for the certification. Must be a valid agency, as defined in the JAGGAER ONE Supplier Management solution.
  expirationdate - Date the certification expires, in the following format:
  yyyy-mm-dd
  certificationnumber -
  Number listed for the certification.
  Maximum length is 100 digits.
  ethnicity - Ethnic group of the supplier. Must be a valid group, as defined in the JAGGAER ONE Supplier Management solution.
  vetbizregistry - Indicates whether the supplier is (Yes) or is not (No) listed in the VetBiz registry of veteranowned businesses.
  sbacertified - Indicates whether the supplier is (Yes) or is not (No) certified by the US Small Business Administration (SBA).
  verificationordernumber - Verification Order Number (VON) ID. Proof of certification by the California Supplier Clearinghouse. Maximum length is 100 characters.
