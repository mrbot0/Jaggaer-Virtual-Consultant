        Operation of the filter.
        According to the data-type of the data element, the following values are allowed:
        Text: STARTWITH, CONTAINS, EQUAL
        Numeric: EQUAL, GREATER_THAN, LESS_THAN
        Date: EQUAL, GREATER_THAN, LESS_THAN
        Yes/No: EQUAL, NOTEQUAL
        Choice: EQUAL, NOTEQUAL
        Multi Choice: IN, NOT_IN, AT_LEAST_ONE
        Attachment/Signed Attachment: ISEXPIRED, NOTEXPIRED
        All datatypes: ISNULL and NOTNULL
    - - VALUES
      - ""
      - |-
        Value of the filter, according to operation.
        Date values can be expressed in format
        “yyyyMMdd” (e.g. 20150624)
        or
        "yyyy-MM-dd HH:mm:ss.SSS Z" (e.g. 2015-06-24 14:34:16.535 +0100).
        It is possible to configure a different format for date value (example: "yyyy-MM-dd"). In this case the same format will be applied to import, export and data element condition filter.
        For Attachment, the operators ISEXPIRED and NOTEXPIRED can be used with a specific date as value (format “yyyyMMdd” or the one set in configuration parameter deShortDateFormat). If omitted, the default date will be the current date.
