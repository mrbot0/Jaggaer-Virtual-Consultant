text: |-
  Attribute: type | Mandatory (Y/N): N | Description: Indicates the type of PO number generated for the PO payment method.. | Mapping on Jaggaer One data model and notes: Values:
  wheel - The PO number will be generated using a predefined number wheel.
  sciquestId - The PO number will be generated by the JAGGAER ONE Supplier Management solution.
  Required if PONumberSelection element is provided.
  This setting is rarely passed in the supplier import. It is usually defined at an organizational level.
