text: 'Attribute: supplierKeywords | Mandatory (Y/N): N | Description: Keywords by which the supplier can be found in product search. | Mapping on Jaggaer One data model and notes: This is a comma-separated field. That is, use commas to separate keywords. Appropriate keywords include products, commodities, and categories offered by the supplier. Use common product search terms that are typically used when searching for products. These terms can then be searched for by users in product search. Suppliers with matching keywords are displayed in the "Suppliers with Matches" section in product search results. If the list of keywords is longer than 700 characters, it is truncated and saved.'
