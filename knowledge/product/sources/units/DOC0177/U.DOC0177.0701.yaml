text: When the JINT service sends the supplier export message to the external system for the first time, it sets all of the fields to isChanged="Yes". When the external system returns a success response, the solution will begin tracking changes on subsequent exports. The unchanged fields will then be set to isChanged="No", leaving only the changed fields set to isChanged="Yes".
