text: |-
  Below you can find a Postman collection including more request ready to be tested in your environment. It is just needed to define 3 environment variables
  1. jintHostName: the name of the host where your API is available, including protocol. Eg. https://customername-ws01.app.jaggaer.com
  2. client_id: the username to retrieve an access token
  3. client_secret: the password to retrieve an access token
