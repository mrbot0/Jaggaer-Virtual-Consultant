text: "Modified fields type from unsignedLong to String (RoutingNumber and InternationalRoutingCode) Revision: 14 | Date Released: 2020-08-27 | Version: JINT 20 02 01 | Description of Change: Additional info values for choice and multi-choice are exported in the “neutral” locale. Revision: 15 | Date Released: 2020-10-21 | Version: JINT 20 03 00 | Description of Change: J1Supplier import: Added bizLegalStruct field J1Supplier export: Added bizLegalStruct field Added extStatusNote field Revision: 16 | Date Released: 2020-11-09 | Version: JINT 20 03 01 | Description of Change: J1Supplier Import/Export: Managed Custom Elements for Locations (Fulfillment centers) J1Supplier Export: Managed attribute isChanged for PUSH interface in the following cases (Supplier Custom Elements and Location Custom Elements): CustomElementIdentifier DisplayName CustomElementValueList CustomElementValue Revision: 17 | Date Released: 2020-11-13 | Version: JINT 20 03 01 | Description of Change: J1Supplier Import/Export Managed the following fields in JIData/locationList/location/termsAndCondition/paymentTerms section: standardPaymentTermsCode termsType daysAfter Revision: 18 | Date Released: 2021-01-07 | Version: JINT 20 03 01 | Description of Change: Added REST Interface Revision: 19 | Date Released: 2021-02-26 | Version: JINT 21 01 00 | Description of Change: J1Supplier Import/Export Managed the following structure data in JIData/contactList/contact section: mobilePhone Managed the following structure data in JIData/accountsPayableList/accountsPayable section: flexFields Revision: 20 | Date Released: 2021-04-15 | Version: JINT 21 01 00 | Description of Change: J1Supplier Export Added condition filter “awarded” referring to negotiations in JA, with possible values: YES, NO, YES_INCLUDE_OFFLINE, NO_INCLUDE_OFFLINE. Revision: 21 | Date Released: 2021-05-31 | Version: JINT 21 01 00 | Description of Change: Updated postman collections related to REST Interface."
