text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: returnCode | Description: Operation result. Possible codes are listed in the table below
  Attribute: returnMessage | Description: Operation result description for each data classes (Company Data, Classification, Users and Data Elements) web service has been called for. If operation on a certain data class completes successfully, it is “OK”, otherwise it is a brief explanation of mismatches found (see “Error Codes” for detail)
  Attribute: id | Description: JA principal system: company account id (internal identifier) of newly created or updated company
  JI principal system: new JINT internal id and for those already created with the JA to JI process flow it will be used the account id
  Attribute: messages | Description: List of messages (warnings and errors)
  Attribute: messages/message/subsystem | Description: JaggaerOne subsystem which is generating the message
  Attribute: messages/message/dataModel | Description: Object related to the message
  Attribute: messages/message/severity | Description: Message severity: ERROR, WARNING, INFO
  Attribute: messages/message/text | Description: Text of the message
