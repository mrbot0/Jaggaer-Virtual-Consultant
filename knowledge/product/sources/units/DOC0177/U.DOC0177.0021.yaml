type: procedura
text: |-
  Executive Summary (parte 1/2)
  1. Export data format [Export of Company Data]: describes the structure of the response in terms of exported fields and sections.
  2. SOAP INTERFACE
  3. Available methods: contains the list of the methods provided by the web service.
  4. WSDL: in this paragraph is attached the wsdl file from which the SOAP web service has been created and is to be used to generate the client.
  5. Endpoints: available webservice SOAP endpoint URLs
  6. Request samples: sample SOAP requests to invoke the webservices
  7. REST INTERFACE
  8. Operation and Endpoints: describes REST available collections. Allowed calls with allowed parameters and supported HTTP methods
  9. Request samples: contains detailed samples of HTTP request/response for each available operation
  10. PUSH INTERFACE
  11. Data model: refers to push message data format
  12. Configuration: describes configuration options
  13. Is Changed: describes the behavior of the “isChanged” attribute
  14. Request samples: contains samples of push message
  15. Data Types and UI Default Labels: describes the type of the fields and the corresponding label in English language in the platform with the aim to simplify the mapping between the fields visible in the platform and the fields used in the web service.
