  Attribute: fob | Mandatory (Y/N): N | Description: Freight on Board (FOB) information. | Mapping on Jaggaer One data model and notes: When shipping goods, FOB indicates whether the destination or the origin pays the loading and transportation costs, or the point at which the responsibility of the goods transfers from the shipper to the buyer.
