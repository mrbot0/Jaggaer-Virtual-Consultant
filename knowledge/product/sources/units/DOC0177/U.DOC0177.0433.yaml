text: |-
  Attribute: postalCode | Mandatory (Y/N): N | Description: Postal code associated with the bank account. | Mapping on Jaggaer One data model and notes: • If the “type” field on the AccountsPayable element is set to DirectDeposit or WireTransfer, this field is required for the countries identified in PostalCode Field (see 2.1.5 PostalCode Field). Optional for all other countries.
  • Must be blank if the “type” field on the AccountsPayable element is set to Check, Credit, ePayable, or PayMode.
