  Attribute: thirdyPartyRefNumber | Mandatory (Y/N): N | Mapping on Jaggaer One data model and notes: Unique reference number or ID generated by a thirdparty solution (that is, in addition to an ERP system) that can be used to map a primary supplier address from JAGGAER ONE to the third-party solution.
