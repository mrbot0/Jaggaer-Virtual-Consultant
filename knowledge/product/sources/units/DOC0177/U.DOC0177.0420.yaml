text: |-
  Attribute: accountNumberType | Mandatory (Y/N): N | Mapping on Jaggaer One data model and notes: Indicates whether the bank uses a standard account number (Account Number) or an International Bank Account Number (Iban, which is valid only for countries other than the United States that support IBAN).
  • If the “type” field on the AccountsPayable element is set to DirectDeposit, this field is required for all countries other than the United States. Must be blank for the United States.
  • If the “type” field on the AccountsPayable element is set to WireTransfer, this field is required for the countries identified in AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields (see page 89). Must be blank for all other countries.
  • Must be blank if the “type” field on the AccountsPayable element is set to Check, Credit, ePayable, or PayMode.
  Values : (Account Number | Iban)
  See AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields, on page 112 for the full list of countries for which this field is required, if the “type” field on the AccountsPayable element is set to WireTransfer.
