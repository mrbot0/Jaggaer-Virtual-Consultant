text: "New Import JIOrder method Export JI Order Method: New fields “firstName”, “lastName”, “phone” and “position” added in Requestor data new “TelephoneNumber” element data added New fields “userFirstName” and “userLastName” added to “HistoryEvent” data Revision: 11 | Date Released: 2020-03-08 | Version: JINT 20 01 00 | Description of Change: Minor changes (no impact): new WSDL version management Revision: 12 | Date Released: 2020-03-11 | Version: JINT 20 01 00 | Description of Change: Import JIOrder method Main request structure [Import JIOrder method]: element “lineList” marked as mandatory with the comment that at least an order line must be set in the request. Header [Import JIOrder method]: element “supplier”, remarked it must always be provided SupplierInfo [Import JIOrder method]: note added stating “You must specify either the id element, the supplierNumber field, or both.” JIOrderLine [Import JIOrder method]: element “item” marked as mandatory. Export and import methods: JIOrderLine “quantity” field changed from unsigned long to double value to represent decimal number, too. In case quantity is a positive whole number, it is exported with no decimal value and with no decimal separator. Revision: 13 | Date Released: 2020-04-06 | Version: JINT 20 01 01 | Description of Change: Export JI Order Method: New field “commodityCodeType” added in Item element. New structure “TransactionDetails” (with its “TransactionDetail”, “TotalTransactionAmount”, “OverToleranceRate” and “OrderAmount” sub-structure) added in Header element Revision: 14 | Date Released: 2020-04-27 | Version: JINT 20 01 01 | Description of Change: Minor changes: alignment of data types and UI default labels Revision: 15 | Date Released: 2020-07-07 | Version: JINT 20 01 01 | Description of Change: Added REST interface Import JI Order Method: import of external attachments available in ExternalInfo element."
