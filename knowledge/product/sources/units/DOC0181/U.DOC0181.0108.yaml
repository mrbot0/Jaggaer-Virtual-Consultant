  Attribute: userName | Description: Username of the user responsible for the change
  Attribute: action/code | Description: Code for the action in the group, such as Line Item Added action code - 14
  Attribute: action/group | Description: Type of group to which the action belongs:
  Approval
  Modification
  Integration
  Distribution
  Attribute: action/description | Description: Description of the action.
  If the description is longer than 1000 characters, it is truncated
  Attribute: field/name | Description: Name of the field associated with the change detailed in the history.
