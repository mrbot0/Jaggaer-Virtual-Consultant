      - Unique ID number for a specific stock item in the supplier inventory
      - ""
    - - auxiliaryCatalogNumber
      - Catalog number, sometimes used by punchout suppliers to provide additional identification of an item.
      - ""
    - - description
      - Description of the item being purchased
      - ""
