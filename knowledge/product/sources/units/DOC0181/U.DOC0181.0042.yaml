ngHandling | Description: Charges for tax 1. See section “TaxShippingHandling [Export JIOrder method]” below Attribute: tax2/taxShippingHandling | Description: Charges for tax 2. See section “TaxShippingHandling [Export JIOrder method]” below Attribute: discountAmount | Description: Discount amount to be applied. See section “DiscountAmount [Export JIOrder method]” below Attribute: orderClauseList | Description: Container for clause applied to the order."
