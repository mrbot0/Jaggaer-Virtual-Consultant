text: |-
  Attribute: standardPaymentTermsCode | Mandatory (Y/N): N | Description: Uniquely identifies a specific preconfigured combination of payment terms.
  If provided, TermsType, DaysAfter, and Discount are populated based on the preconfigured values set in StandardPaymentTermsCode.
  If both StandardPaymentTermsCode and Discount are provided, the value for Discount is used.
  If StandardPaymentTermsCode is provided, the TermsType element cannot have values.
  Note: The StandardPaymentTermsCode element is supported in version 3.2 of the DTD and later.
