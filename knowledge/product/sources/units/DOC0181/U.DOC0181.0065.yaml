text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: distributionType | Description: Manner in which the funds are to be distributed to each split.
  AmountOfQuantity: funds are distributed based on a user-specified portion of the quantity.
  AmountOfPrice: funds are distributed based on a user-specified monetary amount.
  PercentOfQuantity: funds are distributed based on a user-specified percentage of the quantity.
  PercentOfPrice: funds are distributed based on a user-specified percentage of the price.
  Attribute: context | Description: Specifies the context of the split for the line item.
  Line: The split applies to all contexts for the line item.
  Discount: The split applies to the discount.
  Shipping: The split applies to shipping.
  Handling: The split applies to handling.
  Tax1: The split applies to tax 1.
  Tax2: The split applies to tax 2.
  Attribute: splittableFieldIndexList | Description: Container of Splittable Field Index elements.
  See section “SplittableFieldIndex [Export JIOrder method]” below
