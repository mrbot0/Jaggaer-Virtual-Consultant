text: |-
  Attribute: contactInfoList | Description: Container for possible supplier contact information.
  See section “ContactInfo [Import JIOrder method]” below.
  Note: If the supplier does not exist in JAGGAER ONE, at least a ContactInfo element is required, and its type attribute must be set to main. You can choose to omit the other ContactInfo sub-elements, fields, and attributes, but the ContactInfo element and the type attribute are required.
  Valid only for SupplierInfo data specified at JIHeader level.
