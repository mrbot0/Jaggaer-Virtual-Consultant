text: "Colonne: Document DISTRIBUTION | Latest version of this document can be downloaded by uthorized users from the SharePoint area devoted to host ISO System documents OR it can be obtained upon written request to the ISO System Manager. This document and any files transmitted with it are confidential and intended solely for the use of the individual or entity to whom they are addressed. If you have received this document in error please notify the JAGGAER Security Officer. This document contains confidential information and is intended only for the individual(s) named. If you are not the named addressee you should not disseminate, distribute or copy this document. Please notify the JAGGAER Security Officer immediately by e-mail ([email]) if you have received this document by mistake and delete it from your system. If you are not the intended recipient you are notified that disclosing, copying, distributing, printing or taking any action in reliance on the contents of this information is strictly prohibited Document DISTRIBUTION: Document use once PRINTED | Latest version of this document can be downloaded by uthorized users from the SharePoint area devoted to host ISO System documents OR it can be obtained upon written request to the ISO System Manager. This document and any files transmitted with it are confidential and intended solely for the use of the individual or entity to whom they are addressed. If you have received this document in error please notify the JAGGAER Security Officer. This document contains confidential information and is intended only for the individual(s) named. If you are not the named addressee you should not disseminate, distribute or copy this document. Please notify the JAGGAER Security Officer immediately by e-mail ([email]) if you have received this document by mistake and delete it from your system."
