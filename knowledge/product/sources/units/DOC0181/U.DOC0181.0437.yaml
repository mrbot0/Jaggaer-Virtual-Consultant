  See section “ErrorCodes [Import JIOrder method]” below.
  Attribute: returnMessage | Description: Global result description. If operation completed successfully, it is “OK”, otherwise it is a brief explanation of mismatches found.
  Attribute: importResponseMessage | Description: Operation result description.
  See section “ImportResponseMessage [Import JIOrder method]” below
