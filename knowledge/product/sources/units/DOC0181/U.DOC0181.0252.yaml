text: |-
  Attribute: net | Mandatory (Y/N): N | Description: Number of days after the invoice date that the invoice is due.
  Note: Starting from the DTD version 3.2, the Net tag is no longer supported. It must be replaced by TermsType and DaysAfter.
  For example:
  <net>15</net>
  must be replaced with
  <termsType>Net</termsType>
  <daysAfter>15</daysAfter>
