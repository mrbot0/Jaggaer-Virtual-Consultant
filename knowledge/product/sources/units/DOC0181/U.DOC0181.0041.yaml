  rows:
    - - originalRequestMessageId
      - Unique identifier for the PO export message which with this PO was saved
      - ""
    - - orderId
      - Unique Internal identifier of the order
      - ""
    - - validationStatus
      - |-
        Flag describing order validation requirement:
        0: Unneeded, PO was exported with no validation requirements.
        1: Pending - PO is waiting to complete the validation process.
        2: Completed - PO completed the validation process
      - ""
    - - workflowStep
      - Workflow step in which the order was when exported
      - JA_19_02
    - - lastUpdateDate
      - Date and time order information was last updated
      - ""
    - - poNumber
      - Number of the PO.
      - ""
    - - alternatePONumber
      - Alternate PO number.
      - ""
    - - originalPONumber
      - PO Number as initially sent by JI, initialized when record is created the first time
      - ""
    - - workflowStatus
      - |-
        Workflow status of the PO.
        Completed: The PO has completed the workflow process.
        Pending: The PO has not completed the workflow process.
      - ""
    - - supplierstatus
      - |-
        Supplier Status
        See section”SupplierStatus [Export JIOrder method]” below.
      - ""
    - - apStatus
      - Accounts payable status of the PO. POs that are closed can no longer be received or invoiced against.
      - ""
    - - evaluatedReceiptSettlement
      - Indicates whether the PO does (true) or does not (false) have the Evaluated Receipt Settlement setting enabled. When the setting is enabled, invoices cannot be created from the PO (credit memos can still be created).
      - ""
    - - revisionNumber
      - Revision number of the PO. New POs begin with revision 0. The revision number is incremented sequentially (that is, 0, 1, 2, and so on).
      - ""
    - - revisionDate
      - Date and time the revision was finalized
      - ""
    - - distributeRevision
      - Set to true if the revision was flagged to be distributed to the supplier. Otherwise, false.
      - ""
    - - requestor
      - |-
        Information about the person who originally requested the PO export.
        See section “Requestor [Export JIOrder method]” below.
      - ""
    - - buyer
      - |-
        Buyer information.
        See section “BuyerInfo [Export JIOrder method]” below.
      - ""
    - - businessUnit
      - Name of the business unit with which the buyer is associated
      - ""
    - - department
      - Department of the buyer, from his or her profile.
      - ""
    - - priority
      - |-
        Priority inherited from the PO:
        High
        Normal
        Empty
      - ""
    - - createDate
      - Date and time the PO was generated
      - ""
    - - initialRevisionDate
      - Date and time the PO was initially revised
