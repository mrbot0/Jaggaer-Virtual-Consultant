text: |-
  Executive Summary
  1. WSDL: in this paragraph is attached the JIOrder.wsdl from which the web service has been created and is to be used to generate the client.
  2. Endpoints: available webservice SOAP endpoint URLs
  3. Request examples: sample SOAP requests to invoke the webservices
  4. REST INTERFACE
  5. Endpoint definitionError! Reference source not found.: describes REST available collections. Allowed calls with allowed parameters and supported HTTP methods
  6. Request Samples: provides some call examples and a POSTMAN collection with an extensive list of runnable calls
  7. Data Types and UI Default Labels: describes the type of the fields and the corresponding label in English language in the platform with the aim to simplify the mapping between the fields visible in the platform and the fields used in the web service.
