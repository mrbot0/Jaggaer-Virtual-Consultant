text: "Colonne: Attribute | Description | Available from version Attribute: formType | Description: Mechanism for grouping form requests Attribute: formTitle | Description: Caption given to the form request for easy understanding Attribute: catalogNumber | Description: Catalog number of the form request Attribute: description | Description: Description of the form request Attribute: productSizeList | Description: Container for description of the size of the item. See section “ProductSize [Export JIOrder method]” above. Attribute: quantity | Description: Number of items Attribute: productUnitOfMeasureList | Description: Container for description of the unit of measure of the item See section “ProductUnitOfMeasure [Export JIOrder method]” above Attribute: unspsc | Description: Standardized commodity code value for the item, as specified by http://www.unspsc.org (for example, 43191501 – Mobile phones). Attribute: productClassificationList | Description: Container of item classification. See section “ProductClassification [Export JIOrder method]” above. Attribute: manufacturerInfo | Description: Manufacturer information. See section “ManufacturerInfo [Export JIOrder method]” above. Attribute: categoryInfo | Description: Item category information. See section “CategoryInfo [Export JIOrder method]” above Attribute: commoditycode | Description: Code assigned to a product, or a group of products, for the purposes of identifying it in international commerce, or commerce in general. CommodityCode is not a specific description of the goods or service. Attribute: contractNumber | Description: Contract number against which the item was purchased. Attribute: capitalExpense | Description: Indicates whether the item is (true) or is not (false) a capital expense. Attribute: taxable | Description: Indicates whether the manufacturer is (true) or is not (false) taxable. Attribute: templateId | Description: ID of the template to be used to create the form request Attribute: formRequestFields | Description: Container for form request fields. See section “FormRequestFields [Export JIOrder method]” below Attribute: formRequestID | Description: ID of the form request."
