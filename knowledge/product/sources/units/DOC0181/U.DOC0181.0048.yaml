text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: id | Description: JI internal identifier of the supplier
  Attribute: name | Description: Supplier Name
  Attribute: supplierNumber | Description: Supplier ID that your organization has provided for this supplier in the supplier profile
  Attribute: thirdyPartyRefNumber | Description: Supplier ID for the supplier, provided by your organization for use by other systems
  Attribute: businessUnitVendorId | Description: Vendor ID assigned to this supplier by the business unit
  Attribute: DUNS | Description: Dun & Bradstreet (DUNS) number for this supplier
  Attribute: contactInfoList | Description: Container for possible supplier contact information.
  See section “ContactInfo [Export JIOrder method]” below
  Attribute: accountCode | Description: Account code sent to the supplier with the order line
  Attribute: pricingCode | Description: Specifies any special pricing or promotional codes with the order line.
  Attribute: contractNumber | Description: Contract number sent to the supplier with the order line.
  Attribute: contractName | Description: Contract name sent to the supplier with the order line.
  Attribute: contractRenewalNumber | Description: Contract renewal number sent to the supplier with the order line.
  Attribute: note | Description: Text note for the supplier that is entered in the cart.
  Attribute: attachmentList | Description: Supplier Attachment information
  See section “Attachment [Export JIOrder method]” below
  Attribute: quoteNumber | Description: Special quote number to be sent to the supplier
  Attribute: fulfillmentAddressInternalId | Description: Internal ID for the fulfillment center. The fulfillment center address must be active and unique. | Available from version: JA_19_03
  Attribute: fulfillmentAddressId | Description: External ID defined by your organization for this fulfillment center. The fulfillment center address must be active and unique. | Available from version: JA_19_03
  Attribute: fulfillmentAddressThirdPartyId | Description: Unique external ID defined by a third party for this fulfillment center. The fulfillment center address must be active and unique. | Available from version: JA_19_03
