text: |-
  Attribute: termsType | Mandatory (Y/N): N | Description: Used in conjunction with the daysAfter element to determine the invoice due date.
  Possible values:
  Net
  EOM
  MFI
  EOQ
  Manual
  If TermsType is provided the StandardPaymentTermsCode element cannot have values.
  Note: The TermsType element is supported in version 3.2 of the DTD and later. Older versions of the DTD support the Net tag.
