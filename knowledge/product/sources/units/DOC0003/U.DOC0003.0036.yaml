text: “Collaborating on this has been so beneficial,” said Lynsey, “because we can compare different elements like cost, quality, service, lead times, response times, etc, and where we have issues, we can determine what each other is experiencing and what each other is doing to remedy or change them. We can cross check what performance looks like for another authority, and talk about receiving the same service or results. So we are going into review meetings with accurate information, we can ask the right questions and make the right decisions to help the supplier develop. This is very valuable to us – an effective, ongoing way to secure value for the longer term.”
