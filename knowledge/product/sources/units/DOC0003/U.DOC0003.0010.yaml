text: At South Ayrshire Council, Lynsey Bennet, Procurement Officer (Contract and Supplier Management) explained how they, like many other local authorities, had a functional but manual s upplier and contract management system in place, in fact, she said, “There was no automation at all in this process, everything was manual, based on spreadsheets and emails. It took an awful lot of admin time to locate and collect information from different stakeholders and transfer that into a master spreadsheet, so we couldn’t rely on absolute accuracy. One procurement officer managed the whole thing alongside the evaluators, who also had to record everything manually.”
