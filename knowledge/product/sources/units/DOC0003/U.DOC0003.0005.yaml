text: About a year ago, both councils adopted JAGGAER’s contract lifecycle management software, a natural choice which complemented their use of (public contracts Scotland) PCS-Tender. In doing so, they not only gained visibility, tracking, negotiation and compliance benefits, but discovered a collaborative way of sharing knowledge and market intelligence to take their supplier value management to a superior level.
