text: "“At East Ayrshire, we have also taken the time to conduct one-to-one training with our suppliers on the system in order to provide them visibility of their own contract information eg: minutes of performance meetings, price schedules, variation orders and various other contractual documents, thus reducing the need to duplicate work and information eg: copies of contract documentation, and so on,” he said."
