text: They can review any concerns and investigate queries – there are no surprises. On the other hand, where a supplier does not agree with our scoring, we can demonstrate our reasons behind it, because we have all supporting information to hand and up to date in the system. So it comes down to complete visibility, for us and for them, which ultimately enables us to receive a better service and deliver a better service.”
