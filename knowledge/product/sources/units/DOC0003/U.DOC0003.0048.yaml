text: “JAGGAER provides a comprehensive solution to streamline and automate supplier performance management processes across the extended sector. By using the system we can configure and distribute supplier performance surveys, manage certifications, define and monitor supplier KPIs, and create and manage supplier scorecards with closed-loop support for performance sustenance / improvement. The team at JAGGAER are very pro-active and are keen to discuss and develop system enhancements with us,” said Tommy.
