text: The single process has introduced a mechanism for collaboration that could be appropriate for any set of authorities, or even for businesses in other sectors. Both Lynsey and Tommy have worked in the public and private sectors and feel the system has benefits for both, through its ease of use, flexibility and the range of management reports it can produce.
