text: The whole idea behind PCS-T is to standardise measurements across authorities, so that all information would be comparable. But no two contracts are the same, and we were restricted by the KPIs available. We had to find a way of maximising their use to all stakeholders, and widening the range to make them more applicable to different contracts, without limiting their potential for comparative measurements. JAGGAER helped us develop a wider range of KPIs, which could still be used by any authority, thereby facilitating cross-organisational benchmarking.
