text: It was during the time when JAGGAER was working closely with both councils to understand their individual needs and tailor the system accordingly, that they saw an opportunity to leverage similarities and bring both councils equal, and better value from their service agreements. It was a simple, yet highly effective change to how they derive best value from service provision, which benefited both the council and the supplier.
