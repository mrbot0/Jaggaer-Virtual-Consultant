text: With the ability to invite other evaluators to contribute, they can aggregate all information and build on what they’ve learnt going forward for the next generation of contracts. “The functionality of the software makes it open to a wider audience participation,” she continued, “so we can involve other stakeholders, and, who knows, even garner the experience of the recipients one day – the citizens themselves.”
