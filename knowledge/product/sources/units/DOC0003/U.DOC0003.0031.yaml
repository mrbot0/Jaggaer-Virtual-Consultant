text: “East Ayrshire Council are the lead authority on a collaborative C1 Waste Management Contract with South Ayrshire Council” said Tommy. “So it made perfect sense to share scorecard and supplier contract performance information. Also, after having conducted some analysis of the contract registers of both Councils, it was identified that we were using the same suppliers, contractors and service providers for very similar contracts.
