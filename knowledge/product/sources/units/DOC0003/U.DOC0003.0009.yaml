text: Whether in the public or private sector, the management, control and value tracking of co ntracts and the suppliers that deliver on them is an essential contributor to the performance of a business. As both councils experienced, it is a continuous and often repetitive task which, without a systemised and automated approach, can be time- consuming and resource-heavy.
