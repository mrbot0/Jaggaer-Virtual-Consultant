text: South Ayrshire Council (SAC) and East Ayrshire Council (EAC) are two local authorities lying in the southwestern corner of Scotland. Each operates a centralised procurement function, responsible for supervising the strategic spend of up to [importo] million annually on a wide range of goods, services and works, to deliver best value to the local community. SAC delivers services to a population of about 113,000 residents, and employs about 6,000 people to make sure that is done well. East Ayrshire is a diverse area covering some 490 square miles with a population of 122,440 spread over both urban and rural communities. Both procurement functions aim to promote robust, compliant and transparent procurement processes in line with the objectives of Scottish Government, Scotland Excel, and Crown Commercial Service.
