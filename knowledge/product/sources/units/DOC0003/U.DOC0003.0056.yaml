text: “It is definitely beneficial to work as one organisation,” said Lynsey. “Sharing supplier and services information, and employing our aggregated knowledge to make informed decisions, has got to be the sensible way forward, for anyone, especially at a time when we are all focusing on making savings, but still want quality.”
