text: |-
  Attribute: useAsAnMBUChartOfAccountsField | Mandatory (Y/N): N | Description: Indicates whether the custom field is (1) or is not (0) to be added to the MBU Chart-of-Accounts list. When this field is set to 1, you can uniquely assign the custom field to a specific business unit in your organization.
  Note: Setting this field to 0 for a parent custom field also sets it to false for all its children.
