text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: id | Description: Automatically generated supplier ID that JAGGAER Indirect has associated with a supplier. This is the internal ID.
  Attribute: Name | Description: Custom name for the supplier that your organization configured in the supplier profile in JAGGAER Indirect, or the default name for the supplier if no custom name exists.
  Attribute: supplierNumber | Description: Supplier ID that your organization has provided for this supplier in the supplier profile. The SupplierNumber might be used in your ERP system.
  Attribute: Duns | Description: Dun & Bradstreet (DUNS) number for this supplier.
  Attribute: fulfillmentAddressInternalId | Description: Internal ID for the fulfillment center. The fulfillment center address must be active and unique.
  Attribute: fulfillmentAddressId | Description: External ID defined by your organization for this fulfillment center. The fulfillment center address must be active and unique.
  Attribute: fulfillmentAddressThirdPartyId | Description: Unique external ID defined by a third party for this fulfillment center. The fulfillment center address must be active and unique.
  Attribute: contactInfoList | Description: Supplier contact information.
  See section “ContactInfo [PR Export]” below.
  Attribute: businessUnitVendorId | Description: Vendor ID assigned to this supplier by the business unit. Must match an existing vendor ID number in the eProcurement solution.
  Attribute: federalId | Description: Supplier’s TIN or other federal ID number. | Available from version: JA_19_05
