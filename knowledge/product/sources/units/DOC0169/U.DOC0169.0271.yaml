table:
  table: 0
  headers:
    - Condition Filter
    - Description
    - Operators
  rows:
    - - accountingDate
      - Requisition accounting date
      - |-
        Date filtering accepts following operators:
        EQUAL: auction last update date must be equal to provided value
        NOTEQUAL: any auction whose last update date is different from provided value
        GREATER_THAN: any auction whose last update date is equal or greater than provided value
        LESS_THAN: any auction whose last update date is lower or than provided value
        Date value must be expressed in the form
        yyyy-MM-dd
        or
        yyyy-MM-dd HH:mm:ss.SSS Z
        eg. 2012-03-01 or 2012-03-01 12:36:42.535 +0100
    - - creationDate
      - Date and time the requisition was created in the solution
      - ""
    - - lastUpdateDate
      - Date and time requisition information was last updated
      - ""
    - - submitDate
      - Date and time the requisition was submitted
      - ""
    - - prId
      - Unique purchase requisition internal identifier
      - |-
        Internal identifier filter accepts following operators:
        EQUAL: auction status must be equal to provided value
        NOTEQUAL: any auction whose status is different from provided value
        IN: any auction whose status matches one of provided values
        NOT_IN: any auction whose status doesn’t match anyone of provided values
    - - requisitionName
      - Purchase requisition name
      - |-
        These filters accept following operators:
        EQUAL: required field must match exactly provided value (case sensitive)
        NOTEQUAL: required field must be different from provided value
        STARTWITH: required field must start with provided value (case insensitive)
        CONTAINS: required field must contain provided value (case insensitive)
        ENDWITH: required field must terminate with provided value (case insensitive)
        The “requisitionSource”, “requisitionType”, “workflowStatus” and “workflowStep” filters accept also the following:
        IN: required field must be present in provided value list
        NOT_IN: required field must not be present in provided value list
    - - requisitionSource
      - |-
        Source from which the PR was created:
        Automated
        Electronic
        Manual
        Supplier Portal
      - ""
    - - requisitionType
      - |-
        Purchase requisition type:
        Normal
        Consolidated
        Kiosk
      - ""
    - - extReqNumber
      - External Unique number associated with the PR
      - ""
    - - extReqNumber2
      - Second External Unique number associated with the PR
      - ""
    - - workflowStatus
      - |-
        Workflow status of the PR.
        Possible values:
        Completed: The PO has completed the workflow process.
        Pending: The PO has not completed the workflow process.
      - ""
    - - workflowStep
      - Workflow step in which the PR was when exported
      - ""
    - - |-
        validationStatus
        department
      - |-
        Requisition validation requirement.
        0: Unneeded, PR was exported with no validation requirements.
        1: Pending – PR is waiting to complete the validation process.
        2: Completed – PR completed the validation process
        Department associated with the PR.
        Available only over J1P.
      - |-
        Validation status filtering accepts following operation:
        EQUAL: auction status must be equal to provided value
        NOTEQUAL: any auction whose status is different from provided value
        GREATER_THAN: any auction whose status is equal to or greater than provided value
        LESS_THAN: any auction whose status is equal to or lower than provided value
        IN: any auction whose status matches one of provided values
        NOT_IN: any auction whose status doesn’t match anyone of provided values
        Departmant filtering accepts following operation:
        EQUAL: department must be equal to provided value
        NOTEQUAL: any department that is different from provided value
        GREATER_THAN any department that is equal to or greater than provided value
        LESS_THAN: any department that is equal to or lower than provided value
        IN: any department that matches one of provided values
        NOT_IN: any department that doesn’t match anyone of provided values
    - - businessUnit
      - |-
        Unique internal name of the business unit.
        Available only over J1P.
      - |-
        Business unit filtering accepts following operation:
        EQUAL: businessUnit must be equal to provided value
        NOTEQUAL: any businessUnit that is different from provided value
        GREATER_THAN any businessUnit that is equal to or greater than provided value
        LESS_THAN: any businessUnit that is equal to or lower than provided value
        IN: any businessUnit that matches one of provided values
        NOT_IN: any businessUnit that doesn’t match anyone of provided values
