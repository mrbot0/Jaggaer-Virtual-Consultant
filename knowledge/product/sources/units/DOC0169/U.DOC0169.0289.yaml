text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: name | Description: Internal name of the custom field value.
  Attribute: splitIndex | Description: Split sequence number
  Attribute: decDistributionValue | Description: Distribution value for the split. This is a numeric value of up to 15 digits, including up to 4 decimal places.
  Must be a positive number or zero.
  According to specific distribution type, it represents
  AmountOfQuantity: the portion of the quantity to be split.
  AmountOfPrice: the monetary amount to be split.
  PercentOfQuantity and PercentOfPrice: the percentage of the split. For these values, the total of all distribution values must equal 100%
  Attribute: decSplitAmount | Description: Amount to be split for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places.
  For AmountOfPrice splits, the distributionvalue and splitAmount attributes are calculated identically and will always match each other.
  Attribute: decShippingSplitAmount | Description: Amount to be split for shipping for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
  Attribute: decHandlingSplitAmount | Description: Amount to be split for handling for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
  Attribute: decTax1SplitAmount | Description: Amount to be split for tax 1 for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
  Attribute: decTax2SplitAmount | Description: Amount to be split for tax 2 for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
  Attribute: value | Description: Value of the custom field.
  Attribute: Description | Description: Description of the custom field.
  Attribute: columnIndex | Description: Column index number | Available from version: JA_19_04
