text: "Colonne: Attribute | Description | Available from version Attribute: catalogNumber | Description: Unique ID number for a specific stock item in the supplier inventory. Attribute: auxiliaryCatalogNumber | Description: Catalog number. Sometimes used by punchout suppliers to provide additional identification of an item. Attribute: description | Description: Description of the item being purchased. Attribute: productUnitOfMeasureList | Description: Container for description of the unit of measure of the item See section “ProductUnitOfMeasure [PR Export]” below Attribute: productSizeList | Description: Container for description of the size of the item. See section “ProductSize [PR Export]” below. Attribute: Unspsc | Description: Standardized commodity code value for the item, as specified by http://www.unspsc.org (for example, 43191501 – Mobile phones). Attribute: commodityCode | Description: Code assigned to a product, or a group of products, for the purposes of identifying it in international commerce, or commerce in general. CommodityCode is not a specific description of the goods or service. Attribute: productReferenceNumber | Description: Unique ID for hosted products in JAGGAER Indirect, not usually needed by customers. Attribute: productType | Description: Method by which the item was selected. Catalog Form Punchout NonCatalogItem ContractItem Attribute: productClassificationList | Description: Container of item classification. See section “ProductClassification [PR Export]” below. Attribute: supplier | Description: Purchase requisition line supplier information. See section “Supplier [PR Export]” below Attribute: manufacturerInfo | Description: Manufacturer information. See section “ManufacturerInfo [PR Export]” below. Attribute: leadTimeDays | Description: Lead time the vendor requires to fill the order. Attribute: radioNuclide | Description: RadioNuclide number to identify RadioNuclides Attribute: serialNumber | Description: Serial number of the trade-in line item. Valid only if the item is a trade-in. Attribute: assetTagNumber | Description: Company’s unique internal tracking identifier for the trade-in line item. Valid only if the item is a trade-in."
