      - ""
    - - customFieldValueSetList
      - |-
        Container for Custom field value set information.
        See section “CustomFieldValueSet [PR Export]” below
      - ""
    - - splittableFieldSetGroupList
      - |-
        Container for Splittable field Set Group information.
        See section “SplittableFieldSetGroup [PR Export]” below
      - ""
    - - deliveryInfo
      - |-
        Delivery information.
        See section “DeliveryInfo [PR Export]” below
      - ""
    - - clauseList
      - |-
        Container for clause applied to the PR.
        See section “Clause [PR Export]” below.
      - ""
    - - source
      - |-
        Indicates the source from which the PR was created.
        Automated – Automatically created for a PO based upon a form or document type.
        Electronic – Created in cXML or EDI.
        Manual – Created by a user.
        Supplier Portal – Created by a supplier in the portal.
      - ""
    - - budgetDate
      - |-
        Date at which a spend amount can be counted against the budget.
        If a BudgetDate is specified at the header level, all lines will use that date.
        If no BudgetDate is provided at the header or line level in a completed workflow, the workflow completion date is used.
        If no BudgetDate is provided at the header or line level in a pending workflow, the current date/time is used.
      - JA_19_05
