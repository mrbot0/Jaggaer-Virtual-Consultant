  rows:
    - - originalRequestMessageId
      - Unique identifier for the requisition export message which with this PR was saved
      - ""
    - - prId
      - Unique Internal identifier of the purchase requisition
      - ""
    - - validationStatus
      - |-
        Flag describing purchase requisition validation requirement:
        0: Unneeded, requisition was exported with no validation requirements.
        1: Pending – requisition is waiting to complete the validation process.
        2: Completed – requisition completed the validation process
      - ""
    - - workflowStep
      - Workflow step in which the purchase requisition was when exported
      - JA_19_03
    - - lastUpdate
      - Date and time requisition information was last updated
      - ""
    - - requisitionType
      - |-
        Type of PR.
        Normal: the PR is a normal PR (that is, not a consolidated or Kiosk PR).
        Consolidated: The PR has been consolidated with other PRs for a given supplier.
        Kiosk: the PR was generated from a Kiosk order.
      - ""
    - - workflowStatus
      - |-
        Workflow status of the PO.
        Pending: the PR has not completed the workflow process.
        Rejected: the PR was rejected during workflow.
        Completed: The PR has completed the workflow process.
      - ""
    - - externalRequisitionNumber
      - Unique number associated with the PR. Originates outside the eProcurement solution but stored within the solution for cross-referencing.
      - ""
    - - externalRequisitionNumber2
      - Second unique number associated with the PR. Originates outside the eProcurement solution but stored within the solution for cross-referencing.
      - ""
    - - requisitionName
      - Name of the PR
      - ""
    - - description
      - |-
        Description of the PR.
        If the description is longer than 250 characters, it is truncated and saved.
      - ""
    - - Requestor
      - |-
        Information about the person who originally requested the PR validation
        See section “UserProfile [PR Export]” below
      - ""
    - - preparedBy
      - |-
        Information about the person who originally prepared the PR
        See section “UserProfile [PR Export]” below
      - ""
    - - businessUnit
      - Internal name of the business unit with which the PR is associated
      - ""
    - - department
      - Department with which the PR is associated.
      - ""
    - - Priority
      - |-
        Priority of the PR:
        Normal
        High
      - ""
    - - createDate
      - Date and time the PR was generated
      - ""
    - - submitDate
      - Date and time the PR was submitted,
      - ""
    - - accountingDate
      - Accounting date of the PR, also known as the transaction date or the date against which the financial department charges the PR
      - ""
    - - billTo
      - |-
        Billing to information.
        See section “BillTo [PR Export]” below
      - ""
    - - shipTo
      - |-
