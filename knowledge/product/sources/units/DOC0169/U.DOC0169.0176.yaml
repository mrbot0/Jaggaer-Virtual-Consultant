text: |-
  Attribute: decDistributionValue | Mandatory (Y/N): N | Description: Distribution value for the split. This is a numeric value of up to 15 digits, including up to 4 decimal places.
  According to split type, it represents:
  AmountOfQuantity: the portion of the quantity to be split.
  AmountOfPrice: the monetary amount to be split.
  PercentOfQuantity and PercentOfPrice: the percentage of the split.
  For AmountOfPrice splits, the distributionvalue and splitAmount values are calculated identically and will always match each other.
  This information does not appear in the message if there is no split.
