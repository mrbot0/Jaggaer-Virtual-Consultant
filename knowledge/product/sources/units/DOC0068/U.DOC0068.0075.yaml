text: |-
  Colonne: Role | Key Responsibilities
  Role: Project Director | Key Responsibilities: -Outcome of project; Serves as project Champion -Resolution point for policy and process escalations
  Role: Project Manager | Key Responsibilities: -Day-to-day project planning, execution, issues resolution, timeline, resourcing and budget
  Role: Technical Manager | Key Responsibilities: -Implementation of integrations -Advising around issues, risks and decision points -Proactive communication around any technical environment upgrades/outages/clones
  Role: Business Owner/ Process Lead | Key Responsibilities: -Driving business process change -Ensuring implementation is aligned with business processes and policies -Ensuring internally to modify existing business processes and policies in order to achieve project goals
  Role: Trainer | Key Responsibilities: -Develop training strategy -Create training materials -Train End Users
