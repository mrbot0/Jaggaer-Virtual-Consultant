text: |-
  Colonne: Role | Key Responsibilities
  Role: System Administrator | Key Responsibilities: During Implementation: -Hands on; Create and maintain user profiles and roles and approvers; Load data sets -Document process and configuration changes After Implementation: -Troubleshoot with end users -Monitor and review upcoming functional changes to the application and leading and support regression testing for the major releases
  Role: Supplier Manager | Key Responsibilities: - Select and prioritize suppliers to enable with electronic catalogs, and what type of catalog -Responsible for overall supplier relationships, contract negotiation, and driving supplier requirements; contract management for catalogs -Review/approve/provide required information in timely manner -Supplier Enablement Testing
  Role: Testing Lead | Key Responsibilities: -Develop and execute detailed, end-to-end test cases based on implementation business scenario list -Scheduling labs for testing and UAT and inviting the testers -Updating issue log daily
