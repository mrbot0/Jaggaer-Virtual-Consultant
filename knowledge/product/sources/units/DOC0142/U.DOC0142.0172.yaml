text: 43 Fields Used for Trigger Criteria Criteria • Who is buying • Who they are buying for • What they are buying • Who they are buying from • How much they are spending • What budget they are spending against • Which contract or form they are buying from Field/Measure • Requester role, spending limits, department, accounting codes • Prepared by/for, account codes • Item category, commodity code, product flag, catalog/non-catalog item • Supplier, supplier class • Requisition/line amount, requester spending limits • Budget code, amount in budget • Contract/form type or name Requisition Document • Carries many of the fields that trigger workflow • Passes through PR workflow • Configurable
