text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: accountCode | Description: Account code sent to the supplier with the order.
  Attribute: pricingCode | Description: Specifies any special pricing or promotional codes with the order.
  Attribute: contractNumber | Description: Contract number sent to the supplier with the order.
  The eProcurement solution automatically populates the contract number on the PR.
  Attribute: note | Description: Text note for the supplier that is entered in the cart and carried over to POs and PRs.
  If the note is longer than 1000 characters, it is truncated and saved.
  Note: If the Note field is empty, the existing note in the eProcurement solution is not overwritten. Only a populated Note field can overwrite the existing note.
  Attribute: attachments | Description: List of supplier attachments.
  See section “Attachment [PR Export]” above
  Attribute: quoteNumber | Description: Special quote number to be sent to the supplier.
