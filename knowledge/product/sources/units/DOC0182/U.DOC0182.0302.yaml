text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: name | Description: Internal name of the custom field value set.
  Attribute: Label | Description: Display name of the custom field value set
  Attribute: distributionType | Description: Manner in which the funds are to be distributed to each split.
  Valid values:
  AmountOfQuantity: funds are distributed based on a user-specified portion of the quantity
  AmountOfPrice: funds are distributed based on a user-specified monetary amount
  PercentOfQuantity: funds are distributed based on a user-specified percentage of the quantity
  PercentOfPrice: funds are distributed based on a user-specified percentage of the price. The amount of percentage is specified in distribution value attribute.
  Attribute: customFieldValueList | Description: Container for custom field value object.
  See section “CustomFieldValue [PR Export]” below.
  Attribute: customAttributes | Description: Container for custom attribute.
  See section “CustomAttributes [PR Export]” below.
