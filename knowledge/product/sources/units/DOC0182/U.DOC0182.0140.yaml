text: |-
  Attribute: useSystemCatalogPrice | Mandatory (Y/N): N | Description: Indicates whether the catalog price in the eProcurement solution is (true) or is not (false) to be used for the PR line charge.
  If set to false, use the UnitPrice specified in the PR import document. This is the default setting.
  If set to true, use the catalog price in the eProcurement solution.
  If the eProcurement solution catalog does not have a price for the item, use the UnitPrice.
  Required if ProductType is set to Catalog.
