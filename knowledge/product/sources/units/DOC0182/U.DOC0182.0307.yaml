text: "Colonne: Attribute | Description | Available from version Attribute: decDistributionValue | Description: Distribution value for the split. This is a numeric value of up to 15 digits, including up to 4 decimal places. Must be a positive number or zero. According to specific distribution type, it represents AmountOfQuantity: the portion of the quantity to be split. AmountOfPrice: the monetary amount to be split. PercentOfQuantity and PercentOfPrice: the percentage of the split. For these values, the total of all distribution values must equal 100% Attribute: splitIndex | Description: Split sequence number Attribute: splitAmount | Description: Amount to be split for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places. For AmountOfPrice splits, the distributionvalue and splitAmount attributes are calculated identically and will always match each other. Attribute: shippingSplitAmount | Description: Amount to be split for shipping for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places Attribute: handlingSplitAmount | Description: Amount to be split for handling for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places Attribute: tax1SplitAmount | Description: Amount to be split for tax 1 for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places Attribute: tax2SplitAmount | Description: Amount to be split for tax 2 for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places Attribute: discountSplitAmount | Description: Discount split amount. This is a numeric value of up to 15 digits, including up to 4 decimal places. This information does not appear in the message if there is no split."
