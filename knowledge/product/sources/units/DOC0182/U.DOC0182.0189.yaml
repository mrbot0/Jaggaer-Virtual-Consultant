text: |-
  Attribute: splitAmount | Mandatory (Y/N): N | Description: Amount to be split for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places.
  For AmountOfPrice splits, the distributionvalue and splitAmount values are calculated identically and will always match each other.
  This information does not appear in the message if there is no split.
