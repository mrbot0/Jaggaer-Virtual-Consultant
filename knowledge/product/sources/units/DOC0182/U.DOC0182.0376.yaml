text: |-
  Attribute: status | Mandatory (Y/N): Y | Description: Status of the validation request.
  When structure is defined at global header level, it can assume following value:
  Approved: all requisition elements passed validation
  Rejected: all requisition elements failed validation
  Returned: one or more requisition elements failed the validation, but at least one element or field succeeded
  When structure is defined at line level, it can assume following value:
  Approved: requisition line passed validation
  Rejected: requisition line failed validation
