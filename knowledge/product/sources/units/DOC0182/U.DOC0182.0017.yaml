text: |-
  The structure of the current document is the following (parte 2/2)
  15. Request data format [PR Validate]: describes the structure of the validation request. The request is composed of sections and every section is composed of fields to be filled. This paragraph specifies which fields are mandatory and those that can be omitted.
  16. Behavior [PR Validate]: describes how the web service processes the data passed in input
  17. Response Data Format [PR Validate]: describes the structure of the web service response and contains the list of possible error codes
  18. SOAP INTERFACE
  19. Available methods: contains the list of the methods provided by the web service.
  20. WSDL: in this paragraph is attached the JIPurchaseRequisition.wsdl from which the web service has been created and is to be used to generate the client.
  21. Endpoints: available webservice SOAP endpoint URLs
  22. Request samples: sample SOAP requests to invoke the webservice
  23. Error! Reference source not found.
  24. Error! Reference source not found.: describes REST available collections. Allowed calls with allowed parameters and supported HTTP methods
  25. Request Samples: provides some call examples and a POSTMAN collection with an extensive list of runnable calls
  26. Data Types and UI Default Labels: describes the type of the fields and the corresponding label in English language in the platform with the aim to simplify the mapping between the fields visible in the platform and the fields used in the web service.
