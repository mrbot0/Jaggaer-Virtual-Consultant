text: |-
  Attribute: splitIndex | Mandatory (Y/N): N | Description: Split sequence number.
  It must be a positive number from 0 to n-1, where n is the number of CustomFieldValue elements in the CustomFieldValueSet element.
  For example, given a CustomFieldValueSet element with four CustomFieldValue elements, the splitIndex attributes are numbered 0 to 3. The default split index is zero (0).
  This information does not appear in the message if there is no split.
