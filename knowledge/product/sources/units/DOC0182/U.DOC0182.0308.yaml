  rows:
    - - decDistributionValue
      - |-
        Distribution value for the split. This is a numeric value of up to 15 digits, including up to 4 decimal places.
        Must be a positive number or zero.
        According to specific distribution type, it represents
        AmountOfQuantity: the portion of the quantity to be split.
        AmountOfPrice: the monetary amount to be split.
        PercentOfQuantity and PercentOfPrice: the percentage of the split. For these values, the total of all distribution values must equal 100%
      - ""
    - - splitIndex
      - Split sequence number
      - ""
    - - splitAmount
      - |-
        Amount to be split for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places.
        For AmountOfPrice splits, the distributionvalue and splitAmount attributes are calculated identically and will always match each other.
      - ""
    - - shippingSplitAmount
      - Amount to be split for shipping for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
      - ""
    - - handlingSplitAmount
      - Amount to be split for handling for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
      - ""
    - - tax1SplitAmount
      - Amount to be split for tax 1 for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
      - ""
    - - tax2SplitAmount
      - Amount to be split for tax 2 for the line item. This is a numeric value of up to 15 digits, including up to 4 decimal places
      - ""
    - - discountSplitAmount
      - Discount split amount. This is a numeric value of up to 15 digits, including up to 4 decimal places. This information does not appear in the message if there is no split.
      - ""
    - - customFieldValueList
      - |-
        Container for custom field value object.
        See section “CustomFieldValue [PR Export]” above
      - ""
