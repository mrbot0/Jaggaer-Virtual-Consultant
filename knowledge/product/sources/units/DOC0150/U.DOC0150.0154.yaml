text: |-
  Lesson 4: Linking Commodity Code s and Custom Fields to Items
  1. Enable the linking of custom fields to a commodity code in item master items:
  2. Navigate to Contracts > Item Master Management > Configure Item Master Settings .
  3. Click the Configuration tab.
  4. Select the Enable Custom Field / Commodity Code Link checkbox to enable the setting.
  5. Select GL Code as the custom field.
  6. Add GL Code values to the toothbrush item master item.
  7. Navigate to the toothbrush item master item. The GL Code field should now appear below the commodity code.
  8. Add a few GL Code values and set a default.
  9. See how these codes are brought into the requisition:
