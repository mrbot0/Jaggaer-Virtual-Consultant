text: "JSON response message including created token. The following fields are defined access_token: the opaque token to be used for invoking the J1P API expires_in = the token TTL (in mseconds) refresh_expires_in = refresh_token = token_type = Bearer [segreto] = session_state = scope = Return Codes o 200 token created successfully o 400 wrong or missing data o 401 Unauthorized request (i.e. , the provided credentials are invalid)"
