text: The purpose of Jaggaer ’s ‘PaaS integration ’ is to provide a set of to ols and technique s for partners to integrate to custom applications while providing a secure, seamless and efficient experience for their users as they naviga te between Jaggaer and the custom app lications . The aim of this document is to describe Jaggaer ’s ‘PaaS integration ’ model to manage the customer specific requirements using APIs and W ebhooks provided by the JAGGAER ONE platform.
