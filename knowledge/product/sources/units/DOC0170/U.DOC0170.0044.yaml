text: JAGGAER ONE platform (J1P) Public APIs enable the custome rs to integrate third -party systems with Jaggaer application s, to transfer the data from Jaggaer to the external system (customer ERPs), to transfer data from external systems to Jaggaer platform and for custom UI driven integrations developed by Jaggaer p artners. A webhook is a lightweight API that powers one -way data sharing. In conjunction with Public APIs , they enable applications to share data and functionality, and turn the web into something greater than the sum of its parts. Jaggaer is continually w orking to enhance the webhooks to manage customer specific requirements over the Webhooks integration.
