text: "The request parameters are encoded in the URI query: ▪ response_type – Set to code to indicate an authorization code flow. ▪ Scope – Used to specify the scope of the requested authorization in OAuth. The scope value OpenID signals a request for OpenID authentication and ID token. ▪ client_id – The client identifier of the external system at the OP. ▪ state – Opaque value set by the RP to maintain state between request and callback. ▪ redirect_uri – The RP callback URI for the authentication response."
