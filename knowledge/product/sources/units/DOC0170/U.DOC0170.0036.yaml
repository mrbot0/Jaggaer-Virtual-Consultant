text: A Jaggaer partner would be able to leverage the PaaS integration to build a custom integration that allows a buyer to select an RFQ on a Jaggaer core app , push object data to an external web UI pa ge where the user may review it along with data from other customer applications, add details required before triggering another customer app , and then confirm the integration execution results back to t he Jaggaer core app.
