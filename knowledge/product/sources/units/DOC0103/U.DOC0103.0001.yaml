text: "&lt;strong style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt;Business Card Policy&lt;/strong&gt; &lt;br style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt; &lt;br style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt; &lt;span style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt;The following personnel are eligible for business cards:&lt;/span&gt; &lt;br style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt; &lt;ul style=&quot;font-size:13px;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;background-color:#ffffff;&quot;&gt; &lt;li style=&quot;font-size:1em;&quot;&gt;executive-level employees&lt;/li&gt; &lt;li style=&quot;font-size:1em;&quot;&gt;manager-level employees&lt;/li&gt; &lt;li style=&quot;font-size:1em;&quot;&gt;professional staff (exempt)&lt;/li&gt; &lt;li style=&quot;font-size:1em;&quot;&gt;sales executives and account managers&lt;/li&gt; &lt;/ul&gt; &lt;strong style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt;Identification and Title&lt;/strong&gt; &lt;br style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt; &lt;br style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt; &lt;span style=&quot;font-family:'Segoe UI', 'Open Sans', Verdana, Geneva, Arial, Helvetica, sans-serif;font-size:13px;background-color:#ffffff;&quot;&gt;On business cards, individuals should be identified by the official title assigned to them upon being hired."
