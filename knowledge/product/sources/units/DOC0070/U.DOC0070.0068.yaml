      - Date of Last Content/List Price Update
      - Date when the content and/or public price (List Price) was last updated for this catalog - Note that this date value is color coded. As the shades change from green to yellow to orange to red, it indicates progressively old data. Typically, for red shaded rows, you will find that a 'Support Ticket is in Progress' as our Support team is working with the supplier to have them update their catalog
