      - The Science Catalog
      - These suppliers' product offerings are available with the license of the Science Catalog or individually via Content Packs, in accordance with SciQuest's agreements with each supplier and as provided by each supplier. Products will be enabled with the List Price provided by the supplier.
    - - null
      - Premium Hosted Catalogs
      - Catalog content, client-specific pricing and product availability links (where available and as provided by the supplier) for Premium Hosted Catalog suppliers are available individually via Content Packs and are subject to approval by each supplier.
    - - null
      - Punch Out Enabled
      - These suppliers' product offerings are available individually via Content Packs through a "punch-out" integration from SelectSite to the suppliers' web sites, in accordance with SciQuest's agreements with each supplier and as provided by each supplier.
