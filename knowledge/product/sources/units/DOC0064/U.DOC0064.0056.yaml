text: |-
  Colonne:  |  | UIT (Test Environment) | Production Environment
  Preparation
  1. Prepare Contract Party Import Template (for suppliers needed for contracts. Use Precise Supplier Name) | UIT (Test Environment): Small Sample | Production Environment: Complete file
  2. Prepare Contract Import template with Precise Supplier Name; no JAGGAER ID # (yet); and, precise contract attachment name | UIT (Test Environment): Small Sample | Production Environment: Complete file
  3. Move test sample of Contract Attachment Files to TEST FTP Site | UIT (Test Environment): Small Sample
  4. Move Contract Attachment Files to PRODUCTION FTP Site | Production Environment: All Contract Attachments
  Execution
  5. Perform Contract Party Import into JAGGAER | UIT (Test Environment): Small Sample | Production Environment: Complete file
  6. Export Suppliers from JAGGAER to obtain the JAGGAER Supplier ID# | UIT (Test Environment): Select list of Sample Suppliers | Production Environment: All Suppliers (in network with contract party type = 'supplier')
  7. Execute a vLookup on Supplier Name from Export to pull in the JAGGAER Supplier ID# into the Contract Import Template | UIT (Test Environment): n/a | Production Environment: Y
  8. Validate Contract Import Template | UIT (Test Environment): Y | Production Environment: Y
  9. Correct any errors | UIT (Test Environment): Y | Production Environment: Y
  10. Perform Contract Import | UIT (Test Environment): Y | Production Environment: Y
