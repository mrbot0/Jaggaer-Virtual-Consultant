      - "Create Template and Clauses 1. Create a Custom Field 2. Add custom field to contract type 3. Load the Unilateral Clause & Finalize 4. Load the Mutual Clause & Finalize 5. Create Alternative Language based on Custom Field 6. Load Template & assign it to a Contract Type. Open draft template and pull in the Alt Language Clause 7. Finalize Template 8. Create Contract using the template NOTE: For clauses that have a numbering scheme that needs to changed based on the numbering scheme within the template, those clauses must be set up in Word with the exact same style formatting as the template so that the numbers will change as necessary. This is a Word feature, not a TCM function."
