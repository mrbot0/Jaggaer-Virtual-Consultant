text: "&lt;p style=&quot;margin:0px 0px 1em;color:#000000;font-family:Verdana, Geneva, sans-serif;font-size:12px;font-style:normal;font-variant-ligatures:normal;font-variant-caps:normal;font-weight:normal;letter-spacing:normal;orphans:2;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration-style:initial;text-decoration-color:initial;&quot;&gt;&lt;strong&gt;***These Instructions are for the Users filling out the form***&lt;/strong&gt;&lt;/p&gt; &lt;p style=&quot;margin:0px 0px 1em;color:#000000;font-family:Verdana, Geneva, sans-serif;font-size:12px;font-style:normal;font-variant-ligatures:normal;font-variant-caps:normal;font-weight:normal;letter-spacing:normal;orphans:2;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration-style:initial;text-decoration-color:initial;&quot;&gt;&lt;strong&gt;&lt;/strong&gt;Relocating to a new area can be a challenging and stressful experience. To address new hire relocation concerns, departments and new hires need expert information and proper planning to make the move smooth and satisfying.&lt;/p&gt; &lt;p style=&quot;margin:0px 0px 1em;color:#000000;font-family:Verdana, Geneva, sans-serif;font-size:12px;font-style:normal;font-variant-ligatures:normal;font-variant-caps:normal;font-weight:normal;letter-spacing:normal;orphans:2;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration-style:initial;text-decoration-color:initial;&quot;&gt;&lt;/p&gt; &lt;p style=&quot;margin:0px 0px 1em;color:#000000;font-family:Verdana, Geneva, sans-serif;font-size:12px;font-style:normal;font-variant-ligatures:normal;font-variant-caps:normal;font-weight:normal;letter-spacing:normal;orphans:2;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration-style:initial;text-decoration-color:initial;&quot;&gt;&lt;span style=&quot;color:#ff0000;&quot;&gt;Use this form to request relocating your office.&lt;/span&gt;&lt;/p&gt;"
