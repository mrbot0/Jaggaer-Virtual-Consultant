    - - "Description / Trigger(s):"
      - Automated step that returns the requisition back to the user if there's more than one Company specified.
      - Automated step that returns the requisition back to the user if it's a direct order and they do not have an attachment.
      - Automated step that returns the requisition back to the user if it's a blanket order and they do not have an attachment.
      - Automated step that sends the requisition to CostPoint to confirm that valid chart fields are being used.
      - Manual approval step which triggers for all Indirect requisitions. Approver is based on Reports To.
      - Manual approval step which triggers for all Indirect requisitions for certain commodities. Approval is based on the commodity code(s) used.
      - Manual approval step which triggers for all Direct requisitions for all dollar amounts when there is no approver for the given Project. Routes to system admins.
      - Manual approval step which triggers for all Direct requisitions for all dollar amounts. Approval is based on the Project code(s) used. Enable Automatic Approvals.
      - Manual approval step which triggers if the AP Review step doesn't have an approver.
      - Manual approval step which triggers for all Indirect requisitions over [importo]k. Approvers are based on the Org code(s) used. For direct would be for non-reimbursable PRs (based on Org) only regardless of dollar amount.
      - Manual approval step which triggers for all Indirect requisitions over [importo]k. Approvers are based on the Org code(s) used. ADW by Approver (about 4 approvers)
      - Manual approval step which triggers for all Indirect requisitions over [importo]k.
      - Manual approval step which triggers for all non-catalog orders over [importo]k or for all direct orders.
      - For all requisitions to check accounting structure.
      - Manual approval step which triggers for all PO change order requests. Routes to Procurement who can then update the PO.
      - Automated step that turns the Requisition into a Purchase Order, moving it into PO workflow. Does not trigger for PO Change Order Requests.
