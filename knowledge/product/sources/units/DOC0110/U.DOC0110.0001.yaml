text: "&lt;p style=&quot;text-align:center;&quot;&gt;&lt;img&gt;&lt;/p&gt; &lt;p style=&quot;text-align:center;&quot;&gt;&lt;/p&gt; &lt;p style=&quot;text-align:center;&quot;&gt;&lt;span style=&quot;font-size:large;&quot;&gt;Service Requests for both Voice (telephone) and Data (network access) are submitted using this Telephone Service Request form.&lt;/span&gt;&lt;/p&gt; &lt;p style=&quot;text-align:center;&quot;&gt;&lt;strong&gt;&lt;em&gt;&lt;span style=&quot;font-size:small;&quot;&gt;Service Order completion is typically 5 business days, after receipt by Network Services. &lt;/span&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;&lt;em&gt;&lt;span style=&quot;text-decoration:underline;font-size:large;color:#6600ff;&quot;&gt;Please use this from to:&lt;/span&gt;&lt;/em&gt;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Add New Telephone Service&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Change Telephone Service&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Move Telephone Service&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Remove Telephone Service&lt;/strong&gt;&lt;/li&gt; &lt;/ul&gt;&amp;nbsp; &lt;table style=&quot;background-color:#ffffcc;&quot;&gt; &lt;tbody&gt; &lt;tr&gt; &lt;td width=&quot;200px&quot;&gt;Please call the IT Help Desk at: (919) 659-2100&lt;br&gt;&lt;a href=&quot;mailto:[email]&quot;&gt;[email]&lt;/a&gt;&lt;br&gt;&lt;br&gt;&lt;a href=&quot;http://sciquest.com&quot; target=&quot;_blank&quot;&gt;Live Chat&lt;/a&gt;&lt;/td&gt; &lt;td width=&quot;200px&quot;&gt;Monday - Friday&lt;br&gt;7:30 a.m. - 8:00 p.m.&lt;/td&gt; &lt;/tr&gt; &lt;/tbody&gt; &lt;/table&gt;"
