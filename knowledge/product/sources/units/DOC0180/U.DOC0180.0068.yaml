text: |-
  Colonne: Attribute | Description
  Attribute: statusCode | Description: Import response result code.
  200 - The request was processed successfully in its entirety with no warnings or errors.
  201 - The custom field was imported successfully, but one or more warnings were generated. The warnings are included in the response.
  Any other code indicates an import failure. For instance:
  403 – Item master import failed because the customer is not configured for integration traffic on Jaggaer Indirect platform.
  408 - The request could not be processed because the server timed out while waiting for the request
  500 - The request could not be processed due to a transient error.
  Attribute: statusText | Description: General import response result description
  Attribute: errors | Description: List of the common HTTP failure errors that might be generated during a custom field import.
  See section ItemMasterRef [Item Master Import method]
  Attribute | Description
  itemMasterCreationStatus | See section ItemMasterCreationStatus [Item Master Import method]
  error | Zero or more Error
  See section Error [Item Master Import method]
  ItemMasterCreationStatus [Item Master Import method]
  Attribute | Description
  value | Current status of the item master in the workflow.
  Possible values:
  Draft
  Internal Review
  External Review
  Pending Approval
  Pending Signature
  Executed: Future
  Executed: In Effect
  Executed: Expired
  Executed: Superseded
  Executed: Suspended
  Complete
  Terminated
  Archived
  result | Indicates whether the creation of the item master was a success or failure.
  Error [Item Master Import method]
