text: |-
  Colonne: Code | Description
  Code: 0 | Description: Provided data was successfully received and used to try creating objects.
  That means that data is formally correct, but to know if operation really successes or failed it is necessary to analyze other response part.
  Code: 2 | Description: Operation was not completed due to error in provided data.
  Code: -996 | Description: Invalid SOAP Request Object (SOAP Request doesn’t match web service definition or request contains information that are not compliant with instance configuration or user permission)
  Code: -997 | Description: Unauthorized Method (Web Service method isn’t configured to be executed)
  Code: -998 | Description: Unable to acquire lock (Web Service is configured to serialize different call coming from a same client and it hasn’t been able to acquire lock to satisfy request for configured timeout)
  Code: -999 | Description: Generic exception
