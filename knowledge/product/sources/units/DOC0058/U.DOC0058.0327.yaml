text: "Concepts: Your organization is allowed to map your commodity codes with those used by JAGGAER and its suppliers. Hosted and Punch-out items are each given a classification in the system based on UN/SPSC categories. If your organization currently uses commodity codes, then the mapping functionality allows you to “match” each of the JAGGAER categories to a commodity code. By setting up the mapping, the commodity code field is auto-populated."
