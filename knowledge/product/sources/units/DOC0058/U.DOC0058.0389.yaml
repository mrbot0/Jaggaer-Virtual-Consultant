text: Due to the complexity of modifying Purchase Orders, business policies should be put in place to minimize the use of Change Orders. It is highly recommended that the Change Order process be managed by Purchasing, with Purchasing reviewing, approving and completing the Purchase Order (Change Order) modifications.
