text: "Concepts: Suppliers enabled during your implementation will provide items via an electronic catalog. The catalog can either be in a hosted or punch-out format; each offers unique features to meet your organization’s needs. Your implementation team will discuss the benefits of each with your organization. When identifying the initial suppliers for go live consider your suppliers who have the highest volume and spend and ensure all verticals are covered to meet the needs of each end user group at go live."
