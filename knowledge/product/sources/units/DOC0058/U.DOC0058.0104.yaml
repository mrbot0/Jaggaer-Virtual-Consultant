text: "Concepts: Contract Manager Module of Spend Direct Enterprise provides a centralized repository for electronic contracts. This module integrates with the e-procurement process to improve contract visibility, tracking and analysis. End users search contracts and view key information about them, reference contract numbers on requisitions, purchase orders, and invoices, and can choose to apply special contract pricing to items in their shopping carts. Contract owners, or other stakeholders, can be notified of key contract dates and financial milestones to more efficiently manage their contracts."
