text: "Concepts: Configurations can be made in the site to control what your users are seeing in the Marketplace and to identify key relationships with your suppliers. Suppliers can be classified and given preferred positioning in product search results. In addition, your organization can have personalized control of who has access to procure certain items in the system. Some configurations are only available if your Marketplace is using a specific catalog type. If restrictions and supplier preferences are needed, discuss them with your implementation team."
