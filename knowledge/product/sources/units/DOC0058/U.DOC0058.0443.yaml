text: Fiscal Year End is June 30th. Invoice cutover has been defined by the Organization as June 15th to July 15th. Fiscal year Invoice workflow will be enabled during this period to ensure that goods not delivered/services not performed until after June 30th will be charged/credited to next year’s budget while charges/credits for goods and services on or before June 30th are applied to the current Fiscal Year.
