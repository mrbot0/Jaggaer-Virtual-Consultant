text: Consideration There are times when an approver may want to consultant with someone else in the organization prior to approving the requisition. The forward functionality in the workflow process allows the approver to send the document to another individual for review. When a document is forwarded the original approver relinquishes approval permission and the new approver assumes this permission. The new approver is recorded in history.
