text: Organizations may choose to allow Requisition processing for New Fiscal Year orders and “hold” the resulting Purchase Order until the Fiscal Year rollover is complete. New Fiscal Year Requisitions are processed, however the resulting Purchase Order is held prior to the revision stage (or “Purchase Order Create” for Banner).
