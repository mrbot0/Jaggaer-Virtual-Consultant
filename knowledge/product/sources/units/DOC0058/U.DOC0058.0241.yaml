text: The overall goal of the invoicing process in the Marketplace is to help your organization identify invoices that are payable. This goal is achieved through defining tolerances at the organization level or at the supplier level. In the cases where the invoice is within tolerances, or it matches the Purchase Order and the receipt, the system automatically flags the invoice as being payable or OK to Pay. There is limited interaction from the AP Staff.
