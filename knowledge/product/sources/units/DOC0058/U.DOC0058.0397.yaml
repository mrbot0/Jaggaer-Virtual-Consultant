text: |-
  Recommendation 1: Purchasing modifies POs manually in both JAGGAER Marketplace and ERP (JAGGAER recommended)
  1. Valid Change Order requests will be completed on the Marketplace and the ERP by modifying the referenced Purchase Order accordingly in both systems. For the Marketplace PO:
  2. Modifications are made/saved on the Marketplace PO
  3. The “Finalize Revision” Action is invoked, creating a Marketplace PO revision.
  4. Once the Purchase Order modifications have been completed, the Change Order Requisition is approved/completed.
