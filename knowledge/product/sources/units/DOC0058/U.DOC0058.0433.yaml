text: This requires the “Auto-populate Accounting Date” parameter to be enabled on the Requisition document. Enabling this parameter will automatically populate the Accounting Date on the Requisition with the date it was submitted. If not already enabled, this parameter can be turned on at the start of the “Shut Down” period by finalizing and activating a new document version.
