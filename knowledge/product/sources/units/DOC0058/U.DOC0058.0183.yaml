text: The Purchase Order Workflow are automated system steps that are used to send the Purchase Order to the vendor as well as to export the Purchase Order Data to the ERP if necessary. There may also be steps for error handling and for Purchase Order Revisions. The focus during implementation is to define workflow for Marketplace requisitions.
