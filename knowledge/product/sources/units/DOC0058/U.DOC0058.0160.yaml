text: "Concepts: Once a cart is submitted in to workflow and the approval process is complete, a purchase order is created. You can determine what this purchase order ‘screen’ looks like, which in most cases is very similar to the cart view. An organization may also determine a numbering scheme for their purchase orders and/or p-card orders. As part of the Marketplace setup process, you are allowed to configure the purchase order that is faxed or emailed to a supplier. A purchase order can be set up to be used for all suppliers that receive purchases orders via fax or email or for a specific supplier."
