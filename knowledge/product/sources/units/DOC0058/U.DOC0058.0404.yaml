text: 1. The end user works with the identified suppliers to obtain a quote for their item (s) outside of the marketplace. Once the supplier is identified, the end user logs into the Marketplace to place a non-catalog order to the supplier of their item (s). The quotes that were obtained can be attached as internal attachments and an internal note saying that the attachments are other supplier quotes. The quote for the order is attached as an external attachment along with an external note to the supplier.
