text: "Concepts: Each user who needs access to the Marketplace is assigned a unique user profile. Users log in to the Marketplace using a URL in a standard web browser. Or, depending on the integrations that are in scope for your project users log in by clicking a link on a portal within your organization. The user is also assigned roles which determine the level of access he or she has once they login to the site. Roles are created within the Marketplace to manage users with similar permissions. The JAGGAER Marketplace allows users with the correct permissions to save commonly used information to their profile or to change their personal information and preferences."
