text: Workflow is configured to route all requisitions without a vendor or vendors who have this supplier name to Purchasing for review. Purchasing conducts the bidding process outside of the Marketplace and determines the vendor that will provide the goods or services. Purchasing updates the supplier and price on the requisition and the requisition routes through workflow for financial approval.
