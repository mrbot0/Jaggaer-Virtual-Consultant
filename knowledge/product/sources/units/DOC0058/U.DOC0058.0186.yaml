text: In other cases, it may verify that certain types of items (such as radioactive or other hazardous items) that are ordered through the system follow the correct approval process based on your business process. Certain organizations require the purchasing department to approve all orders sent out, while other organizations may have departmental approval only or special handling based on line items or the amounts.
