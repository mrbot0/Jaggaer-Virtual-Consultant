text: |-
  Solution Configuration
  1. Do you have users who shop and complete requisitions for different departments?
  2. Will your users be allowed to pay for their order with a p-card?
  3. Have you decided what your MBUs are going to be?
  4. Will you be controlling order visibility by MBU?
  5. Will centralized purchasing administer the Business Units or will each Business Unit have their own administrator?
  6. Should users have the ability to select from all the accounting codes in the Marketplace or should they only select from the ones to which they have access?
