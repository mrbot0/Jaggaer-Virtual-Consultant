text: 1. Clients can use their JAGGAER Marketplace to procure services like consulting, maintenance services, or printing. The services that are procured may be performed by suppliers that are external to the organization but there are also instances where the services needed may be performed by an internal department in the organization. Examples of internal service requests are printing, catering, IT or maintenance requests.
