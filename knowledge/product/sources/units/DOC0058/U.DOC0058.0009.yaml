text: Part of developing site’s identity includes the organization message, marketplace contact information, and organization logo. These will all display on the homepage. A logo can also be displayed on the log in page. In addition, the organization message provides an excellent way to send a message to users regarding the Marketplace, its suppliers, or any information that is relevant to them.
