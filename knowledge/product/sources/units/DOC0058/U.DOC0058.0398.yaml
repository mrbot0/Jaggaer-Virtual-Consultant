text: |-
  Recommendation 2: Purchasing modifies PO in JAGGAER Marketplace. PO revisions are integrated with ERP. This recommendation requires a compatible integration.
  1. Valid Change Order requests will be completed on the Marketplace by modifying the referenced Purchase Order accordingly.
  2. Modifications are made/saved on the Marketplace PO
  3. The “Finalize Revision” Action is invoked with the “Resend to…”ERP PO Export option checked/on.
  4. Once the Purchase Order modifications have been completed, the Change Order Requisition is approved/completed.
