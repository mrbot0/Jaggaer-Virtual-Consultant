text: 'If the @type attribute on the AccountsPayable element is set to WireTransfer, this field is required for the United States. Must be blank for all other countries. Must be blank if the @type attribute on the AccountsPayable element is set to Check or Credit. | Max Length: 9 General / Field Name: Bank Account Number | Description: Account number of the bank account. If the @type attribute on the AccountsPayable element is set to DirectDeposit, this field is required for the United States, and required for all other countries if the AccountNumberType field is set to AccountNumber. If the @type attribute on the AccountsPayable element is set to WireTransfer, and the AccountNumberType field is set to AccountNumber, this field is required for the United States, and for the countries identified in "AccountNumberType, BankAccountNumber, and InternationalRoutingCode Fields" on page 107. Must be blank for all other countries. Must be blank if the @type attribute on the AccountsPayable element is set to Check or Credit. | Max Length: 20 General / Field Name: Iban Bank Account Number | Description: IBAN of the bank account. If the @type attribute on the AccountsPayable element is set to DirectDeposit, this field is required for all countries except the United States. Must be blank for the United States. If the @type attribute on the AccountsPayable element is set to WireTransfer, this field is always required for some countries, and required for other countries if the AccountNumberType field is set to Iban. See "IbanBankAccountNumber Field" on page 109 for the full list of countries for which this field is required. Must be blank for all other countries.'
