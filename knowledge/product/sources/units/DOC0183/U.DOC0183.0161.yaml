type: tabella
text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: distributionValue | Description: Distribution value for the split. This is a numeric value of up to 15 digits, including up to 4 decimal places.
  Must be a positive number or zero.
  According to specific distribution type, it represents
  AmountOfQuantity: the portion of the quantity to be split.
  AmountOfPrice: the monetary amount to be split.
  PercentOfQuantity and PercentOfPrice: the percentage of the split. For these values, the total of all distribution values must equal 100%
  Attribute: splitIndex | Description: Split sequence number from 0 to n-1, where n is the number of CustomFieldValue elements in the CustomFieldValue Set element
  Attribute: splitAmount | Description: Amount to be split for the line item.
  For AmountOfPrice splits, the distributionValue and splitAmount attributes are calculated identically and will always match each other.
  Attribute: customFieldValueList | Description: Container for custom field value object.
  See section “CustomFieldValue [Export]” below.
  Attribute: customAttributeList | Description: Container for custom attribute of this split.
  See section “CustomAttribute [Export]” above.
