text: "The specified shipping method must be present and active for the specified Carrier. Attribute: shippingMethod | Description: Internal name of the shipping method. The specified shipping method must be present and active. Attribute: trackingNumber | Description: Tracking number associated with the receipt Attribute: note | Description: Text note attached to the receipt header. Attribute: flexText1 | Description: Flex text attached to the receipt header. It is an organization-managed, freeform field which can be renamed (in Field Management) and used in whatever way seems appropriate to enables organizations tracking their own custom data elements Attribute: flexPullID | Description: Identifier associated with the flexText field Attribute: attachmentList | Description: Header attachment information. See section “Attachment [Export]” below. Attribute: matchStatus | Description: Matching status of the receipt header with the PO and invoice, per the configured tolerance setting. No Matches- The receipt header does not match. Fully Matched- The receipt header fully matches. With Forced Matches- The receipt header does not fully match, but it should be paid according to the invoice. Attribute: exchangeRateList | Description: Information on receipt currency. See section “ExchangeRateList [Export]” below. Attribute: workflowStatus | Description: Status of the receipt in workflow. Valid values: Draft Pending Complete Rejected Cancelled"
