text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: catalogNumber | Description: Unique ID number for a specific stock item in the supplier inventory
  Attribute: description | Description: Description of the product available in the receipt line. It explains basic
  Characteristics about the product
  Attribute: quantity | Description: Number of items stocked
  Attribute: stockroomSupplier | Description: Stockroom supplier.
  See section “StockroomSupplier [Export]” below.
  Attribute: fulfillmentCenter | Description: Fulfillment center information.
  See section “FulfillmentCenter [Export]” below.
  Attribute: locationInternalName | Description: Custom ID that the organization has defined for the location of the item in the stockroom.
  Attribute: unitPrice | Description: Price per unit for the item.
  See section “Money [Export]” below.
  Attribute: customItemAttributeList | Description: Container for Custom Item Attribute information.
  See section “CustomItemAttribute [Export]” below.
