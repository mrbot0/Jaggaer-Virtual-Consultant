text: |-
  Colonne: Attribute | Description
  Attribute: statusCode | Description: Create receipt response result code.
  200 - The request was processed successfully.
  400 - The request could not be understood due to syntax errors.
  403 - system understood the request, but server is refusing to fulfill it for some reason.
  408 - The server timed out while waiting for the request
  412 - The precondition given in one or more of the request-header fields evaluated to false when it was tested on the server
  500 - The request could not be processed due to a transient error.
  Attribute: statusText | Description: Text of the status message.
  Attribute: importErrorList | Description: List of error encountered while performing operation.
  See section “Error [Import]” below
