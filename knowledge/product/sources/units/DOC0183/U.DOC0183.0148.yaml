type: tabella
text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: formType | Description: Mechanism for grouping forms.
  Attribute: formTitle | Description: Caption given to the form for easy understanding.
  Attribute: catalogNumber | Description: Catalog number of the form.
  Attribute: description | Description: Description of the item being purchased.
  Attribute: productSizeList | Description: Container for description of the size of the item.
  See section “ProductSize [Export]” below
  Attribute: quantity | Description: Number of items
  Attribute: productUnitOfMeasureList | Description: Container for description of the unit of measure of the item.
  See section “ProductUnitOfMeasure [Export]” below.
  Attribute: unspsc | Description: Standardized commodity code value for the item, as specified by http://www.unspsc.org (for example, 43191501 – Mobile phones).
  Attribute: productClassificationList | Description: Container of item classification.
  See section “ProductClassification [Export]” below.
  Attribute: manufacturerInfo | Description: Manufacturer informatin.
  See section “ManufacturerInfo [Export]” above.
  Attribute: commodityCode | Description: Code assigned to a product pr a group of products for the purposes of identifying it in international commerce, or commerce in general.
  CommodityCode is not a specific description of the goods or service.
  Attribute: contractNumber | Description: Number of the contract associated with the form, as well as the manufacturer.
  Attribute: capitalExpense | Description: Indicates whether the item is (true) or is not (false) a capital expense.
  Attribute: taxable | Description: Indicates whether the manufacturer is (true) or is not (false) taxable.
  Attribute: configId | Description: Configuration identifier, if the form has a different configuration.
  Attribute: configVersion | Description: Version of the current form.
  Every configuration can have many versions.
  Attribute: formFieldList | Description: Container for form field information.
  See section “FormField [Export]” below.
  Attribute: formID | Description: ID of the form.
  Attribute: formElementNumber | Description: Element number of the form.
