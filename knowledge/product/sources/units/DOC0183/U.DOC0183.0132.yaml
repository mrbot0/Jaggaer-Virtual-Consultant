table:
  table: 0
  headers:
    - Attribute
    - Description
    - Available from version
  rows:
    - - lineId
      - Unique ID of the receipt line.
      - ""
    - - lineNumber
      - Position of the line item in the receipt document.
      - ""
    - - addToInventory
      - Indicates whether the item is (true) or is not (false) to be added to stockroom inventory.
      - ""
    - - item
      - |-
        Receipt line item information.
        See section “Item [Export]” below
      - ""
    - - purchaseOrder
      - |-
        Information about Purchase Order associated to the receipt.
        See section “PurchaseOrder [Export]” below.
      - ""
    - - receiptLineStatus
      - |-
        Final status of the receipt line.
        Cost Received
        Cost Cancelled
        Received
        Cancelled
        Returned
        Received / Returned
        Cost Received and Cost Cancelled are valid only for Cost receipts.
        Received, Cancelled, Returned, and Received / Returned are valid only for Quantity receipts.
      - ""
    - - cost
      - |-
        Cost to which the receiptLineStatus applies (either received or cancelled).
        Valid only for Cost receipts.
      - ""
    - - quantity
      - |-
        Quantity of product to which the receiptLineStatus applies, such as 5 items received, 1 item cancelled, or 3 items returned.
        Valid only for Quantity receipts
      - ""
    - - stockedItem
      - |-
        Stocked Item information.
        See section “StockedItem [Export]” below.
      - ""
    - - businessUnit
      - |-
        Business unit with which the receipt line is associated.
        See section “BusinessUnit [Export]” above
      - ""
    - - returnData
      - |-
        Return data information.
        See section “ReturnData [Export]” below.
      - ""
    - - note
      - Text note attached to the receipt line
      - ""
    - - flexText1
      - |-
        Flex text attached to the receipt line.
        The FlexText field is an organization-managed, freeform field which can be renamed (in Field Management) and used in whatever way seems appropriate.
        This field enables organizations to track their own custom data elements along with the default fields that JAGGAER provides.
      - ""
    - - flexText2
      - Second block of flex text attached to the receipt line.
      - ""
    - - flexPullID
      - Identifier associated with the flexText field.
      - ""
    - - attachmentList
      - |-
        Line attachment information.
        See section “Attachment [Export]” above.
      - ""
    - - matchStatus
      - |-
        Matching status of the receipt line with the PO and invoice, per the configured tolerance setting.
        No Matches- The receipt line does not match.
        Fully Matched- The receipt line fully matches.
        With Forced Matches- The receipt line does not fully match, but it should be paid according to the invoice.
      - ""
