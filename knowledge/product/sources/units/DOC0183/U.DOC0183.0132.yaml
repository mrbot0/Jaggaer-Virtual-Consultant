text: "Colonne: Attribute | Description | Available from version Attribute: lineId | Description: Unique ID of the receipt line. Attribute: lineNumber | Description: Position of the line item in the receipt document. Attribute: addToInventory | Description: Indicates whether the item is (true) or is not (false) to be added to stockroom inventory. Attribute: item | Description: Receipt line item information. See section “Item [Export]” below Attribute: purchaseOrder | Description: Information about Purchase Order associated to the receipt. See section “PurchaseOrder [Export]” below. Attribute: receiptLineStatus | Description: Final status of the receipt line. Cost Received Cost Cancelled Received Cancelled Returned Received / Returned Cost Received and Cost Cancelled are valid only for Cost receipts. Received, Cancelled, Returned, and Received / Returned are valid only for Quantity receipts. Attribute: cost | Description: Cost to which the receiptLineStatus applies (either received or cancelled). Valid only for Cost receipts. Attribute: quantity | Description: Quantity of product to which the receiptLineStatus applies, such as 5 items received, 1 item cancelled, or 3 items returned. Valid only for Quantity receipts Attribute: stockedItem | Description: Stocked Item information. See section “StockedItem [Export]” below. Attribute: businessUnit | Description: Business unit with which the receipt line is associated. See section “BusinessUnit [Export]” above Attribute: returnData | Description: Return data information. See section “ReturnData [Export]” below. Attribute: note | Description: Text note attached to the receipt line Attribute: flexText1 | Description: Flex text attached to the receipt line. The FlexText field is an organization-managed, freeform field which can be renamed (in Field Management) and used in whatever way seems appropriate. This field enables organizations to track their own custom data elements along with the default fields that JAGGAER provides. Attribute: flexText2 | Description: Second block of flex text attached to the receipt line."
