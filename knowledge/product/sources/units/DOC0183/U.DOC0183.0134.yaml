type: tabella
text: |-
  Colonne: Attribute | Description | Available from version
  Attribute: catalogNumber | Description: Unique number for a product, also known as a product SKU number.
  Attribute: description | Description: Description of the product available in the ReceiptLine.
  It explains basic characteristics about the product
  Attribute: unitOfMeasure | Description: Packaging description.
  See section “UnitOfMeasure [Export]” below.
  Attribute: productSize | Description: Unit of size for the product.
  See section “Size [Export]” below.
  Attribute: unspsc | Description: Standardized commodity code value for the item, as specified by http://www.unspsc.org (for example, 43191501 - Mobile phones).
  Attribute: commodityCode | Description: Code assigned to a product, or a group of products, for the purposes of identifying it in international commerce, or commerce in general.
  CommodityCode is not a specific description of the goods or service.
  Attribute: productReferenceNumber | Description: Unique ID for hosted products in JAGGAER ONE, not usually needed by customers.
  Attribute: productType | Description: Method by which the item was selected:
  CatalogItem-
  ContractItem- indicates a noncatalog item that is loaded directly onto a contract
  FormItem- a
  InventoryItem- a
  NonCatalogItem- a
  OrgCatalogItem- legacy product type. It has been replaced by VirtualContractItem and VirtualItemMasterItem.
  PunchoutItem- aitem retrieved from punchout supplier
  TradeInItem- a
  VirtualContractItem- indicates a contract item that is linked to a hosted catalog item.
  VirtualItemMasterItem- indicates an item master item that is linked to a contract item, a hosted catalog item, or both.
  Attribute: productFlagList | Description: Classification types that applies to a the product.
  See section “ProductFlag [Export]” below.
  Attribute: supplier | Description: Item supplier information.
  See section “SupplierInfo [Export]” below.
  Attribute: manufacturerInfo | Description: Item manufacturer information.
  See section “ManufacturerInfo [Export]” below.
  Attribute: extendedItemInfo | Description: Container for extended item information.
  See section “ExtendedItemInfo [Export]” below
