  supplierContact: retrieve contact data from supplier information section.
  general: retrieve data from general line item section.
  internal: retrieve data from internal line item section
  external: retrieve data from external line item section
  form: retrieve line item form section information.
  Component Filter: LINE_StockedItem | Description: Extract line stocked item information | Possible values: customItemAttribute: retrieve stocked item custom attribute information.
  Component Filter: LINE_Attachment | Description: Retrieve attachment information defined at line level. | Possible values: N.A.
