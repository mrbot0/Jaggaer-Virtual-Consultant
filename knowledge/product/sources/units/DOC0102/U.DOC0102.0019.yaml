text: 'Nome tecnico: Event Tracking Info | Tipo: HTML | Obbligatorio: No | Sola lettura: false | Note: UserDefinedFieldParamHTML=<TABLE WIDTH = "900" HEIGHT = "35" ALIGN = "center" BGCOLOR = "#F0F8FF" CELLPADDING = "10" BORDER= "1" BORDER-STYLE = "ridge"> <TBODY><TR><TD><Font Color = "BLACK" SIZE = "3"><B><CENTER>Expense Tracking Information</Font Color = "BLACK" SIZE = "3"></B></CENTER><P><P> An <B>Expense Tracking Number </B>is required if multiple funding transactions are used for a meal’s expenses (a requisition combined with at least one additional requisition, recharge, or reimbursement). The Expense Tracking Number is used to accurately monitor the per-person cost for any meals included in the event. The same Expense Tracking Number must be used on each transaction associated with a particular meal.<P> The <B>Expense Tracking Number </B>can be: <UL><LI>The number of the first requisition submitted for the meal (recommended if all meal expenses are orders)<CENTER><B>OR</B></CENTER> <LI>The ERF number if there are reimbursements or recharges associated with the meal <CENTER><B>OR</B></CENTER> <LI>The Meal Expense Tracker (MET) form number if you are using a MET for your event.</LI></UL> The ERF and MET forms are accessed on the Entertainment section of the Financial Affairs Dashboard. Sign in with your Gold password. </TD> </TR> </TBODY> </TABLE> <P><P><P><P> · id=10313 · tipo=userdefined'
