text: 'Nome tecnico: Per Person Costs | Tipo: HTML | Obbligatorio: No | Sola lettura: false | Note: UserDefinedFieldParamHTML=<P><P><P><TABLE WIDTH = "900" HEIGHT = "35" ALIGN = "center" BGCOLOR = "#F0F8FF" CELLPADDING = "10" BORDER= "1" BORDER-STYLE = "ridge"> <TBODY><TR><TD><CENTER><B><FONT Size ="3">Per-Person Meal Costs</FONT Size ="3"></B></CENTER><P><P> The per-person meal cost is calculated by dividing the <B>TOTAL</B> cost of the meal by the number of meal attendees. If there are <B>multiple requisitions (or multiple line items on a single requisition), reimbursements or recharges</B> containing costs for a single meal, be sure to use the <B>sum of all costs</B> pertaining to each individual meal in the per-person meal cost calculation, not just the amount being submitted on this requisition line item.<P><P>The Meal Expense Tracker accessed through the <B><U><A HREF="https://sciquest.com" target="_blank">Financial Affairs Dashboard</A></u></B> provides per-person cost calculations </B></U> for your convenience. Sign in to the Meal Expense Tracker with your gold password. </FONT> </TD> </TR> </TBODY> </TABLE><P><P><P> · id=10309 · tipo=userdefined'
