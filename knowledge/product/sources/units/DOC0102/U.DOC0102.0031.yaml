text: 'Nome tecnico: F&E Documentation and Reporting Requirements | Tipo: HTML | Obbligatorio: No | Sola lettura: false | Note: UserDefinedFieldParamHTML=<TABLE WIDTH = "900" HEIGHT = "35" ALIGN = "center" BGCOLOR = "#F0F8FF" CELLPADDING = "10" BORDER= "1" BORDER-STYLE = "ridge"> <TBODY><TR><TD><Font Color = "BLACK" SIZE = "3"><B><CENTER>ERF, Guest Lists/Flyers and Host Certification</Font Color = "BLACK" SIZE = "3"></CENTER></B><P><P> The <B>ERF (Entertainment Reporting Form) </B>is <B>only </B>required to process out-of-pocket entertainment-related <B>reimbursements and campus recharges</B>. </B><P><P> When a F&E purchase order is used, the event Guest List or Flyer <B>must </B>be attached to the order<B> unless</B> the order is for bulk food purchases.<P><P> If the event is classified as <B>employee morale-building </B>(account code 001250), <B>entertainment </B>(account code 001271), or <B>student outreach </B>(account code 001273), <B>Host Certification must be attached </B>to the order.<P><P> </FONT> </TD> </TR> </TBODY> </TABLE> · id=10303 · tipo=userdefined'
