text: 'Nome tecnico: Top-Level Determination 2 | Tipo: HTML | Obbligatorio: No | Sola lettura: false | Note: UserDefinedFieldParamHTML=<P><P><P><P><TABLE WIDTH = "900" HEIGHT = "35" ALIGN = "center" BGCOLOR = "#F0F8FF" CELLPADDING = "10" BORDER= "1" BORDER-STYLE = "ridge"> <TBODY><TR><TD> <B><CENTER><FONT SIZE="3">Top Level Determination</CENTER></FONT Size ="3"></B><P><P><B> Events requiring top level approval </B>(see determination list directly below) <B>must</B> have the <B>approval included </B>in comments or an email attachment referencing the <B>event name or brief description</B>, the <B>event date</B> and the <B>estimated total cost.</B></P><P><P><UL> <LI> Purchase or serving of alcohol; <LI> Exceeding the per-person meal cost <A HREF="https://sciquest.com" TARGET="_BLANK">(Per-Person Meal Limits)</A>; <LI> Meals provided to a spouse, domestic partner, or family member of host/guest;<LI> Event where cash contributions are included in the cost;<LI> Meals provided to employees as part of a morale-building activity, including retirement and recognition receptions, etc.;<LI> Tickets provided to prospective donors, employees, or student appointees in connection with an entertainment event.</LI><P></UL> </FONT> </TD> </TR> </TBODY> </TABLE><P><P><P> · id=10311 · tipo=userdefined'
