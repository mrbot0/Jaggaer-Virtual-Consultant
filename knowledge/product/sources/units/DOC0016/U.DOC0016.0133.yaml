text: Yeti also only has a three year warranty. For [importo] I expected a lifetime warranty. Finally, while the 40 is a massive thing of beauty, Keep in mind that when you fill it up, it can be extremely heavy. I bought a little two wheel cart for it. Last gripe, the cooler that is 1/8th the cost comes with two bottle openers attached and a dry pocket to store things. Yeti has these as options and it will cost you about another [importo]-100.
