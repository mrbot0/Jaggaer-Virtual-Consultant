text: Now I admit that this does not follow the product instructions for “two-to-one” ice to beverage loading but, if I did that there wouldn’t be hardly any room for beverage. The cooler never left the car interior for 56 hours where the ambient temperature was 72 degrees all but nighttime hours when it was high 70’s. It was only opened for 30 seconds at a time to remove two bottles of water.
