text: The Hopper was built for those adventures where you want to grab your gear and go. It’s the original 100% leakproof, ice-for-days portable cooler. And because we used materials found in things like HazMat suits and whitewater rafts, it’s also tough as nails. The Hopper is made in sizes to fit any adventure, whether that’s on a wild river in a kayak or a floatplane trip to remote salmon streams.
