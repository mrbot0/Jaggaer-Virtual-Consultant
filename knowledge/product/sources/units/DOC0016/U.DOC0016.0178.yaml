text: i was looking for a reliable cooler that would fit the rear basket on a standard golf cart, and this one's perfect for my use. a rep at a well known golf store chain tipped me off to this and also told me, that the (way smaller) flip 8 as well as the bigger hopper 30 will fit as well(the latter with some squeezing). i mention this, because this hopper 20 model is currently discontinued, and i'm glad i still found a brand new, authentic piece with all of its paperwork here. as for performance...? it is not my first yeti product and i simply don't think one can find anything better.
