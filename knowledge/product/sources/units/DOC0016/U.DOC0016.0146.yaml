text: 'I bought the YETI Hopper TWO Portable Cooler (30) for a mid-summer drive from Vermont to Florida. I decided it buy it because I needed to keep the contents of my freezer cold for the entire trip. Followed the included instructions exactly: pre-cooled it overnight before I loaded it. Made sure the ice to content ration was 2:1. Filled all air pockets with ice. Pulled the zipper HARD to close it (to make sure it was fully closed). I had to lay it on its side because of the way the car was packed, but I figured that was ok since there were no warnings not to (plus., the zipper still had the "100% Leakproof" tag attached to it). We drove for 12 hours in 90 degree heat. The car was air conditioned and we never opened it once. When we arrived at our destination there was water everywhere! Most of the ice had melted and the water seeped through the zipper. This a YETI? Wow. Not impressed.'
