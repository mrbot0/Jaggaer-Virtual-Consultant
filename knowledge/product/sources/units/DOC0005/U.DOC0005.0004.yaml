text: This course follows the solution -focused content of JAGGAER Advantage Foundations with a deeper dive into the platform initial setup of the site, supplier, administration, sourcing, and user management components. Topics, all centered around implementation of a JA instance, include the instance creation process, user setup, instance -wide data configuration, product specific -data configuration , automation, and reporting. Participants will learn how to work with team member s and the customer to launch a properly configured JAGGAER Advantage site.
