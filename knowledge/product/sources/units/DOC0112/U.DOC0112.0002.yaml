text: You will find separate pages in this wizard where you should complete the following:&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;&lt;span style=&quot;font-size:small;&quot;&gt;Compose a&amp;nbsp;brief message to suppliers, outlining your need and telling them to respond by emailing you their quotes.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span style=&quot;font-size:small;&quot;&gt;Answer questions&amp;nbsp;needed for the approval process.&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span style=&quot;font-size:small;&quot;&gt;&lt;span style=&quot;font-size:small;&quot;&gt;Specify your product and/or service line items (note that there are separate pages for products and services; you can hide whichever is irrelevant).&lt;/span&gt;&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span style=&quot;font-size:small;&quot;&gt;Select your suppliers (if using this process, please request bids from at least 3 suppliers).&lt;/span&gt;&lt;/li&gt; &lt;li&gt;&lt;span style=&quot;font-size:small;&quot;&gt;Submit the form.&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;span style=&quot;font-size:small;&quot;&gt;If you need to see the approval process or status, click the 'Form Approvals' tab at the bottom of the form request wizard.&lt;/span&gt;&lt;/p&gt; &lt;ul&gt;&lt;/ul&gt;
