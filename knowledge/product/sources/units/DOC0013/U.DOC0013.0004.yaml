text: Content includes a look at JAGGAER and how it works with clients and suppliers, a quick dive into the various products that make up the JAGGAER Advantage Suite, an introduction to site administration and configuration, and a quick look at implementation roles and responsibilities. Partici pants will learn about typical use of the solutions and discuss some of the variations that are possible based upon client needs and business processes. This course is typically delivered in eLearning format through JAGGAER University.
