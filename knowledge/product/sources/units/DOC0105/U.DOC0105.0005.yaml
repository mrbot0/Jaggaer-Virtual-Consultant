text: "Nome tecnico: Pocket Map 200 | Campo: Pocket Map | Tipo: HTML | Obbligatorio: No | Gruppo: Product List | Sola lettura: false | Note: Pocket Map · UserDefinedFieldParamHTML=The <b>Pocket Map</b> highlights 35 of our most-visited buildings, provides key fact about the University, and features a transportation map on the reverse side. The map is small in size but big in detail, providing a three-dimensional view of campus buildings. Portable and practical, this map is ideal for a quick orientation for campus visitors. For those with mobile devices, included are QR codes linking you to University Mobile and Transloc (the Cliff shuttle app). The map folds down to 2 1/8&quot; x 3 1/4&quot;, with a full size of 12 1/4&quot; x 6 1/4&quot;. <b>Price - [importo]</b> · id=10031 · tipo=userdefined"
