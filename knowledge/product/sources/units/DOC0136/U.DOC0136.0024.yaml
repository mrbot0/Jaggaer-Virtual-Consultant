text: "Remember: In order to modify a Supplier’s Fulfillment Center the “approver” has to have the “ Manage Supplier Profiles ” permission. If they don’t a process has to be in place (perhaps using the PO Comments) for the approver to notify a User that can update the Supp lier Profile / Fulfillment Center."
