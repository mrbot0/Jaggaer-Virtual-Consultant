text: |-
  To provide your organization with the highest quality technology, JAGGAER will be branded to look and feel like your company website. The following items will be required to brand the JAGGAER instance
  1. Company logo (recommended in .png format)
  2. CLIENT images for JAGGAER homepage
  3. Colors and associated hex codes
  4. Font
