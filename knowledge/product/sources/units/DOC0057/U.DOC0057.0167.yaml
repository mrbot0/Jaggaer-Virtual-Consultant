text: The Sourcing portion of this questionnaire is intended to gather information about how your organization executes Sourcing events. The more we can learn about your business processes and requirements, the better we can tailor JAGGAER configuration to meet your needs. Please answer as many of the following questions as well as you can with as much detail as possible. Keep in mind that the project team will be reviewing this document with you as part of the implementation process.
