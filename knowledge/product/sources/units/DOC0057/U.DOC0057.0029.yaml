text: The Supplier Management portion of this questionnaire is intended to gather information about how your organization manages suppliers today, and how you intend to manage suppliers leveraging JAGGAER in the future. The more we can learn about your business processes and requirements, the better we can tailor the JAGGAER configuration to meet your needs. Please answer as many of the following questions as you can with as much detail as possible. Keep in mind that the project team will be reviewing this document with you as part of the implementation process.
