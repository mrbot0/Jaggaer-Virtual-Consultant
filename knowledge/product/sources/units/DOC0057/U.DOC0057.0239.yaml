text: 1. In the supplier registration process sourcing director allows your suppliers to select a commodity code which corresponds to products / services that you purchase. When creating a sourcing event you can search for suppliers by commodity code selected in their registration. These commodity codes can be specific codes that your organization uses or a standardized list (NAICS , UNSPSC, etc.). If using commodity codes, please provide a list of commodity codes in the spreadsheet below.
