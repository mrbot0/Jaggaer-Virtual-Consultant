text: A system object is any content created, edited and maintained within JAGGAER. System objects may be RFPs, RFIs, projects, auctions, contracts, suppliers, etc. depending on the client’s usage of the system. Suppliers will also select the categories they service or manufacture during the system registration process. Users will then be able to search for suppliers or objects within the system by category.
