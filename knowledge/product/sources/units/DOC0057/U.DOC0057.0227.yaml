text: "1. Sourcing Director allows you to determine which types of events you would like to create. Examples of these are RFI (Request for Information), RFP (Request for Proposal), and RFQ (Request for Quote). Your organization may use these or other names to define your event types. Please the event types that your organization uses below, with a short acronym for each (3 – 7 letters):"
