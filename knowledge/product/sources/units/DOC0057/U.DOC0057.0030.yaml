text: Supplier data management occurs through JAGGAER’s supplier registration and on-boarding process. The supplier registration and on-boarding process provides clients the ability to standardize collection, review, and management of supplier information while accounting for a client’s specific business requirements. A client’s business and process requirements will be incorporated into their Supplier Registration & On-Boarding module through leveraging various system capabilities and configurations. Below is a list of questions to allow JAGGAER to understand your business requirements for supplier data management.
