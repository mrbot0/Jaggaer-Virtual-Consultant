  Role: Data Extract Resource | Resource Name: Technical lead for the Client’s source system(s)
  Knowledge of source system(s) and creation of extract spend and supplier data elements
  Load data extracts to a Secure FTP site
  Role: Functional Subject Matter Experts | Resource Name: Knowledge of supplier base, spend patterns, and political entities
  Will spend majority of time in the reporting tool disseminating data
  Knowledge of overall business process and user buying habits with current suppliers
  Role: Training Lead | Resource Name: Create a training / change management plan
  Play a key role in ensuring the success of initial rollout and ongoing user adoption
