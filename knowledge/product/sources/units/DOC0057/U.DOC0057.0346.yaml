text: "Then develop an initial list of top 20 suppliers who can provide an on-line catalog or website for a set of goods that you purchase. Considerations or drivers may be: Spend, transaction volume, go-live departments, contract status, state mandated contracts, etc. Your Supplier Enablement Consultant will utilize this list to identify your list of potential go-live catalog suppliers."
