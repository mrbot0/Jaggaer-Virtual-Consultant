text: "On Feb 1 2014 Supplier XYZ is considered a small business. On Feb 1 2015 Supplier XYZ loses its small business status. The Client does not send the ‘small business’ supplier status on each transaction line; rather, the small business status is available on the diversity vendor lookup file that the client provides. If small business status is on the diversity vendor lookup file, two situations can occur, and we’d like to know if this type of situation is relevant to you:"
