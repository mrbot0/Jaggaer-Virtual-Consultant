text: "Nome tecnico: fldFormInstructions | Tipo: HTML | Obbligatorio: No | Sola lettura: false | Note: UserDefinedFieldParamHTML=Use this form to submit a request for the purchase of consultant services or maintenance agreements.<br><br> <b>NOTES:</b><br> This request will be routed to your Business Unit's Purchasing Dept. for review prior to a PO being created and sent to the supplier.<br><br> For one-time service requests, use the <b>General Services Request</b> form.<br><br> Fields with <b>bold labels</b> represent required fields.<br><br> <b>When selecting a supplier...</b><br> If the supplier you are looking for is not returned in your search, search for and select <b>NEW SUPPLIER</b>. Then enter as much information as you can provide about the supplier in the Internal Notes section below.<br><br> If you don't know (or don't care) where the service is purchased from, search for and select <b>UNKNOWN SUPPLIER</B>. Purchasing will then do their best to find a source for you. · id=10014 · tipo=userdefined"
