text: This document is intended to show the basic syntax used to create Shared Folder and Dynamic workflow rules and will go through an example PO Workflow document. This will cover a few specific workflow rules, which should give a feel for the types of rules that can be written, but will not cover this aspect in extensive detail as the main goal of this document is only to illustrate basic syntax.
