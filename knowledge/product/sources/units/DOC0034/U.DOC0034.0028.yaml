text: "A single equal sign (=) will not work. 11. <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> : This line indicates the folder that the type of folder being used for approvals is an Explicit Folder. In other words, this rule uses a Shared Workflow folder, which is populated with approvers that have the ability to advance the document to the next step in workflow. 12. </Activity> : Each activity must end with this element. This indicates that the activity stops here."
