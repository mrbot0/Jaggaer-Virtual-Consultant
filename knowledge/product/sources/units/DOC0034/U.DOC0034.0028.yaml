steps:
  - '<Activity name="Missing Distribution"> : The activity starts off with the name. This displays in SelectSite in the activity section.'
  - "<ActivityType>manual</ActivityType> : This activity is manual. This indicates that an approver from the organization must approve this step in order for the document to move on to the next step."
  - '<StepRef name="Missing Distribution" /> : This line shows the Workflow step that is tied to this activity. This activity will cause the step in this field to be triggered.'
  - '<FolderRef name="Missing Distribution" /> : This line indicates the Shared Workflow folder that is tied to the activity, which defines the users that are able to approve the workflow step. In this case the Missing Distribution folder contains the users with approval powers.'
  - "<Rule><![CDATA[ Document.HasInvalidDistribution() == true ]]></Rule> : This section defines the rule for the activity. Rules will always be contained within the <![CDATA[ ]> element."
  - In this case the rule is Document.HasInvalidDistribution() == true.
  - The prefix of this rule is Document. This means that the rule evaluation is for the entire document. Alternately, if a rule contains the prefix "DocLine." the rule evaluates individual line items on the document.
  - The suffix of this rule defines the "object" that is being triggered for the evaluation, in this case HasInvalidDistribution(). This object checks to see if the document is missing distribution information or if it is somehow invalid.
  - The last part of this rule == true says that if the Document.HasInvalidDistribution() evaluation is true that the document will stop at the associated step. If this rule read == false instead, then the document would not stop here.
  - "NOTE: Use of double equals signs (==) is required for this type of evaluation. A single equal sign (=) will not work."
  - "<FolderSelectionRule>ExplicitFolder</FolderSelectionRule> : This line indicates the folder that the type of folder being used for approvals is an Explicit Folder. In other words, this rule uses a Shared Workflow folder, which is populated with approvers that have the ability to advance the document to the next step in workflow."
  - "</Activity> : Each activity must end with this element. This indicates that the activity stops here."
