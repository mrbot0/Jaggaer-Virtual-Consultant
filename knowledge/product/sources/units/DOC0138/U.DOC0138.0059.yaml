text: The FormType names listed within the rule seen below are specific to the organization, so the rule would need to be re-written for other clients. <Activity name="Mixed Order Auto-Return"> <ActivityType>automated</ActivityType> <StepRef name="Mixed Order Auto-Return" /> <FolderRef name="Auto-Return" /> <Rule><![CDATA[([Product.FormType ~ "/NonPO/"] && [Product.FormType !~ "/NonPO/"]) || ([Product.FormType ~ "/NoDistro/"] && [Product.FormType !~ "/NoDistro/"]) || ([Product.FormType ~ "/AutoInv/"] && [Product.FormType !~ "/AutoInv/"])]]></Rule> <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> <Flag>AllowCreateSourcingEvent</Flag> <Attribute name="wfActivitySupportNote"> <AttrValue lang="default">Items that do not create POs cannot be mixed with items that do create POs.
