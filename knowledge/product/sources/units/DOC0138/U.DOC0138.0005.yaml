text: The rule uses basic workflow objects to evaluate whether the document owner (requisitioner) has an assigned HR department of “Chemistry”, and also whether there is a product in the requisition with a Product Type of “radioactive”. If the Owner is both in the department Chemistry, AND (denoted by the &&) there is a radioactive item in the requisition, the requisition will route to the explicit folder noted in the FolderRef section, “Chemistry”. If the user is in the Chemistry department and submits a requisition that does not have a radioactive item, the requisition will not stop at this particular activity.
