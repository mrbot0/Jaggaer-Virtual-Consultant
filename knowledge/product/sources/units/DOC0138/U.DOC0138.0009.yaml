text: The rule uses basic workflow objects to evaluate whether the requisition contains a line item with the Product Type of “Green”. If it does, the requisition will route to the explicit folder called “Purchasing Approval.” If there is not a line item with this product type, the requisition will not stop at this activity for approval.
