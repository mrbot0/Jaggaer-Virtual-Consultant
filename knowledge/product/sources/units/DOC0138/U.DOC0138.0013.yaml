text: This line shows an ADW rule. a. Document. Indicates that this evaluates the entire document. b. RequiresRuleGroupEvaluation shows that an ADW rule is being evaluated. In this case the rule being evaluated is Director Approval. This rule can be found in the Advanced Dynamic Workflow section of workflow configuration. There many rules can be configured under ADW. A document stops here if any one of the ADW rules in the group are true.
