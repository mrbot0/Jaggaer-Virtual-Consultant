text: This calls for a “static” workflow activity where the rules that would trigger an approval are written into the XML code. In the case below, the rule says an item would stop if the user’s requisition total limit is exceeded, OR if their line-item limit is exceeded. Financial Approval can also be used without reference to spending limits – you could direct ALL requests to Financial Approvers by using an “all” rule instead of the one below. <Activity name="Financial Approval"> <ActivityType>manual</ActivityType> <StepRef name="Financial Approval" /> <Rule><![CDATA[(Document.Total > Owner.UserLimit("WfLimitPurchasingReqTotal") || [DocLine.Total > Owner.UserLimit("WfLimitPurchasingReqLine")] || ([Document.Total = 0] && Document.Total = Owner.UserLimit("WfLimitPurchasingReqTotal")))]]></Rule> <FolderSelectionRule>UserSelectedApprover</FolderSelectionRule> <Flag>FinancialApproval</Flag> <Attribute name="wfActivityHelp"> <AttrValue lang="default">User’s requisition or line item purchasing limit exceeded</AttrValue> </Attribute> </Activity>
