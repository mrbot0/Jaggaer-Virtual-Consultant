text: The step that this activity will happen in is the “Department” step, and the shared folder where approvers will be added is the folder named “Chemistry Approvals” (if this is a new workflow step, or new Workflow Folder, you will need to create a shared folder called Chemistry Approvals and add an approver(s) to it – the user will need to have requisition approval permissions in order to be assigned).
