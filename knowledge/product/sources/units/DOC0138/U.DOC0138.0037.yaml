text: This activity would accommodate a similar approval in a different way. It uses ADW; rules created and assigned to the “Director Approval” rule group would be evaluated to determine if the request would need to stop. Rules could be created based on a variety of triggers, and with multiple factors if needed. <Activity name="Director Approval"> <ActivityType>manual</ActivityType> <StepRef name="Director Approval" /> <Rule><![CDATA[ Document.RequiresRuleGroupEvaluation("Director Approval") == true ]]></Rule> <FolderSelectionRule>MultiElementDynamic</FolderSelectionRule> <Attribute name="RuleGroupInternalName"> <AttrValue lang="default">Director Approval</AttrValue> </Attribute> </Activity>
