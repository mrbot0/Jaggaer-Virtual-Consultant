text: The rule group might have a rule that specifies invoices are automatically created for orders from certain suppliers with whom the client has set up this arrangement for faster payment. Other criteria could also be used. Any PO that meets the criteria of a rule in Auto Invoice would be sent to an internal (explicit) folder called Create Invoice, which would run a robot that would create an invoice.
