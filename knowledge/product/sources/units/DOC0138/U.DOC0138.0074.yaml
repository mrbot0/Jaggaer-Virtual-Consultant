text: Next is another automated activity that would occur during Purchase Order workflow. This rule hinges on the values of a couple of custom fields that the organization has created and placed on the PO Document. <Activity name="PO Distribution"> <ActivityType>automated</ActivityType> <StepRef name="PO Distribution" /> <FolderRef name="Distribute PO" /> <Rule><![CDATA[ !(Document.CustomFieldValues("Manual Purchase Order") in {"true"}) && !(Document.CustomFieldValues("Order Category") in {"2 - Confirming - Do Not Distribute"}) ]]></Rule> <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> </Activity>
