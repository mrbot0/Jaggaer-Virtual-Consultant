text: Next, let’s look at an example that uses an Advanced Dynamic Workflow rule evaluation to trigger a notification, not an approval. If the item is radioactive, radioactive minor, controlled, toxin or select agent, a system notification will be sent to any approver named on the Shared Folder called “EH&S Notification.” <Activity name="EH&S Notification"> <ActivityType>notification</ActivityType> <FolderRef name="EH&S Notification" /> <Rule><![CDATA[ [Product.Radioactive = true || Product.RadioactiveMinor = true || Product.HazMat = true || Product.Controlled = true || Product.Toxin = true || Product.SelectAgent = true] ]]></Rule> <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> </Activity>
