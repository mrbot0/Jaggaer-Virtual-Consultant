text: The rule in this activity says if the Supplier ID is blank, the request must be directed to someone who can correct that. Who gets it is managed via a Shared Folder called Missing Supplier Catch. <Activity name="Missing Supplier Catch"> <ActivityType>manual</ActivityType> <StepRef name="Missing Supplier Catch" /> <FolderRef name="Missing Supplier Catch" /> <Rule><![CDATA[[Supplier.ID == ""]]]></Rule> <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> <Flag>AllowCreateSourcingEvent</Flag> <Attribute name="wfActivityHelp"> <AttrValue lang="default">No supplier is specified.
