text: If both those things are true, the requisition goes to an internal folder called “Auto-Reject” which runs a robot (named in the “Workflow Folders” XML file) which rejects the requisition and tells the user it’s because they exceeded their pCard limit. <Activity name="pCard Limit Check"> <ActivityType>automated</ActivityType> <StepRef name="pCard Limit Check" /> <FolderRef name="Auto-Reject" /> <Rule><![CDATA[[DocLine.CreditCardNumber != ""] && Document.Total >= Owner.UserLimit("WfLimitLpoReqLine")]]></Rule> <FolderSelectionRule>ExplicitFolder</FolderSelectionRule> <Attribute name="wfActivityHelp"> <AttrValue lang="default">Your requisition has been rejected because you exceeded your pCard limit.</AttrValue> </Attribute> </Activity>
