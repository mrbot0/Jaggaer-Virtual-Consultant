      precondizioni: []
      passi:
        - n: 1
          verbo: <activitytype>automated</activitytype>
          oggetto: ": This rule will not require a user to approve the step. This means that the step will complete automatically"
          valore: This rule will not require a user to approve the step. This means that the step will complete automatically
        - n: 2
          verbo: <folderref
          oggetto: 'name="Distribute PO" /> : This line may look familiar from the previous activities, but since this step is automated it works a little bit differently. Automated activities do not use a Shared Workflow folder like manual activities. Instead, automated activities take advantage of workflow robots. Robots are what allow automated steps to function without user approval. You can see what robot is being used for this folder under the Workflow Folder Import/Export tab in workflow setup'
          valore: Distribute PO
        - n: 3
          verbo: <rule><![cdata[
          oggetto: '!(Document.CustomFieldValues("Manual Purchase Order") in {"true"}) && !(Document.CustomFieldValues("Order Category") in {"2 - Confirming - Do Not Distribute"}) ]]></Rule>: This rule shows some interesting concepts:'
          valore: Manual Purchase Order
        - n: 4
          verbo: '!(document.customfieldvalues("manual'
          oggetto: Purchase Order") in {"true"}) i. This shows that the rule is looking at a Custom Field value at the document level. ii. The rule is looking to see if the value of the Manual Purchase Order Custom Field has a value of true. iii. Notice the ! in front of this rule. If you see ! at the beginning of any rule, then a document will only stop if that rule IS NOT true. In this case, as long as the Manual Purchase Order is not true, the document will stop here. b. && - When you see two "and" symbols like this (&&) that means that the rule following the preceding rule MUST also be true. This allows customers to require several criteria in order for a document to stop. Many && can be used in a given activity
          valore: Manual Purchase Order
      risultato_atteso: null
