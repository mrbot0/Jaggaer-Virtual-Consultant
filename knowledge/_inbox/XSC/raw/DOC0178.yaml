    extraction:
      label: Status
      technical_name: Status
      type: null
      mandatory_text: ""
      allowed_values: []
      notes: |-
        Indicates the actual status of the contract (that is, where the contract is in the workflow process).
        Valid only if you are creating a new contract.
        Possible values:
        Draft
        Executed
        The default status is Draft.
        If the status is Executed, then the specified startDate and endDate elements determine which executed status applies:
        Executed: Future Contract- The contract is being created before the StartDate.
        Executed: In Effect Contract- The contract is being created between the StartDate and EndDate.
        Completed Contract- The contract is being created after the EndDate.
      section: 2.2.1.2
      source_unit: U.DOC0178.0088
