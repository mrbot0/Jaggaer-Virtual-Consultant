          valore: UPDATE_ADDINFO instead of UPDATE. After an RFQ has moved past RUNNING status, any attempt to use the operation code of UPDATE will still fail
        - n: 5
          verbo: as
          oggetto: noted previously by Luca, any attempt to update data elements that are part of the RFQ Award Type should be in the awardRfxAdditionalInfoList parameter when sent in the request
          valore: null
        - n: 6
          verbo: the
          oggetto: web service implementation needs to add a check and a more informative error message when processing an UPDATE_ADDINFO request if the request includes updates for the data elements of the RFQ Type if the RFQ is in a status after RUNNING (if this is attempted right now, the web service just responds with the same, not very informative error message we are seeing now)
          valore: null
        - n: 7
          verbo: web
          oggetto: service implementation should also check and provide the same, more informative error message if the RFQ is after RUNNING status and the operation code on import is anything other than UPDATE_ADDINFO (after RUNNING status, this is the only valid operation code for import)
          valore: null
        - n: 8
