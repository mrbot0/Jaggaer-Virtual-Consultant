          oggetto: service implementation will also check and provide the same, more informative error message if the RFQ is AWARDED status or later
          valore: null
        - n: 9
          verbo: web
          oggetto: service implementation needs to be updated so that the UPDATE_ADDINFO operation code will handle updates to both the RFQ type data elements and the RFQ Award Type data elements (right now, UPDATE_ADDINFO only tries to save updates to the RFQ Type data elements)
          valore: null
      risultato_atteso: The request that is sent to update the RFQ Award Type data elements after the RFQ has moved past RUNNING status should be sent with an operation code of:UPDATE_ADDINFO instead of UPDATE. After an RFQ has moved past RUNNING status, any attempt to use the operation code of UPDATE will still fail.
