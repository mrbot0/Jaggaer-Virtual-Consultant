    notes: Facts and Figures Brochure · UserDefinedFieldParamHTML=With impressive
      economy, the <b>Facts and Figures Brochure </b>provides some of the most
      commonly requested information about University’s people, schools, and
      resources—including enrollment, faculty, and staff data, as well as
      financial and academic support information. The new design features an
      elegant twenty-page booklet with maps of the Atlanta and Oxford campuses
      tucked inside the back cover. Additionally, Facts & Figures contains a
      list of the University's points of distinction along with updated
      statistical information. <b><font color="red">New Price -
      [importo]</font></b> · id=10015 · tipo=userdefined
