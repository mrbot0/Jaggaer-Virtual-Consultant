  - label: Visitor's Guide
    technical_name: Visitor's Guide200
    type: HTML
    mandatory_text: No
    allowed_values: []
    notes: "Visitor's Guide · UserDefinedFieldParamHTML=The <b>Visitor's Guide</b>
      is an extensive introduction to the University; its campus and the city of
      CollegeTown. It provides helpful and detailed information to newcomers,
      visitors, prospective students and their parents, prospective faculty and
      staff as well as Univ. Healthcare visitors. This guide provides campus
      highlights and its nearby amenities and services. Included in this 8.5 by
      11 inch, full-color booklet is an illustrated, color-coded campus map.<b>
      Price - No Charge</b> Available for PDF download: <a
      href=\"http://communications.emory.edu/documents/marketing/Visitor_Guide_\
      2011.pdf\">2011 Visitor's Guide</a> · id=10012 · tipo=userdefined"
