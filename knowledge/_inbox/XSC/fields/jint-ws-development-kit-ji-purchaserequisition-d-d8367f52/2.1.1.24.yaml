  - label: distributionValue
    technical_name: distributionValue
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Distribution value for the split. This is an integer numeric value.

      Must be a positive number or zero.

      According to specific distribution type, it represents:

      AmountOfQuantity: the portion of the quantity to be split.

      AmountOfPrice: the monetary amount to be split.

      PercentOfQuantity and PercentOfPrice: the percentage of the split. For
      these values, the total of all distribution values must equal 100%

      DEPRECATED: uses “decDistributionValue” field
    section: 2.1.1.24
    source_unit: jint-ws-development-kit-ji-purchaserequisition-d-d8367f52/2.1.1.24#part-1
    row_ref: t0.r1
    genre: tecnica
    document: jint-ws-development-kit-ji-purchaserequisition-d-d8367f52
  - label: splitIndex
    technical_name: splitIndex
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Split sequence number.

      The @splitIndex attribute must be a positive number from 0 to n-1, where n
      is the number of CustomFieldValue elements in the CustomFieldValueSet
      element. For example, given a CustomFieldValueSet element with four
      CustomFieldValue elements, the @splitIndex attributes are numbered 0 to 3.
      The default split index is zero (0).
    section: 2.1.1.24
    source_unit: jint-ws-development-kit-ji-purchaserequisition-d-d8367f52/2.1.1.24#part-1
    row_ref: t0.r2
    genre: tecnica
    document: jint-ws-development-kit-ji-purchaserequisition-d-d8367f52
  - label: splitAmount
    technical_name: splitAmount
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Amount to be split for the line item. This is a numeric value of up to 15
      digits, including up to 4 decimal places.

      For AmountOfPrice splits, the distributionvalue and splitAmount attributes
      are calculated identically and will always match each other.

      DEPRECATED: uses “decSplitAmount” field
    section: 2.1.1.24
    source_unit: jint-ws-development-kit-ji-purchaserequisition-d-d8367f52/2.1.1.24#part-1
    row_ref: t0.r3
    genre: tecnica
    document: jint-ws-development-kit-ji-purchaserequisition-d-d8367f52
