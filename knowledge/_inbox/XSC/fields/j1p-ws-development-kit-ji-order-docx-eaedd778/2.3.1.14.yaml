  - label: days
    technical_name: days
    type: null
    mandatory_text: N
    allowed_values: []
    notes: Number of days after the invoice date that the discount can be applied to
      the invoice. That is, if payment is received within the specified number
      of days of the invoice date, the discount is applied
    section: 2.3.1.14
    source_unit: j1p-ws-development-kit-ji-order-docx-eaedd778/2.3.1.14#part-1
    row_ref: t0.r1
