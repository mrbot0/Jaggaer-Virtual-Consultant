  - label: net
    technical_name: net
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Number of days after the invoice date that the invoice is due.

      Note: Starting from the DTD version 3.2, the Net tag is no longer
      supported. It must be replaced by TermsType and DaysAfter.

      For example:

      <net>15</net>

      must be replaced with

      <termsType>Net</termsType>

      <daysAfter>15</daysAfter>
    section: 2.3.1.14
    source_unit: j1p-ws-development-kit-ji-order-docx-eaedd778/2.3.1.14#part-1
    row_ref: t0.r2
    genre: tecnica
    document: j1p-ws-development-kit-ji-order-docx-eaedd778
  - label: standardPaymentTermsCode
    technical_name: standardPaymentTermsCode
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Uniquely identifies a specific preconfigured combination of payment terms.

      If provided, TermsType, DaysAfter, and Discount are populated based on the
      preconfigured values set in StandardPaymentTermsCode.

      If both StandardPaymentTermsCode and Discount are provided, the value for
      Discount is used.

      If StandardPaymentTermsCode is provided, the TermsType element cannot have
      values.

      Note: The StandardPaymentTermsCode element is supported in version 3.2 of
      the DTD and later.
    section: 2.3.1.14
    source_unit: j1p-ws-development-kit-ji-order-docx-eaedd778/2.3.1.14#part-1
    row_ref: t0.r3
    genre: tecnica
    document: j1p-ws-development-kit-ji-order-docx-eaedd778
  - label: termsType
    technical_name: termsType
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Used in conjunction with the daysAfter element to determine the invoice
      due date.

      Possible values:

      Net

      EOM

      MFI

      EOQ

      Manual

      If TermsType is provided the StandardPaymentTermsCode element cannot have
      values.

      Note: The TermsType element is supported in version 3.2 of the DTD and
      later. Older versions of the DTD support the Net tag.
    section: 2.3.1.14
    source_unit: j1p-ws-development-kit-ji-order-docx-eaedd778/2.3.1.14#part-1
    row_ref: t0.r4
    genre: tecnica
    document: j1p-ws-development-kit-ji-order-docx-eaedd778
  - label: daysAfter
    technical_name: daysAfter
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Used in conjunction with the TermsType element to compute the invoice due
      date.

      Possible values: [0 - 999]

      Note: The DaysAfter element is supported in version 3.2 of the DTD and
      later. Older versions of the DTD support the Net tag.
    section: 2.3.1.14
    source_unit: j1p-ws-development-kit-ji-order-docx-eaedd778/2.3.1.14#part-1
    row_ref: t0.r5
    genre: tecnica
    document: j1p-ws-development-kit-ji-order-docx-eaedd778
