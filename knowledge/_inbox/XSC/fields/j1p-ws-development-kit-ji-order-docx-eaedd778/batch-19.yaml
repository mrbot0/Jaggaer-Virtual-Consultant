    technical_name: NET
    section: 2.3.1.14
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Number of days after the invoice date that the invoice is due.

      Note: Starting from the DTD version 3.2, the Net tag is no longer
      supported. It must be replaced by TermsType and DaysAfter.

      For example:

      <net>15</net>

      must be replaced with

      <termsType>Net</termsType>

      <daysAfter>15</daysAfter>
