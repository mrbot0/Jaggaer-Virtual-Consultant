  - label: sortBy
    technical_name: sortBy
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Method to be used when sorting custom field values in search results and
      the user's profile.

      Allowed values are:

      Alpha-numeric - The values are sorted alpha-numerically.

      Explicitly - The values are sorted in the order specified on the
      Administration > organization setup > Custom Fields > Values tab.
    section: 2.1.1.2
    source_unit: jint-ws-development-kit-ji-custom-field-docx-e39a8594/2.1.1.2#part-1
