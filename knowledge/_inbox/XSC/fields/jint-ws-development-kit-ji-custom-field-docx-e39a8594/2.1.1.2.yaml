  - label: useAsAnMBUChartOfAccountsField
    technical_name: useAsAnMBUChartOfAccountsField
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Indicates whether the custom field is (1) or is not (0) to be added to the
      MBU Chart-of-Accounts list. When this field is set to 1, you can uniquely
      assign the custom field to a specific business unit in your organization.

      Note: Setting this field to 0 for a parent custom field also sets it to
      false for all its children.
    section: 2.1.1.2
    source_unit: jint-ws-development-kit-ji-custom-field-docx-e39a8594/2.1.1.2#part-1
    row_ref: t0.r6
    genre: tecnica
    document: jint-ws-development-kit-ji-custom-field-docx-e39a8594
  - label: useDynamicWorkflow
    technical_name: useDynamicWorkflow
    type: null
    mandatory_text: N
    allowed_values: []
    notes: Indicates whether values associated with the custom field can (1) or
      cannot (0) be part of dynamic workflow. JAGGAER Services must set up the
      associated dynamic workflow step or activity before you can set this field
      to true.
    section: 2.1.1.2
    source_unit: jint-ws-development-kit-ji-custom-field-docx-e39a8594/2.1.1.2#part-1
    row_ref: t0.r7
    genre: tecnica
    document: jint-ws-development-kit-ji-custom-field-docx-e39a8594
  - label: customFieldStyle
    technical_name: customFieldStyle
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Style to be applied to the custom field.

      Possible values:

      0 - Use user profile permissions -This style uses the custom field
      permissions as set up in the user's profile or role.

      1 - Yes/No (checkbox) - This style shows up as a checkbox in the JAGGAER
      Indirect solution UI for the user to select. The user must have either the
      View or Edit Personal List custom field permission to be able to see and
      select the checkbox. Default values saved in the profile are not
      automatically applied.

      2 - Organization-wide list - This style shows the user all your
      organization's values within the Values tab in a drop-down list on the PR
      or PO.
    section: 2.1.1.2
    source_unit: jint-ws-development-kit-ji-custom-field-docx-e39a8594/2.1.1.2#part-1
    row_ref: t0.r8
    genre: tecnica
