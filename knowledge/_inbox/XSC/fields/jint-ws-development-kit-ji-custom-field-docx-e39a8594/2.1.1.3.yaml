  - label: active
    technical_name: active
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Indicates whether the value should (1) or should not (0) be active for
      shoppers in the JAGGAER Indirect solution.

      An active item is available to appropriate end users when shopping in the
      solution. An inactive item is not available to end users. A value might be
      marked inactive even if it has relationships in place.
