  - label: action
    technical_name: action
    type: null
    mandatory_text: Y
    allowed_values: []
    notes: >-
      Action to perform on the custom field value.

      Allowed values:

      modify - Update the existing value or add a value if none exists.

      delete - Delete the value, provided a relationship does not exist.

      If a relationship does exist for the value, you must delete the
      relationship before you can delete the value.
