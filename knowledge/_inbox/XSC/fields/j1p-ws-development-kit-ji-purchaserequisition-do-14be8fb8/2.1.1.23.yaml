  - label: distributionType
    technical_name: distributionType
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Manner in which the funds are to be distributed to each split.

      Valid values:

      AmountOfQuantity: funds are distributed based on a user-specified portion
      of the quantity

      AmountOfPrice: funds are distributed based on a user-specified monetary
      amount

      PercentOfQuantity: funds are distributed based on a user-specified
      percentage of the quantity

      PercentOfPrice: funds are distributed based on a user-specified percentage
      of the price. The amount of percentage is specified in distributionvalue
      attribute.
    section: 2.1.1.23
