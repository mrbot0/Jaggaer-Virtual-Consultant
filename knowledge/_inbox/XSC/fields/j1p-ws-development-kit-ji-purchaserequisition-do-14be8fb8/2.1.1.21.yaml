    notes: >-
      Text note for the supplier that is entered in the cart and carried over to
      POs and PRs.

      If the note is longer than 1000 characters, it is truncated and saved.

      Note: If the Note field is empty, the existing note in the eProcurement
      solution is not overwritten. Only a populated Note field can overwrite the
      existing note.
