  - label: decDistributionValue
    technical_name: decDistributionValue
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Distribution value for the split. This is a numeric value of up to 15
      digits, including up to 4 decimal places.

      According to split type, it represents:

      AmountOfQuantity: the portion of the quantity to be split.

      AmountOfPrice: the monetary amount to be split.

      PercentOfQuantity and PercentOfPrice: the percentage of the split.

      For AmountOfPrice splits, the distributionvalue and splitAmount values are
      calculated identically and will always match each other.

      This information does not appear in the message if there is no split.
    section: 2.1.1.27
    source_unit: j1p-ws-development-kit-ji-purchaserequisition-do-14be8fb8/2.1.1.27#part-1
    row_ref: t0.r1
    genre: tecnica
    document: j1p-ws-development-kit-ji-purchaserequisition-do-14be8fb8
  - label: splitIndex
    technical_name: splitIndex
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Split sequence number.

      It must be a positive number from 0 to n-1, where n is the number of
      CustomFieldValue elements in the CustomFieldValueSet element.

      For example, given a CustomFieldValueSet element with four
      CustomFieldValue elements, the splitIndex attributes are numbered 0 to 3.
      The default split index is zero (0).

      This information does not appear in the message if there is no split.
    section: 2.1.1.27
    source_unit: j1p-ws-development-kit-ji-purchaserequisition-do-14be8fb8/2.1.1.27#part-1
    row_ref: t0.r2
    genre: tecnica
    document: j1p-ws-development-kit-ji-purchaserequisition-do-14be8fb8
