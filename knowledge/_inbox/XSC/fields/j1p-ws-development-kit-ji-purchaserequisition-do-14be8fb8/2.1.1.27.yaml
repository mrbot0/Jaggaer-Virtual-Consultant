    notes: |-
      Distribution value for the split. This is an integer value.
      DEPRECATED: uses “decDistributionValue” field
    section: 2.1.1.27
    source_unit: j1p-ws-development-kit-ji-purchaserequisition-do-14be8fb8/2.1.1.27#part-1
