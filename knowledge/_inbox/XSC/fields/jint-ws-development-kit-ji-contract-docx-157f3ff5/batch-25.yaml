    allowed_values: []
    notes: >-
      Type of notification to be sent to the first party owner, first party
      stakeholder, and second party stakeholder:

      Advance Notice – Sent prior to the obligation due date, based on
      advanceNoticeList settings, to inform the owner or stakeholder that the
      obligation is coming due.

      Due Date – Sent on the due date of the obligation.

      Past Due Notice – Sent after the obligation has passed its due date
      without being met.

      Completed – Sent when an obligation has been marked Complete. This type of
      notification is not sent to second party stakeholder
