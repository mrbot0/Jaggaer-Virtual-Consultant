  - key: tech:PAYMENTTERMSTYPE
    label: paymentTermsType
    labels:
      - paymentTermsType
    technical_name: PAYMENTTERMSTYPE
    section: 2.2.1.45
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Used in conjunction with the PaymentTermsDaysAfter element to determine
      the invoice due date. Possible values:

      Net: Invoice due date = Invoice date + PaymentTermsDaysAfter

      EOM (End of Month): Invoice due date = Last day of the month of the
      invoice date + PaymentTermsDaysAfter.

      MFI (Month Following Invoice): Invoice due date = First day of the month
      after the invoice date + PaymentTermsDaysAfter.

      EOQ (End of Quarter): Invoice due date = Last day of the quarter of the
      invoice date + PaymentTermsDaysAfter.

      Manual: The invoice due date is not set based on payment terms but is
      entered manually by the user.

      Note: If PaymentTermsType is provided in an import message, the Net and
      StandardPaymentTermsCode elements cannot have values.
    sources:
