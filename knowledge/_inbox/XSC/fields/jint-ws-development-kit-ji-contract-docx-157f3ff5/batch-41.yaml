  - key: tech:STANDARDPAYMENTTERMSCODE
    label: standardPaymentTermsCode
    labels:
      - standardPaymentTermsCode
    technical_name: STANDARDPAYMENTTERMSCODE
    section: 2.2.1.45
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Uniquely identifies a specific preconfigured combination of payment terms.

      If StandardPaymentTermsCode is provided in an import message,
      PaymentTermsType, PaymentTermsDaysAfter, and Discount are populated based
      on the code.

      If both StandardPaymentTermsCode and Discount are provided, the value for
      Discount is used.

      Note: If StandardPaymentTermsCode is provided in an import message, the
      Net and PaymentTermsType elements cannot have values.
