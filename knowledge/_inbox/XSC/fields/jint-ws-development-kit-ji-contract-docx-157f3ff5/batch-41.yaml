    section: 2.2.1.45
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Number of days after the invoice date that the invoice is due.

      Note: A Net payment terms type can be specified using either the Net
      element or the combination of the PaymentTermsType element set to Net and
      the PaymentTermsDaysAfter element.

      Note: If Net is provided in an import message, the PaymentTermsType and
      StandardPaymentTermsCode elements cannot have values.
