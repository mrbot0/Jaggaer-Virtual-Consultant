  - key: tech:TYPE
    label: Type
    labels:
      - Type
      - type
    technical_name: TYPE
    section: 2.2.1.11
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Contract custom field type

      Text (Single Line) – Freeform single-line entry area, up to 100
      alphanumeric characters. Cannot be a parent custom field.

      Text (Multi-Line) – Freeform multi-line entry area, up to 2000
      alphanumeric characters. Cannot be a parent custom field.

      Numeric Text Box – Freeform single-line entry area, numbers only. Cannot
      be a parent custom field.

      Yes/No – Yes-No checkbox. You can enable multiple checkboxes.

      Dropdown List (Pick One) – Predefined set of selections in dropdown list
      format.

      Multiple Choice (Pick One) – Also known as a Radio Button Group.
      Predefined set of selections in radio button group format.

      Multiple Select (Pick Many) – Predefined set of selections. User can enter
      all custom field values that apply. This is the only custom field type
      that can accept more than one custom field value.

      File Upload – Add a file attachment.

      Date – Date field, with today’s date as the default selection.

      Table – Create a table composed of other custom fields.
