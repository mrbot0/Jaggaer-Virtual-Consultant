  - label: Note
    technical_name: Note
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Note about the workflow step status. Stored in the Note column of the
      ContractAuditTrail table.

      If the note is longer than 1000 characters, it is truncated and saved.

      If not provided or empty, existing notes are not overwritten.
    section: 2.4.1.1
