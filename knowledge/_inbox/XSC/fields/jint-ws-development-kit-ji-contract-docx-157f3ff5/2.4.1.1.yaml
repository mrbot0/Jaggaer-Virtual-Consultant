  - label: status
    technical_name: status
    type: null
    mandatory_text: Y
    allowed_values: []
    notes: >-
      Status of the workflow step for the contract.

      It can assume following value:

      approve – The workflow step is approved. The contract can advance to the
      next step in the workflow.

      approveWithException – The workflow step is approved, but with one or more
      exceptions. The exceptions should be noted in the Note element. The
      contract can advance to the next step in the workflow.

      return – The workflow step is not approved. The contract is returned to
      draft status and does not advance to the next step in the workflow.
    section: 2.4.1.1
    source_unit: jint-ws-development-kit-ji-contract-docx-157f3ff5/2.4.1.1#part-1
    row_ref: t0.r1
    genre: tecnica
