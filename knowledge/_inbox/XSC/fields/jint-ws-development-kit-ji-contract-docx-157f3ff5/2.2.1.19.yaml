  - label: type
    technical_name: type
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Identifies the type of attachment (for contract attachment with fileBase64
      only).

      MainDocument – The attachment is the main contract document

      SignedDocument – The attachment is a signed document

      CompiledDocument- The attachment is a compilation of multiple attachments

      Attachment- The attachment is a normal attachment, not a main, signed, or
      compiled document.

      PreviousSignedDocument- The attachment is a previously signed document.
    section: 2.2.1.19
