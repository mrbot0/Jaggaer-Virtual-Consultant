    technical_name: ALLOWSUPPLIEREDITITEMS
    section: 2.2.1.24
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Indicates whether supplier can (true) or cannot (false) edit the price on
      a contract noncatalog line item that has been populated from the contract
      on a portal invoice or credit memo.

      This field does not apply to other non-catalog line items, only those
      populated from the contract on a portal invoice or credit memo.

      Note: This field applies to price only. Suppliers cannot edit the part
      number, product size, packaging, or description of an item.
