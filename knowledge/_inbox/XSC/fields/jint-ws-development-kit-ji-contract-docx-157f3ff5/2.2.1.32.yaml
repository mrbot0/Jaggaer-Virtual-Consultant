  - label: userList
    technical_name: userList
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      List of users to be explicitly allowed to access this contract.

      The user is allowed to access the contract even if he or she does not meet
      the criteria specified in roleList, departmentList and businessUnitList.

      See section “User [Import]” below
