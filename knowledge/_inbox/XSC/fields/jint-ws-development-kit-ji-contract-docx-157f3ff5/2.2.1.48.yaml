  - label: unitOfMeasure
    technical_name: unitOfMeasure
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Packaging or size unit for the service line item, such as EA (each), PK
      (pack), KG (kg), or LG (large).

      The supplier item is the actual purchasable item available for the
      shopper.

      If the packaging or size also includes a quantity (for example, 2 per
      package), then include the quantity with the code (for example, “2/PK”).

      The default unitOfMeasure is EA.
    section: 2.2.1.48
