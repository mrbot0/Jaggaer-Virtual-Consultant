  - label: useReqLimitsForInvoice
    technical_name: useReqLimitsForInvoice
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Indicates whether the minimum and maximum contract spend and line item
      quantity limits set for PRs do (true) or do not (false) also apply to
      invoices.

      That is, if this field is set to true, then:

      The values of the PR-specific fields (minimumContractSpendPerPR,
      maximumContractSpendPerPR, minimumLineItemQuantityPerPR, and
      maximumLineItemQuantityPerPR) also apply to invoices.

      The invoicespecific fields (minimumContractSpendPerInvoice,
      maximumContractSpendPerInvoice, minimumLineItemQuantityPerInvoice, and
      maximumLineItemQuantityPerInvoice) do not appear in the contract export
      message.

      The values of the PR-specific fields overwrite any values currently
      configured for the invoice-specific fields
    section: 2.2.1.24
    source_unit: jint-ws-development-kit-ji-contract-docx-157f3ff5/2.2.1.24#part-1
    row_ref: t0.r16
    genre: tecnica
    document: jint-ws-development-kit-ji-contract-docx-157f3ff5
