  - label: dayOfWeekEnum
    technical_name: dayOfWeekEnum
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      If dayOrWeekOfMonthEnum is set to First, Second, Third, Fourth, or Last,
      indicates the specific day of the month on which the obligation is to
      recur (such as first Weekend Day, or third Thursday).

      Possible values:

      Day

      Weekday

      Weekend Day

      Sunday

      Monday

      Tuesday

      Wednesday

      Thursday

      Friday

      Saturday
