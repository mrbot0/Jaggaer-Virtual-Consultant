  - key: tech:STATUS
    label: Status
    labels:
      - Status
      - status
    technical_name: STATUS
    section: 2.2.1.2
    type: null
    mandatory_text: Y
    allowed_values: []
    notes: >-
      Indicates the actual status of the contract (that is, where the contract
      is in the workflow process).

      Valid only if you are creating a new contract.

      Possible values:

      Draft

      Executed

      The default status is Draft.

      If the status is Executed, then the specified startDate and endDate
      elements determine which executed status applies:

      Executed: Future Contract- The contract is being created before the
      StartDate.

      Executed: In Effect Contract- The contract is being created between the
      StartDate and EndDate.

      Completed Contract- The contract is being created after the EndDate.
    sources:
      - document: jint-ws-development-kit-ji-contract-docx-157f3ff5
        section: 2.2.1.2
