rows:
  - label: startOnExecution
    technical_name: startOnExecution
    type: null
    mandatory_text: ""
    allowed_values: []
    notes: >-
      Indicates whether the contract start date is (true) or is not (false) to
      be set to the date when the contract reaches “Executed: In Effect” status.

      For eSignature contracts, this is the date and time that the final signer
      signs the contract, or a signed contract is manually uploaded.

      If this field is set to true, you must still enter a startDate.

      The entered start date is provisional until the contract reaches Executed:
      In Effect status, at which time the solution replaces the entered start
      date with that date.

      If the contract requires a manual upload, you can update the start and end
      dates at that time.
    section: 2.2.1.4
    source_unit: jint-ws-development-kit-ji-contract-docx-157f3ff5/2.2.1.4#part-1
