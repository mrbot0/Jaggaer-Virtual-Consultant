    notes: "UserDefinedFieldParamHTML=<body> <p></p><b>Step 1</b> - Enter Total
      Amount &nbsp;&nbsp;&nbsp;<blockquote>Enter the total estimated cost of the
      travel in the <b>Supplier </b>section.</blockquote><p></p><b>Step 2</b> -
      Attach File &nbsp;&nbsp;&nbsp;<blockquote>Simply attach the completed
      travel form from the SQUFS website under Business and Finance Forms and
      Documents.</blockquote> <p></p><b>Step 3</b> - Click <b><i>Go</i></b>
      &nbsp;&nbsp;&nbsp;<blockquote>Click the <b>Go</b> button with the
      Available Action: <i>Add and go to Cart</i>. </blockquote><b>Step 4</b> -
      Click <b><i>Proceed to Checkout</i></b> &nbsp;&nbsp;&nbsp;<blockquote>This
      will create a draft requisition for your travel authorization request.
      </blockquote><b>Step 5</b> - Enter the accounting codes
      &nbsp;&nbsp;&nbsp;<blockquote>Enter the fund code and the word
      <i>Travel</i> for the account code. </blockquote> </body><b>Step 6</b> -
      Assign - Click <b>Place Order</b><blockquote>If you are not the traveler,
      assign the cart to the traveler. The traveler will need to place the order
      which will complete your request for travel authorization.</blockquote>
      You will receive an email from the Travel Office letting you know if the
      travel is authorized, rejected or if you need to make changes to the
      travel form and resubmit. </html> · id=10001 · tipo=userdefined"
