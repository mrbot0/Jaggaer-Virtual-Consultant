    technical_name: RECEIPTTYPE
    section: 2.1.1.3
    type: null
    mandatory_text: Y
    allowed_values: []
    notes: >-
      Type of receipt.

      Quantity - A Quantity receipt is used when a PO is based on item quantity
      times the unit price (such as non-catalog orders, hosted orders, and
      punchout orders).

      Cost- A Cost receipt is used when a PO is considered amount-only (such as
      amount only POs, blanket POs, and service orders).
