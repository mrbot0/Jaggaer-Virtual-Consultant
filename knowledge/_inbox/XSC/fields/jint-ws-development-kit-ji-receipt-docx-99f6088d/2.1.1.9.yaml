  - label: flexText1
    technical_name: flexText1
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Flex text attached to the receipt line.

      The FlexText field is an organization-managed, freeform field which can be
      renamed (in Field Management) and used in whatever way seems appropriate.

      This field enables organizations to track their own custom data elements
      along with the default fields that JAGGAER provides.

      If the text is longer than 100 characters, it is truncated and saved.
    section: 2.1.1.9
    source_unit: jint-ws-development-kit-ji-receipt-docx-99f6088d/2.1.1.9#part-1
    row_ref: t0.r8
    genre: tecnica
    document: jint-ws-development-kit-ji-receipt-docx-99f6088d
  - label: flexText2
    technical_name: flexText2
    type: null
    mandatory_text: N
    allowed_values: []
    notes: |-
      Second block of flex text attached to the receipt line.
      If the text is longer than 100 characters, it is truncated and saved.
    section: 2.1.1.9
