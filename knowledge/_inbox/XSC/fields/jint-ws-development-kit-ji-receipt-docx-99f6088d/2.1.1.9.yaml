  - label: note
    technical_name: note
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Text note attached to the receipt line.

      If the note is longer than 700 characters, it is truncated and saved.

      Note: If the Note field is empty, the existing note in the Invoicing
      solution is not overwritten. Only a populated Note field can overwrite the
      existing note
    section: 2.1.1.9
    source_unit: jint-ws-development-kit-ji-receipt-docx-99f6088d/2.1.1.9#part-1
    row_ref: t0.r7
