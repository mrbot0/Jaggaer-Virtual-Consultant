  - label: receiptLineStatus
    technical_name: receiptLineStatus
    type: null
    mandatory_text: Y
    allowed_values: []
    notes: >-
      Final status of the receipt line.

      Cost Received

      Cost Cancelled

      Received

      Cancelled

      Returned

      Received / Returned

      Cost Received and Cost Cancelled are valid only for Cost receipts.

      Received, Cancelled, Returned, and Received / Returned are valid only for
      Quantity receipts.
    section: 2.1.1.9
    source_unit: jint-ws-development-kit-ji-receipt-docx-99f6088d/2.1.1.9#part-1
    row_ref: t0.r2
    genre: tecnica
