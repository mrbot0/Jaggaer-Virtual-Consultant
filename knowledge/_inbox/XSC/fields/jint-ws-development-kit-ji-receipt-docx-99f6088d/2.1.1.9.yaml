  - label: cost
    technical_name: cost
    type: null
    mandatory_text: Y/N
    allowed_values: []
    notes: >-
      Cost to which the receiptLineStatus applies (either received or
      cancelled).

      Required for Cost receipts, mutually exclusive with the quantity element.
    section: 2.1.1.9
    source_unit: jint-ws-development-kit-ji-receipt-docx-99f6088d/2.1.1.9#part-1
