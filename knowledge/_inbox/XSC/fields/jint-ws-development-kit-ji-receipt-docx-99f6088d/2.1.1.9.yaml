  - label: quantity
    technical_name: quantity
    type: null
    mandatory_text: Y/N
    allowed_values: []
    notes: >-
      Quantity of product to which the receiptLineStatus applies, such as 5
      items received, 1 item cancelled, or 3 items returned.

      Required only for Quantity receipts, mutually exclusive with the cost
      element.
    section: 2.1.1.9
    source_unit: jint-ws-development-kit-ji-receipt-docx-99f6088d/2.1.1.9#part-1
