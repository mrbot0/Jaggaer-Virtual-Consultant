  - label: note
    technical_name: note
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Text note attached to the receipt header.

      If the note is longer than 1000 characters, it is truncated and saved.

      Note: If the Note field is empty, the existing note in the Invoicing
      solution is not overwritten. Only a populated Note field can overwrite the
      existing note.
