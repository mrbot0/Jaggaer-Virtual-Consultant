    notes: >-
      Default value of the additional column to be redefined for the commercial
      parameter. According to parameter type, possible values are:

      BOOLEAN: TRUE or 1 for true value, any other value means false

      MULTILINE OR TEXT: any string

      NUMERIC: a string representing a number

      COMBO: any value among allowed ones

      DATE [22.02.00] Note: format is yyyy-MM-dd
