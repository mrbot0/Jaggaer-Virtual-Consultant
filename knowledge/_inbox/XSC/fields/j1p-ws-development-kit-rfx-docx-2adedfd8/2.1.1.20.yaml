  - label: aggregationTypeTCO
    technical_name: aggregationTypeTCO
    type: null
    mandatory_text: N
    allowed_values: []
    notes: |-
      In case of TCO formula, it indicates the aggregation type:
      SUM
      AVG
      Default is SUM.
