    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Flag to force the sensitive data visibility for the user:

      1 = redefine the permission by assigning the visibility of the sensitive
      data (supplier response & buyer evaluation) on the Rfx for the evaluation
      user. If the permission is already present in the standard permissions, no
      redefinition is performed.

      0 = not redefine the permission for the evaluation user

      Default is 0.
