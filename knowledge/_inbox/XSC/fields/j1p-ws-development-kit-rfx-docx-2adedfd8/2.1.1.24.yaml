  - label: |-
      permissionList/
      forceRfxVisibility
    technical_name: |-
      permissionList/
      forceRfxVisibility
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Flag to force the Rfx visibility for the user:

      1 = redefine the permission by assigning the visibility on the Rfx for the
      evaluation user. If the permission is already present in the standard
      permissions, no redefinition is performed.

      0 = not redefine the permission for the evaluation user

      Default is 0.
    section: 2.1.1.24
