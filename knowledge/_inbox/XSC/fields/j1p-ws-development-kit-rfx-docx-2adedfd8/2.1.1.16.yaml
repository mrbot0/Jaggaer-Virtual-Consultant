  - label: defaultValue
    technical_name: defaultValue
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Default value to be set on the additional column. According to column
      type, possible values are:

      BOOLEAN: TRUE or 1 for true value, any other value means false

      NOTE, MULTILINE OR TEXT: any string

      NUMERIC: a string representing a number

      COMBO: any value among allowed ones

      DATE [22.02.00] Note: format is yyyy-MM-dd
    section: 2.1.1.16
    source_unit: j1p-ws-development-kit-rfx-docx-2adedfd8/2.1.1.16#part-1
    row_ref: t0.r4
    genre: tecnica
    document: j1p-ws-development-kit-rfx-docx-2adedfd8
  - label: sellerVisibility
    technical_name: sellerVisibility
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Visibility of the additional column to the seller

      Valid value:

      0 = not visible

      1 = visible in read-only mode

      2 = visible and writeable

      If not provided, 2 is assumed.

      In case of NUMERIC_FORMULA or NUMERIC_SR_FORMULA, the value 0 means
      formula hidden to supplier, any other value means formula visible
      (read-only) to supplier.
    section: 2.1.1.16
    source_unit: j1p-ws-development-kit-rfx-docx-2adedfd8/2.1.1.16#part-1
    row_ref: t0.r5
    genre: tecnica
    document: j1p-ws-development-kit-rfx-docx-2adedfd8
