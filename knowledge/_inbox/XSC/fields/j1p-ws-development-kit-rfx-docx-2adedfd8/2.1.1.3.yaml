  - label: commScoringAlgorithm
    technical_name: commScoringAlgorithm
    type: null
    mandatory_text: N
    allowed_values: []
    notes: |-
      Scoring algorithm to calculate the score.
      Possible values:
      PROPORTIONAL_VS_BEST = Proportional vs Best
      BETTER_ABOVE_AVERAGE_DISCOUNT = Better Above Average Discount
      DIFFERENTIAL_VS_BASE_PRICE = Differential vs Base Price
      LINEAR = Linear (Worst=0)
      COPY_TCO = Copy of TCO
      NO_FORMULA = No formula
    section: 2.1.1.3
    source_unit: j1p-ws-development-kit-rfx-docx-2adedfd8/2.1.1.3#part-2
    row_ref: t0.r39
    genre: tecnica
    document: j1p-ws-development-kit-rfx-docx-2adedfd8
  - label: commAlgorithmInputData
    technical_name: commAlgorithmInputData
    type: null
    mandatory_text: Y/N
    allowed_values: []
    notes: >-
      Source for Scoring algorithm.

      Required for all possible values of commScoringAlgorithm except for these
      following values:

      COPY_TCO

      NO_FORMULA

      Possible values:

      PRICE

      TCO

      Default value: PRICE
    section: 2.1.1.3
    source_unit: j1p-ws-development-kit-rfx-docx-2adedfd8/2.1.1.3#part-2
    row_ref: t0.r40
    genre: tecnica
    document: j1p-ws-development-kit-rfx-docx-2adedfd8
  - label: commAlgorithmValuesStrategy
    technical_name: commAlgorithmValuesStrategy
    type: null
    mandatory_text: N
    allowed_values: []
    notes: >-
      Price values strategy.

      Required for all possible values of commScoringAlgorithm except for this
      following value:

      NO_FORMULA

      Possible values:

      REVERSE = lower price preferred

      DIRECT = higher price preferred

      Default value: REVERSE
    section: 2.1.1.3
    source_unit: j1p-ws-development-kit-rfx-docx-2adedfd8/2.1.1.3#part-2
    row_ref: t0.r41
    genre: tecnica
    document: j1p-ws-development-kit-rfx-docx-2adedfd8
  - label: commAlgorithmBaseValue
    technical_name: commAlgorithmBaseValue
    type: null
    mandatory_text: N
    allowed_values: []
    notes: |-
      Base value for scoring algorithm.
      Required when commScoringAlgorithm is set on these following values:
      BETTER_ABOVE_AVERAGE_DISCOUNT
      DIFFERENTIAL_VS_BASE_PRICE.
    section: 2.1.1.3
    source_unit: j1p-ws-development-kit-rfx-docx-2adedfd8/2.1.1.3#part-2
    row_ref: t0.r42
    genre: tecnica
