  - label: Additonal Guidance
    technical_name: Additonal Guidance
    type: HTML
    mandatory_text: No
    allowed_values: []
    notes: 'Before filling out this form, determine if the purchase is capital
      equipment or capitalized software. Verify that the: <ul> <li>Equipment or
      software has a normal life expectancy of more than one year, and is not
      expendable. Non-expendable means that the equipment is not consumed by
      it’s use.</li> <li>Capitalized cost will exceed [importo]. The [importo]
      value includes the price of the equipment and other costs needed to put
      the equipment into service such as required installation services, startup
      components, accessories, startup kits (e.g. regents), freight, handling
      and sales tax.</li> <li>Determine if a trade-in will be involved</li>
      <ul><li>If a trade-in is part of the purchase, the Department Asset
      Custodian must approve the release of the trade-in before the requisition
      is submitted.</li> <li>Establish the price for trade-in and arrangements
      for the supplier to receive or pick up the product.</li></ul></ul> <br>
      Contact <a href="mailto:[email]">Capital Accounting</a> if you have
      questions determining if your purchase is a capitalized asset or regarding
      Asset Management codes. · UserDefinedFieldParamHTML=Please see the
      "<b><u><a target="_blank"
      href="https://supplychain.ucsf.edu/buying-capital-equipment">Capital
      Equipment How To Guide</a></b></u>" for guidance on completing this
      form.<br></br> 1. Use this form to request: <ul><li><b>Capital
      Equipment</b> - Equipment costing [importo] or more and has a life
      expectancy of more than one year</li></ul> <br> For equipment and software
      orders under [importo], please use the Non-Catalog or Amount-based PO
      Forms<br></br> 2. Fill out all required fields shown in <b>bold text</b>.
      Please note all fields may be necessary to complete the
      transaction.<br><br> 3. Provide as much information as possible for any
      related equipment services.<br><br> 4. Attach any relevant supporting
      documents (i.e. vendor quote, technical specifications, warranty
      information, service level agreements, software licenses, etc.)<br><br> 5.
      If any attached documents are for both external and internal viewing,
      attach it <b>ONLY</b> in the External Attachments section.<br><br> 6. To
      order more than one piece of equipment, fill out the form and then click
      "Add to Cart".<br></br><br> · id=10001 · tipo=userdefined'
