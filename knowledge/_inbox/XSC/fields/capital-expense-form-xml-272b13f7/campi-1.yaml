  - label: Form Instruction Details
    technical_name: Form Instruction Details
    type: HTML
    mandatory_text: No
    allowed_values: []
    notes: "UserDefinedFieldParamHTML=<b>Commodity Code and Account</b> <br><br>
      This form will default a commodity code of <i>‘00330 – Inventorial
      Equipment >[importo]’</i>, this will make the Account default to
      <i>‘52603’</i>. <br><br> If the equipment purchase uses sponsored project
      funding sources, please specify the following Accounts for each sponsored
      project funding source in the Accounting Codes (chartfields) section
      during checkout: <ul> <li><b>51321</b> - Sponsored proj equip >[importo]K,
      non-comp</li> <li><b>51322</b> - Sponsored proj computer >[importo]K</li>
      </ul> Do not use the above Accounts for non-sponsored project funding
      sources. <br> · id=10102 · tipo=userdefined"
