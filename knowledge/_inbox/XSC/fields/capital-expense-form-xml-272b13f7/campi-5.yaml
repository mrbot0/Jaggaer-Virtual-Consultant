  - label: You have completed this form
    technical_name: You have completed this form
    type: HTML
    mandatory_text: No
    allowed_values: []
    notes: 'UserDefinedFieldParamHTML=<br>You have now completed this form.<br></br>
      <b>To order more than one piece of equipment</b>: <ul> <li>Select "Add to
      Cart" from the Available Actions dropdown.</li> <li>Update the form and
      add the form again to the cart. </li></ul> <b>After adding all forms to
      the cart, indicate whether your equipment/software is taxable.</b> <ul>
      <li>If the equipment is taxable, check the Taxable checkbox for each
      line.</li> <li>If the equipment is not taxable, do not check the Taxable
      checkbox for each line.</li></ul> <b>Be sure to specify asset management
      codes, especially the <u><b>Custody Code</u></b></b>. <ul> <li>From the
      "Proceed to Checkout" page, click the Asset Management tab.</li> <li>Input
      the <b> Custody Code</b> and <b> Asset Location</b>.</li> <li>Input the
      Tag Number <b>ONLY</b> if the purchase is adding to the value of an
      existing piece of equipment.</li> </ul> · id=10100 · tipo=userdefined'
