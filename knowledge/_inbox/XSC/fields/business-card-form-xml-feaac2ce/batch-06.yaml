      <li>executive and manager-level employees <li>professional staff (exempt)
      <li>sales executives and account managers </ul> <strong>Identification and
      Title</strong><br><br> On business cards, individuals should be identified
      by the official title assigned to them upon being hired. Variations on
      titles are permissible at the department head's discretion and with the
      approval of the appropriate dean.<br><br> · id=10000 · tipo=userdefined
