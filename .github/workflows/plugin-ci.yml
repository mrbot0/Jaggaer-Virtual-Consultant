name: plugin-ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # il plugin è nella sottocartella plugin/ (accanto a knowledge/)
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # --ignore-scripts blocca gli install script di TUTTE le dipendenze per sicurezza. 29/10/2026 (decisione
      # dell'utente): tolta better-sqlite3, il DB usa node:sqlite incluso in Node — nessuna dipendenza nativa da
      # ricompilare, quindi niente più "npm rebuild better-sqlite3".
      - run: npm ci --ignore-scripts
      - run: npm test
      # Revisione finale: le soglie di tempo (guard, observe-append, kb fields, SessionStart, audit-append) girano da
      # sole, dopo la suite e senza concorrenza (--test-concurrency=1), con riscaldamento, baseline node -e 0 e
      # mediana/p95 su fino a 3 tentativi: la suite principale ha solo tetti generosi.
      - run: npm run test:timing
