<!doctype html>
<!-- Tenant demo (M7, K6): modulo di richiesta d'acquisto con "Centro di costo" obbligatorio e
     toast di validazione. Pagina statica: gli snapshot MCP registrati in mcp/ sono stati ottenuti
     da questa pagina (struttura e testi), con l'URL del tenant sandbox dichiarato. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Nuova richiesta - ACME SBX</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; }
    .banner { background: #f5a623; padding: .25rem .5rem; font-weight: bold; }
    .toast { background: #c0392b; color: #fff; padding: .5rem; margin: .5rem 0; }
    label { display: block; margin: .5rem 0; }
  </style>
</head>
<body>
  <header class="banner" role="banner">SANDBOX</header>
  <p>Tenant acme-sbx</p>
  <h1>Richiesta d'acquisto</h1>
  <div class="toast" role="alert">Il centro di costo è obbligatorio (REQ-VAL-014)</div>
  <form>
    <label>Descrizione <input name="descr" value="RdA di prova - 5 sedie"></label>
    <label>Articolo <input name="item" value="Sedia ergonomica"></label>
    <label>Quantità <input type="number" name="qty" value="5"></label>
    <label>Centro di costo <input name="cdc" required></label>
    <label>Codice progetto <input name="prj"></label>
    <label>Referente <input name="ref" value="mario.rossi@acme.it"></label>
    <label>Importo stimato <input name="amount" value="€ 1.250,00"></label>
    <button type="button" id="save">Salva bozza</button>
    <button type="button" id="submit" disabled>Invia in approvazione</button>
  </form>
  <a href="requisitions.html">Elenco richieste</a>
</body>
</html>
