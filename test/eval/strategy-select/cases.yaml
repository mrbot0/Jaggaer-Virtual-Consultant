# Golden di strategy-select (K3.2, criterio di uscita §33 K3: strategia attesa in ≥ 18/20).
# Punteggio DT-017 (§14.3) = forma×0.35 + rischio×0.30 + precedente×0.20 + sorprese×0.15.
# Copertura: le quattro tracce di §18, i bordi delle bande (0.15, 0.35, 0.55, 0.75), ogni strategia
# del repertorio §14.2 almeno una volta (le tre di combinazione in `combine`).
- id: s18-1-config-libresco
  source: "§18.1 — 0.35×0.6 + 0.30×0.7 + 0.20×0.9 + 0 = 0.60 → STR-DRY-RUN, poi STR-VERIFY-FIRST"
  # la traccia stampa 'd .31' per L.ACME.ADM.DEC.0377 ma lo pesa 0.9 (smentito d<0.3): si usa la classe della traccia
  input: { shape: libresco, risk: R2, precedent: "smentito-d<0.3", surprises: 0, mode: config, depth: standard }
  expect: { strategy: STR-DRY-RUN, then: STR-VERIFY-FIRST, combine: [], score: 0.60 }
- id: s18-2-triage-replay
  source: "§18.2 — consolidato, precedente confermato d .12 stesso soggetto → STR-REPLAY della classificazione"
  input: { shape: consolidato, risk: R0, precedent: [{ dec: L.ACME.P2P.DEC.0290, d: 0.12, result: confermata, customer: ACME }], surprises: 0, mode: diag, divergence_unknown: false }
  expect: { strategy: STR-REPLAY, combine: [], score: 0 }
- id: s18-3-ops-ignoto
  source: "§18.3 — ignoto .9×.35 + R1 .3×.30 + nessun prec .5×.20 + 0 = .505 → STR-VERIFY-FIRST"
  input: { shape: ignoto, risk: R1, precedent: [], surprises: 0, mode: ops }
  expect: { strategy: STR-VERIFY-FIRST, combine: [], score: 0.505 }
- id: s18-4-diag-contraddittorio
  source: "§18.4 — contraddittorio R0 senza precedente, due CTR aperti → si risolvono prima (DT-011): STR-TRIANGULATE"
  input: { shape: contraddittorio, risk: R0, precedent: nessuno, surprises: 0, mode: diag, divergence_unknown: false, has_hypotheses: true, depth: profonda, preferred_prior: 0.40 }
  expect: { strategy: STR-TRIANGULATE, combine: [], score: 0.45 }
- id: edge-015-lower
  source: "bordo 0.15 (incluso nella banda 0.15–0.35): consolidato R1 confermato d<0.5 → DT ordinaria"
  input: { shape: consolidato, risk: R1, precedent: "confermato-d<0.5", surprises: 0, mode: config }
  expect: { strategy: nessuna, combine: [], score: 0.15 }
- id: edge-015-below
  source: "sotto 0.15 con precedente confermato d<0.2 da precedents(): 0.09 → STR-REPLAY"
  input: { shape: consolidato, risk: R1, precedent: [{ dec: L.ACME.ADM.DEC.0402, d: 0.05, result: confermata }, { dec: L.ACME.ADM.DEC.0377, d: 0.31, result: smentita }], surprises: 0, mode: config }
  expect: { strategy: STR-REPLAY, combine: [], score: 0.09 }
- id: edge-035-empirico
  source: "bordo 0.35 (incluso in 0.35–0.55): empirico R2 → STR-GENERALIZE-CAUTIOUSLY"
  input: { shape: empirico, risk: R2, precedent: "confermato-d<0.2", surprises: 0, mode: config }
  expect: { strategy: STR-GENERALIZE-CAUTIOUSLY, combine: [], score: 0.35 }
- id: edge-035-contraddittorio
  source: "bordo 0.35: contraddittorio R0 → STR-TRIANGULATE"
  input: { shape: contraddittorio, risk: R0, precedent: "confermato-d<0.2", surprises: 0, mode: nrt }
  expect: { strategy: STR-TRIANGULATE, combine: [], score: 0.35 }
- id: edge-055-below
  source: "0.54 (sotto 0.55): empirico R3 senza precedenti → STR-GENERALIZE-CAUTIOUSLY"
