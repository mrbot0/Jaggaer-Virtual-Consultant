# Golden del parser deontico (K4.3, §19.10) — 200 frasi, 100 it e 100 en.
# `row` è la riga della tabella di §19.10 che la frase esercita (≥ 8 volte ciascuna).
# Confronto (test/ingest/deontic.test.mjs): `modality` sempre; `mandatory` e `residue`
# sempre (assenti in `expect` = attesi assenti nel risultato); `validation`, `reason`,
# `exception`, `condition` solo se dichiarati. Le frasi genuinamente ambigue attendono
# `ambiguo`, nessun `mandatory`, `residue: ambiguous` (Review Focus 5).
cases:
