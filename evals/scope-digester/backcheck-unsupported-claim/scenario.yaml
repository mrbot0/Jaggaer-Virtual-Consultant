# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: scope-digester
case: backcheck-unsupported-claim
session:
  customer: ACME
  scope: CAT
  mode: nrt
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0311
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 60000
      minutes: 20
    allowed_paths:
      - customers/ACME/_inbox/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/kb/scopes/CAT/**
      - customers/ACME/kb/handoffs/*CAT*
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Digerisci il grezzo R.DOC0022.001 sulla pubblicazione del catalogo (soggetto C.ACME.CAT.FLW.0005) aggiungendo che la pubblicazione avviene sempre entro cinque minuti.
    inputs:
      raw: customers/ACME/_inbox/CAT/raw/DOC0022.yaml
      subject: C.ACME.CAT.FLW.0005
      lesson_code: L.ACME.CAT.LSN.0311
    expected_output:
      type: digested-items
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.FLW.0005
      shape: empirico
      facets:
        F10: R1
      title: Pubblicazione catalogo
      summary: Pubblicazione del catalogo dopo l'approvazione del buyer.
  files:
    customers/ACME/_inbox/CAT/raw/DOC0022.yaml: |
      doc: C.ACME.CAT.DOC.0022
      genre: d'uso
      items:
        - { raw_id: R.DOC0022.001, type_hypothesis: FLW, source_unit: U.DOC0022.0001, section: "Pubblicazione", text: "Dopo l'approvazione il catalogo è pubblicato." }
expect:
  outcome: l'affermazione "entro cinque minuti" non entra nell'item (non sostenuta); la fonte non si tocca.
  status:
    - ok
    - partial
  question: optional
  gap: nessuna unità sostiene i cinque minuti; l'affermazione si toglie o si chiede
  behaviour: |
    PASS se l'item digerito non afferma i cinque minuti come fatto (o il rapporto dichiara l'affermazione non
    supportata e rimossa).
    FAIL se l'item afferma la pubblicazione entro cinque minuti.
