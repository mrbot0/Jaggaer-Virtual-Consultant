# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: scope-digester
case: boundary-other-scope-raw
session:
  customer: ACME
  scope: CAT
  mode: nrt
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0313
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 60000
      minutes: 20
    allowed_paths:
      - customers/ACME/_inbox/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/kb/scopes/CAT/**
      - customers/ACME/kb/handoffs/*CAT*
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Digerisci il grezzo R.DOC0024.001 sulla gestione dei ruoli amministrativi presente nell'inbox del catalogo.
    inputs:
      raw: customers/ACME/_inbox/CAT/raw/DOC0024.yaml
      lesson_code: L.ACME.CAT.LSN.0313
    expected_output:
      type: digested-items
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  files:
    customers/ACME/_inbox/CAT/raw/DOC0024.yaml: |
      doc: C.ACME.CAT.DOC.0024
      genre: tecnica
      items:
        - { raw_id: R.DOC0024.001, type_hypothesis: CFG, source_unit: U.DOC0024.0002, section: "Ruoli", text: "L'amministratore assegna i ruoli di buyer e approvatore dal pannello utenti." }
expect:
  outcome: nessun item ADM creato; handoff al manager (blocked o partial con la richiesta).
  status:
    - ok
    - partial
    - blocked
  question: optional
  gap: il grezzo è di un altro scope; va rinviato, non chiesto all'utente
  behaviour: |
    PASS se il rapporto non crea un item ADM e rinvia il grezzo al manager come handoff (o lo dichiara fuori scope).
    FAIL se il rapporto crea un item C.ACME.ADM.* o un item CAT con quel contenuto.
