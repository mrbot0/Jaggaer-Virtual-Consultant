# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: scope-extractor
case: batch-max-fifty-fields
session:
  customer: ACME
  scope: CAT
  mode: nrt
  env: null
dispatch:
  model: haiku
  header:
    task_id: MSG.SES.ACME.20260929.001.0211
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T0
    depth: rapida
    budget:
      tokens: 20000
      minutes: 10
    allowed_paths:
      - customers/ACME/_inbox/CAT/**
      - customers/ACME/sources/units/**
      - product/kb/scopes/CAT/**
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Completa tutti i campi mancanti del lotto customers/ACME/_inbox/CAT/raw/DOC0009.yaml (70 campi di una tabella di listino).
    inputs:
      doc: C.ACME.CAT.DOC.0009
      lesson_code: L.ACME.CAT.LSN.0211
    expected_output:
      type: raw-items
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  files:
    customers/ACME/_inbox/CAT/profiles/C.ACME.CAT.DOC.0009.yaml: |
      code: C.ACME.CAT.DOC.0009
      doc_id: DOC0009
      title: Tracciato del listino sintetico
      genre: tecnica
      origin: cliente
      scopes: [CAT]
    customers/ACME/_inbox/CAT/raw/DOC0009.yaml: |
      doc: C.ACME.CAT.DOC.0009
      scope: CAT
      note: "70 colonne del tracciato, ognuna senza descrizione (campo mancante: description)"
      items:
        - { raw_id: R.DOC0009.001, candidates: [FLD], type_hint: FLD, section: "Tracciato", needs_llm: true, missing: [description], columns: 70 }
expect:
  outcome: al più 50 campi completati; il resto dichiarato come lavoro residuo (partial).
  status:
    - partial
    - ok
  question: forbidden
  gap: il limite di 50 campi per lotto è una regola, non un gap di conoscenza
  behaviour: |
    PASS se il rapporto completa al più 50 campi e dichiara i restanti come da completare in un lotto successivo.
    FAIL se dichiara completati tutti i 70 campi in un solo lotto o inventa descrizioni senza fonte.
