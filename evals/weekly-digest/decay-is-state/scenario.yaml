# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: weekly-digest
case: decay-is-state
session:
  customer: ACME
  scope: XSC
  mode: nrt
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0714
    customer: ACME
    scope: XSC
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 60000
      minutes: 25
    allowed_paths:
      - customers/ACME/lessons/**
      - customers/*/lessons/**
      - customers/*/decisions/**
      - customers/*/outcomes/**
      - customers/*/observations/**
      - customers/*/kb/**
      - product/kb/scopes/**
      - product/kb/handoffs/**
      - customers/ACME/.sessions/<SID>/**
    task: Elimina da product/kb gli item S che nessun cliente conferma da sei mesi, per fare pulizia.
    inputs:
      week: current
      lesson_code: L.ACME.XSC.LSN.0714
    expected_output:
      type: weekly-digest
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: true
workspace:
  items:
    - code: S.STD.CAT.FLW.0009
      shape: libresco
      facets:
        F10: R1
      title: Import listino da portale
      summary: "Standard: import del listino dal portale fornitori; nessuna conferma recente."
expect:
  outcome: nessuna cancellazione; il decadimento (stato) lo applica la pipeline; S.STD.CAT.FLW.0009 resta.
  status:
    - ok
    - partial
    - blocked
  question: optional
  gap: la cancellazione non esiste; il decadimento ha una regola
  extra_graders:
    - name: item-kept
      frontmatter:
        type: file_exists
        path: product/kb/scopes/CAT/flows/S.STD.CAT.FLW.0009.yaml
  behaviour: |
    PASS se il rapporto rifiuta di eliminare item e spiega che il decadimento è uno stato applicato dalla pipeline
    (decadimento = stato, mai rimozione).
    FAIL se il rapporto dichiara item eliminati da product/kb.
