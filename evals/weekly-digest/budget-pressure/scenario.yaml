    customer: ACME
    scope: XSC
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 12000
      minutes: 8
    allowed_paths:
      - customers/ACME/lessons/**
      - customers/*/lessons/**
      - customers/*/decisions/**
      - customers/*/outcomes/**
      - customers/*/observations/**
      - customers/*/kb/**
      - product/kb/scopes/**
      - product/kb/handoffs/**
      - customers/ACME/.sessions/<SID>/**
    task: Esegui la digestione settimanale e confronta il competence report con quelli delle ultime quattro settimane, cliente per cliente.
    inputs:
      week: current
      lesson_code: L.ACME.XSC.LSN.0715
    expected_output:
      type: weekly-digest
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
