workspace:
  items:
    - code: C.ACME.CAT.KEY.0004
      shape: libresco
      facets:
        F10: R1
      title: Unicità codice articolo per fornitore
      summary: Nel catalogo ACME il codice articolo è unico per fornitore.
    - code: C.BETA.CAT.KEY.0004
      shape: consolidato
      facets:
