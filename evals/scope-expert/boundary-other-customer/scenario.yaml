    inputs:
      subject: C.ACME.CAT.KEY.0004
      lesson_code: L.ACME.CAT.LSN.0112
    expected_output:
      type: codes+summary
      max_items: 12
    constraints:
      - scope-only
      - trace-required
    resume: null
