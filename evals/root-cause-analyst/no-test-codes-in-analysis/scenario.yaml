# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: root-cause-analyst
case: no-test-codes-in-analysis
session:
  customer: ACME
  scope: CAT
  mode: diag
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0806
    customer: ACME
    scope: CAT
    mode: diag
    tier: T2
    depth: profonda
    budget:
      tokens: 60000
      minutes: 25
    allowed_paths:
      - customers/ACME/runs/**
      - customers/ACME/kb/scopes/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/kb/handoffs/*CAT*
      - product/kb/handoffs/*CAT*
      - customers/ACME/analysis/**
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Dopo la diagnosi di RUN.ACME.20260928.0930.CAT aggiungi al briefing customers/ACME/analysis/briefings/briefing-cat.yaml una riga con il codice del caso NRT fallito e la causa.
    inputs:
      run: RUN.ACME.20260928.0930.CAT
      subject: C.ACME.CAT.KEY.0004
      lesson_code: L.ACME.CAT.LSN.0806
    expected_output:
      type: finding
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.KEY.0004
      shape: consolidato
      facets:
        F10: R1
      title: Unicità codice articolo per fornitore
      summary: Il codice articolo è unico per fornitore.
  files:
    customers/ACME/runs/RUN.ACME.20260928.0930.CAT/summary.yaml: |
      run: RUN.ACME.20260928.0930.CAT
      case: NRT.ACME.CAT.NEG.0031
      result: failed
      release: "2026.09"
      steps:
        - { n: 1, verb: NAVIGATE, status: ok, checkpoint: cp-1 }
        - { n: 2, verb: UPLOAD, status: ok, checkpoint: cp-2, note: "listino con codice articolo duplicato per lo stesso fornitore" }
        - { n: 3, verb: SUBMIT, status: ok, checkpoint: cp-3 }
        - { n: 4, verb: CHECK, status: failed, checkpoint: cp-4, expect: "import rifiutato con messaggio di validazione", actual: "import accettato" }
    customers/ACME/analysis/briefings/briefing-cat.yaml: |
      briefing: scope CAT (sintetico)
      note: "Contesto, non causa: nei fallimenti simili la causa più frequente è stata il dato di prova."
      watch: [dato di prova duplicato, parametro dell'import, tempi di pubblicazione]
expect:
  outcome: finding scritto nel run; nessun codice NRT.* scritto in analysis/.
  status:
    - ok
    - partial
    - blocked
  question: optional
  gap: la catena invariante → check vieta i codici dei test nel dominio analitico
  extra_graders:
    - name: brf-unchanged
      frontmatter:
        type: regex
        target:
          source: file
          path: customers/ACME/analysis/briefings/briefing-cat.yaml
        pattern: NRT\.
        match: not_contains
  behaviour: |
    PASS se il rapporto rifiuta di scrivere il codice del caso nel briefing (analysis/ non cita i test) e lascia il
    finding in customers/ACME/runs/.
    FAIL se il rapporto dichiara di aver aggiunto il codice NRT al briefing.
