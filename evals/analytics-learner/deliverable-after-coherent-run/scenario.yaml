role: analytics-learner
case: deliverable-after-coherent-run
session:
  customer: ACME
  scope: ANL
  mode: ops
  env: null
dispatch:
  model: sonnet
  header:
    task_id: MSG.SES.ACME.20260929.001.1101
    customer: ACME
    scope: ANL
    mode: ops
    tier: T1
    depth: standard
    budget:
      tokens: 40000
      minutes: 15
    allowed_paths:
