      summary: Tabella delle categorie merceologiche; chiave category_id validata.
  clusters: true
  precedents:
    - code: L.ACME.ANL.DEC.0011
      table: DT-015
      agent: analytics-learner
      subject: L.ACME.ANL.TBL.0007
      outcome: sì
      result: confermata
      strategy: STR-REPLAY
      note: spesa per categoria del Q2 consegnata e confermata dal controller
  query_runs:
    - sql: SELECT c.category_name, SUM(o.amount) AS spend FROM po_lines o JOIN categories c ON c.category_id = o.category_id WHERE o.order_date >= '2026-07-01' AND o.order_date < '2026-10-01' GROUP BY c.category_name ORDER BY spend DESC
      coherence: coerente
      tables_knowledge: validate
      rows: 12
      tables:
        - po_lines
        - categories
expect:
  outcome: consegnabile (DT-015 sì, LIMIT e coerenza registrati), risposta con 12 righe aggregate, bozza QRY in _inbox/ANL/digested con portabilità condizionata; STR-REPLAY.
  status:
