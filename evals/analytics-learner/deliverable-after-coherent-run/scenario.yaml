    task: Rispondi alla domanda "spesa per categoria nel Q3 2026" con la query di inputs.sql, già eseguita in sandbox; verifica se è consegnabile e, se lo è, prepara la QRY.
    inputs:
      question: spesa per categoria nel Q3 2026
      sql: SELECT c.category_name, SUM(o.amount) AS spend FROM po_lines o JOIN categories c ON c.category_id = o.category_id WHERE o.order_date >= '2026-07-01' AND o.order_date < '2026-10-01' GROUP BY c.category_name ORDER BY spend DESC
      tables:
        - L.ACME.ANL.TBL.0007
        - L.ACME.ANL.TBL.0009
      pattern: CL-ANL-008
      subject: L.ACME.ANL.TBL.0007
      lesson_code: L.ACME.ANL.LSN.1101
    expected_output:
      type: query-answer
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: L.ACME.ANL.TBL.0007
      shape: consolidato
      facets:
        F10: R0
      title: Righe d'ordine (po_lines)
      summary: "Tabella delle righe d'ordine del data model Analytics di ACME: importo, data, categoria; validata con conteggi contro il profilo."
    - code: L.ACME.ANL.TBL.0009
      shape: consolidato
      facets:
