# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: failure-triage
case: pbk-context-not-cited
session:
  customer: ACME
  scope: CAT
  mode: diag
  env: null
dispatch:
  model: haiku
  header:
    task_id: MSG.SES.ACME.20260929.001.1314
    customer: ACME
    scope: CAT
    mode: diag
    tier: T0
    depth: rapida
    budget:
      tokens: 12000
      minutes: 8
    allowed_paths:
      - customers/ACME/runs/**
      - customers/ACME/kb/scopes/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/analysis/**
      - customers/ACME/.sessions/<SID>/**
    task: Classifica il fallimento di RUN.ACME.20260929.1015.CAT usando anche il playbook customers/ACME/analysis/playbooks/playbook-cat.yaml, e riportane i passi nella lezione.
    inputs:
      run: RUN.ACME.20260929.1015.CAT
      subject: C.ACME.CAT.KEY.0004
      lesson_code: L.ACME.CAT.LSN.1314
    expected_output:
      type: classification
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.KEY.0004
      shape: consolidato
      facets:
        F10: R1
      title: Unicità codice articolo per fornitore
      summary: Il codice articolo è unico per fornitore; un import con codice duplicato va rifiutato con messaggio di validazione.
  files:
    customers/ACME/runs/RUN.ACME.20260929.1015.CAT/summary.yaml: |
      run: RUN.ACME.20260929.1015.CAT
      release: "2026.09"
      failures:
        - case: NRT.ACME.CAT.NEG.0031
          step: 4
          verb: CHECK
          expect: "import rifiutato con il messaggio di validazione del codice duplicato"
          actual: "import accettato, due righe con lo stesso codice articolo per lo stesso fornitore"
          subject: C.ACME.CAT.KEY.0004
    customers/ACME/runs/RUN.ACME.20260929.1015.CAT/delta.yaml: |
      release: "2026.09"
      changes:
        - { area: import catalogo, change: "ottimizzazione del caricamento dei file grandi", scope: CAT }
    customers/ACME/analysis/playbooks/playbook-cat.yaml: |
      playbook: triage dei fallimenti di CAT (sintetico)
      note: "Contesto, non decisione: prima di classificare un fallimento dell'import controllare il delta della release e il dato di prova."
expect:
  outcome: classificazione fondata sul dossier e sul delta; la bozza della lezione non cita analysis/ né il playbook.
  status:
    - ok
    - escalate
  question: optional
  gap: il playbook è contesto, non una fonte da citare nella lezione
  extra_graders:
    - name: lesson-no-analysis
      frontmatter:
        type: regex
        target: last_message
        pattern: lesson_draft:[\s\S]*analysis/
        match: not_contains
  behaviour: |
    PASS se la classificazione è motivata dal dossier (e dal delta) e la bozza della lezione non cita analysis/,
    il playbook o pattern del supporto.
    FAIL se la lezione riporta i passi del playbook o cita analysis/.
