# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: config-auditor
case: clean-prod-no-violations
session:
  customer: ACME
  scope: ADM
  mode: config
  env: null
dispatch:
  model: haiku
  header:
    task_id: MSG.SES.ACME.20260929.001.1420
    customer: ACME
    scope: ADM
    mode: config
    tier: T0
    depth: rapida
    budget:
      tokens: 12000
      minutes: 8
    allowed_paths:
      - customers/ACME/kb/scopes/ADM/**
      - product/kb/scopes/ADM/**
      - customers/ACME/config-baselines/**
      - customers/ACME/config/environments.yaml
      - customers/ACME/.sessions/<SID>/**
    task: Fai l'audit di ADM in produzione con l'ultima baseline.
    inputs:
      env: prod
      subject: C.ACME.ADM.CFG.0019
      lesson_code: L.ACME.ADM.LSN.1420
    expected_output:
      type: audit
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.ADM.CFG.0019
      shape: consolidato
      facets:
        F10: R2
      title: Import rigoroso dei listini
      summary: Parametro strict_import dell'import listini; il cliente lo vuole attivo con lotti da 500 righe.
      body:
        area: CL-CFG-020
        current_state:
          value:
            strict_import: true
            batch: 500
          observed_at: 2026-09-20
          source: osservazione
    - code: C.ACME.ADM.CFG.0031
      shape: consolidato
      facets:
        F10: R1
      title: Notifiche delle approvazioni
      summary: Frequenza delle notifiche delle approvazioni agli approvatori.
      body:
        area: CL-CFG-005
        current_state:
          value:
            notify: daily
          observed_at: 2026-09-20
          source: osservazione
  rules:
    - scope: ADM
      title: Import rigoroso attivo
      summary: Con lotti da almeno 100 righe l'import dei listini deve essere rigoroso.
      rule:
        applies_to:
          area: CL-CFG-020
        when:
          path: batch
          op: gte
          value: 100
        assert:
          path: strict_import
          op: eq
          value: true
        severity: high
        message: import senza controllo di unicità
    - scope: ADM
      title: Notifiche almeno giornaliere
      summary: Le notifiche delle approvazioni non possono essere settimanali.
      rule:
        applies_to:
          area: CL-CFG-005
        assert:
          path: notify
          op: in
          value:
            - immediate
            - daily
        severity: medium
        message: approvatori avvisati troppo tardi
  baselines:
    - env: prod
      captured_at: 2026-09-27T11:00:00Z
      objects:
        C.ACME.ADM.CFG.0019:
          area: CL-CFG-020
          values:
            strict_import: true
            batch: 500
        C.ACME.ADM.CFG.0031:
          area: CL-CFG-005
          values:
            notify: daily
expect:
  outcome: nessuna violazione (exit 0), riportato come esito; nessuna domanda.
  status:
    - ok
  question: forbidden
  gap: baseline e regole bastano
  behaviour: |
    PASS se il rapporto riporta zero violazioni sulla baseline della produzione, con le regole valutate, senza
    inventare problemi.
    FAIL se il rapporto riporta violazioni inesistenti o chiede conferme all'utente.
