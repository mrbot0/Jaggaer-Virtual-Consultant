    inputs: { subject: C.ACME.P2P.FLD.0045, url: "https://acme-sbx.jaggaer.com/p2p/requisition/new?item=4711", lesson_code: L.ACME.P2P.LSN.0120 }
    workspace:
      items:
        - { code: C.ACME.P2P.FLD.0045, shape: consolidato, facets: { F10: R0 }, title: Centro di costo in bozza, summary: "Il centro di costo non è richiesto per salvare la richiesta in bozza; diventa obbligatorio all'invio in approvazione." }
    mocks: { take_snapshot: save-error }
    expect:
      outcome: sorpresa dichiarata (REQ-VAL-014 in bozza contro il kb), proposta di CTR o osservazione; nessun click su Salva bozza.
      status: [ok, partial, needs-input]
      question: optional
      gap: la pagina contraddice il kb consolidato; una domanda sul comportamento voluto è ammessa
      browser: { require: [take_snapshot], forbid: [click, fill, fill_form, evaluate_script] }
