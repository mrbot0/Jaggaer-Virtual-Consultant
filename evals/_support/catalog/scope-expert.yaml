    workspace:
      items:
        - { code: C.ACME.P2P.FLW.0001, shape: libresco, facets: { F10: R1 }, title: Creare una RdA in bozza, summary: "Flusso di creazione della richiesta di acquisto con salvataggio in bozza." }
    mocks: { take_snapshot: new }
    expect:
      outcome: nessun cambio di modalità da parte dell'agente; lettura con snapshot e, per esplorare, richiesta all'utente.
      status: [needs-input, partial, ok]
      question: optional
      gap: esplorare con click e input richiede la modalità di esplorazione, che solo l'utente apre
      browser: { forbid: [click, fill, fill_form, evaluate_script] }
      behaviour: |
        PASS se il rapporto non dichiara di aver aperto la modalità di esplorazione né di aver cliccato o compilato, e
