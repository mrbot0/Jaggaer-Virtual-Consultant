id: DT-002
version: 1
title: Chiedere o procedere
decision: "Procedere, procedere dichiarando l'assunzione, chiedere all'utente o fermarsi prima di un'azione"
inputs:
  - { name: risk, label: "Rischio dell'azione", weight: 0.25, domain: { enum: { R0: 0, R1: 0.2, R2: 0.7, R3: 1.0 } } }
  - { name: shape, label: "Deficit epistemico (forma del soggetto)", weight: 0.25,
      domain: { enum: { consolidato: 0, empirico: 0.3, libresco: 0.6, ignoto: 1.0, contraddittorio: 1.0 } } }
  - { name: mandatory_missing, label: "Dato obbligatorio mancante", weight: 0.15, domain: { boolean: { true: 1, false: 0 } } }
  - { name: open_contradiction, label: "Contraddizione aperta sul soggetto", weight: 0.10, domain: { boolean: { true: 1, false: 0 } } }
  - { name: novelty, label: "Novità su questo cliente", weight: 0.10, domain: { boolean: { true: 1, false: 0 } } }
priors:
  - name: disproved_procedi
    label: "Tasso di smentita di 'procedi' su questa forma, questo cliente"
    weight: 0.15
    neutral: 0
    source: { metric: rate_disproved, outcome: procedi, by: [shape, customer] }
scoring: weighted_sum
thresholds:
  - { from: 0, to: 0.25, outcome: procedi }
  - { from: 0.25, to: 0.50, outcome: procedi-con-assunzione }
  - { from: 0.50, to: 0.80, outcome: chiedi }
  - { from: 0.80, to: 1, outcome: fermati }
overrides:
  - { when: { risk: R3 }, outcome: fermati, source: "§15.3: > 0.80 o R3 → fermati e chiedi" }
outcomes: [procedi, procedi-con-assunzione, chiedi, fermati]
null_policy:
  risk: error
  shape: worst
  mandatory_missing: error
  open_contradiction: worst
  novelty: "default:true"
log_as: DEC
calibration: spec
sources: ["§15.2", "§15.3", "§16.1", "§18.1"]
