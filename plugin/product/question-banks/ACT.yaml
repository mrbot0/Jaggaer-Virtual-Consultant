type: ACT
source: §64, §29.4
note: "Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP. Le parole chiave it/en servono solo al recupero delle unità (FTS),
  non si mostrano: il corpus è in gran parte in inglese."
questions:
  - attribute: risk
    question: Quale classe di rischio ha l'azione?
    keywords:
      it:
        - rischio
        - attenzione
        - pericolo
        - dati
      en:
        - risk
        - caution
        - warning
        - careful
        - data
    genre: regola
    critical_for_r2: true
    always_critical: true
  - attribute: environments
    question: In quali ambienti è ammessa?
    keywords:
      it:
        - ambiente
        - sandbox
        - produzione
      en:
        - environment
        - sandbox
        - production
    genre: regola
    critical_for_r2: true
    always_critical: false
  - attribute: approvals
    question: Quali approvazioni richiede?
    keywords:
      it:
        - approvazione
        - approvatore
        - autorizzazione
      en:
        - approval
        - approver
        - authorization
        - approve
    genre: regola
    critical_for_r2: true
    always_critical: false
  - attribute: evidence_min
    question: Quali evidenze minime deve produrre?
    keywords:
      it:
        - evidenze
        - minime
      en:
        - evidence
        - minimum
    genre: regola
    critical_for_r2: true
    always_critical: false
  - attribute: report_kind
    question: Quale report produce?
    keywords:
      it:
        - report
      en:
        - report
    genre: regola
    critical_for_r2: true
    always_critical: false
  - attribute: db_writes
    question: Cosa scrive nel DB di conoscenza?
    keywords:
      it:
        - scrive
        - database
      en:
        - writes
        - database
    genre: tecnica
    critical_for_r2: true
    always_critical: false
  - attribute: budget
    question: Con quale budget?
    keywords:
      it:
        - budget
        - token
      en:
        - budget
        - tokens
    genre: regola
    critical_for_r2: true
    always_critical: false
