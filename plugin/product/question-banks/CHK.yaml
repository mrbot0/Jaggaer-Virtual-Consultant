type: CHK
source: §64
note: "Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP. Le parole chiave it/en servono solo al recupero delle unità (FTS),
  non si mostrano: il corpus è in gran parte in inglese."
questions:
  - attribute: kind
    question: Che tipo di controllo è (pre-azione, post-modifica, salute integrazioni…)?
    keywords:
      it:
        - tipo
        - genere
      en:
        - kind
        - type
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: how
    question: "Come si esegue: verbo, bersaglio, esito atteso?"
    keywords:
      it:
        - come
        - eseguire
        - verificare
      en:
        - how
        - execute
        - check
    genre: tecnica
    critical_for_r2: true
    always_critical: true
  - attribute: cost
    question: Quanto costa eseguirlo (tempo, token, rischio)?
    keywords:
      it:
        - costo
        - tempo
      en:
        - cost
        - time
        - effort
    genre: empirica
    critical_for_r2: false
    always_critical: false
  - attribute: deterministic
    question: Il risultato è deterministico?
    keywords:
      it:
        - deterministico
        - ripetibile
      en:
        - deterministic
        - repeatable
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: frequency
    question: Con che frequenza va eseguito?
    keywords:
      it:
        - frequenza
        - ogni
        - periodico
      en:
        - frequency
        - every
        - periodic
    genre: regola
    critical_for_r2: false
    always_critical: false
  - attribute: cluster
    question: A quale cluster di controlli appartiene?
    keywords:
      it:
        - gruppo
        - categoria
      en:
        - group
        - category
    genre: tecnica
    critical_for_r2: false
    always_critical: false
