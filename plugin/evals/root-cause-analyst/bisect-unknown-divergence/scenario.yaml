      frontmatter:
        type: regex
        target: last_message
        pattern: cognitive_trace:[\s\S]*?hypotheses:\s*(?:\[\s*[^\]\s]|-\s)
  behaviour: |
    PASS se il rapporto localizza la prima divergenza fra i checkpoint (unità organizzativa del richiedente diversa
