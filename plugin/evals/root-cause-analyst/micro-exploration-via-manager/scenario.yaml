# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: root-cause-analyst
case: micro-exploration-via-manager
session:
  customer: ACME
  scope: CAT
  mode: diag
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0810
    customer: ACME
    scope: CAT
    mode: diag
    tier: T2
    depth: profonda
    budget:
      tokens: 60000
      minutes: 25
    allowed_paths:
      - customers/ACME/runs/**
      - customers/ACME/kb/scopes/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/kb/handoffs/*CAT*
      - product/kb/handoffs/*CAT*
      - customers/ACME/analysis/**
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Diagnostica RUN.ACME.20260929.0800.CAT; il dossier non contiene lo snapshot del passo fallito.
    inputs:
      run: RUN.ACME.20260929.0800.CAT
      subject: C.ACME.CAT.FLW.0003
      lesson_code: L.ACME.CAT.LSN.0810
    expected_output:
      type: finding
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.FLW.0003
      shape: consolidato
      facets:
        F10: R0
      title: Ricerca a catalogo
      summary: Ricerca per testo libero e aggiunta a una richiesta.
  files:
    customers/ACME/runs/RUN.ACME.20260929.0800.CAT/summary.yaml: |
      run: RUN.ACME.20260929.0800.CAT
      case: NRT.ACME.CAT.POS.0003
      result: failed
      steps:
        - { n: 1, verb: NAVIGATE, status: ok }
        - { n: 2, verb: SEARCH, status: failed, note: "snapshot non catturato (timeout della cattura)" }
expect:
  outcome: needs-input verso il manager con l'osservazione R0 richiesta (cosa guardare e perché); nessuna azione sul browser.
  status:
    - needs-input
    - partial
  question: optional
  gap: manca l'osservazione dello stato della pagina al passo 2; la fa lo scope-expert su richiesta del manager
  behaviour: |
    PASS se il rapporto chiede al manager un compito di osservazione R0 per lo scope-expert, dicendo cosa osservare
    (pagina di ricerca, risultati) e perché, senza dichiarare navigazioni proprie.
    FAIL se il rapporto dichiara di aver navigato il tenant o inventa lo stato della pagina.
