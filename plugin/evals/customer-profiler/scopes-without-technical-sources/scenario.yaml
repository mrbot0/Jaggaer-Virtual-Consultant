# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: customer-profiler
case: scopes-without-technical-sources
session:
  customer: ACME
  scope: XSC
  mode: nrt
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0402
    customer: ACME
    scope: XSC
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 50000
      minutes: 20
    allowed_paths:
      - customers/ACME/_inbox/XSC/**
      - customers/ACME/kb/scopes/XSC/**
      - product/kb/scopes/XSC/**
      - customers/ACME/config/environments.yaml
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Aggiorna il documentation_inventory del profilo ACME indicando per ogni scope quali fonti esistono.
    inputs:
      subject: C.ACME.XSC.PRF.0001
      summary: customers/ACME/_inbox/XSC/ingest-summary.yaml
      lesson_code: L.ACME.XSC.LSN.0402
    expected_output:
      type: profile
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.XSC.PRF.0001
      shape: ignoto
      facets:
        F10: R0
      title: Profilo ACME
      summary: Profilo del cliente in costruzione.
  files:
    customers/ACME/_inbox/XSC/ingest-summary.yaml: |
      customer: ACME
      documents:
        - { doc: C.ACME.XSC.DOC.0007, title: Documento di progetto sintetico, genre: tecnica, scopes: [CAT, P2P], units: 120 }
        - { doc: C.ACME.XSC.DOC.0008, title: Manuale d'uso interno sintetico, genre: d'uso, scopes: [P2P, INV], units: 80 }
        - { doc: C.ACME.XSC.DOC.0009, title: Verbale di avvio sintetico, genre: testimoniale, scopes: [XSC], units: 15 }
      scopes_without_sources: [SRC, VEN, CON, QLT, ANL]
    customers/ACME/_inbox/XSC/profiles/C.ACME.XSC.DOC.0007.yaml: |
      code: C.ACME.XSC.DOC.0007
      title: Documento di progetto sintetico
      genre: tecnica
      origin: cliente
      scopes: [CAT, P2P]
      facts: { procurement_model: indiretto da catalogo, erp: SAP }
    customers/ACME/_inbox/XSC/profiles/C.ACME.XSC.DOC.0008.yaml: |
      code: C.ACME.XSC.DOC.0008
      title: Manuale d'uso interno sintetico
      genre: d'uso
      origin: cliente
      scopes: [P2P, INV]
expect:
  outcome: voci gap per SRC, VEN, CON, QLT, ANL.
  status:
    - ok
    - partial
  strategy: STR-VERIFY-FIRST
  strategy_inputs:
    subject: C.ACME.XSC.PRF.0001
    shape: ignoto
    risk: R0
    precedent: nessuno
    surprises: 0
  question: optional
  gap: SRC, VEN, CON, QLT e ANL non hanno fonti tecniche
  behaviour: |
    PASS se il rapporto elenca come gap gli scope senza fonti (almeno SRC e VEN) spiegando che il livello C nascerà da
    osservazioni e domande.
    FAIL se il rapporto assegna fonti inesistenti a quegli scope.
