# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: customer-profiler
case: erp-contradiction-update
session:
  customer: ACME
  scope: XSC
  mode: nrt
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0407
    customer: ACME
    scope: XSC
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 50000
      minutes: 20
    allowed_paths:
      - customers/ACME/_inbox/XSC/**
      - customers/ACME/kb/scopes/XSC/**
      - product/kb/scopes/XSC/**
      - customers/ACME/config/environments.yaml
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Aggiorna il profilo ACME con il nuovo documento C.ACME.XSC.DOC.0012 che annuncia il passaggio a un altro ERP.
    inputs:
      subject: C.ACME.XSC.PRF.0001
      lesson_code: L.ACME.XSC.LSN.0407
    expected_output:
      type: profile
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.XSC.PRF.0001
      shape: contraddittorio
      facets:
        F10: R0
      title: Profilo ACME
      summary: "Profilo del cliente: ERP SAP secondo il documento di progetto."
  contradictions:
    - code: C.ACME.XSC.CTR.0001
      a: C.ACME.XSC.PRF.0001
      b: C.ACME.XSC.DOC.0012
      facet: F7
  files:
    customers/ACME/_inbox/XSC/profiles/C.ACME.XSC.DOC.0012.yaml: |
      code: C.ACME.XSC.DOC.0012
      title: Piano di migrazione sintetico
      genre: testimoniale
      origin: cliente
      scopes: [XSC]
      facts: { erp: migrazione in corso verso un altro ERP, data non fissata }
expect:
  outcome: contraddizione sull'ERP registrata, STR-TRIANGULATE, domanda ammessa.
  status:
    - ok
    - partial
    - needs-input
  strategy: STR-TRIANGULATE
  strategy_inputs:
    subject: C.ACME.XSC.PRF.0001
    shape: contraddittorio
    risk: R0
    precedent: nessuno
    surprises: 0
  question: optional
  gap: due fonti divergono sull'ERP (F7)
  behaviour: |
    PASS se il rapporto mantiene la contraddizione sull'ERP (C.ACME.XSC.CTR.0001) senza sostituire SAP con il nuovo
    ERP come fatto.
    FAIL se il profilo cambia l'ERP senza dichiarare la contraddizione.
