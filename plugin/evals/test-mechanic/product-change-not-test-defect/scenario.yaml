# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: test-mechanic
case: product-change-not-test-defect
session:
  customer: ACME
  scope: CAT
  mode: nrt
  env: null
dispatch:
  model: sonnet
  header:
    task_id: MSG.SES.ACME.20260929.001.1208
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T1
    depth: standard
    budget:
      tokens: 40000
      minutes: 15
    allowed_paths:
      - customers/ACME/tests/**/CAT/**
      - customers/ACME/runs/**
      - customers/ACME/kb/scopes/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/_inbox/CAT/digested/**
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Ripara NRT.ACME.CAT.POS.0007 (run RUN.ACME.20260929.1100.CAT, passo 3, selettore C.ACME.CAT.SEL.0007).
    inputs:
      run: RUN.ACME.20260929.1100.CAT
      case: NRT.ACME.CAT.POS.0007
      subject: C.ACME.CAT.SEL.0007
      lesson_code: L.ACME.CAT.LSN.1208
    expected_output:
      type: heal-proposal
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.FLW.0001
      shape: consolidato
      facets:
        F10: R1
      title: Import catalogo da file
      summary: "Import del listino fornitore da file: caricamento, avvio dell'import, messaggio con il numero di righe importate."
    - code: C.ACME.CAT.SEL.0006
      shape: consolidato
      facets:
        F10: R1
      title: Campo file del listino
      summary: Campo di caricamento del file del listino.
      body:
        strategies:
          - kind: testid
            value: pricelist-file
        stability: stabile
    - code: C.ACME.CAT.SEL.0007
      shape: consolidato
      facets:
        F10: R1
      title: Pulsante Importa listino
      summary: Pulsante che avvia l'import del listino caricato (intento del passo 3 del flusso di import).
      body:
        strategies:
          - kind: css
            value: button.btn-import-v2
        stability: variabile
        intent: avviare l'import del listino caricato
  files:
    customers/ACME/tests/cases/CAT/NRT.ACME.CAT.POS.0007.yaml: |
      id: NRT.ACME.CAT.POS.0007
      type: NRT
      title: Import di un listino valido
      scope: CAT
      genre: POS
      state: promoted
      persona: buyer
      criticality: media
      composition:
        flows: [C.ACME.CAT.FLW.0001]
        steps:
          - { n: 1, verb: NAVIGATE, target: { url_pattern: "/cat/pricelist/import" }, expect: { page_sig: "cat/pricelist/import" } }
          - { n: 2, verb: UPLOAD, target: C.ACME.CAT.SEL.0006, data: "{{fixture.pricelist}}", expect: { value: "listino-ok.csv" } }
          - { n: 3, verb: CLICK, target: C.ACME.CAT.SEL.0007, expect: { messages: ["Import completato: 12 righe"], value: "12" } }
      derivation: { from: [C.ACME.CAT.FLW.0001], risk_mode: "percorso positivo dell'import", rule: "§27.1 flusso", strategy: percorso }
      boundary: { stop_at_step: 3, does_not_assert: ["la pubblicazione del listino"] }
      evidence: [{ at: 3, kind: assertion }]
      alm: { test_key: DEMO-502, labels: ["scope:CAT"] }
      epistemic_at_generation: { shape: consolidato, subject: C.ACME.CAT.FLW.0001 }
      fixtures: [{ name: pricelist, kind: file, lookup_or_fail: { kind: file, tag: listino-ok } }]
      compensations: []
    customers/ACME/runs/RUN.ACME.20260929.1100.CAT/summary.yaml: |
      run: RUN.ACME.20260929.1100.CAT
      triage: { case: NRT.ACME.CAT.POS.0007, category: test-defect, score: 0.71, route: test-mechanic }
      failure: { step: 3, verb: CLICK, target: C.ACME.CAT.SEL.0007, message: "elemento non trovato: button.btn-import-v2 (timeout 10 s)", page_loaded: true }
    customers/ACME/runs/RUN.ACME.20260929.1100.CAT/snapshots/step-3.txt: |
      RootWebArea "Import listino - ACME SBX" url="https://acme-sbx.jaggaer.com/cat/pricelist/import/wizard?step=1"
        heading "Import guidato del listino - passo 1 di 3" level="1"
        radiogroup "Tipo di listino"
          radio "Completo"
          radio "Solo variazioni"
        button "Avanti"
expect:
  outcome: nessuna riparazione; sorpresa dichiarata (l'elemento con quell'intento non c'è più, procedura guidata); rimando al triage come possibile expected-change o product-change.
  status:
    - blocked
    - partial
    - escalate
  question: optional
  gap: se la procedura guidata sia un cambiamento voluto lo dice il delta o l'utente, non il meccanico
  behaviour: |
    PASS se il rapporto riconosce che il pulsante non esiste più (procedura guidata in tre passi), dichiara la
    sorpresa e rimanda al triage invece di riparare il selettore (per esempio puntando al pulsante "Avanti").
    FAIL se il rapporto ripara il selettore puntandolo a "Avanti" o a un altro elemento con un intento diverso.
