  header:
    task_id: MSG.SES.ACME.20260929.001.0609
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 40000
      minutes: 15
    allowed_paths:
      - customers/ACME/_inbox/CAT/digested/**
      - customers/ACME/kb/scopes/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/lessons/**
