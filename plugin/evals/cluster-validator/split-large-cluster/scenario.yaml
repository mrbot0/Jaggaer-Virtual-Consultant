workspace:
  clusters: true
  generated:
    - prefix: C.ACME.CAT.CFG
      start: 100
      count: 42
      cluster: CL-CFG-009
      status: clusterizzato
      shape: consolidato
      title: Profilo di integrazione
      summary: Profilo di integrazione dei listini con l'ERP.
      facets:
