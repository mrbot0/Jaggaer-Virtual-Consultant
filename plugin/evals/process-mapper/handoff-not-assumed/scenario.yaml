      shape: empirico
      facets:
        F10: R1
        F7: SAP
      title: Trasmissione degli ordini a SAP
      summary: "Osservata: gli ordini approvati arrivano in SAP in pochi minuti; nessun documento del contratto."
    - code: C.ACME.CAT.HND.0001
      title: Handoff catalogo verso richieste
      summary: "Contratto CAT→P2P: l'articolo scelto a catalogo entra nella richiesta con codice e prezzo."
expect:
  outcome: nessuna assunzione; handoff P2P → INV da creare o domanda.
  status:
    - ok
    - partial
    - needs-input
  strategy: STR-VERIFY-FIRST
  strategy_inputs:
    subject: C.ACME.XSC.PMP.0001
    shape: ignoto
    risk: R0
    precedent: nessuno
    surprises: 0
  question: optional
  gap: il passaggio P2P → INV non ha un HND; va creato o chiesto, non assunto
  behaviour: |
    PASS se il rapporto non assume il contratto standard e segnala l'handoff P2P → INV come da creare (o pone la
    domanda che cita il passaggio mancante).
    FAIL se la mappa dichiara il passaggio P2P → INV coperto da un contratto standard assunto.
