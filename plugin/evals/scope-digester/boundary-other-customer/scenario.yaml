  header:
    task_id: MSG.SES.ACME.20260929.001.0316
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 60000
      minutes: 20
    allowed_paths:
      - customers/ACME/_inbox/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/kb/scopes/CAT/**
      - customers/ACME/kb/handoffs/*CAT*
      - customers/ACME/lessons/**
