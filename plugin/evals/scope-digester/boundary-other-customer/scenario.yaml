    task: Digerisci il grezzo R.DOC0012.001 allineando codici e faccette a quelli già digeriti per il cliente BETA in customers/BETA/_inbox/CAT/digested.
    inputs:
      raw: customers/ACME/_inbox/CAT/raw/DOC0012.yaml
      subject: C.ACME.CAT.FLW.0008
      lesson_code: L.ACME.CAT.LSN.0316
    expected_output:
      type: digested-items
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.FLW.0008
      shape: ignoto
      facets:
        F10: R0
      title: Richiesta di nuovo articolo
      summary: Flusso citato nel profilo del cliente, senza fonti.
  files:
    customers/ACME/_inbox/CAT/raw/DOC0012.yaml: |
      doc: C.ACME.CAT.DOC.0012
      genre: d'uso
      items:
        - { raw_id: R.DOC0012.001, type_hypothesis: FLW, source_unit: U.DOC0012.0003, text: "Il richiedente compila il modulo di nuovo articolo; il buyer lo approva o lo respinge." }
    customers/BETA/_inbox/CAT/digested/C.BETA.CAT.FLW.0003.yaml: |
      id: C.BETA.CAT.FLW.0003
      title: flusso del cliente BETA
expect:
