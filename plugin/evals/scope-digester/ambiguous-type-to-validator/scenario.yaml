# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: scope-digester
case: ambiguous-type-to-validator
session:
  customer: ACME
  scope: CAT
  mode: nrt
  env: null
dispatch:
  model: opus
  header:
    task_id: MSG.SES.ACME.20260929.001.0306
    customer: ACME
    scope: CAT
    mode: nrt
    tier: T2
    depth: standard
    budget:
      tokens: 60000
      minutes: 20
    allowed_paths:
      - customers/ACME/_inbox/CAT/**
      - product/kb/scopes/CAT/**
      - customers/ACME/kb/scopes/CAT/**
      - customers/ACME/kb/handoffs/*CAT*
      - customers/ACME/lessons/**
      - customers/ACME/.sessions/<SID>/**
    task: Digerisci il grezzo R.DOC0016.001 sul campo "valuta predefinita" del listino (soggetto C.ACME.CAT.CFG.0032).
    inputs:
      raw: customers/ACME/_inbox/CAT/raw/DOC0016.yaml
      subject: C.ACME.CAT.CFG.0032
      lesson_code: L.ACME.CAT.LSN.0306
    expected_output:
      type: digested-items
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.CAT.CFG.0032
      shape: libresco
      facets:
        F10: R1
      title: Valuta predefinita del listino
      summary: Valuta usata quando il file del listino non la indica.
  precedents:
    - code: L.ACME.CAT.DEC.0045
      table: DT-020
      agent: scope-digester
      subject: C.ACME.CAT.CFG.0032
      outcome: CFG
      result: smentita
      note: era un campo del documento (FLD), non un parametro
  files:
    customers/ACME/_inbox/CAT/raw/DOC0016.yaml: |
      doc: C.ACME.CAT.DOC.0016
      genre: d'uso
      items:
        - { raw_id: R.DOC0016.001, type_hypothesis: CFG, source_unit: U.DOC0016.0001, section: "Valute", text: "La valuta predefinita si imposta nel profilo del listino e compare come campo nel documento." }
expect:
  outcome: tipo ambiguo inviato al validatore con CFG e FLD candidati; STR-VERIFY-FIRST.
  status:
    - ok
    - partial
  strategy: STR-VERIFY-FIRST
  strategy_inputs:
    subject: C.ACME.CAT.CFG.0032
    shape: libresco
    risk: R1
    precedent: smentito-d<0.3
    surprises: 0
  question: optional
  gap: il tipo è ambiguo fra CFG e FLD e l'ultima decisione CFG è stata smentita
  behaviour: |
    PASS se il rapporto non sceglie d'ufficio il tipo e passa l'item al validatore con i due tipi candidati (CFG e FLD),
    citando il precedente smentito L.ACME.CAT.DEC.0045.
    FAIL se il rapporto codifica l'item come CFG ignorando il precedente smentito.
