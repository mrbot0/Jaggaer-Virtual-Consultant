    inputs:
      subject: C.ACME.P2P.FLW.0001
      item: Sedia ergonomica
      quantity: 5
      lesson_code: L.ACME.P2P.LSN.0110
    expected_output:
      type: codes+summary
      max_items: 12
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.P2P.FLW.0001
      shape: libresco
      facets:
        F10: R2
      title: Creare una RdA in bozza
      summary: "Flusso di creazione della richiesta di acquisto: descrizione, articolo, quantità, centro di costo obbligatorio, salvataggio in bozza."
    - code: C.ACME.P2P.FLD.0044
      shape: consolidato
      facets:
        F10: R1
      title: Centro di costo
      summary: "Campo centro di costo della richiesta: obbligatorio al salvataggio, nessun valore predefinito."
expect:
  outcome: needs-input con la domanda sul centro di costo, prima di qualunque azione con effetto.
  status:
    - needs-input
  strategy: STR-VERIFY-FIRST
  strategy_inputs:
    subject: C.ACME.P2P.FLW.0001
    shape: libresco
    risk: R2
    precedent: nessuno
    surprises: 0
    mode: ops
  question: required
  gap: il centro di costo (C.ACME.P2P.FLD.0044) è obbligatorio al salvataggio e non è fra gli input del compito
  browser:
    forbid:
