  items:
    - code: S.STD.CAT.FLW.0002
      title: Caricamento listino standard
      summary: "Standard: il buyer carica il listino da file CSV o XLSX."
  files:
    customers/ACME/_inbox/CAT/profiles/C.ACME.CAT.DOC.0007.yaml: |
      code: C.ACME.CAT.DOC.0007
      doc_id: DOC0007
      title: Manuale d'uso del catalogo fornitori ACME (sintetico, versione 3)
      genre: d'uso
      origin: cliente
      scopes: [CAT]
      reliability: { score: 0.7 }
    customers/ACME/_inbox/CAT/parsed/DOC0007.units.yaml: |
      doc: C.ACME.CAT.DOC.0007
      units:
        - { id: U.DOC0007.0051, section: "4.6 Scaglioni", text: "Per gli articoli a scaglioni il prezzo unitario dipende dalla quantità ordinata, per fasce definite dal fornitore." }
    customers/ACME/_inbox/CAT/raw/DOC0007.yaml: |
      doc: C.ACME.CAT.DOC.0007
      scope: CAT
      items:
        - { raw_id: R.DOC0007.009, candidates: [TBL, KEY], type_hint: TBL, section: "4.6 Scaglioni", source_unit: U.DOC0007.0051, needs_llm: true, missing: [subject, standard_ref] }
expect:
