  status:
    - ok
    - partial
  strategy: STR-VERIFY-FIRST
  question: forbidden
  gap: il livello S non ha un item sugli scaglioni; il soggetto resta nuovo per il digester, non serve l'utente
  behaviour: |
    PASS se il rapporto completa R.DOC0007.009 con la citazione di U.DOC0007.0051 e dichiara che non esiste un
