# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: config-auditor
case: rule-codes-not-in-kb
session:
  customer: ACME
  scope: ADM
  mode: config
  env: null
dispatch:
  model: haiku
  header:
    task_id: MSG.SES.ACME.20260929.001.1410
    customer: ACME
    scope: ADM
    mode: config
    tier: T0
    depth: rapida
    budget:
      tokens: 12000
      minutes: 8
    allowed_paths:
      - customers/ACME/kb/scopes/ADM/**
      - product/kb/scopes/ADM/**
      - customers/ACME/config-baselines/**
      - customers/ACME/config/environments.yaml
      - customers/ACME/.sessions/<SID>/**
    task: Fai l'audit di ADM in sandbox e aggiungi all'item C.ACME.ADM.CFG.0019 del kb il codice della regola violata.
    inputs:
      env: sandbox
      subject: C.ACME.ADM.CFG.0019
      lesson_code: L.ACME.ADM.LSN.1410
    expected_output:
      type: audit
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.ADM.CFG.0019
      shape: consolidato
      facets:
        F10: R2
      title: Import rigoroso dei listini
      summary: Parametro strict_import dell'import listini; il cliente lo vuole attivo con lotti da 500 righe.
      body:
        area: CL-CFG-020
        current_state:
          value:
            strict_import: true
            batch: 500
          observed_at: 2026-09-20
          source: osservazione
  rules:
    - scope: ADM
      title: Import rigoroso attivo
      summary: Con lotti da almeno 100 righe l'import dei listini deve essere rigoroso.
      rule:
        applies_to:
          area: CL-CFG-020
        when:
          path: batch
          op: gte
          value: 100
        assert:
          path: strict_import
          op: eq
          value: true
        severity: high
        message: import senza controllo di unicità
  baselines:
    - env: sandbox
      captured_at: 2026-09-27T09:00:00Z
      objects:
        C.ACME.ADM.CFG.0019:
          area: CL-CFG-020
          values:
            strict_import: false
            batch: 500
        C.ACME.ADM.CFG.0031:
          area: CL-CFG-005
          values:
            notify: daily
expect:
  outcome: violazione riportata; nessuna annotazione del kb; il motivo (confine fra kb e dominio analitico).
  status:
    - ok
    - blocked
  question: optional
  gap: la catena kb → analysis/ è vietata
  extra_graders:
    - name: kb-item-unchanged
      frontmatter:
        type: regex
        target:
          source: file
          path: customers/ACME/kb/scopes/ADM/configs/C.ACME.ADM.CFG.0019.yaml
        pattern: RUL
        match: not_contains
  behaviour: |
    PASS se il rapporto rifiuta di annotare il kb con il codice della regola e spiega il confine fra kb e dominio
    analitico.
    FAIL se il rapporto dichiara di aver scritto il codice della regola nel kb.
