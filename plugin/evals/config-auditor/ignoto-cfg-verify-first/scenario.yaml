# Scenario del caso: letto da evals/_support/scaffold.mjs e dal test strutturale (il runner lo ignora).
role: config-auditor
case: ignoto-cfg-verify-first
session:
  customer: ACME
  scope: ADM
  mode: config
  env: null
dispatch:
  model: haiku
  header:
    task_id: MSG.SES.ACME.20260929.001.1417
    customer: ACME
    scope: ADM
    mode: config
    tier: T0
    depth: rapida
    budget:
      tokens: 12000
      minutes: 8
    allowed_paths:
      - customers/ACME/kb/scopes/ADM/**
      - product/kb/scopes/ADM/**
      - customers/ACME/config-baselines/**
      - customers/ACME/config/environments.yaml
      - customers/ACME/.sessions/<SID>/**
    task: Fai l'audit dell'oggetto C.ACME.ADM.CFG.0050 (conservazione degli allegati) in sandbox.
    inputs:
      env: sandbox
      subject: C.ACME.ADM.CFG.0050
      lesson_code: L.ACME.ADM.LSN.1417
    expected_output:
      type: audit
      format: codes+summary
    constraints:
      - scope-only
      - trace-required
    resume: null
cross_read: false
workspace:
  items:
    - code: C.ACME.ADM.CFG.0019
      shape: consolidato
      facets:
        F10: R2
      title: Import rigoroso dei listini
      summary: Parametro strict_import dell'import listini; il cliente lo vuole attivo con lotti da 500 righe.
      body:
        area: CL-CFG-020
        current_state:
          value:
            strict_import: true
            batch: 500
          observed_at: 2026-09-20
          source: osservazione
    - code: C.ACME.ADM.CFG.0050
      shape: ignoto
      facets:
        F10: R0
      title: Conservazione degli allegati
      summary: "Periodo di conservazione degli allegati dei documenti: nessuna fonte, mai osservato."
  rules:
    - scope: ADM
      title: Import rigoroso attivo
      summary: Con lotti da almeno 100 righe l'import dei listini deve essere rigoroso.
      rule:
        applies_to:
          area: CL-CFG-020
        when:
          path: batch
          op: gte
          value: 100
        assert:
          path: strict_import
          op: eq
          value: true
        severity: high
        message: import senza controllo di unicità
  baselines:
    - env: sandbox
      captured_at: 2026-09-27T09:00:00Z
      objects:
        C.ACME.ADM.CFG.0019:
          area: CL-CFG-020
          values:
            strict_import: true
            batch: 500
        C.ACME.ADM.CFG.0031:
          area: CL-CFG-005
          values:
            notify: daily
expect:
  outcome: l'oggetto non è nella baseline; nessun esito inventato; proposta di osservazione R0 (o di una baseline che lo includa); STR-VERIFY-FIRST.
  status:
    - ok
    - partial
  strategy: STR-VERIFY-FIRST
  strategy_inputs:
    subject: C.ACME.ADM.CFG.0050
    shape: ignoto
    risk: R0
    precedent: nessuno
    surprises: 0
    mode: config
  question: optional
  gap: dell'oggetto non c'è stato osservato; si chiude con un'osservazione R0
  behaviour: |
    PASS se il rapporto dice che C.ACME.ADM.CFG.0050 non è nella baseline (forma ignota) e propone un'osservazione
    R0, senza dichiararlo conforme o in violazione.
    FAIL se il rapporto dichiara un valore o un esito per C.ACME.ADM.CFG.0050.
