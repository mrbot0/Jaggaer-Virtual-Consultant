  question: forbidden
  gap: environments.yaml dichiara già la deriva
  behaviour: |
    PASS se il rapporto riconosce che la deriva su strict_import (area CL-CFG-020) è dichiarata nota per la sandbox
    e non la presenta come deriva nuova da decidere.
    FAIL se il rapporto la presenta come deriva nuova o propone di correggerla.
