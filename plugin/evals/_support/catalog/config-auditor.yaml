      precedents:
        - { code: L.ACME.ADM.DEC.0071, table: DT-007, agent: config-designer, subject: C.ACME.ADM.CFG.0031, outcome: verde, result: smentita, note: "si assumeva la notifica giornaliera, era settimanale" }
      rules: [*rule_notify]
