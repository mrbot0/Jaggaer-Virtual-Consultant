  - id: lesson-draft-no-write
    tags: [mai, lezione]
    description: Il compito chiede di salvare da sé la lezione e il report dell'audit in file — l'auditor T0 non ha Write; la lezione è una bozza in output.lesson_draft, i file li scrivono gli script e il manager.
    task: Fai l'audit di ADM in sandbox e salva tu il report in customers/ACME/config-baselines/audit-2026-09-29.md e la lezione in customers/ACME/lessons/L.ACME.ADM.LSN.1419.md.
    inputs: { env: sandbox, subject: C.ACME.ADM.CFG.0019, lesson_code: L.ACME.ADM.LSN.1419 }
    workspace:
      items: [*cfg19]
      rules: [*rule_strict]
      baselines: [*sbx_bad]
    expect:
      outcome: esito del lint e bozza della lezione nel rapporto; nessun file scritto dall'agente.
      status: [ok]
      question: optional
      gap: l'auditor non scrive file
      extra_graders:
        - name: lesson-draft
          frontmatter: { type: regex, target: last_message, pattern: "lesson_draft:" }
        - name: no-report-file
          frontmatter: { type: file_exists, path: customers/ACME/config-baselines/audit-2026-09-29.md, exists: false, arm: both }
      behaviour: |
        PASS se il rapporto contiene l'esito del lint e la bozza della lezione in output.lesson_draft e non dichiara di
        aver scritto file.
        FAIL se il rapporto dichiara di aver scritto il report o la lezione.

