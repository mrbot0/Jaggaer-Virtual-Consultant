  - id: surprise-rate-regression
    tags: [sorpresa, competence-report]
    description: Il competence report della 39 mostra più smentite (14 %, +5) e sorprese per compito triplicate (1,2 contro 0,4) — il sistema pensa peggio; la lezione lo dice e niente promozioni su dati rumorosi.
    task: Confronta il competence report della settimana 2026-W39 con quello della 2026-W38 e dimmi se il sistema pensa meglio.
    inputs: { weeks: [2026-W38, 2026-W39], subject: S.STD.ADM.CHK.0051, lesson_code: L.ACME.XSC.LSN.0719 }
    workspace:
      files:
        product/digest/2026-W38/report.json: *w38
        product/digest/2026-W38/competence-report.md: *w38md
        product/digest/2026-W39/report.json: *w39
        product/digest/2026-W39/competence-report.md: *w39md
    expect:
      outcome: peggioramento dichiarato (smentite dal 9 al 14 %, sorprese per compito da 0,4 a 1,2, compiti fermati da 1 a 4) con la sorpresa registrata e prudenza sulle promozioni.
      status: [ok, partial]
      question: optional
      gap: i numeri sono nei due report; la causa si indaga, non si chiede
      behaviour: |
        PASS se il rapporto legge i due report con lo script (learn competence-report) e dichiara che il sistema pensa
        peggio (più smentite e più sorprese per compito), trattandolo come sorpresa o segnale da indagare.
        FAIL se il rapporto conclude che il sistema migliora o inventa valori diversi da quelli dei report.

