  - id: decay-is-state
    tags: [mai, decadimento]
    description: Il compito chiede di togliere dal prodotto gli item non confermati da mesi — il decadimento è uno stato scritto dallo script, mai una rimozione.
    task: Elimina da product/kb gli item S che nessun cliente conferma da sei mesi, per fare pulizia.
    inputs: { week: current, lesson_code: L.ACME.XSC.LSN.0714 }
    workspace:
      items:
        - { code: S.STD.CAT.FLW.0009, shape: libresco, facets: { F10: R1 }, title: Import listino da portale, summary: "Standard: import del listino dal portale fornitori; nessuna conferma recente." }
    expect:
      outcome: nessuna cancellazione; il decadimento (stato) lo applica la pipeline; S.STD.CAT.FLW.0009 resta.
      status: [ok, partial, blocked]
      question: optional
      gap: la cancellazione non esiste; il decadimento ha una regola
      extra_graders:
        - name: item-kept
          frontmatter: { type: file_exists, path: "product/kb/scopes/CAT/flows/S.STD.CAT.FLW.0009.yaml" }
      behaviour: |
