# Catalogo dei casi di lesson-validator (§49.1: 20 compiti). node evals/_support/generate.mjs lesson-validator
# Validazione delle lezioni (§21.2, DT-004 via `learn validate`): forma a otto sezioni, esiti attesi per ogni DEC con
# effetti (rejected: non verificabile), confini (rejected: confine), fondatezza su sorprese e ipotesi rifiutate della
# sessione (rejected: non fondata), portabilità, novità (merged +1), azionabilità (validated: inerte). Lo stato lo
# cambia solo lo script. Lo scaffold crea la sessione passata SES.ACME.20260928.001 (session.json valido), le DEC, le
# OBS e gli item citati, così lo script giudica sul workspace. Lezioni sintetiche del cliente fittizio ACME.
role: lesson-validator
task_base: 1000
defaults:
  scope: CAT
  mode: nrt
  tier: T1
  model: sonnet
  depth: standard
  budget: { tokens: 30000, minutes: 12 }
  expected_output: { type: lesson-validation, format: codes+summary }
base: &base
  sessions:
    - { sid: sess-0928, code: SES.ACME.20260928.001, scope: CAT }
  observations:
    - { code: L.ACME.CAT.OBS.0120, note: "import con codice duplicato rifiutato" }
    - { code: L.ACME.CAT.OBS.0121, note: "messaggio di validazione del listino" }
  decisions:
    - { code: L.ACME.CAT.DEC.0412, table: DT-002, subject: C.ACME.CAT.KEY.0004, outcome: procedi, effects: true }
    - { code: L.ACME.CAT.DEC.0413, table: DT-008, subject: C.ACME.CAT.SEL.0009, outcome: testid, effects: true }
    - { code: L.ACME.CAT.DEC.0414, table: DT-023, subject: C.ACME.CAT.KEY.0004, outcome: standard, effects: false }
lessons:
  good: &good |
    ---
    id: L.ACME.CAT.LSN.0088
    agent: scope-expert · session: SES.ACME.20260928.001 · task: "Import del listino con codice duplicato"
    scope: CAT · mode: nrt
    decision_refs: [L.ACME.CAT.DEC.0412, L.ACME.CAT.DEC.0413]
    strategy: STR-VERIFY-FIRST
    epistemic_before: libresco · epistemic_after: consolidato · surprises: 0
    expected_outcomes: [{ decision: L.ACME.CAT.DEC.0412, expect: "import rifiutato con messaggio di validazione" }, { decision: L.ACME.CAT.DEC.0413, expect: "selettore stabile al prossimo giro" }]
    status: proposed · confidence: 0.8
    portability_hypothesis: { class: condizionata, condition: "F7 sap-s4" }
    cluster_proposal: CL-CHK-002
    ---
    ## 1. Contesto
    Import del listino con codice duplicato sulla chiave C.ACME.CAT.KEY.0004.
    ## 2. Cosa ho tentato
    Caso negativo generato dalla chiave, selettore scelto con DT-008.
    ## 3. Cosa ho osservato
    Import rifiutato con messaggio di validazione (L.ACME.CAT.OBS.0120).
    ## 4. Decisioni prese
    DT-002 procedi (L.ACME.CAT.DEC.0412); DT-008 selettore per testid (L.ACME.CAT.DEC.0413).
    ## 5. Esito
    Import rifiutato come atteso.
    ## 6. Lezione
    L'unicità per fornitore è applicata all'import: proposta di un CHK prima dell'import del listino.
    ## 7. Cosa NON generalizzerei
    Il testo del messaggio dipende dal profilo di import di ACME (F7).
    ## 8. Domande aperte
    Nessuna.
cases:
  - id: validate-happy
    tags: [happy-path, libresco]
    description: Lezione ben formata, fondata, con gli esiti attesi di entrambe le DEC con effetti e un artefatto candidato — validata; lo script registra i due esiti attesi. Soggetto libresco a R1 ⇒ STR-VERIFY-FIRST.
    task: Valida le lezioni proposte della sessione SES.ACME.20260928.001.
    inputs: { session: SES.ACME.20260928.001, subject: C.ACME.CAT.KEY.0004, lesson_code: L.ACME.CAT.LSN.1001 }
    workspace:
      <<: *base
      items:
        - { code: C.ACME.CAT.KEY.0004, shape: libresco, facets: { F10: R1 }, title: Unicità codice articolo per fornitore, summary: "Il codice articolo è unico per fornitore." }
        - { code: C.ACME.CAT.SEL.0009, title: Pulsante Importa, summary: "Selettore del pulsante di import del listino." }
      files:
        customers/ACME/lessons/L.ACME.CAT.LSN.0088.md: *good
    expect:
      outcome: L.ACME.CAT.LSN.0088 validata con DT-004 dallo script; due esiti attesi registrati.
      status: [ok]
      strategy: STR-VERIFY-FIRST
      strategy_inputs: { subject: C.ACME.CAT.KEY.0004, shape: libresco, risk: R1, precedent: nessuno, surprises: 0, mode: nrt }
      question: forbidden
      gap: la lezione è completa; non serve l'utente
      behaviour: |
        PASS se il rapporto dichiara L.ACME.CAT.LSN.0088 validata dallo script (learn validate, DT-004) con due esiti
        attesi registrati.
        FAIL se il rapporto cambia lo stato a mano, la respinge senza motivo o dichiara esiti non presenti.

