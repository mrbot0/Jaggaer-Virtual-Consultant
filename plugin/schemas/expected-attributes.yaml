# Registro degli attributi attesi per tipo (§64, estende §9.2) — COMPLETO (WP09a).
# Formato di K0 invariato: <TIPO>: [attributi] (scripts/kb/epistemic.mjs lo legge così). In più:
#   critical         attributi critici per R ≥ R2 (§64, DT-022: senza, l'item non entra in uso per R ≥ R2)
#   always_critical  attributi sempre critici (§19.13: senza, l'item va in quarantena; per CFG location e options)
#   genres           genere di fonte che di norma copre l'attributo (tecnica, d'uso, empirica, testimoniale, regola)
#   identity_blocks  FLD: i 12 blocchi della carta d'identità (§19.20, validate-fld.mjs IDENTITY_BLOCKS)
# Le domande della digestione guidata sono in product/question-banks/<TIPO>.yaml (una per attributo).
# Da confermare con un configuratore senior (§38.2).
CFG: [ location, options, dependencies, impacts, current_state, risk, rollback ]
CFP: [ steps, preconditions, verification, rollback, risk, approvals, evidence ]
FLW: [ actor, trigger, preconditions, steps, postconditions, compensation, evidence, invariants ]
KEY: [ uniqueness, mutability, format, cross_system, document_impact, enforcement_channels ]
LCY: [ states, transitions, mandatory_by_state, immutable_after, validations, integration_touchpoints ]
FLD:
  [
    document,
    section,
    datatype,
    domain,
    mandatory,
    mandatory_reason,
    editable_in_states,
    default,
    lineage,
    visibility,
    system_of_record,
    sensitivity,
    custom
  ]
INT: [ protocol, trigger, mode_latency, mappings, error_catalog, observability, silence_semantics, counterpart_owner, test_strategy ]
SEL: [ strategies, stability, frame_context, effect, last_success ]
HND: [ contract, owner_of_test, asserts, does_not_pass, does_not_assert, stop_at_step, shared_fixtures, reciprocal_test ]
CHK: [ kind, how, cost, deterministic, frequency, cluster ]
PMP: [ stages, variants, handoffs, integrations, owner, epistemic_by_stage ]
PRF: [ sector, size, legal, procurement_model, erp, modules, integrations, documentation_inventory, approval_culture, environments ]
TBL: [ subject_area, columns, joins_known, row_count_observed, validated ]
QRY: [ purpose, pattern, tables, query, validation, portability ]
ERR: [ message, trigger, category, blocking, meaning, resolution, related, observed ]
DIN: [ document, sample, fields, lifecycle, by_role, privacy ]
DOC: [ kind, genre, origin, version_date, covers_release, reliability, structure, known_issues, ingestion ]
ENV: [ type, base_url, allowed_hosts, fingerprint, policy, alignment, personas ]
ACT: [ risk, environments, approvals, evidence_min, report_kind, db_writes, budget ]
STR: [ applies_when, plan, cost, success_criteria ]
DT: [ inputs, scoring, thresholds, priors, null_policy, version ]
