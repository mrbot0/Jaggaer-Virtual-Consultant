type: PMP
source: §64, §19.3
note: Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP.
questions:
  - attribute: stages
    question: Quali fasi, in quali scope e con quali flussi?
    genre: d'uso
    critical_for_r2: true
    always_critical: true
  - attribute: variants
    question: Quali varianti esistono, a quali condizioni e con che quote?
    genre: empirica
    critical_for_r2: false
    always_critical: false
  - attribute: handoffs
    question: Quali passaggi fra scope (HND) attraversa?
    genre: tecnica
    critical_for_r2: true
    always_critical: false
  - attribute: integrations
    question: Quali integrazioni tocca e in quale fase?
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: owner
    question: Chi possiede il processo?
    genre: testimoniale
    critical_for_r2: false
    always_critical: false
  - attribute: epistemic_by_stage
    question: Quanto sappiamo di ciascuna fase (forma epistemica)?
    genre: empirica
    critical_for_r2: false
    always_critical: false
