type: DOC
source: §64, §19.7
note: "Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP. Le parole chiave it/en servono solo al recupero delle unità (FTS),
  non si mostrano: il corpus è in gran parte in inglese."
questions:
  - attribute: kind
    question: Che tipo di documento è?
    keywords:
      it:
        - tipo
        - genere
      en:
        - kind
        - type
    genre: tecnica
    critical_for_r2: false
    always_critical: true
  - attribute: genre
    question: Di quale genere di fonte (tecnica, d'uso, empirica, testimoniale)?
    keywords:
      it:
        - genere
        - fonte
      en:
        - genre
        - source
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: origin
    question: Chi l'ha prodotto (vendor, cliente, partner, interno)?
    keywords:
      it:
        - origine
        - autore
      en:
        - origin
        - author
        - vendor
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: version_date
    question: Quale versione e quale data?
    keywords:
      it:
        - versione
        - data
      en:
        - version
        - date
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: covers_release
    question: A quale release del prodotto si riferisce?
    keywords:
      it:
        - release
        - versione
        - prodotto
      en:
        - release
        - version
        - product
    genre: tecnica
    critical_for_r2: true
    always_critical: false
  - attribute: reliability
    question: Quanto è affidabile (base, freschezza, paternità, coerenza, corroborazione)?
    keywords:
      it:
        - affidabilità
      en:
        - reliability
    genre: tecnica
    critical_for_r2: true
    always_critical: false
  - attribute: structure
    question: Com'è fatto (pagine, capitoli, tabelle, figure, tabelle di campi)?
    keywords:
      it:
        - struttura
        - capitoli
      en:
        - structure
        - chapters
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: known_issues
    question: Quali parti sono superate o contraddette dall'osservazione?
    keywords:
      it:
        - problemi
        - superato
      en:
        - issues
        - outdated
    genre: empirica
    critical_for_r2: false
    always_critical: false
  - attribute: ingestion
    question: A che punto è l'ingestion (profilato, segmentato, estratto, digerito, rivisto)?
    keywords:
      it:
        - ingestion
        - stato
      en:
        - ingestion
        - status
    genre: tecnica
    critical_for_r2: false
    always_critical: false
