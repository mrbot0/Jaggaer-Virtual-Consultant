type: FLW
source: §19.11 (banca per FLW, 6 domande su 8 attributi), §64
note: "Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP. Le parole chiave it/en servono solo al recupero delle unità (FTS),
  non si mostrano: il corpus è in gran parte in inglese."
questions:
  - attribute: actor
    question: Chi lo esegue (ruolo)?
    keywords:
      it:
        - utente
        - ruolo
        - richiedente
        - buyer
        - amministratore
      en:
        - user
        - role
        - requester
        - buyer
        - administrator
    genre: d'uso
    critical_for_r2: false
    always_critical: false
  - attribute: trigger
    question: Cosa lo avvia?
    keywords:
      it:
        - avvia
        - scatena
        - attiva
        - evento
        - quando
      en:
        - trigger
        - triggered
        - starts
        - initiates
        - event
        - when
        - submitted
    genre: d'uso
    critical_for_r2: false
    always_critical: false
  - attribute: preconditions
    question: Cosa deve essere vero prima?
    keywords:
      it:
        - prima
        - prerequisito
        - necessario
        - deve
      en:
        - before
        - prerequisite
        - required
        - must
        - ensure
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: steps
    question: Quali passi, in che ordine, con quali dati?
    keywords:
      it:
        - passi
        - procedura
        - selezionare
        - cliccare
      en:
        - steps
        - procedure
        - select
        - click
        - enter
    genre: d'uso
    critical_for_r2: false
    always_critical: true
  - attribute: postconditions
    question: Cosa deve essere vero dopo?
    keywords:
      it:
        - risultato
        - dopo
        - stato
        - creato
      en:
        - result
        - after
        - status
        - created
        - becomes
    genre: d'uso
    critical_for_r2: true
    always_critical: false
  - attribute: compensation
    question: Come si annulla o si chiude ciò che ha creato (close/cancel, mai delete)?
    keywords:
      it:
        - annullare
        - chiudere
        - cancellare
      en:
        - cancel
        - close
        - withdraw
        - reverse
    genre: tecnica
    critical_for_r2: true
    always_critical: false
  - attribute: evidence
    question: Dove si vede che è andato bene?
    keywords:
      it:
        - evidenza
        - schermata
        - conferma
        - registro
      en:
        - evidence
        - screenshot
        - confirmation
        - log
    genre: d'uso
    critical_for_r2: false
    always_critical: false
  - attribute: invariants
    question: Quali condizioni restano vere per tutto il flusso (vincoli che nessun passo può violare)?
    keywords:
      it:
        - sempre
        - vincolo
        - regola
      en:
        - always
        - constraint
        - rule
        - never
    genre: tecnica
    critical_for_r2: false
    always_critical: false
