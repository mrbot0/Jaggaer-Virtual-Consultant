type: ENV
source: §64, §51
note: Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP.
questions:
  - attribute: type
    question: Che ambiente è (sandbox, dev, preprod, prod)?
    genre: tecnica
    critical_for_r2: false
    always_critical: true
  - attribute: base_url
    question: Qual è l'URL di base?
    genre: tecnica
    critical_for_r2: false
    always_critical: true
  - attribute: allowed_hosts
    question: Quali host sono ammessi (SSO compreso)?
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: fingerprint
    question: Quali segnali (almeno due) riconoscono l'ambiente?
    genre: empirica
    critical_for_r2: true
    always_critical: false
  - attribute: policy
    question: Quali regole valgono (scrittura dati, approvazioni)?
    genre: regola
    critical_for_r2: true
    always_critical: false
  - attribute: alignment
    question: È allineato alla produzione? Da quando?
    genre: testimoniale
    critical_for_r2: false
    always_critical: false
  - attribute: personas
    question: Con quali utenti di prova si opera?
    genre: tecnica
    critical_for_r2: false
    always_critical: false
