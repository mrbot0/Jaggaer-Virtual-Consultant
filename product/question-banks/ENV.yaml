type: ENV
source: §64, §51
note: "Una domanda per attributo atteso (schemas/expected-attributes.yaml). La digestione guidata (scripts/kb/digest-plan.mjs) pone ogni domanda alle unità del
  documento (kb units --near <soggetto> --query <domanda> --top 5); nessuna risposta = GAP. Le parole chiave it/en servono solo al recupero delle unità (FTS),
  non si mostrano: il corpus è in gran parte in inglese."
questions:
  - attribute: type
    question: Che ambiente è (sandbox, dev, preprod, prod)?
    keywords:
      it:
        - tipo
        - ambiente
      en:
        - type
        - environment
    genre: tecnica
    critical_for_r2: false
    always_critical: true
  - attribute: base_url
    question: Qual è l'URL di base?
    keywords:
      it:
        - url
        - indirizzo
      en:
        - url
        - address
    genre: tecnica
    critical_for_r2: false
    always_critical: true
  - attribute: allowed_hosts
    question: Quali host sono ammessi (SSO compreso)?
    keywords:
      it:
        - host
        - dominio
        - sso
      en:
        - host
        - domain
        - sso
    genre: tecnica
    critical_for_r2: false
    always_critical: false
  - attribute: fingerprint
    question: Quali segnali (almeno due) riconoscono l'ambiente?
    keywords:
      it:
        - segnali
        - riconoscere
      en:
        - signals
        - recognize
    genre: empirica
    critical_for_r2: true
    always_critical: false
  - attribute: policy
    question: Quali regole valgono (scrittura dati, approvazioni)?
    keywords:
      it:
        - regole
        - approvazioni
        - scrittura
      en:
        - rules
        - approvals
        - write
    genre: regola
    critical_for_r2: true
    always_critical: false
  - attribute: alignment
    question: È allineato alla produzione? Da quando?
    keywords:
      it:
        - allineato
        - copia
        - produzione
      en:
        - aligned
        - copy
        - production
        - refresh
    genre: testimoniale
    critical_for_r2: false
    always_critical: false
  - attribute: personas
    question: Con quali utenti di prova si opera?
    keywords:
      it:
        - utenti
        - prova
      en:
        - test
        - users
        - personas
    genre: tecnica
    critical_for_r2: false
    always_critical: false
