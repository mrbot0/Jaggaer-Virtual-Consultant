id: DT-011
version: 1
title: Risolvere una contraddizione
decision: "Risolvere un CTR: vince l'item L, C o S, oppure la contraddizione resta irrisolta"
description: "Punteggio = dubbio sulla risoluzione. Di norma vince l'osservazione confermata (§28.4); il manuale vince sulla UI, la spec sul modello (§11.3); 'non lo so' dell'utente → irrisolta, quarantena sul soggetto (§11.5)."
inputs:
  - { name: candidate_winner, label: "Lato con l'evidenza migliore", weight: 0, domain: { enum: { vince-L: 0, vince-C: 0, vince-S: 0 } } }
  - name: winner_evidence
    label: "Evidenza del lato vincente (§13.8)"
    weight: 0.35
    domain: { enum: { osservazione-confermata: 0, esecuzione: 0, osservazione-singola: 0.4, documento: 0.7, dichiarazione: 0.8 } }
  - { name: genre_fit, label: "Il genere del vincente è quello giusto per l'attributo conteso (UI → d'uso/empirica, modello → tecnica)", weight: 0.20,
      domain: { boolean: { true: 0, false: 1 } } }
  - { name: confidence_gap, label: "Scarto di confidenza fra i due item", weight: 0.20, domain: { range: [0, 1], invert: true } }
  - { name: user_answer, label: "Risposta dell'utente (§11.5)", weight: 0.10, domain: { enum: { conferma: 0, nessuna: 0.5, non-lo-so: 1 } } }
priors:
  - name: winner_disproved
    label: "Tasso di smentita delle risoluzioni vinte da questo lato"
    weight: 0.15
    neutral: 0
    source: { metric: rate_disproved, outcome_input: candidate_winner, by: [customer] }
scoring: weighted_sum
thresholds:
  - { from: 0, to: 0.5, outcome_from: candidate_winner }
  - { from: 0.5, to: 1, outcome: irrisolta }
overrides:
  - { when: { user_answer: non-lo-so }, outcome: irrisolta, source: "§11.5: 'non lo so' → quarantena sul soggetto" }
outcomes: [vince-L, vince-C, vince-S, irrisolta]
null_policy: { candidate_winner: error, winner_evidence: worst, genre_fit: worst, confidence_gap: worst, user_answer: "default:nessuna" }
log_as: DEC
calibration: bootstrap
sources: ["§15.2", "§11.3", "§11.5", "§13.8", "§28.4", "§18.4"]
