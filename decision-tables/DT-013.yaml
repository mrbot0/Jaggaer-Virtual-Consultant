id: DT-013
version: 1
title: Stadio di checkpoint
decision: "Stadio di checkpoint di un'integrazione asincrona nella corsia integration (L2)"
description: "Stadi: queued_accepted (default, ADR-13) · processed (messaggio processato entro la p95, §62 CL-CHK-004) · acknowledged (risposta del controparte, §20.6.4). Un alto tasso di timeout sugli stadi profondi riporta verso queued_accepted (prior invertito)."
inputs:
  - { name: blocking_impact, label: "document_impact.severity: blocking", weight: 0.30, domain: { boolean: { true: 1, false: 0 } } }
  - { name: silence_possible, label: "silence_semantics: il controparte può fallire in silenzio", weight: 0.25, domain: { boolean: { true: 1, false: 0 } } }
  - { name: latency_declared, label: "Latenza p95 dichiarata nell'INT", weight: 0.15, domain: { boolean: { true: 0, false: 1 } } }
priors:
  - name: stage_timeout_rate
    label: "Tasso di timeout per stadio e interfaccia"
    weight: 0.30
    neutral: 0
    invert: true
    source: { metric: external, note: "dai checkpoint della corsia integration (§20.4: latenza reale vs dichiarata)" }
scoring: weighted_sum
thresholds:
  - { from: 0, to: 0.40, outcome: queued_accepted }
  - { from: 0.40, to: 0.70, outcome: processed }
  - { from: 0.70, to: 1, outcome: acknowledged }
outcomes: [queued_accepted, processed, acknowledged]
null_policy: { blocking_impact: worst, silence_possible: worst, latency_declared: worst }
log_as: DEC
calibration: bootstrap
sources: ["§15.2", "§27.4", "ADR-13", "§20.4", "§47.2"]
